,9],[1916,2,"《枫桥夜泊》这首诗中提到的意象有____。",["渔火","乌啼","美酒","客船"],"ABD","《枫桥夜泊》是唐代诗人张继的诗作。此诗精确而细腻地描述了一个客船夜泊者对江南深秋夜景的观察和感受，勾画了月落乌啼、霜天寒夜、江枫渔火、孤舟客子等景象，有景有情有声有色。",10],[1917,2,"“吾日三省吾身”，是教我们要对自己的言行时时反省、检查。下列属于“三省”内容的是____。",["为人谋而不忠乎","与朋友交而不信乎","学而时习之，不亦说乎","传不习乎"],"ABD","曾子曰：“吾日三省吾身：为人谋而不忠乎？与朋友交而不信乎？传不习乎？”",3],[1918,2,"下列城市与其所在的省份对应正确的是____。",["洛阳--河南","太原--山西","南京--江西","哈尔滨--黑龙江"],"ABD","C项南京在江苏省。",7],[1919,2,"杭州西湖上有白堤和苏堤两条大堤，分别是为了纪念____。",["白居易","白朴","苏辙","苏轼"],"AD","A项唐代诗人白居易任杭州刺史时有诗云：“最爱湖东行不足，绿杨荫里白沙堤。”即指此堤。后人为纪念这位诗人，称为白堤。D项北宋大诗人苏轼任杭州知州时，疏浚西湖，利用挖出的葑泥构筑而成的。后人为了纪念苏轼治理西湖的功绩将它命名为苏堤。",0],[1920,2,"宋明时期兴盛不衰的理学，又被称为____。",["新儒学","性理之学","心性之学","陆王心学"],"ABCD","以上都正确。",2],[1921,2,"下列诗人与其号对应正确的有____。",["陆游--放翁","杨万里--诚斋","白居易--乐天","王安石--半山"],"ABD","C 项“乐天”是诗人白居易的字，号是香山居士。",0],[1922,2,"苏轼与____合称“三苏”。",["苏武","苏迈","苏辙","苏洵"],"CD","三苏是指其中的苏洵、苏轼、苏辙这三人。在唐宋时期，三苏是唐宋八大家当中的三位，其中苏洵是苏轼和苏辙的父亲，苏轼是苏辙的哥哥。",0],[1923,2,"成语“刮目相看”的故事中涉及下列哪些人物?",["吕蒙","刘备","张飞","鲁肃"],"AD","主人公是吕蒙与鲁肃。三国时期,东吴大将吕蒙原来是个大老粗,只懂厮杀,不爱读书,鲁肃因此看不起他.后来孙权说服吕蒙多读书,鲁肃再去看吕蒙,吕蒙密献对付关羽的计策,鲁肃大喜,说：“吾谓大弟但有武略耳,至于今者,学识英博,非复吴下阿蒙。”,吕蒙答道：“士别三日,即更刮目相看!”从此二人结为好友.这就是成语“士别三日当刮目相看”和“吴下阿蒙”的出处。",0],[1924,2,"下列作品中属周部族史诗的是____。",["《生民》","《公刘》","《绵》","《皇矣》"],"ABCD","《诗经·大雅》中《生民》、《公刘》、《绵》、《皇矣》和《大明》这五首构成了周部族史诗,这五首史诗记录了周部族发展史的几次重要的部族大事,再现了周部族发展史,具有非凡的艺术魅力",0],[1925,2,"明代中晚期市民⽂学的理论表现是____。",["童⼼说","良知说","天理说","性灵说"],"AD","明代中后期市民文学兴起,其理论表现是李贽的“童心说”和公安派“独抒性灵”口号的提出,其代表作品则有长篇小说《金瓶梅》、短篇小说集“三言”、“二拍”等。",0],[1926,2,"先秦诸子百家中，被称为“显学”的是____。",["儒家","道家","墨家","法家"],"AC","儒家是先秦诸子百家中较大的一支学派,与墨家并称“显学”。",2],[1927,2,"下列人物属战国时代的是____。",["老子","庄子","韩非","荀子"],"BCD","老子属于春秋时代人物。",2],[1928,2,"下列人物属儒家学派的是____。",["孔子","庄子","孟子","老子"],"AC","孔子和孟子都是儒家学说的代表性任务，他们的学说被尊称为“孔孟之道”。",2],[1929,2,"荀子是____。",["战国后期人","战国中期人","法家集大成者","儒家最后一位代表人物"],"AD","荀子是战国后期人，批判地接受并创造性地发展了儒家正统的思想和理论，为传播保存儒家思想文化做出巨大贡献。",2],[1930,2,"“春秋三传”指____。",["《春秋》","《春秋左氏传》","《春秋公羊传》","《春秋榖梁传》"],"BCD","古代“传”的意思是解读别的书的书籍。春秋三传就是解读《春秋》的书，包括《春秋左氏传》《春秋公羊传》《春秋榖梁传》。",2],[1931,2,"以下著作属于国别史的是____。",["《国语》","《春秋》","《左传》","《战国策》"],"AD","《春秋》《左传》都是编年体史书。是以年代为线索编排有关历史事件的史书。",2],[1932,2,"以下著作属于编年史的是____。",["《国语》","《春秋》","《左传》","《战国策》"],"BC","《国语》《战国策》为国别体史书，是以是一种以国家为单位，分别记叙历史事件的史书。",2],[1933,2,"下列作品选自《战国策》的有____。",["《苏秦始将连横说秦》","《邹忌讽齐王纳谏》","《触龙说赵太后》","《郑伯克段于鄢》"],"ABC","《郑伯克段于鄢》是编年体史书《左传》的一个片段。",1],[1934,2,"下列作品属屈原的是____。",["《离骚》","《天问》","《九歌》","《九辩》"],"ABC","《九辩》是战国时期楚国文学家宋玉创作的一首长篇抒情诗，宋玉为屈原的弟子。",0],[1935,2,"下列作品属组诗的是____。",["《九辩》","《九歌》","《九章》","《招魂》"],"BC","组诗是指由表现同一主题和采用相关题材的若干首诗所组成的一组诗篇。《九辩》、《招魂》均为单首诗歌。",11],[1936,2,"“汉赋四大家”包含____。",["枚乘","司马相如","扬雄","班固"],"BCD","汉赋四大家包括：司马相如、扬雄、班固、张衡。",0],[1937,2,"司马相如的代表赋作是____。",["《长杨赋》","《子虚赋》","《上林赋》","《哀秦二世赋》"],"BCD","《长杨赋》是西汉辞赋家扬雄创作的一篇赋，故排除A选项。",0],[1938,2,"扬雄的大赋作品有____。",["《长门赋》","《甘泉赋》","《河东赋》","《长杨赋》"],"BCD","《长门赋》这是汉代文学家司马相如受汉武帝失宠皇后陈阿娇的百金重托而作的一篇骚体赋，故排除A选项。",0],[1939,2,"以下作品属于抒情小赋的是____。",["《吊屈原赋》","《归田赋》","《鹦鹉赋》","《两都赋》"],"BC","赋按体裁形式可分为骚体赋、散体大赋和抒情小赋三种。《吊屈原赋》属于骚体赋体裁，《两都赋》属于大体体裁。",0],[1940,2,"《史记》共分五部分，其中包括____。",["十二本纪","八志","十表","三十世家"],"ACD","《史记》是中国的一部纪传体通史，被人们称为信史，由西汉武帝时期的司马迁花了13年的时间所写成的。全书共一百三十卷，约五十二万六千五百字，有十表、八书、十二本纪、三十世家、七十列传。",1],[1941,2,"司马迁的作品有____。",["《士不遇赋》","《悲士不遇赋》","《报任安书》","《报孙会宗书》"],"BC","《士不遇赋》是西汉董仲舒创作的一篇抒情赋。《报孙会宗书》是西汉杨恽写给孙会宗的一封书信。",0],[1942,2,"贾谊的作品有____。",["《新书》","《论贵粟疏》","《治安策》","《论积贮疏》"],"ACD","《论贵粟疏》是汉代大臣晁错的文章，出自《汉书·食货志》，是当时给汉文帝的奏疏。文章全面论述了“贵粟”（重视粮食）的重要性，提出重农抑商、入粟于官、拜爵除罪等一系列主张。",0],[1943,2,"清代出现了官方的和民间的报纸是____。",["《京报》","《宫门钞》","《塘报》","《辕门钞》"],"ABCD","以上都正确。",3],[1944,2,"柳宗元的诗歌主要包括____。",["贬谪诗","山水田园诗","民歌体诗","新乐府诗"],"AB","柳宗元的诗作大部分作于贬官的永州、柳州时期。他诗作的重要内容就是抒写被贬谪的抑郁悲伤和思乡之情。柳宗元在贬谪期间也写过一些山水田园诗，并且试图以清静幽寂的自然境界来净化心灵，从而消除现实郁闷。民歌体诗歌则是刘禹锡的代表风格。",0],[1945,2,"下列作品属于志怪小说的有____。",["《博物志》","《搜神记》","《幽明录》","《拾遗记》"],"ABCD","志怪小说晋代比较有代表性的是《博物志》和《搜神记》，南北朝比较著名的是《异苑》、《幽明录》、《续齐谐记》、《拾遗记》。这些作品都对后世小说产生了一定的影响。",0],[1946,2,"《孔雀东南飞》的男女主人公是____。",["焦仲卿","罗敷","子都","刘兰芝"],"AD","《孔雀东南飞》的男主是焦仲卿,女主是刘兰芝。主要讲述了焦仲卿、刘兰芝夫妇被迫分离并双双自杀的故事,控诉了封建礼教的残酷无情,歌颂了焦刘夫妇的真挚感情和反抗精神。",14],[1947,2,"下列东汉乐府诗歌属乐府民歌中的爱情题材的有____。",["《艳歌行》","《上邪》","《有所思》","《江南》"],"BCD","《艳歌行》是汉代乐府古辞，属《相和歌辞·瑟调曲》。此诗写游子思乡。一个普通的家庭“兄弟两三人”为了生计，流浪他乡。因女主人为他们缝补衣裳而被归来的女主人丈夫发现而产生了误会。",9],[1948,2,"下列作家属“建安七子”的有____。",["王粲","刘桢","徐干","曹植"],"ABC","“建安七子”包括孔融、陈琳、王粲、徐干、阮瑀、应玚、刘桢。这七人大体上代表了建安时期除曹氏父子（即曹操、曹丕、曹植）外的文学成就。",1],[1949,2,"下列作品属曹操的有____。",["《燕歌行》","《蒿里行》","《短歌行》","《步出夏门行》"],"BCD","《燕歌行》是唐代诗人高适的诗作。此诗概括一般的边塞战争，主要是揭露主将骄逸轻敌，不恤士卒，致使战事失利。",0],[1950,2,"下列作品属陶渊明辞赋的有____。",["《归去来兮辞》","《登楼赋》","《闲情赋》","《归园田居》"],"AC","《登楼赋》是东汉文学家王粲的赋作，而《归园田居》属于陶渊明的组诗，而非辞赋。",0],[1951,2,"骈文的主要特征是____。",["对偶","夸饰","用典","声律"],"ACD","骈文的特点主要有：讲究声律的调谐、用字的绮丽、辞汇的对偶和用典。",14],[1952,2,"韩愈散文包括多种文体，其中有____。",["杂文","赠序文","稗志","传记"],"ABCD","韩愈散文包括多种文体，其中有杂文、赠序文、稗志和传记。",0],[1953,2,"下列说法正确的是____。",["《世说新语》记述了汉末至东晋的士族阶层的遗闻轶事，特别是士族人物的清谈","《世说新语》是中国魏晋南北朝时期“笔记小说”的代表作","《世说新语》的作者是干宝","《世说新语》是一部志人小说"],"ABD","C选项《世说新语》的作者是刘义庆。",0],[1954,2,"唐代传奇的创作特点主要有____。",["人物形象栩栩如生","故事情节曲折，引人入胜","语言华美，凝练传神","题材丰富多彩"],"ABCD","从艺术上看，唐代传奇在人物描写、情节安排和语言运用等方面都取得了巨大的成就，标志着中国古代小说艺术的渐趋成熟。\n（1）在人物描写方面，唐传奇善于通过对话和行动的具体描绘来表现人物的性格特征；善于通过对比、烘托，使人物形象更加丰满；善于运用细节描写、肖像描写和心理刻画，更细致深入地展现人物性格的复杂性，等等。因此，唐传奇塑造了众多的，栩栩如生的人物形象。（2）在情节结构的安排方面，不少唐传奇都做到了波澜起伏，严密完整，引人入胜；\n（3）在语言运用方面，唐传奇主要用散体古文，兼用通俗口语和骈文技巧，并大量插入诗歌，具有华实相扶、凝练传神的特点。\n（4）唐传奇题材丰富，美不胜收。唐传奇是我国文学史上有意识的写作小说的开始，它的产生，标志着中国小说的发展已渐趋成熟。",0],[1955,2,"下列作家属盛唐边塞诗人的是____。",["孟浩然","高适","岑参","王之涣"],"BCD","孟浩然是唐代山水田园诗人。",1],[1956,2,"下列作品属岑参的有____。",["《白雪歌送武判官归京》","《走马川行奉送出师西征》","《燕歌行》（汉家烟尘）","《逢人京使》"],"ABD","《燕歌行》（汉家烟尘）为高适作品。",0],[1957,2,"下列属李白的作品有____。",["《蜀道难》","《登高》","《行路难》（金樽清酒斗十千）","《将进酒君不见）"],"ACD","《登高》是唐代诗人杜甫的诗作。故排除B选项。",0],[1958,2,"下列属杜甫的作品有____。",["《自京赴奉先县咏怀五百字》","“三吏”、“三别”","《梦游天姥吟留别》","《茅屋为秋风所破歌》"],"ABD","《梦游天姥吟留别》是唐代诗人李白的诗作。故排除C选项。",0],[1959,2,"下列作品属李白的诗篇是____。",["《望庐山瀑布》","《望天门山》","《江畔独步寻花》","《黄鹤楼送孟浩然之广陵》"],"ABD","《江畔独步寻花七绝句》是唐代诗人杜甫的组诗作品，共有七首。",0],[1960,2,"构成“汉字⽂化圈”的要素有____。",["汉字","儒学","道教","律令制度"],"ABD","汉字文化圈为文化圈的概念之一。日本学者西嶋定生（1919－1988）给出的“汉字文化圈”的构成要素是：以汉字为传意媒介，以儒家为思想伦理基础，以律令制为法政体制，以汉传佛教为宗教信仰等等作为共同的价值标准。",2],[1961,2,"下列属“元白诗派“的有____。",["元稹","白居易","姚合","王建"],"ABD","元白诗派：重写实，尚通俗，主要代表人物是白居易、元稹、王建、张籍等。",0],[1962,2,"白居易把自己的诗 有____。",["原始的巫术","行业禁忌","文学上的建安风骨","中国戏曲的程式化动作"],"ABCD","当一种现象以同样的形式反复出现时，其中就含有规律性，成为某一历史时期、某一国家（民族或地域）文化发展中带有典型和标志作用的事情，这些现象称为文化事象。",9],[2086,2,"按照四分法可将中国文化分为____。",["物质文化","宗教文化","精神文化","制度文化"],"ACD","还有语言文化。",14],[2087,2,"竺可桢先生在《中国近五千年气候变化的初步研究》一文中将我国五千年的气候变化分为四个大的时期，按时间先后它们是____。",["温暖期","寒暖交错期","寒冷期","第一冷期"],"ABC","中国五千年气候的变化大势是由暖变冷,大致分为四个大的时期:1)温暖期：从公元前3000年到公元前1100年,下限正好在商朝末年。2)寒暖交错期：从公元前1100年到公元1400年,下限到明朝初期。3)方志时期,又叫寒冷时期。从公元1400年到1900年,下限到清朝末年。4)仪器观测期。",1],[2088,2,"用现代地理学的观点观察中国地理的自然特征，可以将中国领土划分为____。",["东部季风区","东部平原区","西北干旱区","中部山地区"],"AC","东部季风区，西北干旱半干旱区，青藏高原区。",7],[2089,2,"中国古代文化的基干包括____。",["源于印度的佛教文化","源于齐鲁的儒家文化","源于三晋的法家文化","源于江浙的商业文化"],"BC","中国古代文化的基干包括源于齐鲁的儒家文化 、源于三晋的法家文化、源于南楚的道家及楚辞文化。",2],[2090,2,"概括起来说，我国古代改造利用自然的成就包括____。",["土地的开垦","都江堰的修建","京杭大运河的开通","水利的兴修"],"AD","传说:大禹治水。战国:都江堰和郑国渠。关中:井渠法。汉代:王景治黄河",11],[2091,2,"下列人物中属于“五帝”的是____。",["黄帝","神农氏","高辛","颛顼"],"ACD","五帝是指黄帝、颛顼、帝喾、尧、舜。",11],[2092,2,"在汉武帝数十年对匈奴的战争中，大的战役有____。",["河南战役","河西战役","河东战役","漠北战役"],"ABD","河东战役是显王三年至四十七年(公元前366年—前322年)，秦军收复被魏国夺占的河西地区(今山西、陕西间黄河南段以西地区)的作战。",1],[2093,2,"“三公九卿”中“三公”指的是____。",["丞相","尚书","太尉","御史大夫"],"ACD","秦以丞相，太尉，御史大夫为三公。",3],[2094,2,"中国古代四大发明中，在唐宋之际发明并应用的包括____。",["火药","指南针","造纸术","活字印刷术"],"ABD","造纸术，是中国四大发明之一，发明于西汉时期、改进于东汉时期。",11],[2095,2,"明末清初的“三先生”指的是____。",["王夫之","顾炎武","黄宗羲","徐光启"],"ABC","清初出现了许多具有唯物主义思想与民主色彩的先进知识份子，黄宗羲、王夫之、顾炎武就是其杰出代表。他们被并称为“清初三先生” ，均曾参加过反清复明的爱国活动，失败后，拒绝同满清权贵合作，表现出崇高的民族气节。",1],[2096,2,"我国传统的市商贸易活动的主要模式有____。",["市","商","墟","集"],"ACD","市、墟、集、会是传统市商贸易活动的主要模式。",1],[2097,2,"下列属于儒家\"五常\"的有哪些？",["仁","义","礼","智","信","忠"],"ABCDE","\"五常\"即仁、义、礼、智、信，是儒家提倡的五种基本道德规范；\"忠\"虽也是传统道德，但不属于五常。",2],[2098,2,"下列属于古代\"六艺\"的有哪些？",["礼","乐","御","画","数"],"ABCE","六艺为礼、乐、射、御、书、数，是周代贵族教育的基本科目；\"画\"不在六艺之中。",8],[2099,2,"下列属于《三国演义》中\"五虎上将\"的有哪些？",["关羽","张飞","赵云","马超","黄忠","吕布"],"ABCDE","演义中关羽、张飞、赵云、马超、黄忠被封为\"五虎上将\"；书中指出此封号正史并无记载，且吕布不属五虎。",0],[2100,2,"下列属于\"金陵十二钗\"正册的有哪些？",["林黛玉","薛宝钗","贾探春","史湘云","晴雯","香菱"],"ABCD","正册十二人为黛玉、宝钗、元春、迎春、探春、惜春、湘云、妙玉、凤姐、巧姐、李纨、秦可卿；晴雯在又副册，香菱在副册。",10],[2101,2,"下列传统节日与习俗的对应，正确的有哪些？",["端午节——插艾蒿","七夕节——乞巧","重阳节——插茱萸","腊八节——喝腊八粥","清明节——扫墓踏青","中元节——赏月吃饼"],"ABCDE","端午插艾剪\"艾虎\"、七夕乞巧、重阳插茱萸、腊八喝腊八粥、清明扫墓踏青均有记述；赏月吃饼是中秋习俗。",5],[2102,2,"古代没有洗衣粉，下列哪些是古人使用的洗涤用品？",["草木灰水（灰水）","皂角（皂荚）","澡豆","肥皂团","洗衣液"],"ABCD","《考工记》即记载草木灰水用于洗涤；皂角、澡豆、肥皂团（\"肥皂\"得名由来）均为古代洗涤用品；洗衣液是近代化工产品。",12],[2103,2,"下列哪些是书中提到的万里长城以外的古长城遗址？",["山东齐长城（穆陵关）","华阴魏长城","烧锅营子燕长城","慕田峪长城","八达岭长城"],"ABCD","书中列举了齐长城、华阴魏长城、烧锅营子燕长城等古长城遗址；八达岭属明长城主线上的段落。",7],[2104,2,"下列属于戏曲角色行当的有哪些？",["生","旦","净","末","丑","侠"],"ABCDE","生、旦、净、末、丑是戏曲的五种角色行当；\"侠\"不是行当。",9],[2105,2,"书中说\"十八般武器\"有具体所指，下列属于\"十八般兵器\"的有哪些？",["刀","剑","戟","琴","流星锤"],"ABCE","十八般兵器一般指刀、枪、剑、戟、斧、钺、钩、叉、镋、棍、槊、棒、鞭、锏、锤、抓、拐子、流星等；\"琴\"不在其列。",10],[2106,2,"下列属于\"十二地支\"的有哪些？",["子","丑","巳","玄","亥"],"ABCE","十二地支为子、丑、寅、卯、辰、巳、午、未、申、酉、戌、亥；\"玄\"不是地支。",6],[2107,2,"下列属于\"五经\"的有哪些？",["《诗经》","《尚书》","《周易》","《春秋》","《论语》"],"ABCD","五经指《诗》《书》《礼》《易》《春秋》五部儒家经典；《论语》属于\"四书\"。",2],[2108,2,"世人常说的\"文房四宝\"具体指哪四宝？",["笔","墨","纸","砚","印章"],"ABCD","文房四宝指笔、墨、纸、砚，书中也指出这一说法的内涵历代有所变化，但四宝所指大体如此。",8],[2109,2,"\"唐宋八大家\"包括下列哪些人？",["韩愈","柳宗元","欧阳修","苏轼","辛弃疾"],"ABCD","唐宋八大家为韩愈、柳宗元、欧阳修、苏洵、苏轼、苏辙、王安石、曾巩；辛弃疾是词人，不在其列。",0],[2110,2,"属于\"岁寒三友\"的有哪些？",["松","竹","梅","兰"],"ABC","岁寒三友指松、竹、梅；\"兰\"属\"花中四君子\"。",1],[2111,2,"属于\"花中四君子\"的有哪些？",["梅","兰","竹","菊","松"],"ABCD","花中四君子指梅、兰、竹、菊；\"松\"属岁寒三友。",1],[2112,2,"下列属于我国\"四大名著\"的有哪些？",["《三国演义》","《水浒传》","《西游记》","《红楼梦》","《金瓶梅》"],"ABCD","四大名著为《三国演义》《水浒传》《西游记》《红楼梦》；《金瓶梅》是世情小说，不属四大名著。",0],[2113,2,"京剧界的\"四大名旦\"指哪些人？",["梅兰芳","程砚秋","尚小云","荀慧生","周信芳"],"ABCD","四大名旦为梅兰芳、程砚秋、尚小云、荀慧生；周信芳是京剧老生\"麒麟童\"，不属四大名旦。",9],[2114,2,"\"三从四德\"中的\"三从\"包括哪些？",["未嫁从父","既嫁从夫","夫死从子","父死从兄"],"ABC","\"三从\"指未嫁从父、既嫁从夫、夫死从子；\"父死从兄\"是干扰项。",14],[2115,2,"\"八音\"是制作乐器的八类材料，下列属于其中的有哪些？",["金","石","丝","木","鼓"],"ABCD","八音指金、石、丝、竹、匏、土、革、木八类材料；\"鼓\"是乐器名称，不是材料。",9],[2116,2,"毛评本《三国演义》中所说的\"三绝\"，指的是哪些人？",["诸葛亮（智绝）","关羽（义绝）","曹操（奸绝）","赵云"],"ABC","\"三绝\"指诸葛亮之智绝、关羽之义绝、曹操之奸绝，赵云不在\"三绝\"之列。",2],[2117,2,"属于\"竹林七贤\"的有哪些？",["嵇康","阮籍","山涛","王维"],"ABC","竹林七贤为嵇康、阮籍、山涛、向秀、刘伶、王戎、阮咸；王维是唐代诗人，不属七贤。",0],[2118,2,"下列属于中国历史上\"上古三代\"（夏商周）的有哪些？",["夏","商","周","秦"],"ABC","夏、商、周合称\"三代\"；秦是三代之后的第一个大一统王朝。",1],[2119,2,"\"战国四公子\"指的是下列哪几位？",["孟尝君","平原君","信陵君","春申君","吕不韦"],"ABCD","战国四公子为齐孟尝君、赵平原君、魏信陵君、楚春申君，均以养士著称；吕不韦是秦国丞相。",1],[2120,2,"秦始皇统一六国后推行巩固统一的措施包括？",["书同文","车同轨","统一度量衡","统一货币","分封诸侯"],"ABCD","秦统一文字、车轨、度量衡和货币；秦废分封而行郡县，分封不是其措施。",1],[2121,2,"辅佐刘邦建立汉朝、史称\"汉初三杰\"的是？",["张良","萧何","韩信","陈平"],"ABC","刘邦自述：运筹帷幄不如张良，镇国抚民不如萧何，战必胜攻必取不如韩信。",1],[2122,2,"\"文景之治\"时期推行的政策包括？",["轻徭薄赋","与民休息","提倡节俭","大兴土木"],"ABC","文景二帝减田租、省刑罚、尚节俭；大兴土木与之背道而驰。",0],[2123,2,"\"开元盛世\"时期的著名贤相包括？",["姚崇","宋璟","杨国忠","李林甫"],"AB","姚崇、宋璟相继为相，辅佐唐玄宗开创开元盛世；杨国忠、李林甫为奸相。",1],[2124,2,"\"康乾盛世\"指的是哪几位皇帝在位时期？",["康熙","雍正","乾隆","顺治"],"ABC","康乾盛世历经康熙、雍正、乾隆三朝，持续百余年。",1],[2125,2,"下列属于\"二十四史\"的有哪些？",["《史记》","《汉书》","《后汉书》","《三国志》","《资治通鉴》"],"ABCD","二十四史为纪传体正史，《资治通鉴》是编年体，不在其列。",1],[2126,2,"下列属于编年体史书的有哪些？",["《春秋》","《左传》","《资治通鉴》","《史记》"],"ABC","《春秋》《左传》《资治通鉴》均按年代编排；《史记》是纪传体。",2],[2127,2,"下列属于中国古代著名兵书的有哪些？",["《孙子兵法》","《吴子》","《六韬》","《论语》"],"ABC","《孙子兵法》《吴子》《六韬》均为著名兵书；《论语》是儒家经典。",2],[2128,2,"下列《水浒传》人物与绰号对应正确的有哪些？",["及时雨——宋江","豹子头——林冲","智多星——吴用","黑旋风——宋江"],"ABC","\"黑旋风\"是李逵的绰号，不是宋江。",0],[2129,2,"下列《西游记》人物与来历对应正确的有哪些？",["孙悟空——仙石孕育","唐僧——以玄奘为原型","猪八戒——天蓬元帅","沙僧——卷帘大将"],"ABCD","四组对应均正确：悟空出自仙石，八戒、沙僧分别是被贬的天蓬元帅和卷帘大将。",0],[2130,2,"下列《红楼梦》人物关系对应正确的有哪些？",["贾宝玉与林黛玉——姑表兄妹","王熙凤——贾琏之妻","贾政——贾宝玉之父","贾探春——贾琏之妹"],"ABC","探春是贾政之女、贾宝玉的庶出妹妹，与贾琏是堂兄妹关系。",10],[2131,2,"\"唐宋八大家\"中属于唐代的有哪些？",["韩愈","柳宗元","欧阳修","苏轼"],"AB","八大家中唐代仅韩愈、柳宗元二人，其余六位为宋人。",0],[2132,2,"下列属于唐代著名边塞诗人的有哪些？",["高适","岑参","王昌龄","王之涣","王维"],"ABCD","高适、岑参、王昌龄、王之涣均以边塞诗著称；王维以山水田园诗为主。",0],[2133,2,"\"元杂剧四大悲剧\"包括？",["《窦娥冤》","《汉宫秋》","《梧桐雨》","《赵氏孤儿》","《西厢记》"],"ABCD","四大悲剧为《窦娥冤》《汉宫秋》《梧桐雨》《赵氏孤儿》；《西厢记》是喜剧。",9],[2134,2,"明代\"四大奇书\"指的是？",["《三国演义》","《水浒传》","《西游记》","《金瓶梅》","《红楼梦》"],"ABCD","四大奇书为《三国演义》《水浒传》《西游记》《金瓶梅》；《红楼梦》成书于清代，不在其列。",0],[2135,2,"古人总结的汉字造字方法\"六书\"包括？",["象形","指事","会意","形声","拼音"],"ABCD","六书为象形、指事、会意、形声、转注、假借；拼音是近现代注音方法。",1],[2136,2,"\"楷书四大家\"指的是？",["欧阳询","颜真卿","柳公权","赵孟頫","王羲之"],"ABCD","楷书四大家为唐代的欧阳询、颜真卿、柳公权和元代的赵孟頫。",8],[2137,2,"我国传统\"四大名绣\"指的是？",["苏绣","湘绣","粤绣","蜀绣","京绣"],"ABCD","四大名绣为苏州苏绣、湖南湘绣、广东粤绣、四川蜀绣。",7],[2138,2,"我国古代\"四大古都\"指的是？",["西安","洛阳","南京","北京","杭州"],"ABCD","四大古都为西安、洛阳、南京、北京；杭州属\"六大古都\"之列。",7],[2139,2,"下列属于\"五岳\"的有哪些？",["泰山","华山","恒山","嵩山","衡山","黄山"],"ABCDE","五岳为东岳泰山、西岳华山、北岳恒山、中岳嵩山、南岳衡山；黄山不在五岳之列。",7],[2140,2,"中国\"四大道教名山\"指的是？",["武当山","青城山","龙虎山","齐云山","五台山"],"ABCD","四大道教名山为湖北武当山、四川青城山、江西龙虎山、安徽齐云山；五台山是佛教名山。",7],[2141,2,"下列属于传统七夕节习俗的有哪些？",["乞巧","拜织女","穿针引线","登高远眺"],"ABC","七夕女子穿针乞巧、拜织女星；登高远眺是重阳节习俗。",5],[2142,2,"下列属于清明节习俗的有哪些？",["扫墓祭祖","踏青","插柳","放风筝","赏月"],"ABCD","清明扫墓、踏青、插柳、放风筝均为其习俗；赏月是中秋习俗。",5],[2143,2,"下列属于端午节习俗的有哪些？",["赛龙舟","吃粽子","挂艾草","佩香囊","登高远眺"],"ABCD","端午赛龙舟、吃粽子、挂艾草菖蒲、佩香囊；登高远眺是重阳习俗。",5],[2144,2,"下列属于春节习俗的有哪些？",["贴春联","守岁","拜年","给压岁钱","插茱萸"],"ABCD","贴春联、守岁、拜年、压岁钱均为春节习俗；插茱萸是重阳节习俗。",5],[2145,2,"中医诊断疾病的\"四诊\"指的是？",["望","闻","问","切","针"],"ABCD","四诊即望诊、闻诊、问诊、切诊；针灸是治疗方法而非诊法。",11],[2146,2,"\"中医四大经典\"指的是？",["《黄帝内经》","《难经》","《伤寒杂病论》","《神农本草经》","《本草纲目》"],"ABCD","中医四大经典为《黄帝内经》《难经》《伤寒杂病论》《神农本草经》；《本草纲目》是明代药学巨著。",11],[2147,2,"下列属于中国传统弹拨乐器的有哪些？",["古琴","古筝","琵琶","二胡"],"ABC","古琴、古筝、琵琶均为弹拨乐器；二胡是拉弦乐器。",9],[2148,2,"下列关于李白的说法正确的有哪些？",["被称为\"诗仙\"","号青莲居士","诗风豪放飘逸","被称为\"诗圣\""],"ABC","李白号青莲居士、诗风豪放飘逸，被称\"诗仙\"；\"诗圣\"是杜甫。",0],[2149,2,"儒家经典\"三礼\"指的是？",["《周礼》","《仪礼》","《礼记》","《诗经》"],"ABC","三礼为《周礼》《仪礼》《礼记》，是记载古代礼制的经典。",2],[2150,2,"下列属于唐代\"传奇\"（文言短篇小说）的有哪些？",["《柳毅传》","《莺莺传》","《南柯太守传》","《牡丹亭》"],"ABC","唐传奇以《柳毅传》《莺莺传》《南柯太守传》等为代表；《牡丹亭》是明代戏曲。",3],[2151,2,"明末清初的三大思想家指的是？",["黄宗羲","顾炎武","王夫之","纪昀"],"ABC","黄宗羲、顾炎武、王夫之并称明末清初三大思想家；纪昀是清代《四库全书》总纂官。",1],[2152,2,"下列属于中国历史上著名\"治世\"或\"盛世\"的有哪些？",["文景之治","贞观之治","开元盛世","康乾盛世","安史之乱"],"ABCD","文景之治、贞观之治、开元盛世、康乾盛世均为治世；安史之乱是唐由盛转衰的战乱。",1],[2153,2,"科举取士的三级最高考试是？",["乡试","会试","殿试","武试"],"ABC","科举正式的三级考试为乡试、会试、殿试；童试为入门考试。",3],[2154,2,"下列属于对老年人年龄的雅称有哪些？",["花甲（六十岁）","古稀（七十岁）","耄耋（八九十岁）","期颐（百岁）","豆蔻（十三四岁）"],"ABCD","花甲、古稀、耄耋、期颐均指老年；豆蔻指少女十三四岁。",4],[2155,2,"下列年龄称谓与年龄对应正确的有哪些？",["弱冠——男子二十岁","而立——三十岁","不惑——四十岁","花甲——七十岁"],"ABC","弱冠二十、而立三十、不惑四十均正确；花甲指六十岁，七十岁称古稀。",4],[2156,2,"下列属于传统启蒙读物的有哪些？",["《三字经》","《百家姓》","《千字文》","《弟子规》","《史记》"],"ABCD","三字经、百家姓、千字文、弟子规均为蒙学读物；《史记》是史书。",2],[2157,2,"下列少数民族与其传统节日对应正确的有哪些？",["泼水节——傣族","火把节——彝族","那达慕大会——蒙古族","开斋节——回族","樱花节——傣族"],"ABCD","四组对应均正确；\"樱花节\"并非傣族传统节日，属干扰项。",5],[2158,2,"古代婚礼\"六礼\"中的前四礼是？",["纳采","问名","纳吉","纳征","出家"],"ABCD","六礼为纳采、问名、纳吉、纳征、请期、亲迎，前三到四礼均在议婚阶段。",5],[2159,2,"下列属于\"二十四节气\"的有哪些？",["芒种","白露","霜降","大寒","腊八"],"ABCD","芒种、白露、霜降、大寒均为节气；腊八是传统节日。",6],[2160,2,"古代天文学\"四象\"与方位的对应正确的有哪些？",["东方——青龙","西方——白虎","南方——朱雀","北方——玄武","中央——麒麟"],"ABCD","东青龙、西白虎、南朱雀、北玄武；\"中央麒麟\"是干扰项。",0],[2161,2,"下列\"五行相生\"关系正确的有哪些？",["木生火","火生土","土生金","金生水","水生火"],"ABCD","五行相生为木生火、火生土、土生金、金生水、水生木；\"水生火\"错误。",7],[2162,2,"下列属于中国传统节令食品的有哪些？",["月饼","元宵","粽子","重阳糕","汉堡"],"ABCD","月饼、元宵、粽子、重阳糕为传统节令食品；汉堡是西式食品。",5],[2163,2,"下列属于中国传统民间手工艺的有哪些？",["剪纸","刺绣","泥塑","面塑","油画"],"ABCD","剪纸、刺绣、泥塑、面塑均为传统手工艺；油画是西方画种。",5],[2164,2,"下列属于中国传统戏曲剧种的有哪些？",["京剧","越剧","黄梅戏","豫剧","话剧"],"ABCD","京剧、越剧、黄梅戏、豫剧均为传统戏曲剧种；话剧是西方传入的戏剧形式。",9],[2165,2,"下列成语出自《论语》的有哪些？",["温故知新","举一反三","不耻下问","任重道远","草木皆兵"],"ABCD","前四个成语均出自《论语》；\"草木皆兵\"出自淝水之战典故。",0],[2166,2,"下列典故与项羽有关的有哪些？",["破釜沉舟","四面楚歌","霸王别姬","乌江自刎","约法三章"],"ABCD","前四项均与项羽有关；\"约法三章\"是刘邦入关中之事。",7],[2167,2,"下列典故与韩信有关的有哪些？",["胯下之辱","背水一战","明修栈道、暗度陈仓","多多益善","破釜沉舟"],"ABCD","前四项均与韩信有关；\"破釜沉舟\"是项羽之事。",0],[2168,2,"下列史事与岳飞有关的有哪些？",["背刺\"精忠报国\"","郾城大捷","风波亭遇害","被十二道金牌召回","完璧归赵"],"ABCD","前四项均与岳飞有关；\"完璧归赵\"是战国蔺相如之事。",7],[2169,2,"中国古代\"四大美女\"指的是？",["西施","王昭君","貂蝉","杨玉环","赵飞燕"],"ABCD","四大美女为西施、王昭君、貂蝉、杨玉环；赵飞燕是汉成帝皇后，不在其列。",1],[2170,2,"\"沉鱼落雁、闭月羞花\"与四大美女的对应正确的有哪些？",["沉鱼——西施","落雁——王昭君","闭月——貂蝉","羞花——杨玉环","闭月——西施"],"ABCD","四组对应均正确；\"闭月\"指的是貂蝉，不是西施。",1],[2171,2,"\"建安七子\"包括下列哪些人？",["孔融","陈琳","王粲","曹植"],"ABC","建安七子为孔融、陈琳、王粲、徐干、阮瑀、应玚、刘桢；曹植属\"三曹\"，不在七子之列。",1],[2172,2,"宋代著名的\"四大书院\"包括？",["白鹿洞书院","岳麓书院","嵩阳书院","应天书院","东林书院"],"ABCD","四大书院为白鹿洞、岳麓、嵩阳、应天书院；东林书院为明代讲学议政之所。",1],[2173,2,"我国\"四大石窟\"指的是？",["敦煌莫高窟","云冈石窟","龙门石窟","麦积山石窟","大足石刻"],"ABCD","四大石窟为敦煌莫高窟、大同云冈石窟、洛阳龙门石窟、天水麦积山石窟。",7],[2174,2,"我国\"四大名亭\"指的是？",["醉翁亭","陶然亭","爱晚亭","湖心亭","兰亭"],"ABCD","四大名亭为滁州醉翁亭、北京陶然亭、长沙爱晚亭、杭州湖心亭；绍兴兰亭因王羲之闻名，但不属四大名亭。",10],[2175,2,"下列属于\"十二生肖\"的有哪些？",["龙","虎","蛇","马","狼"],"ABCD","十二生肖为鼠牛虎兔龙蛇马羊猴鸡狗猪；狼不在其列。",5],[2176,3,"春节贴____字，是中国民间由来已久的风俗，寄托了人们对美好生活的向往，也是对未来的祝愿。",[],"福","春节贴“福”字，是中国民间由来已久的风俗，寄托了人们对美好生活的向往，也是对未来的祝愿。据宋代《梦粱录》记载:“岁旦在迩，席铺百货，画门神桃符，迎春牌儿……”“士庶家不论大小，俱洒扫门闾，去尘秽，净庭户，换门神，挂钟馗，钉桃符，贴春牌，祭祀祖宗”。文中的“贴春牌”即是写在红纸上的“福”字。",5],[2177,3,"有“文章巨公”和“百代文宗”之名的是____。",[],"韩愈","韩愈，字退之，有“文章巨公”和“百代文宗”之称。",0],[2178,3,"醉翁亭位于安徽省滁州市西南琅琊山麓，其建造者是____。",[],"智仙","原文中有“作亭者谁？山之僧智仙也。”",7],[2179,3,"“琴棋书画”是中国古代文人修身必备，被誉为“文人四友”，这里的“棋”指的是____。",[],"围棋","四艺，通常指中国文人所推崇和要掌握的四门艺术，即琴、棋、书、画，又称为“文人四艺”，或“秀才四艺”。“琴”指的是弹琴（多指古琴）、“棋”指的是弈棋（多指围棋和中国象棋）、“书”指的是书法、“画”指的是绘画。",13],[2180,3,"写出下诗中缺失部分：____花落去，似曾相识燕归来。",[],"无可奈何","出自宋代晏殊的《浣溪沙·一曲新词酒一杯》\n一曲新词酒一杯，去年天气旧亭台。夕阳西下几时回？\n无可奈何花落去，似曾相识燕归来。小园香径独徘徊。",0],[2181,3,"“唐太宗”的“太宗”指的是他的____。",[],"庙号","庙号是中国君主死后在庙中被供奉时所称呼的名号，起源于重视祭祀与敬拜的商朝。唐太宗，名李世民（599年1月23日—649年7月10日。他的名字意思是“济世安民”，太宗是他死后的庙号。",4],[2182,3,"“三人行，必有我师”、“敏而好学，不耻下问”出自____。",[],"论语","《论语》，是春秋时期思想家、教育家孔子的弟子及再传弟子记录孔子及其弟子言行而编成的语录文集，成书于战国前期。全书共20篇492章，以语录体为主，叙事体为辅，较为集中地体现了孔子及儒家学派的政治主张、伦理思想、道德观念、教育原则等。",2],[2183,3,"“好来宝”是____族的即兴诗。",[],"蒙古","好来宝是中国蒙古族曲艺曲种，用蒙古语演唱。好来宝在蒙古语中意为“联韵”，即各句唱词的头一个音节谐韵，故又称联头韵。有的则将好来宝译为“连起来唱”或 “串起来唱”。2008年6月7日，好来宝经国务院批准列入第二批国家级非物质文化遗产名录。",0],[2184,3,"唐代人可以称“父亲”为____。",[],"哥哥","“哥哥”在唐代既指“父亲”，也指“兄长”。哥哥原本不是中原的叫法，在唐朝属于外来语，一般称父亲为“耶耶”，私下里某些场合可以称“哥哥”，但在较为正式或者特殊的公开场合，还是得叫“父亲”或者“大人”。有时也把父亲叫做“阿耶”，和母亲在一起就叫“耶娘”，或“爷娘”。",1],[2185,3,"世界遗产委员会第24届会议决定把龙门石窟列入《世界遗产名录》，龙门石窟位于河南省____市。",[],"洛阳","龙门石窟位于河南省洛阳市，是世界上造像最多、规模最大的石刻艺术宝库，被联合国科教文组织评为“中国石刻艺术的最高峰”，位居中国各大石窟之首。现为世界文化遗产、全国重点文物保护单位、国家AAAAA级旅游景区。",7],[2186,3,"中国的四大发明是造纸术、指南针、火药、____。",[],"印刷术","中国四大发明是造纸术、指南针、火药、印刷术。四大发明是中国古代创新的智慧成果和科学技术，四大发明的概念却来源于西方学者，并在之后被中国人接受。意大利数学家杰罗姆·卡丹早在1550年就第一个指出，中国对世界所具有影响的“三大发明”：是司南（指南针）、印刷术和火药。来华传教士艾约瑟最先在三大发明中加入造纸术。",11],[2187,3,"我国思想家____曾提出：学校应成为民主议政的场所。",[],"黄宗羲","黄宗羲“学校议政”思想主要体现于其著作《明夷待访录学校》中。该书曾被称为“反对君主专制主义的战斗檄文，代表了中国古代民主思想的最高成就”。学校议政思想可以概括为：学校反映民意，参与决策，舆论监督限制皇权、官权。在他看来，不是皇帝，而是“学校”形成的舆论，才是天下是非的标准，身为天子的皇上也要以其是非为是非。",1],[2188,3,"“吴带当风”是形容我国唐代画家____的笔法。",[],"吴道子","吴道子是中国山水画的祖师，被后人尊称为“画圣”，素有“吴带当风”的美誉，他的人物绘画更是“冠绝于世”。所绘人物，善用状如兰叶或蓴菜条之线条表现衣褶，使有飘举之势，人称“吴带当风”；又喜以焦墨勾线，略加淡彩设色，又称“吴装”。",8],[2189,3,"我国历史上第一部编年体史书是____。",[],"春秋","《春秋》是中国第一部编年体史书，共三十五卷，是儒家经典之一且为十三经中篇幅最长的，在四库全书中列为经部。记述范围从公元前722（鲁隐公元年）至公元前468。",2],[2190,3,"徐霞客曾经盛赞一座山为“四海名山皆过目，就中此景难图录”。这座山指的是____。",[],"雁荡山","徐霞客曾经盛赞一座山为：“四海名山皆过目，就中此景难图录。”这座山指的就是以山水奇秀闻名，素有“海上名山、寰中绝胜”之誉，史称中国“东南第一山”的雁荡山。据说，是因山顶有湖，芦苇茂密，结草为荡，南归秋雁多宿于此，故名雁荡。雁荡山开山凿胜始于南北朝，兴于唐，盛于宋。历代文人墨客纷至沓来，谢灵运、沈括、徐霞客等都是雁荡山的忠实拥趸，留下了不少诗篇。",7],[2191,3,"____是中国境内最早的直立人。",[],"元谋人","元谋人，学名元谋直立人，或称元谋猿人，是在中国发现的直立人化石。1965年发现于云南元谋上那蚌村附近，共计左右门齿两颗。",1],[2192,3,"三星堆遗址位于四川省广汉市，古蜀文化遗址，被誉为____文明之源。",[],"长江","三星堆古遗址位于四川省广汉市西北的鸭子河南岸，分布面积12平方千米，距今已有5000至3000年历史，是迄今在西南地区发现的范围最大、延续时间最长、文化内涵最丰富的古城、古国、古蜀文化遗址。三星堆遗址被称为20世纪人类最伟大的考古发现之一，昭示了长江流域与黄河流域一样，同属中华文明的母体，被誉为“长江文明之源”。",7],[2193,3,"北宋书法四大家是黄庭坚、欧阳修、米芾、____。",[],"蔡襄","宋四家是中国北宋时期四位书法家苏轼、黄庭坚、米芾和蔡襄的合称。这四个人大致可以代表宋代的书法风格，而且成就最高，故称“宋四家”。",8],[2194,3,"唐宋散文八大家是韩愈、柳宗元、欧阳修、苏洵、苏轼、苏辙、王安石、____。",[],"曾巩","唐宋八大家，又称为“唐宋散文八大家”，是唐代和宋代八位散文家的合称，分别为唐代柳宗元、韩愈和宋代欧阳修、苏洵、苏轼、苏辙、王安石、曾巩八位。其中韩愈、柳宗元是唐代古文运动的领袖，欧阳修、三苏(苏轼、苏辙、苏洵)等四人是宋代古文运动的核心人物，王安石、曾巩是临川文学的代表人物。他们先后掀起的古文革新浪潮，使诗文发展的陈旧面貌焕然一新。",0],[2195,3,"四大名旦是梅兰芳、程砚秋、尚小云、____。",[],"荀慧生","京剧四大名旦是指梅兰芳、程砚秋、尚小云、荀慧生，他们是中国京剧旦角行当中四大艺术流派的创始人。他们的优秀艺术，给人留下了不可磨灭的印象。",8],[2196,3,"《水浒传》中吴用的绰号是____。",[],"智多星","智多星是《水浒传》人物吴用的绰号。吴用满腹经纶，通晓文韬武略，足智多谋，常以诸葛亮自比，道号“加亮先生”，人称“智多星”。",0],[2197,3,"“海上生明月，天涯共此时”的作者是____。",[],"张九龄","“海上生明月，天涯共此时”出自张九龄的《望月怀远》。表示一轮明日从海上慢慢升起，远在天边的亲人这时候一定和我一样在凝视着它。后用来表达对远方亲人的思念之情。",0],[2198,3,"“无边落木萧萧下，不尽长江滚滚来”是____的作品。",[],"杜甫","“无边落木萧萧下，不尽长江滚滚来”出自唐朝诗人杜甫的古诗作品《登高》第三四句，其全诗文如下：风急天高猿啸哀，渚清沙白鸟飞回。无边落木萧萧下，不尽长江滚滚来。万里悲秋常作客，百年多病独登台。艰难苦恨繁霜鬓，潦倒新停浊酒杯。",0],[2199,3,"红杏尚书指的是____。",[],"宋祁","宋祁(公元998年-公元1061年)，字子京，小字选郎。是北宋官员、著名文学家、史学家、词人。司空宋庠之弟，宋祁与兄长宋庠并有文名，时称“二宋”。诗词语言工丽，因《玉楼春》词中有“红杏枝头春意闹”，世称“红杏尚书”。",3],[2200,3,"我国创作妇女诗最多的诗人是____。",[],"李白","李白出生于商人家庭，曾经几次游历大江南北，也算是体察民情，在游历的过程中李白见过各种妇人不同的生活，也因此感叹颇多，所以在他的诗词中，很多是描写妇女的。有描写妇女的怨恨、离别、相思之情等。",0],[2201,3,"词这种文体起于唐代盛于____代。",[],"宋","词最初称为“曲词”或“曲子词”,是配音乐的。 后来词也跟乐府一样，逐渐跟音乐分离，成为诗的别体，所以有人把词 称为“诗余”。 因其每句的长短丌一，所以又称“长短句”。",0],[2202,3,"负荆请罪的故事主角是廉颇和____。",[],"蔺相如","《史记·廉颇蔺相如列传》：相如曰：“夫以秦王之威，而相如廷叱之，辱其群臣，相如虽弩，独畏廉将军哉！顾吾念之，强秦之所以不敢加兵予赵者，徒以吾两人在也，今两虎共斗，其势不俱生，吾所以为此者，以先国家之急而后私仇也。”廉颇闻之，肉袒负荆。因宾客至蔺相如门谢罪，曰：“鄙贱之人，不知将军宽之至此也!”卒相与欢，为刎颈之交。后世据此典故提炼出成语“负荆请罪”。",1],[2203,3,"“师者，所以传道受业解惑也。”中的“道”指的是____家礼教、思想。",[],"儒","此句出自韩愈的《师说》，意思是：老师，是用来传授知识、教授学业、解答疑惑的人。“道”指的是儒家礼教、思想。",2],[2204,3,"“就像没有那回事一样，形容态度镇定，不把事情放在心上。”这句话描述的是成语____。",[],"若无其事","好像没有那么回事似的，形容不动声色或漠不关心。",0],[2205,3,"《弟子规》总叙的全部内容为“弟子规，圣人训。____，次谨信。泛爱众，而亲仁。有余力，则学文。”",[],"首孝悌","《弟子规》，原名《训蒙文》，是清朝李毓秀所作的三言韵文，约作于康熙年间。该文共为五个部分，其首章“总叙”将孔子的话，用三字句改编而成，为“弟子规，圣人训。首孝悌，次谨信。泛爱众，而亲仁。有余力，则学文。”",2],[2206,3,"我国传统图案里以石榴象征____。",[],"多子","在中国传统文化中，石榴是吉祥的象征。它的果实里有很多石榴籽，寓意多子多福。所以可以送给已婚夫妇，代表多子多福。",14],[2207,3,"儒家代表人孔子在解释“仁”时说，“夫仁者，____，己欲达而达人”。",[],"己欲立而立人","己欲立而立人，己欲达而达人出自于《论语·雍也》。欲:想要。立，站立。而，表转折，才能够。立人，使动用法，使人站立，意思是把摔倒的人扶起来。达，腾达。达人，使动用法，使人腾达，意思是周济需要帮助的人。",2],[2208,3,"“仁”最早出自____。",[],"尚书","最早出自《尚书》。《尚书》中说：“克宽克仁，彰信兆民”，意思是说当年商汤用宽恕仁爱之德，明信于天下的百姓。“仁”最早的涵义是“亲人”的意思，《说文解字》中说：“亲，仁也”，又说：“仁，亲也”。主要是指家庭成员之间、氏族亲人之间要“亲爱”，这种“仁爱”之情，仅仅局限于家族亲属之间。",2],[2209,3,"“欲将轻骑逐”中“将”的意思是____。",[],"率领","欲将轻骑逐，大雪满弓刀。出自卢纶的《和张仆射塞下曲六首》，意思是：正想要率领轻骑一路追杀，纷纷大雪，却已经洒满了将士的弓刀。",0],[2210,3,"“在危急的时刻，猛然想出办法。”这句话描述的是成语____。",[],"急中生智","急中生智是，汉语成语，拼音是jí zhōng shēng zhì，意思是形容事态紧急的时候，突然想出办法。出自《和微之诗二十三首序》。",0],[2211,3,"“斯恶已”中“恶”的解释是____。",[],"丑陋","天下皆知美之为美,斯恶已。皆知善之为善,斯不善已。摘自《老子·道经·第二章》 解释：当天下的人都知道都认为这件事是美好的话,那么它丑恶的一面就显现出来了。",2],[2212,3,"汉武帝时设立了一种专门的乐舞机构是____。",[],"乐府","乐府是汉武帝时设立的专门管理音乐的机关。乐府负责培训乐工,制定乐谱,搜集和整理歌辞并配以乐曲。",9],[2213,3,"京剧的角色分为____。",[],"生旦净末丑","京剧的角色分为生旦净末丑，其中“生”指男性角色,“旦”指女性角色,“净”指花脸,“末”指中年以上男子,“丑”指喜剧角色。",9],[2214,3,"三教九流中的“三教”指的是儒教、佛教、____。",[],"道教","三教是指释道儒这三个传统宗教。儒家的创始人是孔子，所以儒教又叫做孔教，但是并不等同于儒学，儒教的教义是仁字，为民为天地，为求万事太平的仁是它们的最高教义，也是国内民族的本土宗教，历史悠久代表了所有文明礼乐。道教是用修炼追求得道成仙，寻求人与自然之间的和谐，它们的最高信仰其实是对于神仙的敬畏。",2],[2215,3,"我国文房四宝是____。",[],"笔墨纸砚","笔墨纸砚，是中国独有的文书工具，即文房四宝。",8],[2216,3,"《礼记》中认为人的七情是指喜、怒、哀、乐、爱、恶、____。",[],"欲","七情按《礼记》的观点指喜、怒、哀、惧、爱、恶、欲，按儒家的说法是喜、怒、哀、惧、爱、恶、欲，按佛教的说法则是喜、怒、忧、惧、爱、憎、欲，而医家的七情是喜、怒、忧、思、悲、恐、惊。",2],[2217,3,"“春城无处不飞花，寒食东风御柳斜。”出自____。",[],"寒食","《寒食》是唐代诗人韩翃的一首七言绝句。全文为：春城无处不飞花，寒食东风御柳斜。日暮汉宫传蜡烛，轻烟散入五侯家。诗的前两句写的是白昼风光，描写了整个长安柳絮飞舞，落红无数的迷人春景和皇宫园林中的风光；后两句则是写夜晚景象，生动地画出了一幅夜晚走马传烛图，使人如见蜡烛之光，如闻轻烟之味。",5],[2218,3,"“天下第一行书”是王羲之的____。",[],"兰亭集序","《兰亭集序》，又题为《临河序》、《禊帖》、《三月三日兰亭序》等。晋穆帝永和九年（公元353）三月三日，时任会稽内史的王羲之与友人谢安、孙绰等四十一人会聚兰亭，赋诗饮酒。王羲之将诸人名爵及所赋诗作编成一集，并作序一篇，记述流觞曲水一事，并抒写由此而引发的内心感慨。这篇序文就是《兰亭集序》。此序受石崇《金谷诗序》影响很大，其成就又远在《金谷诗序》之上。",8],[2219,3,"书法史上的“二王”是指王羲之和____两位书法家。",[],"王献之","“二王”书法家是指王羲之和王献之，他们二人为父子，是东晋时期的大书法家。",8],[2220,3,"《祭侄文稿》被誉为“天下第二行书”，它的作者是____。",[],"颜真卿","《祭侄文稿》，全名《祭侄赠赞善大夫季明文文稿》，俗谓《祭侄稿》。为唐朝书法家颜真卿所书，后世誉为“天下行书第二”，真迹现藏于台北国立故宫博物院。",8],[2221,3,"我国文学史上第一部诗歌总集____。",[],"诗经","《诗经》，是中国古代诗歌开端，最早的一部诗歌总集，收集了西周初年至春秋中叶(前11世纪至前6世纪)的诗歌，共311篇，其中6篇为笙诗，即只有标题，没有内容，称为笙诗六篇(《南陔》《白华》《华黍》《由庚》《崇丘》《由仪》)，反映了周初至周晚期约五百年间的社会面貌。",2],[2222,3,"杰出的女纺织家黄道婆向____妇女学习棉纺织技术。",[],"黎族","黄道婆，又名黄婆、黄母，是原松江府乌泥泾(今属上海市)人，宋末元初著名的棉纺织家、技术改革家。幼时为童养媳，曾因不堪虐待流落崖州(治所在今海南省三亚市崖城镇)，定居约40年，向黎族妇女学习棉纺织技艺并有改进，总结出“错纱、配色、综线、挈花”的织造技术。",10],[2223,3,"傈傈族语属于____语系。",[],"汉藏","傈僳语属汉藏语系-藏缅语族-彝语支。",1],[2224,3,"芳华越剧团的创始人是____。",[],"尹桂芳","福建省芳华越剧团，原为上海市芳华越剧团，由著名越剧表演艺术家尹桂芳于1946年在上海创建。",9],[2225,3,"“徐黄异体”指的是五代画家____和黄筌的花鸟画风格。",[],"徐熙","徐熙画派，中国画流派之一。为五代花鸟画派的一支，代表画家徐熙。北宋郭若虚在《图画见闻志》\"论黄、徐体异\"时说\"黄家富贵，徐熙野逸。\"又说\"徐熙江南处士\"，\"多状江南所有，汀花野竹，水鸟渊鱼。\"此派多作粗笔浓墨，略施杂彩，而笔迹不隐，素有\"落墨花\"之称。",8],[2226,3,"中国现存最大的两座古代木构殿堂是____和凌恩殿。",[],"太和殿","太和殿俗称金銮殿，为汉族宫殿建筑之精华，东方三大殿之一。中国现存最大的木结构大殿。位于北京紫禁城(故宫)南北主轴线的显要位置，明永乐十八年(1420年)建成，称奉天殿。明嘉靖四十一年(1562年)改称皇极殿，清顺治二年(1645年)改今名。建成后屡遭焚毁，多次重建，今殿为清康熙三十四年(1695年)重建后的形制。",10],[2227,3,"在我国古代，“鱼书”指的是____。",[],"书信","鱼书是古时对书信的称谓。纸张出现以前，书信多写在白色丝绢上，为使传递过程中不致损毁，古人常把书信扎在两片竹木简中，简多刻成鱼形，故称鱼书。",4],[2228,3,"袁雪芬、严凤英、红线女、叶盛兰分别是越剧、____、粤剧、京剧的著名演员。",[],"黄梅戏","袁雪芬、严凤英、红线女、叶盛兰分别是越剧、黄梅戏、粤剧、京剧的著名演员。",9],[2229,3,"京杭大运河数段中最早开凿的是____。",[],"邗沟","京杭大运河最早开凿的河段是邗沟，从春秋吴王夫差十年起，以通江淮为起始点，之后是隋朝的运河系统，历经了元、明、清三个朝代的扩展，才初具规模，有了世界第一大运河的雏形，为我国的经济文化繁荣发展做出了杰出的贡献。",7],[2230,3,"耄耋之年指____岁。",[],"八九十","耄耋之年是一个汉语成语，用作对老年人的泛称，指八九十岁。出自曹操《对酒》：“耄耋皆得以寿终，恩泽广及草木昆虫。”",4],[2231,3,"书法九势是____、转笔、藏峰、藏头、护尾、疾势、掠笔、涩势、横鳞竖勒。",[],"落笔","书法九势为落笔、转笔、藏锋、藏头、护尾、疾势、掠笔、涩势、横鳞竖勒，为汉代书法家蔡邕对书法中行笔技巧的总结。",8],[2232,3,"饮中八仙为____、贺知章、李适之、李琎、崔宗之、苏晋、张旭、焦遂。",[],"李白","醉八仙，指唐朝嗜酒的八位学者名人，亦称酒中八仙、饮中八仙。《新唐书·李白传》载，李白、贺知章、李适之、汝阳王李琎、崔宗之、苏晋、张旭、焦遂为“酒中八仙人”。杜甫有《饮中八仙歌》。瓷器画面绘饮中八仙，每每于人物之上书以人名，以清朝为多见。",8],[2233,3,"扬州八怪是郑板桥、汪士慎、李鱓、黄慎、金农、高翔、李方鹰、____。",[],"罗聘","扬州八怪，是清康熙中期至乾隆末年活跃于扬州地区的一批风格相近的书画家总称，美术史上也常称其为“扬州画派”，指：金农、郑燮、黄慎、李鱓、李方膺、汪士慎、罗聘、高翔。",10],[2234,3,"“河鼓二”在天文学上是指____。",[],"牛郎星","河鼓二指天鹰座α星，又称“牛郎星”。古代传说牛郎织女七月七日鹊桥相会。实际上牛郎织女相距16光年，即使乘现代最强大的火箭，几百年后也不曾相会。河鼓二的两侧各有一颗较暗的星，分别称为河鼓一、河鼓三，它们与河鼓二合称为“河鼓三星”。河鼓三星像一根长长的扁担，所以民间又叫它“扁担星”。",0],[2235,3,"唐宋八大家是____、柳宗元、欧阳修、苏洵、苏轼、苏辙、王安石、曾巩。",[],"韩愈","唐宋八大家，又称为“唐宋散文八大家”，是唐代和宋代八位散文家的合称，分别为唐代韩愈、柳宗元和宋代欧阳修、苏洵、苏轼、苏辙、王安石、曾巩八位。其中韩愈、柳宗元是唐代古文运动的领袖，欧阳修、三苏（苏轼、苏辙、苏洵）等四人是宋代古文运动的核心人物，王安石、曾巩是临川文学的代表人物。他们先后掀起的古文革新浪潮，使诗文发展的陈旧面貌焕然一新。",0],[2236,3,"十三经是____、《诗经》、《尚书》、《礼记》、《仪礼》、《公羊传》、《榖梁传》、《左传》、《孝经》、《论语》、《尔雅》、《孟子》。",[],"易经","《十三经》，南宋形成的十三部儒家经典，为历代儒客文人推崇。分别是《易经》《尚书》《诗经》《周礼》《仪礼》《礼记》《春秋左传》《春秋公羊传》《春秋榖梁传》《孝经》《论语》《孟子》《尔雅》。",2],[2237,3,"四大民间传说是____、孟姜女、梁山伯与祝英台、白蛇与许仙。",[],"牛郎织女","在我国的古典文学宝库中，除了有史书记载的古典文学作品外，还有一类就是民间广为流传的神话传说，它不仅数量众多，内容丰富，而且绚丽多彩，充满诗情画意和艺术魅力，其中牛郎织女、孟姜女、梁山伯与祝英台与白蛇传被称为中国四大民间传说。",10],[2238,3,"五音是____。",[],"宫商角徵羽","五音指中国五声音阶中的角、徵、宫、商、羽，五个音级。五音中各相邻两音间的音程，除角和徵、羽和宫（高八度的宫）之间为小三度外，余均为大二度。",9],[2239,3,"相声八德是____、玉德隆、焦德海、张德全、周德山、马德禄、刘德治、李德祥。",[],"李德钖","李德钖(1881-1926)，相声艺人。原名李佩亭，艺名万人迷。北京人。时人誉之为“相声大王”，与其他七位“德”字辈著名相声艺人并称“相声八德”。作品有《老老年》《对对子》《哭当票》《十八愁绕口令》。",9],[2240,3,"四大名瓷窑是河北的瓷州窑、浙江的龙泉窑、江西的____、福建的德化窑。",[],"景德镇窑","中国四大名瓷窑：河北磁州窑、浙江的龙泉窑、江西的景德镇窑、福建的德化窑。四大名窑是中国传统陶瓷烧制工艺中的艺术珍品，劳动人民生产的瓷器，继唐代“南青北白”的格局确定之后，到了宋代发展到了前所未有的高峰。",10],[2241,3,"昭陵六骏是什伐赤、青骓、特勤骠、飒露紫、拳毛騧、____。",[],"白蹄乌","昭陵六骏分别叫飒露紫、拳毛騧、白蹄乌、特勒骠、青骓和什伐赤。六骏中,有侍者牵引的飒露紫塑造最为精采。",14],[2242,3,"五贡是____、拔贡、岁贡、副贡、优贡。",[],"恩贡","清代科举制度中对五类贡生的总称.。包括:恩贡、拔贡、副贡、岁贡和优贡。这五类都是正途出身资格。另有捐纳取得的贡生，称为例贡。",3],[2243,3,"六朝是吴、东晋、宋、齐、梁、____。",[],"陈","六朝(222年–589年)，一般是指中国历史上三国至隋朝的南方的六个朝代。即孙吴(或称东吴、三国吴)、东晋、南朝宋(或称刘宋)、南朝齐(或称萧齐)、南朝梁(或称萧梁)、南朝陈这六个朝代。又因六朝皆以建康(今南京)为京师，所以后世许多文献皆以六朝或南朝来代指南京，并常会用南京来指明六朝时期的人事物，所以南京又称六朝古都。",1],[2244,3,"六历是____、《颛顼历》、《夏历》、《殷历》、《周历》、《鲁历》。",[],"黄帝历","古六历通常是指从春秋战国到秦朝时期制定的黄帝、颛、夏、殷、周、鲁六种历法。六历的不同主要是“历元”（年的起算点）、施行地区和所用的元朔。",1],[2245,3,"三山是指安徽____、江西庐山、浙江雁荡山。",[],"黄山","三山是指旅游胜地闻名的黄山、庐山、雁荡山。",7],[2246,3,"诗经是我国第一部诗歌总集，其中包括____首诗。",[],"三百零五","《诗经》是我国第一部诗歌总集，收集了自西周初年至春秋中叶五百多年的诗歌305篇。",2],[2247,3,"“月上柳梢头，人约黄昏后”描写的传统节日是____。",[],"元宵节","“月上柳梢头，人约黄昏后”是北宋诗人欧阳修写的一首词，名为：《生查子•元夕》 ，全词：去年元夜时，花市灯如昼。月上柳梢头，人约黄昏后。今年元夜时，月与灯依旧。不见去年人，泪湿春衫袖。整首词创作背景是一年的伊始之际——元宵。",5],[2248,3,"“词苑千载，群芳竞秀，盛开一枝女儿花”说的是历史上的____。",[],"李清照","“词苑千载，群芳竞秀，盛开一枝女儿花”说的是李清照。李清照号称为“易安居士”。",0],[2249,3,"诸子百家中名家的特点是注重逻辑辩证，____这个典故能表达名家的这一特点。",[],"白马非马","“名家”是先秦时期以辩论名实问题为中心的一个思想派别,重视“名”(概念)和“实”(事)的关系的研究。包括“白马非马”、“离坚白”、“合同异”等观点。",2],[2250,3,"古人的婚礼在____（时间）举行。",[],"黄昏","古人结婚时间一般是黄昏。无论是因为黄昏的昏和结婚的婚读音很接近的缘故，还是因为黄昏风景美丽的缘故，古人大多数都选择在黄昏结婚。",5],[2251,3,"“天时不如地利，地利不如人和”出自____。",[],"孟子","《天时不如地利，地利不如人和》出自《孟子·公孙丑下》。天时不如地利，地利不如人和的意思是：有利的时机和气候不如有利的地势，有利的地势不如人心所向。",2],[2252,3,"文学史上被称作“小李杜”的是杜牧和____。",[],"李商隐","唐诗中以李白、杜甫的作品最享负盛名。至中晚唐，诗风的发展已近末流。因珠玉在前，后人已难有突破。当时一般诗人虽偶有佳作，但惟有杜牧和李商隐二人，能被时人一致公认为最杰出的作家。鉴於二人刚巧一位姓李,一位姓杜，与盛唐李杜相同，故称其为小李杜，以示与李白杜甫齐名。",0],[2253,3,"我国书法艺术博大精深，“欧体”是指____的字体。",[],"欧阳询","书法上的“欧体”是指欧阳询的字体，对应于楷书四大家“颜柳欧赵”中的欧，欧体结构严谨，于平正中见险绝，被尊为“唐人楷书第一”。",8],[2254,3,"“大禹治水”的故事家喻户晓，大禹治理的是____流域的洪水。",[],"黄河","大禹治水(鲧禹治水)是古代的汉族神话传说故事，著名的上古大洪水传说。他是黄帝的后代，三皇五帝时期，黄河泛滥，鲧、禹父子二人受命于尧、舜二帝，任崇伯和夏伯，负责治水。这一时期，黄河流域水患特别严重，百姓经常因为水患而流离失所，庄家更是颗粒无收，正因如此，治理黄河水患的问题一直困扰着人们。到了尧舜时期，黄河流域流水情况更加不稳定，已经到了不可不治的状况了。",7],[2255,3,"《西游记》中唐僧的原型是____。",[],"玄奘","唐僧，俗家姓陈，生于河南洛阳，法号“玄奘”，被尊称为“三藏法师”，世俗称为“唐僧”，小名叫“江流儿”。中国古典名著《西游记》中的主角之一，原型为唐代高僧玄奘。",0],[2256,3,"京剧《贵妃醉酒》是根据____这部古代戏曲改编而成的。",[],"长生殿","京剧中《贵妃醉酒》是由《长生殿》这部古代戏曲改编而成的，这首曲子讲述的是唐玄宗和杨玉环的爱情故事。",9],[2257,3,"荀子把教学或学习过程具体化为闻、见、知、____四个环节。",[],"行","闻、见、知、行为中国战国时期荀子提出的关于教学过程或学习过程的几个环节。荀子认为，学习当启始于“闻”，完成于“行”。提出:“君子之学也，入乎耳，箸乎心，布乎四体，形乎动静。",2],[2258,3,"“一门父子三词客，千古文章八大家”这幅对联中提到的“三父子”是苏洵、苏轼、____。",[],"苏辙","“一门父子三词客，千古文章八大家”中三词客为：北宋苏洵、苏轼、苏辙；这是对苏轼、苏辙、苏洵三父子在文坛上的成就的褒奖",0],[2259,3,"“一问三不知”，“三不知”说的是事情的开始、经过、____。",[],"结果","出自《左传·哀公二十七年》，原意是对某一事情的开始、发展、结果都不知道，现在用来表示对实际情况一点也不知道。",2],[2260,3,"水浒一百单八将中有____位女性。",[],"三","水浒传108将中的三名女将分别是顾大嫂、扈三娘、还有孙二娘，其中顾大嫂的结局最好。",0],[2261,3,"“山重水复疑无路,柳暗花明又一村。”出自陆游的____。",[],"游山西村","“山重水复疑无路，柳暗花明又一村”是宋代诗人陆游的作品《游山西村》中的一句诗。比喻在遇到困难一种办法不行时，可以用另一种办法去解决，通过探索去发现答案。",0],[2262,3,"____节来源于二十四节气。",[],"清明","清明节的得名源于我国农历24节气中的清明节气。清明节气共有15天，作为节气的清明，时间在春分之后。",6],[2263,3,"____是我国北宋年间司马光主编的一部编年体。",[],"资治通鉴","《资治通鉴》（常简作《通鉴》），由北宋司马光主编的一部多卷本编年体史书，共294卷，历时19年完成。主要以时间为纲，事件为目，从周威烈王二十三年（公元前403年）写起，到五代后周世宗显德六年（公元959年）征淮南停。",1],[2264,3,"金沙江发源于____。",[],"唐古拉山脉","金沙江的发源地（即长江的发源地）20世纪70年代定于青海省唐古拉山主峰各拉丹冬雪山，正源沱沱河。",7],[2265,3,"诗句“二十四桥明月夜，玉人何处教吹箫”中的“二十四桥”位于____。",[],"扬州","一说扬州城里原有二十四座桥；一说即吴家砖桥，因古时有二十四位美女吹箫于桥上而得名。",10],[2266,3,"苏轼在《念奴娇·赤壁怀古》中提到了“羽扇纶巾，谈笑间，樯橹灰飞烟灭”，“羽扇纶巾”形容的是____。",[],"周瑜","羽扇纶巾，意思是拿着羽毛扇子，戴着青丝绶的头巾。形容态度从容。出自宋·苏轼《念奴娇·赤壁怀古》，指代汉末儒将周瑜的便装打扮 。",0],[2267,3,"“归去来兮，吾归何处？”是苏轼所发出的哀叹之音,似有归隐田园之意。东晋一田园诗人曾有《归去来兮辞》文章，其诗人是____。",[],"陶渊明","《归去来兮辞》是晋宋之际文学家陶渊明创作的抒情小赋，也是一篇脱离仕途回归田园的宣言。这篇文章作于作者辞官之初，叙述了他辞官归隐后的生活情趣和内心感受，表现了他对官场的认识以及对人生的思索，表达了他洁身自好、不同流合污的精神情操。",0],[2268,3,"唐诗大变于中唐，代表这种新变的第一诗人群是____诗派。",[],"韩孟","“韩孟诗派”是中唐的一个诗歌创作流派，以韩愈为领袖，包括孟郊、李贺、卢仝、马异、刘叉。他们主张“不平则鸣”，苦吟以抒愤，并互相切磋酬唱他们具有变态的审美趣味，“以丑为美”，以震荡光怪为美，以瘁索枯槁为美，以五彩斑斓为美。表现出重主观心理、尚奇险怪异的创作倾向。诗歌形成一种奇崛硬险的风格。他们在艺术上力求避熟就生，标新立异，力矫大历诗风的平弱纤巧。这种诗歌的新的追求与新的变化，积极推动了盛唐以后诗歌艺术境界的开拓。",0],[2269,3,"元曲在元代被称作____。",[],"新乐府","元曲在元代被称“乐府”，“新乐府”，“北乐府”。人们通常所说的元曲，包括剧曲和散曲。剧曲指的是杂剧的曲辞，它是戏剧这一在舞台上表演的综合艺术的密不可分的组成部分。",9],[2270,3,"宋代最早提倡复古和文体复古的代表人物是____。",[],"柳开","柳开（947年－1000年），原名肩愈，字绍先（一作绍元），后改名开，字仲涂，号东郊野夫、补亡先生，大名（今河北大名）人，北宋文学家。因官至如京使，世称柳如京。柳开是开宝六年进士，历任州、军长官，殿中侍御史，提倡韩愈、柳宗元的散文，以复兴古道、述作经典自命。反对宋初的华靡文风，为宋代古文运动倡导者。作品文字质朴，然有枯涩之病。诗作现存八首。著《河东集》。",0],[2271,3,"鲁迅先生称史记为“史家之绝唱，____”。",[],"无韵之离骚","“史家之绝唱，无韵之离骚”的意思是史家独一无二的文章，没有韵的《离骚》。史家之绝唱，无韵之离骚是鲁迅对司马迁《史记》的评价，这是一个相当高的评价。《离骚》是屈原的代表作，在我国古代文学史上有着划时代的意义，书写了高洁的志向和人格。",0],[2272,3,"“四书”的构成为大学、孟子、论语、____。",[],"中庸","四书包括：《论语》、《大学》、《中庸》、《孟子》。宋儒为明代进士。四书是教人做人的学问，是国人的精神之所在。",2],[2273,3,"《离骚》在诗歌形式上所属的体式是____。",[],"七言体","离骚在诗歌形式上所属的体式是七言体。七言诗是中国诗歌体裁之一,主要特点是每句七字或以七字句为主,而离骚全诗大部分句子都是七字的,因此离骚属于七言体诗歌。",0],[2274,3,"与曹操有关的著名典故为____。",[],"望梅止渴","南朝宋，刘义庆《世说新语·假谲》：有一次曹操带兵在外行军，一时找不到取水的地方，士兵都渴极了，曹操就骗他们说：“前面有个大梅林，梅子又甜又酸，可以解渴。”士兵听了，一个个都流出了口水，暂时止住了口渴。",0],[2275,3,"我国古代最早提出“废黜百家，独尊儒术”的是____。",[],"董仲舒","“罢黜百家，独尊儒术”，是董仲舒于元光元年(公元前134年)提出的治国思想，在汉武帝时开始推行。",2],[2276,3,"____是我国湖北省的简称。",[],"鄂","湖北省，位于中国中部偏南、长江中游，洞庭湖以北，故名湖北，简称“鄂”，省会武汉。",7],[2277,3,"变脸是____的绝活。",[],"川剧","川剧变脸是川剧表演的特技之一，用于揭示剧中人物的内心及思想感情的变化，即把不可见、不可感的抽象的情绪和心理状态变成可见、可感的具体形象——脸谱。川剧变脸是运用在川剧艺术中塑造人物的一种特技。是揭示剧中人物内心思想感情的一种浪漫主义手法。",9],[2278,3,"长江三峡是指由巫峡、瞿塘峡和____。",[],"西陵峡","长江三峡又名峡江或大三峡，位于中国重庆市、恩施州、宜昌市地区境内的长江干流上，西起重庆市奉节县的白帝城，东至湖北省宜昌市的南津关，全长193千米，由瞿塘峡、巫峡、西陵峡组成。",7],[2279,3,"沉鱼落雁其中的沉鱼最开始指____。",[],"毛嫱","“沉鱼落雁”这个成语，源出自《庄子·齐物论》中的“毛嫱、丽姬，人之所美也，鱼见之深入，鸟见之高飞，麋鹿见之决骤。”",0],[2280,3,"“四象二十八星宿”是我国古代天文学最重要的成就，也是中国传统文化中最神秘的部分之一。其中的“四象”被称为“四方神”，影响及于我国古代的军事、宗教、文学、风水等各个领域。四象指的是青龙、____、朱雀、玄武。",[],"白虎","“四象”通常指的是左青龙,右白虎,前朱雀,后玄武。古代汉族人民把东、西、南、北四方每一方的七宿想象为四种动物形象，叫作四象。",0],[2281,3,"我国古代贵族四术为诗、书、礼和____。",[],"乐","《诗经》中的歌曲曾被列为上层社会教育的主要科目，所谓诗、书、礼、乐并称“四术”。",2],[2282,3,"中国四大名绣为苏绣、湘绣、蜀绣、____。",[],"粤绣","中国四大名绣，是指中国中部湖南省的“湘绣”，中国西部四川省的“蜀绣”，中国南部广东省的“粤绣”和中国东部江苏省的“苏绣”的合称。",7],[2283,3,"《孙子兵法•火攻篇》在论及火攻时罗列了五种火攻，分别是火人、火积、火辎、火库和____。",[],"火队","孙子曰：“凡火攻有五：一曰火人，二曰火积，三曰火辎，四曰火库，五曰火队。”",14],[2284,3,"六义是诗经学名词，指的是风、雅、颂、赋、比、____。",[],"兴","《诗经》是中国文学史上第一部诗歌总集，收入西周初期至春秋中叶间的诗歌三百零五篇。所谓《诗经》中的“六义”，是指“风、雅、颂”三种诗歌形式与“赋、比、兴”三种表现手法。",2],[2285,3,"“按图索骥”中的“骥”本意指的是____。",[],"马","索：找；骥：良马。按照画像去寻求好马。比喻墨守成规办事；也比喻按照线索去寻求。",8],[2286,3,"“环肥燕瘦”中的“燕”是指谁_____",[],"赵飞燕","环是指的唐玄宗贵妃杨玉环，燕是指的汉成帝皇后赵飞燕。形容女子形态不同，各有各好看的地方。也借喻艺术作品风格不同，而各有所长。",1],[2287,3,"屈原在____中写道，“吾令羲和弭节兮，望崦嵫而勿迫。”",[],"离骚","《离骚》是战国诗人屈原创作的文学作品。“离骚”，东汉王逸释为：“离，别也；骚，愁也。”《离骚》以理想与现实的冲突为主线，以花草禽鸟的比兴和瑰奇迷幻的“求女”神境作象征，借助于自传性回忆中的情感激荡，和复沓纷至、倏生倏灭的幻境交替展开全诗。作品倾诉了对楚国命运和人民生活的关心，“哀民生之多艰”，叹奸佞之当道。主张“举贤而授能”，“循绳墨而不颇”。提出“皇天无私阿”，对天命论进行批判。作品中大量的比喻和丰富的想像，表现出积极浪漫主义精神，并开创了中国文学上的“骚”体诗歌形式，对后世有深远影响。有东汉王逸《楚辞章句》、南宋朱熹《楚辞集注》、清代戴震《屈原赋注》等注本。",0],[2288,3,"“尔曹身与名俱灭，不废江河万古流。”出自____的《戏为六绝句》(其二)。",[],"杜甫","出处：唐，杜甫《戏为六绝句》（其二）全文为：王杨卢骆当时体，轻薄为文哂未休。尔曹身与名俱灭，不废江河万古流。",0],[2289,3,"“相见争如不见，有〔多〕情何似无情。”出自宋代____的《西江月》。",[],"司马光","相见争如不见，有情何似无情。出自宋代司马光的《西江月》，全文是：“宝髻松松挽就，铅华淡淡妆成。青烟翠雾罩轻盈，飞絮游丝无定。相见争如不见，有情何似无情。笙歌散后酒初醒，深院月斜人静。”",0],[2290,3,"“泪眼问花花不语，乱红飞过秋千去。”出自____的《蝶恋花》。",[],"欧阳修","出自欧阳修的《蝶恋花》。全文是：“庭院深深深几许，杨柳堆烟，帘幕无重数。玉勒雕鞍游冶处,楼高不见章台路。雨横风狂三月暮，门掩黄昏，无计留春住。泪眼问花花不语，乱红飞过秋千去。”",0],[2291,3,"及笄之年是指____岁。",[],"十五","及笄是指女子满了15岁。形容古代女子已到了结婚的年龄。",4],[2292,3,"中元节是我国的传统节日之一,而在民间中元节也被人们称为____。",[],"鬼节","中元节是我国的传统节日之一，而在民间中元节也被人们称为鬼节。当日祭拜时着装得体，以黑色灰色着装为宜。忌红色等大红大紫之色。否则容易招致煞气，惹祸上身。拜祭时要态度端正，不要大声喧哗，出言不逊或有不雅举止。据说否则会打扰到死者的灵魂，重者更会招致怨气。七月十五要外出游玩的朋友，要在太阳落山前返回。否则阳气退去，阴气见长，体弱多病之人则容易受到阴气袭扰。",5],[2293,3,"补全诗句：“秋风吹不尽，____。”",[],"总是玉关情","出自唐·李白《子夜吴歌·秋歌》。全文为：长安一片月，万户捣衣声。秋风吹不尽，总是玉关情。何日平胡虏，良人罢远征。",0],[2294,3,"补全词：“杜郎俊赏，算而今，重到须惊。纵豆蔻词工，青楼梦好，____。”",[],"难赋深情","出自宋诗人姜夔的《扬州慢·淮左名都》。全文为：淳熙丙申至日，予过维扬。夜雪初霁，荠麦弥望。入其城，则四顾萧条，寒水自碧，暮色渐起，戍角悲吟。予怀怆然，感慨今昔，因自度此曲。千岩老人以为有“黍离”之悲也。淮左名都，竹西佳处，解鞍少驻初程。过春风十里。尽荠麦青青。自胡马窥江去后，废池乔木，犹厌言兵。渐黄昏，清角吹寒。都在空城。杜郎俊赏，算而今、重到须惊。纵豆蔻词工，青楼梦好，难赋深情。",0],[2295,3,"2013年4月，本着生态性、文化性、地方特色与时代性相结合的原则统筹考虑，最终选出“屯溪八景”，分别是谜窟探奇、新安怀古、华山思贤、老街问市、三江烟霞、稽灵松涛、龙山禅月和____。",[],"鬲山荷韵","“屯溪八景”分别是“谜窟探奇”、“新安怀古”、“华山思贤”、“老街问市”、“三江烟霞”、“稽灵松涛”、“龙山禅月”和“鬲山荷韵”。",7],[2296,3,"清代出现的以满族菜为主，沿袭明代宫廷风格的菜肴，被称为____。",[],"满汉全席","满汉全席，清朝时期宫廷盛宴。既有宫廷菜肴之特色，又有地方风味之精华；突出满族与汉族菜的特殊风味，烧烤、火锅、涮涮锅几乎不可缺少的菜点，同时又展示了汉族烹调的特色，扒、炸、炒、熘、烧等兼备，实乃中华菜系文化的瑰宝和最高境界。满汉全席原是清代宫廷中举办宴会时满人和汉人合坐的一种全席。",12],[2297,3,"中国画史上，被公认为水准最高的山水画作是元代画作____。",[],"富春山居图","富春山居图是元代画家黄公望于1350年创作的纸本水墨画，中国十大传世名画之一。",8],[2298,3,"五岳中以“险”著称的是____。",[],"华山","五岳即东岳泰山、西岳华山、北岳恒山、中岳嵩山、南岳衡山。论景观，五岳又各具特色：泰山雄、衡山秀、华山险，恒山奇，嵩山奥。",7],[2299,3,"成语“胸有成竹”源于宋代____画竹的故事。",[],"文同","北宋时候，有一个著名的画家，名叫文同，他是当时画竹子的高手。文同为了画好竹子，不管是春夏秋冬，也不管是刮风下雨，或是天晴天阴，他都常年不断地在竹林子里头钻来钻去，为的就是把竹子不同时期的姿态记在心头。由于文同长年累月地对竹子作了细微的观察和研究，竹子在春夏秋冬四季的形状有什么变化；在阴晴雨雪天，竹子的颜色、姿势又有什么两样；在强烈的阳光照耀下和在明净的月光映照下，竹子又有什么不同；不同的竹子，又有哪些不同的样子，他都摸得一清二楚。所以画起竹子来，根本用不着画草图。有个名叫晁补之的人，称赞文同说：文同画竹，早已胸有成竹了。",1],[2300,3,"中国古代祭祀天地的仪式很多，其中最为隆重的是____。",[],"封禅","封禅，封为“祭天”，禅为“祭地”，意思是指中国古代帝王在太平盛世或天降祥瑞之时的祭祀天地的大型典礼，一般由帝王亲自到泰山上举行。远古暨夏商周三代，已有封禅的传说。出自《管子·封禅篇》。",1],[2301,3,"自秦至今，我国一直沿用的行政区划单位是____。",[],"县","秦始皇即位时推行“郡县制”；秦代沿袭了秦的郡县制，与郡国并存；东汉形成“州、郡、县三级制”；隋又改为“郡(州)、县二级制”；唐设“道”对地方实行监察，将“郡”改称“州”，实行“道、州、县三级制”；宋改“道”为“路”，实行“路、州、县三级制”；元推行行省制,形成“省、道路、州(府)、县四级制”；明承元制，改行省为“承宣布政使司”,形成“司、府(州)、县”三级制；清承明制，改司为省，省名与今相近。由此，“县”是自秦迄今一直沿用的行政区划单位。",1],[2302,3,"北魏时期，提出“除去三张伪法”，鼓动灭佛、改革天师道的道士是____。",[],"寇谦之","北魏道士寇谦之称太上老君亲临嵩岳授以“天师之位”，赐以《云中音诵新科之戒》20卷，传其服气导引口诀之法；令其“清整道教，除去三张（指张陵、张衡、张鲁——引者）伪法，租米钱税及男女合气之术”。",9],[2303,3,"中国五岳是____、南岳衡山、西岳华山、北岳恒山和中岳嵩山。",[],"东岳泰山","中国五岳，中华传统文化中五大名山的总称，是古代民间山神崇敬、五行观念和帝王巡猎封禅相结合的产物。五岳分别是中岳嵩山(海拔1491.71米，位于河南省郑州市登封市)、东岳泰山(海拔1532.7米， 位于山东省泰安市泰山区)、西岳华山(海拔2154.9米，位于陕西省渭南市华阴市)、南岳衡山(海拔1300.2米，位于湖南省衡阳市南岳区)、北岳恒山(海拔2016.1米，位于山西省大同市浑源县)。岳曾是封建帝王仰天功之巍巍而封禅祭祀的地方，更是封建帝王受命于天的象征。",7],[2304,3,"《金匮要略》是我国著名医学家____的传世著作。",[],"张仲景","《金匮要略》是我国东汉著名医学家张仲景所著《伤寒杂病论》的杂病部分，也是我国现存最早的一部论述杂病诊治的专书，原名《金匮要略方论》。“金匮”是存放古代帝王圣训和实录的地方，意指本书内容之珍贵。全书分上、中、下三卷，共25篇，载疾病60余种，收方剂262首。所述病证以内科杂病为主，兼及外科、妇科疾病及急救卒死、饮食禁忌等内容。被后世誉为“方书之祖”。",12],[2305,3,"中国“四大石窟”指的是____、云冈石窟、龙门石窟、麦积山石窟。",[],"莫高窟","四大石窟指的是以中国佛教文化为特色的巨型石窟艺术景观，包括：莫高窟（甘肃敦煌）、云冈石窟（山西大同）、龙门石窟（河南洛阳）、麦积山石窟（甘肃天水），是中国古代传统文化艺术的历史瑰宝。",7],[2306,3,"我国最早一部家庭教育专著是____的《颜氏家训》。",[],"颜之推","《颜氏家训》是汉民族历史上第一部内容丰富，体系宏大的家训，也是一部学术著作。作者颜之推，是南北朝时期著名的文学家、教育家。",1],[2307,3,"“鹅湖之会”是书院史上的著名事件，他指的是朱熹和____在鹅湖书院进行的辩论。",[],"陆九渊","著名学者吕祖谦为了调和朱熹“理学”和陆九渊“心学”两派之间在学术上的矛盾，邀请他们在江西鹅湖寺举行学术交流，史称“鹅湖之会”。这次大会进行了三天，双方各持己见、互不相让。虽然学术上的分歧没能得到解决。但是这次讨论会影响很大，是中国哲学史上堪称典范的一次学术讨论会，而且开启了书院会讲的先河。",2],[2308,3,"自汉代以来，太学内官设辟雍，专供____讲学之用。",[],"皇帝","自汉代以来，太学内多设辟雍，供皇帝讲学。每逢皇帝来讲学，太学(或国子监)的官员和学生都要跪在泮水四周聆听。",1],[2309,3,"最早使用“教育”两字的是____。",[],"孟子","在中国古代文献中，教育一词最早见于《孟子·尽心上》，“得天下英才而教育之”。《说文解字》释“教，上所施下所效”；“育，养子使作善也”，教育就是教诲培育的意思。",2],[2310,3,"根据古代“左庙右学”的传统，国子监与____毗邻。",[],"孔庙","国子监是我国元、明、清三代国家管理教育的最高行政机关和国家设立的最高学府，孔庙则是皇家祭孔之地，两者相伴形成“左庙右学”。",1],[2311,3,"江南三大名楼是____、岳阳楼、黄鹤楼。",[],"滕王阁","江南三大名楼指的是江西南昌的滕王阁、湖北武汉的黄鹤楼和湖南岳阳的岳阳楼。",10],[2312,3,"苏州四大园林指的是____、狮子林、拙政园和留园。",[],"沧浪亭","沧浪亭、狮子林、拙政园和留园并称苏州四大园林，代表着宋（公元960～1278年）、元（公元1271～1368年）、明（公元1368～1644年）、清（公元1644～1911年）四个朝代的艺术风格，被称为苏州四大名园。",10],[2313,3,"被誉为“中国戏曲之母”的剧种是____。",[],"昆曲","昆剧（别称昆腔、昆曲），原名“昆山腔”，发源于元末明初的苏州府昆山县，是中国戏曲的剧种之一，被誉为“百戏之祖”。",9],[2314,3,"诗歌起源于_____",[],"劳动","诗歌起源于上古的社会生活，因劳动生产、两性相恋、原始宗教等而产生的一种有韵律、富有感情色彩的语言形式。",0],[2315,3,"被誉为“唐人楷书第一”的是____。",[],"欧阳询","欧阳询唐朝著名书法家、书法理论家，与虞世南、褚遂良、薛稷并称初唐四大家。",8],[2316,3,"《广陵散》成为千古名曲，与“竹林七贤”之一的____有很大关系。",[],"嵇康","据《晋书》记载，此曲乃嵇康游玩洛西时，为一古人所赠。",7],[2317,3,"魏晋时期的著名道士葛洪撰写的道教名著是____。",[],"抱朴子","葛洪，字稚川，东晋时学者、文学家，《抱朴子》是其代表作，该书总结了战国时代以来神仙家的理论，确立了道教神仙理论体系；又继承魏伯阳炼丹理论，集魏晋炼丹术之大成，也是研究我国晋代宝贵以前道教史及思想史的宝贵陶瓷材料。",10],[2318,3,"天干地支纪年始于汉代，这种纪年是以_____为起点",[],"立春","干支纪年是以立春作为一年的开始。农历最根本包含两部分,即农历历月和节气,其它的部分是由这两部分派生出来的,是为农业服务的。所以是以立春作为一年的起点。",6],[2319,3,"毕升发明的活字印刷实际上使用的是____。",[],"泥活字","胶泥制成的用于排版印刷的反文单字。据中国北宋科学家沈括所著《梦溪笔谈》卷十八“技艺”载，泥活字为庆历年间平民毕升所发明。方法是用胶泥刻字，每字一印，经火烧硬而成泥活字，并用它们在两块铁板上交替排版和印刷。毕升发明的泥活字印书成功，标志着活字印刷术的诞生，比德国J.谷登堡活字印书早约400年。",11],[2320,3,"我国古代将科举殿试的第三名称为____。",[],"探花","探花是中国古代科举考试中对位列第三的进士的称谓，与第一名状元、第二名榜眼合称“三鼎甲”。",3],[2321,3,"都江堰位于四川省，是____时期在李冰父子的主持下兴建的。",[],"战国","都江堰始建于战国时期，是蜀郡太守李冰父子在前人鳖灵开凿的基础上组织修建的大型水利工程。",11],[2322,3,"颐和园是乾隆皇帝为其母孝圣宪皇太后祝寿而建，其前身是____。",[],"清漪园","颐和园，中国清朝时期皇家园林，前身为清漪园，坐落在北京西郊，距城区十五公里，占地约二百九十公顷，与圆明园毗邻。",1],[2323,3,"“天下第一泉”共有四处，分别是庐山谷帘泉、____、济南趵突泉、镇江中泠泉。",[],"北京玉泉","分别是北京玉泉山玉泉、山东济南趵突泉、镇江扬子江中冷泉和庐山康王谷谷帘泉。",7],[2324,3,"中国历史上的太平盛世出现的时期有____时期、汉文帝时期、唐玄宗前期。",[],"隋文帝","开皇之治是隋文帝杨坚在位期间开创的盛世。隋文帝自灭陈统一天下，专心励精图治、锐意改革，最终出现了国家富庶、社会繁荣、突厥臣服、天下安定，读书人感觉生逢其时，老百姓各安其业的盛世局面。开皇盛世的大隋帝国疆域辽阔，气象恢弘磅礴。",1],[2325,3,"史学界认为的东周时期春秋与战国的分界点是____。",[],"三家分晋","三家分晋是指春秋末年，晋国被韩、赵、魏三家瓜分的事件。“三家分晋”成为了中国春秋时代和战国时代的分界点。三家分晋标志着新兴地主阶级登上历史舞台，推动了封建制度的确立，揭开了七雄兼并的战国序幕。",1],[2326,3,"中国历史上的第一个王朝的建立者是____。",[],"大禹","公元前2070年，禹建立了夏朝，这是我国历史上第一个王朝。",1],[2327,3,"考古发现，____已经大量使用石器并且懂得人工取火和管理火。",[],"北京人","北京人遗址是世界上出土古人类遗骨和遗迹最丰富的遗址。先后发现五个比较完整的北京人头盖骨化石和一些其他部位的化石，还有大量的石器和石片，共十万件以上。距今约七十万年至二十万年，发现于北京周口店，保留了猿的某些特征，使用打制石器，已会使用天然火，过着群居的生活。",10],[2328,3,"著名的半坡遗址是____文化的代表。",[],"仰韶","半坡遗址是新石器时代仰韶文化聚落遗址，年代为中国原始社会母系氏族繁荣时期遗留下的村落遗址，已有6000-6700多年历史。",10],[2329,3,"汉代主要的选才制度是____。",[],"察举制","科举制从隋朝（一说唐朝）开始实行，直至清光绪卅一年（1905年），前后经历一千三百余年；九品中正制又称九品官人法，是魏晋南北朝时期的官吏选拔制度；察举制的确立时间是汉武帝元光元年（公元前134年）。",3],[2330,3,"郑樵的《通志》属于____。",[],"典章制度","《通志》由南宋郑樵撰写，中国传统史学将其归入典章制度的政书，列为三通之一。",0],[2331,3,"司马迁《史记》中的本纪主要用于记述____。",[],"帝王事迹","“本纪”是全书提纲，以王朝的更替为体，按年月时间记述帝王的言行政绩；其中记载先秦历史的五篇，依次是五帝，夏，殷，周，秦；记载秦汉历史的七篇，依次是秦始皇，楚霸王项羽，汉高祖刘邦，高后吕雉，汉文帝刘恒，汉景帝刘启和汉武帝刘彻。",1],[2332,3,"编年体史书起源于____。",[],"春秋","中国编年体史书起源于春秋，它以时间为中心，按年、月、日顺序记述史事，目前数量极多，其中最出名的是《春秋》、《左传》、《竹书纪年》、《资治通鉴》，它们也被称为中国四大编年体史书。",2],[2333,3,"由汉武帝派遣出使西域的第一个使者是____。",[],"张骞","张骞富有开拓和冒险精神，建元二年(前139年)，奉汉武帝之命，由甘父做向导，率领一百多人出使西域，打通了汉朝通往西域的南北道路，即赫赫有名的丝绸之路，汉武帝以军功封其为博望侯。",1],[2334,3,"迄今发现的铭文最多的古代青铜器是____。",[],"毛公鼎","毛公鼎为西周晚期的重器，鼎内壁铸有铭文，32行，近500字，是现存青铜器铭文中最长的一篇，堪称西周青铜器中铭文之最。其内容叙事完整，记载详实，被誉为“抵得一篇《尚书》”，是研究西周晚年政治史的重要史料。",10],[2335,3,"云纹高足玉杯是一件珍贵文物，它出土于____。",[],"阿房宫遗址","云纹高足玉杯1976年出土于西安车张村阿房宫遗址，青色玉，杯身呈直口筒状，近底部急收，小平底。",10],[2336,3,"被誉为“中华第一玉龙”的玉猪龙，是____时期的玉器。",[],"红山文化","玉猪龙是红山文化时期中的代表玉器,又被称为玉兽玦,被专家们认为是龙最早的雏形。",10],[2337,3,"古代被称为“国瓷”的著名瓷器品种是____。",[],"青花瓷","青花瓷，属于釉下彩瓷，是我国的国瓷。白地蓝花，素雅洁净，是景德镇的名品佳作。",10],[2338,3,"提出“宇宙便是吾心，吾心便是宇宙”哲学家是____。",[],"陆九渊","陆九渊是宋代著名的理学家、主观唯心主义哲学家。他主张“吾心即是宇宙”，又倡“心即理”说。",2],[2339,3,"在形式逻辑领域提出“名辞说”理论的是____。",[],"墨家","墨家在形式逻辑方面提出了以“名、辞、说”为思维的三种基本形式。",2],[2340,3,"《庄子》名篇《逍遥游》中写：“北冥有鱼，其名为鲲。鲲之大，不知其几千里也。”这种名叫鲲的大鱼可以变化成鸟，请问鸟的名字是____。",[],"鹏","北冥有鱼，其名为鲲。鲲之大，不知其几千里也。化而为鸟，其名为鹏。鹏之背，不知其几千里也，怒而飞，其翼若垂天之云。",2],[2341,3,"以法制为中心，综合运用“法势术”是法家成熟的表现，而提出这一理论的是____。",[],"韩非子","“法势术”这一理论是由秦国的韩非子提出的。在韩非之前已有申不害、商鞅、慎到等法家人物对法家学说做了许多论述，商鞅主要讲“法”，申不害主要讲“术”，慎到主要讲“势”。",2],[2342,3,"开创理学先河的是人物是孙复、石介和____。",[],"胡瑗","北宋初期的胡瑗、孙复、石介是理学的先驱人物，他们以讲学授徒的方式，为理学培育了人才。",2],[2343,3,"首次在中国哲学史上明确提出“知行合一”的是____。",[],"王阳明","知行合一，致良知，是阳明文化的核心。明武宗正德四年（1509），心学集大成者王守仁在贵阳文明书院讲学，首次提出知行合一说。",2],[2344,3,"“水则载舟，水则载舟”是我国古代思想史上____提出的著名论点。",[],"荀子","“水则载舟,水则覆舟”出自《荀子・王制》。荀子,战国末期赵国人,著名思想家、文学家、政治家,荀子对儒家思想有所发展,在人性问题上,提倡性恶论,否认天赋的道德观念,强调后天环境和教育对人的影响。",2],[2345,3,"“天人合一”的说法是宋代哲学家____明确提出的。",[],"张载","真正明确提出“天人合一”的是北宋哲学家张载。张载在天、人关系的研究上独树一帜，承前启后，以《孟子》《中庸》《大学》等经典之“性”“诚”“明”的理念贯通天人。",2],[2346,3,"汉代的董仲舒将天道和人事相比附，提出了____说，成为古代封建统治的理论基础之一。",[],"天人感应","公元前134年，武帝下诏征求治国方略，董仲舒在著名的《举贤良对策》中将儒家思想结合社会需要，并融合各家思想，系统地提出了“天人感应”、“大一统”学说和“罢黜百家，独尊儒术”的主张，被武帝所采纳，使儒学成为中国社会正统思想。公元前104年病故，死后得武帝眷顾，被赐葬于长安下马陵。",1],[2347,3,"儒家提倡的“内圣外王”之道有其循序渐进的途径，依次是修身、齐家、治国、____。",[],"平天下","《礼记·大学》：“古之欲明明德于天下者，先治其国；欲治其国者，先齐其家；欲齐其家者，先修其身；欲修其身者，先正其心；欲正其心者，先诚其意；欲诚其意者，先致其知，致知在格物。物格而后知至，知至而后意诚，意诚而后心正，心正而后身修，身修而后家齐，家齐而后国治，国治而后天下平。”",2],[2348,3,"属于道教的三天尊的是玉清原始天尊、上清灵宝君和太清____。",[],"道德天尊","三清天尊是道教对其所崇奉的三位最高天神的合称。指居于三清仙境的三位尊神，即玉清境清微天元始天尊、上清境禹馀天灵宝天尊、太清境大赤天道德天尊。其中所谓玉清境、上清境、太清境是所居仙境的区别，清微天、禹余天、大赤天是所统天界的划分，而天尊的意思则是说，极道之尊，至尊至极，故名天尊。",1],[2349,3,"佛教四大菩萨是____、观音菩萨、普贤菩萨、地藏菩萨。",[],"文殊菩萨","佛教中四大菩萨，指的是文殊菩萨、观音菩萨、普贤菩萨、地藏菩萨四位法力高深的菩萨。",2],[2350,3,"“太守与客来饮于此，饮少辄醉，而年又最高，故自号曰醉翁也”中的“太守”是____。",[],"欧阳修","《醉翁亭记》最后一句：“太守谓谁？庐陵欧阳修也。”",3],[2351,3,"宣纸是中国独特的手工艺品，享有“千年寿纸”的美誉。它名字的来历与什么有关____。",[],"产地","宣纸得名于其产地——安徽宣城。",8],[2352,3,"顾恺之创作的是____。",[],"洛神赋图","《洛神赋图》是东晋顾恺之的画作，原《洛神赋图》卷为设色绢本。是由多个故事情节组成的类似连环画而又融会贯通的长卷。",0],[2353,3,"阎立本创作的是____。",[],"历代帝王图","《历代帝王图》又名《列帝图》、《十三帝图》、《古列帝图卷》、《古帝王图》，传为唐代阎立本画作，绢本，设色，现存后人摹本。",1],[2354,3,"展子虔创作的是____。",[],"游春图","《游春图》是隋朝画家展子虔创作的绘画作品，绢本、青绿设色，画上有宋徽宗题写的“展子虔游春图”六个字，现存北京故宫博物院绘画馆。、",8],[2355,3,"绘画“四品”指的是____、妙品 、能品 、逸品。",[],"神品","四品是指唐朝朱景玄所著，是中国现存就早的绘画史，即：神、妙、能、逸。",8],[2356,3,"书法史上“楷书四大家”指的是欧阳询、____、柳公权、赵孟頫。",[],"颜真卿","楷书四大家是对书法史上以楷书著称的四位书法家的合称,也称四大楷书。他们分别指：唐朝欧阳询(欧体)、唐朝颜真卿(颜体)、唐朝柳公权(柳体)、元代赵孟頫(赵体)。",8],[2357,3,"《闰中秋月诗帖》的笔法属于____。",[],"瘦金体","《闰中秋月诗帖》是赵佶创作的一幅书法作品，现收藏于北京故宫博物院。《闰中秋月诗帖》为“瘦金体”的典型作品之一，“瘦金”即有“瘦筋”的含意。",8],[2358,3,"现存面积最大的地面城池是____。",[],"西安城","古代的城市称作城池，“城”指城墙，“池”指城外环绕城墙的河池，俗称“护城河”。西安城是我国现存面积最大、保存最完整的古城。",7],[2359,3,"最早修建长城的是春秋时的____国。",[],"楚","最早修建长城是春秋时期的楚国，《左传》上所说楚国“汉水以为池，方城以为城”的方城，即指此。",2],[2360,3,"佛教的创始人是乔达摩·____。",[],"悉达多","乔达摩·悉达多是古印度著名思想家，古印度迦毗罗卫国释迦族人，佛教的创始者，被后世尊称为释迦牟尼佛。",2],[2361,3,"中国三大古建筑群的是____、曲阜孔庙、承德避暑山庄。",[],"北京故宫","中国三大古建筑群，即北京故宫、曲阜孔庙和承德避暑山庄，中国三大古建筑群均已列入世界文化遗产名录。",10],[2362,3,"《论语》中认为“为仁之本”的是_____",[],"孝悌","《论语》中认为“为仁之本”是孝悌，孝悌是仁的一部分，也是仁的根本。孝是指报答父母的养育之恩，悌指的是兄弟姐妹之间的友爱。孔子非常重视孝悌，他认为孝悌是做人、做学问的根本。",2],[2363,3,"古代茶圣是____。",[],"陆羽","陆羽（733—804），字鸿渐，复州竟陵（今湖北天门）人，一名疾，字季疵，号竟陵子、桑苎翁、东冈子，又号“茶山御史”。是唐代著名的茶学家，被誉为“茶仙”，尊为“茶圣”，祀为“茶神”。",12],[2364,3,"李清照号____。",[],"易安居士","李清照，南宋女词人。号易安居士，今山东济南人。长于诗、文、词,兼书法、绘画,且通音律。",0],[2365,3,"著名的候风地动仪的研制者是____。",[],"张衡","候风地动仪的发明者东汉大科学家张衡。早在公元132年，中国就发明了地球的探测器——地动仪。它是中国古代科文并茂的巨星——张衡创制发明的，也是世界上最早的一台会测报地震方向的科学仪器，它首开人类科学测报地震的先河。",11],[2366,3,"李白号____。",[],"青莲居士","李白（701年—762年） ，字太白，号青莲居士，又号“谪仙人”。",0],[2367,3,"国子监的最高官员称为____。",[],"祭酒","国子监以师为官，最高职位是祭酒，一般的教学和管理人员也是朝廷命官，由吏部统一管理任免。国子监的学生称为监生，监生又分官生和民生。",3],[2368,3,"最早记录指南针存在偏差的是____。",[],"梦溪笔谈","沈括是世界上第一个指出指南针不完全指南北的人，记载于《梦溪笔谈》中。",11],[2369,3,"____被誉为“天下名茶之冠”。",[],"西湖龙井","杭州西湖龙井，被誉为“天下名茶之冠”，产于湘江省杭州市西湖周围的群山之中。",7],[2370,3,"唐太宗李世民登基前曾发动“玄武门事变”，按照古代五行说，大兴宫的“玄武门”一定位于该宫的____。",[],"北方","玄武门之变，是唐高祖武德九年六月初四（公元626年7月2日），是由当时唐高祖李渊次子秦王李世民在唐王朝的首都长安城（今陕西省西安）太极宫的北宫门--玄武门附近发动的一次政变。",1],[2371,3,"在中国的饮茶史上，____皇帝是著名的泉水评定专家，被誉为“茶帝”。",[],"乾隆","乾隆皇帝爱新觉罗弘历（1711——1799）在世89年,是我国历史上在位时间最长,寿命最长的皇帝,也是最爱茶的皇帝。",12],[2372,3,"“真龙天子”最早指的是____皇帝。",[],"刘邦","《史记》记载，旧时一妇人在河边行走时，不知何故突然昏厥过去，他丈夫见她久久不回，于是到河边寻找，见有一条龙盘于那妇人身上，过不久这妇人便有孕上身，不久便产下一婴，这便是汉高祖刘邦。因此刘邦是历史上第一个被称为真龙天子的皇帝。",1],[2373,3,"中国的三大传统节日是____、中秋节、端午节。",[],"春节","中国的三大传统节日是春节、端午节、中秋节。",5],[2374,3,"人殉制度是中国历史上最残忍的制度，他终止于____时期。",[],"明英宗","明英宗朱祁镇即位后，对人殉制度非常厌恶，明确提出废止人殉，曾下旨说“藩王薨，妃、夫人以下不必从死，年少有父母者遣归”。",1],[2375,3,"二胡名曲《二泉映月》中的“二泉”指的是天下第二泉，它位于____。",[],"无锡","二泉映月中的二泉，是江苏无锡市的西郊惠山九龙十三泉，中声名最大的“天下第二泉”，人们也称它为二泉。",7],[2376,3,"盖碗茶是____族所喜爱的特色饮茶方式。",[],"回","盖碗茶是西北回族的一种独特的饮茶方式，相传始于唐代，相传至今，颇受回族人民喜爱。",12],[2377,3,"“登黄山天下无山，观止矣！”是____在游历黄山后写下的。",[],"徐霞客","徐霞客(1586-1641)，名弘祖，字振之，号霞客，明朝南直隶江阴(今江苏江阴市)人。明地理学家、旅行家和文学家，地理名著《徐霞客游记》的作者，被称为\"千古奇人\"。徐霞客一生志在四方，足迹遍及今21个省、市、自治区 。\"达人所之未达，探人所之未知\" ，所到之处，探幽寻秘，并记有游记，记录观察到的各种现象、人文、地理、动植物等状况。他经30年考察撰成的60万字《徐霞客游记》，开辟了地理学上系统观察自然、描述自然的新方向，既是系统考察祖国地貌地质的地理名著，又是描绘华夏风景资源的旅游巨篇，还是文字优美的文学佳作，在国内外具有深远的影响。《徐霞客游记》开篇之日(5月19日)被定为中国旅游日。",7],[2378,3,"我国古代铜活字印书史上造字时间最长、耗费资金最大、刻字数量最多的人物是____。",[],"林春祺","在我国古代印刷史上，林春祺造铜活字印书，造字时间最长，耗费资金最大，刻字数量最多。",11],[2379,3,"王维的诗句“朝为越溪女，暮作吴宫妃。”说的是我国古代的著名美女____。",[],"西施","《西施咏》：“艳色天下重，西施宁久微。朝为越溪女，暮作吴宫妃。贱日岂殊众，贵来方悟稀。邀人傅脂粉，不自著罗衣。君宠益娇态，君怜无是非。当时浣纱伴，莫得同车归。持谢邻家子，效颦安可希。”《西施咏》是唐代诗人王维创作的一首诗。此诗借西施从平民到宫廷宠妃的历史典故，揭示人生浮沉全凭际遇的炎凉世态，并表达对小人的嘲讽，揭露当时社会上潜藏的危机，抒发诗人怀才不遇的不平与感慨。",0],[2380,3,"“香山居士”是我国唐代诗人____的别称。",[],"白居易","白居易（772年2月28日－846年9月8日），字乐天，号香山居士，又号醉吟先生，生于河南新郑，祖籍山西太原。他是唐代著名现实主义诗人，有“诗魔”和“诗王”之称，与元稹共同倡导新乐府运动，世称“元白”，又与刘禹锡并称“刘白”。",0],[2381,3,"“苦心人，无不负，卧薪尝胆，三千越申可吞吴。”描写的是____。",[],"勾践","出自蒲松龄“落第自勉联”：有志者，事竟成，破釜沉舟，百二秦关终属楚；苦心人，天不负，卧薪尝胆，三千越甲可吞吴。越王勾践（约前520年―前465年），姒姓，名勾践，又名鸠浅、菼执，夏禹后裔，越王允常之子，春秋末年越国国君。前496年即位，曾败于吴国，被迫求和。返国后重用范蠡、文种，卧薪尝胆使越国国力渐渐恢复起来。前482年，吴王夫差兴兵参加黄池之会，以彰显武力率精锐而出。越王勾践抓住机会率兵而起，大败吴师。夫差仓卒与晋国定盟而返，与勾践连战惨败。不得已与越议和。前473年夫差被迫自尽，灭吴国称霸，是春秋时期最后一位霸主。",1],[2382,3,"我国广州市的别称是____。",[],"羊城","羊城是广州别称，广东省省会，位于广东省中南部，东江、西江、北江交汇处，珠江三角洲北缘，濒临中国南海。",7],[2383,3,"五谷中的“黍”是指____。",[],"黄米","黄米又称黍、糜子、黄米、夏小米、黄小米，有糯质和非糯质之别，糯质黍多作以醇酒，非糯质黍，称为穄，以食用为主。",12],[2384,3,"田园诗派的开创者是____。",[],"陶渊明","陶渊明，字元亮，又名潜，世称靖节先生，私谥靖节，世称靖节先生，浔阳柴桑（今江西九江）人，东晋著名诗人、辞赋家、散文家，被誉为“隐逸诗人之宗”“田园诗派之鼻祖”，江西首位文学巨匠。",0],[2385,3,"我国的第一部长篇历史小说是____。",[],"三国演义","《三国演义》（全名为《三国志通俗演义》，又称《三国志传》）是中国古典四大名著之一，亦是中国第一部长篇历史章回小说，作者是元末明初的罗贯中。",1],[2386,3,"清朝文学家蒲松龄号“柳泉居士”，世称____。",[],"聊斋先生","蒲松龄（1640年6月5日-1715年2月25日），字留仙，一字剑臣，别号柳泉居士，世称聊斋先生，自称异史氏。",0],[2387,3,"《水调歌头·明月几时有》一词的小序中提到的“子由”是苏轼的____。",[],"弟弟","子由是苏轼弟弟苏辙的字。",0],[2388,3,"诗句“故人西辞黄鹤楼，烟花三月下扬州”中的“故人”指的是____。",[],"孟浩然","故人：老朋友,这里指孟浩然。出自：唐·李白《黄鹤楼送孟浩然之广陵》。 原文：故人西辞黄鹤楼，烟花三月下扬州。孤帆远影碧空尽，唯见长江天际流。",0],[2389,3,"《与妻书》的作者是黄花岗起义七十二烈士之一的____，这封家书表现了他作为一个革命者以天下为己任，追求正义与真理，舍“小爱”取“大爱”的高尚情操和宽广胸怀，令人肃然起敬。",[],"林觉民","林觉民（1887—1911），字洞意，黄花岗七十二烈士之一。《与妻书》是他参加孙中山领导的广州起义前写给妻子的绝笔书。",2],[2390,3,"____在古时是指结婚时把夫妻头发束在一起。",[],"结发","结发是古时候的婚姻习俗，当夫妻成婚时，各取头上一根头发，合而作一结，男女双方结为夫妻。这就是古诗中所说的：“结发为夫妻，恩爱两不疑”。",5],[2391,3,"____是关于农业生产和农事活动的著作。",[],"齐民要术","《齐民要术》大约成书于北魏末年(公元533年-544年)，是北朝北魏时期，南朝宋至梁时期，中国杰出农学家贾思勰所著的一部综合性农学著作，也是世界农学史上专著之一，是中国现存最早的一部完整的农书。",11],[2392,3,"“夕阳无限好，只是近黄昏。”是____的诗句。",[],"李商隐","“夕阳无限好，只是近黄昏”是出自唐代李商隐的即景抒情的诗《登乐游原》中一句，意思是虽然夕阳无限美好，可惜的是已接近黄昏时刻，美好转瞬而逝。",0],[2393,3,"先秦两汉时期成就最高，影响最大，通过人物描写来反映历史面貌的是____。",[],"史记","“通过人物描写反映历史面貌”，可知此书是纪传体，因为纪传体是通过记叙人物活动反映历史事件的史书体例。《史记》为西汉司马迁所作，是中国第一部纪传体通史，以人物传记为中心来反映历史内容，记载了从黄帝以来至汉武帝时期的历史，被列为“二十四史之首”。",1],[2394,3,"“态生两靥之愁，娇袭一身之病”是宝玉对黛玉的第一印象，其中“靥”是指____。",[],"酒窝","“靥”是指酒窝儿，嘴两旁的小圆窝儿。",10],[2395,3,"被国内外人士誉为“中国三大国粹”的是“京剧、国画、____”。",[],"中医","中国三大国粹分别为京剧、国画、中医。",8],[2396,3,"王羲之对一种动物十分偏爱，并从它的体态姿势上领悟到书法执笔运笔的理，这种动物是____。",[],"鹅","王羲之爱鹅成癖，为见好鹅，不辞劳苦，更不惜墨宝。王羲之生性爱鹅，会稽有一位孤老太太养了只鹅，叫声很好听，想买而未能得到，于是就带着亲友去观看。老太太听说他要来，把鹅烹煮了用来招待他，王羲之难过了一整天。当时山阴有位道士，养了一群鹅，去观看，很高兴，多次恳求道士买他的鹅。道士说：“替我抄一遍《道德经》我就送你这群鹅。”王羲之欣然写完，把鹅装在笼子里回去了，一路上乐不可支。",8],[2397,3,"要成好人，____。引酵若酸，哪得甜酒。",[],"须寻好友","出自吕德胜《小儿语》——要成好人，须寻好友。",12],[2398,3,"马可.波罗来中国的时候，中国处于____时期。",[],"元朝","马可.波罗是世界著名的旅行家、商人，著有《马可.波罗游记》。他是第一个深入中国的西方人。元朝初年，马可.波罗来到中国。他的游记中记载了与忽必烈的相处。",1],[2399,3,"《红楼梦》中有“小宝钗\"，“小黛玉”之称的两人是袭人、____。",[],"晴雯","小宝钗指的是袭人，他们俩都是封建思想的代表，实时劝谏宝玉读书封侯，与达官贵人结交。小黛玉指的是晴雯，第一是晴雯和黛玉关系本来就不错，又都是不喜欢宝玉读书考举人进士，厌恶世俗经济学问的人。",10],[2400,3,"曹植七步成诗，相传历史上还有一位三步就能成诗的人，他是____。",[],"寇准","历史上能三步成诗的人是寇准。太平兴国五年(980年)，19岁的寇准考中进士甲科，授大理评事。",1],[2401,3,"“醉里挑灯看剑，梦回吹角连营”出自____的作品。",[],"辛弃疾","“醉里挑灯看剑,梦回吹角连营”一句出自南宋爱国词人辛弃疾所写的一首名字为《破阵子》的词，题目为《为阵同甫赋壮词以寄》。",0],[2402,3,"“但愿人长久，千里共婵娟”，苏东坡借这首词表达了对____的思念之情。",[],"兄弟","“但愿人长久，千里共婵娟。”苏东坡借这首词表达了对弟弟苏辙的思念之情。",0],[2403,3,"“春风得意”成为进士及第的代称与____有关。",[],"孟郊","“春风得意”出自唐朝的孟郊写的七言绝句《登科后》，这里的春风既指大自然中的微风，又用来比喻皇恩。唐朝诗人孟郊曾多次进京赶考不中，终于在41岁的时候考中进士，因此写下《登科后》：“昔日龌龊不足夸，今朝放荡思无涯。春风得意马蹄疾，一日看尽长安花。”用以表达自己喜悦的心情。",3],[2404,3,"五湖指的是洞庭湖、鄱阳湖、太湖、巢湖、____。",[],"洪泽湖","五湖指洞庭湖、鄱阳湖、太湖、巢湖和洪泽湖。",7],[2405,3,"元杂剧中的女主唱称为____。",[],"旦本","旦本戏是戏剧用语，指元杂剧由女主角演唱的杂剧为旦本戏。",9],[2406,3,"“匪女之为美，美人之贻”中的“贻”的意思是____。",[],"赠送","贻的意思是指： 赠给。解释：不是你的美好(让我动心)，(而是因为)美人送给我的(我才珍惜)。",14],[2407,3,"“彼采萧兮，一日不见，如三秋兮”中“三秋”的意思是____。",[],"三季","《采葛》写主人公对友人的思念。这两句是用比喻方法构成的夸张句。三秋是指三个季度。",0],[2408,3,"旧时我国的老百姓称____为“仓神”。",[],"老鼠","旧时我国民间曾将正月二十五日定为“填仓节”。人们管老鼠叫“仓神”。到“填仓节”这天，家家仓囤装满粮食，并虔诚祭祀，祈求“老鼠仓神”口下留情，少来偷吃，并祷祝年年五谷丰登，粮油满仓。",12],[2409,3,"与伯牙、钟子期“高山流水觅知音”故事相关的乐器是____。",[],"古琴","两位“知音”的友谊感动了后人，人们在他们相遇的地方，筑起了一座古琴台。直至今天，人们还常用“知音”来形容朋友之间的情谊。两人千古传诵的诗篇:摔碎瑶琴凤尾寒，子期不在对谁弹！春风满面皆朋友，欲觅知音难上难。高山流水觅知音！",9],[2410,3,"“名不正言不顺”表达了中国的____思想。",[],"儒家","“名不正言不顺”是儒家的思想。出处：《论语·子路》：“名不正则言不顺，言不顺则事不成。”",2],[2411,3,"山东曲阜有“三孔”，分别是“孔府”、“ 孔林 ”和____。",[],"孔庙","曲阜三孔由孔庙、孔府和孔林构成，位于山东省曲阜市，是中国唯一且规模最大的集祭祀孔子的寺庙、孔子嫡系后裔的府邸和孔子及其子孙墓地于一体的建筑群。",10],[2412,3,"我国第一部中医学典籍是____。",[],"黄帝内经","《黄帝内经》是一本综合性的医书，也是中国最早的医学典籍，对后世中医学理论的奠定有深远的影响。",11],[2413,3,"被称为“中国17世纪工艺百科全书”的《天工开物》是____创作的。",[],"宋应星","宋应星是明朝著名科学家。宋应星的著作和研究领域涉及自然科学及人文科学的不同学科，而其中最杰出的作品《天工开物》被誉为“中国17世纪的工艺百科全书”。",11],[2414,3,"“霓裳羽衣”是我国____代的宫廷乐舞。",[],"唐","霓裳羽衣舞，是一种唐代的宫廷乐舞，唐玄宗作曲。",12],[2415,3,"中国古代的“乐府双璧”是指____和孔雀东南飞。",[],"木兰诗","“乐府双璧”即《木兰诗》和《孔雀东南飞》的喻称。《木兰诗》又名《木兰辞》，是北朝民歌；《孔雀东南飞》又名《古诗为焦仲卿妻作》，是古乐府民歌的代表作之一，也是保存下来的最早的一首长篇叙事诗。",9],[2416,3,"“字字看来皆是血，十年辛苦不寻常”描述的是名著____的成书过程。",[],"红楼梦","《红楼梦》，又名《石头记》《金玉缘》，是清代作家曹雪芹创作的章回体长篇小说，被誉为中国古典四大名著之首。“字字看来皆是血，十年辛苦不寻常。”是《红楼梦》甲戌本第一回之前《凡例》的末尾。《凡例》的末段内容与其他诸本第一回第一段基本相同，是对全书的总评。",10],[2417,3,"“退避三舍”指的是军队____。",[],"后退九十里","该成语最早出自于春秋·左丘明《左传·僖公二十三年》。退避三舍（舍，古时行军以三十里为一舍）原意指为了回避与对方的冲突，主动退让九十里；常用于比喻退让和回避，避免冲突。",2],[2418,3,"严复所说的“孔门四科”具体指德行、政事、文学和____。",[],"言语","后世学者将德行、政事、文学、言语，视为“孔门四科”。",0],[2419,3,"中华文化源远流长，我国四大文化遗产分别为《明清档案》、《殷墟甲骨》、《居延汉简》、____。",[],"敦煌经卷","四大文化遗产是指四本记录了中国历史的书籍，分别是《明清档案》、《殷墟甲骨》、《居延汉简》和《敦煌经卷》。",1],[2420,3,"明代有两大戏曲流派：以汤显祖为代表的____（重意趣）和以沈璟为代表的吴江派（重格律）。",[],"临川派","临川派是明代传奇文学的一种流派。万历年间﹐临川汤显祖创作《牡丹亭》等传奇﹐着重刻划人物﹐讲究词藻﹐影响颇大。",9],[2421,3,"“不愤不启，不悱不发”中的____是想弄明白而弄不明白的意思。",[],"愤","愤：心里想弄明白可还是不明白。",1],[2422,3,"沈括的《梦溪笔谈》、王应麟的《困学纪闻》，以及洪迈的____是宋代三大笔记。",[],"容斋随笔","王应麟的《困学纪闻》，与沈括的《梦溪笔谈》、洪迈的《容斋随笔》，并称宋代三大笔记。",8],[2423,3,"对乐府诗的分类，以郭茂倩的____最为完备。",[],"乐府诗集","《乐府诗集》是北宋文学家郭茂倩编撰的上古至唐、五代的乐府诗歌总集，成书于北宋时期。每一类有总序，每一曲有题解，对乐曲的起源、性质、演唱配器等均有详尽说明。其中还保存了不少已失传著作的内容。",9],[2424,3,"《汉书》的志尤为人们所重视。其中由《史记·平准书》演变而来的志被命名为____。",[],"食货志","《食货志》是由《史记》的《平准书》演变来的，但有很大发展，内容也更加丰富了。",12],[2425,3,"《汉书》创立了中国现存最早的图书目录《汉书·____》。",[],"艺文志","《汉书·艺文志》是汉代时期改撰而成的文学作品，是中国现存最早的目录学文献。",1],[2426,3,"赵州桥是隋朝工匠____修建的。",[],"李春","建于隋朝年间公元595年－605年，由著名匠师李春设计建造，距今已有1400多年的历史，是当今世界上现存第二早（还有一座小商桥）、保存最完整的古代单孔敞肩石拱桥。",1],[2427,3,"唐文宗大和七年，朝廷下令将九经，《论语》、《孝经》、《尔雅》十二部书刻在石碑上，开成二年刻成，又称____。",[],"开成石经","开成石经，唐代的十二经刻石。又称唐石经。始刻于文宗太和七年(833)，开成二年(837)完成。原碑立于唐长安城务本坊的国子监内，宋时移至府学北墉，即今西安碑林。中国清代以前所刻石经很多，唯开成石经保存最为完好，是研究中国经书历史的重要资料。1961年国务院公布为全国重点文物保护单位。",2],[2428,3,"“蒹葭苍苍，白露为霜。所谓伊人，在水一方”中“蒹葭”是指____。",[],"芦苇","蒹葭者，芦苇也，飘零之物，随风而荡，却止于其根，若飘若止，若有若无。思绪无限，恍惚飘摇，而牵挂于根。根者，情也。相思莫不如是。露之为物，瞬息消亡。",6],[2429,3,"常用作表示第五位顺序的字是____。",[],"戊","戊，天干的第五位，用作顺序第五的代称。",6],[2430,3,"文字是人类文明的重要标志，我国最古老的文字是____。",[],"甲骨文","中国迄今发现的最古老的比较成熟的文字是甲骨文，是刻在龟甲和兽骨上的文字。",1],[2431,3,"清代皇帝的夫人有不同的称呼指代有不同的等级，其中地位最低的是____。",[],"答应","在清朝，将之分为八等级，分别为：皇后一人，皇贵妃一人，贵妃两人，妃四人，嫔六人，贵人不限人数，常在不限人数，答应不限人数。",1],[2432,3,"故宫的三大殿是指太和殿、中和殿、保和殿，三大殿是封建皇帝行使权力或者举行盛典时用的宫殿。如果新皇帝要举行登基大典，一般会在____举行。",[],"太和殿","太和殿俗称金銮殿，明清两朝皇帝都在太和殿举行盛大典礼，如皇帝登基即位、皇帝大婚、册立皇后、命将出征等。",10],[2433,3,"《山海经》中“迷谷”指的是____。",[],"植物","《山海经》中迷谷是一种植物。",2],[2434,3,"上古神话中的四大神兽中____在山海经中没有明确的记载。",[],"梼杌","梼杌在《山海经》中没有明确的记载。",2],[2435,3,"“勿以恶小而为之，勿以善小而不为。”语出三国志，出自____。",[],"刘备","“勿以恶小而为之，勿以善小而不为”，出自蜀汉昭烈帝刘备的诏书中。意思是不要因为是件较小的坏事就去做，不要因为是件较小的善事就毫不关心。",1],[2436,3,"我国古代诗人中流传下来的诗作数量第一的诗人是____。",[],"陆游","我国古代诗人中流传下来的诗作数量第一的诗人是陆游。陆游具有多方面文学才能，尤以诗的成就为最，自言“六十年间万首诗”，存世有九千三百余首。",0],[2437,3,"凤凰涅槃出自____先生的同名作品《凤凰涅槃》。",[],"郭沫若","凤凰涅槃一说出自于郭沫若先生同名作品，非中国古代传说，在中国古代神话传说中并无凤凰会浴火重生的说法。",0],[2438,3,"西王母住在____山。",[],"昆仑","西王母住在昆仑山。",7],[2439,3,"中国第一神山是____。",[],"昆仑山","中国第一神山是昆仑山。",7],[2440,3,"又西九十里，曰夸父之山。其北有林焉，名曰桃林”这里的“桃林”出自神话故事____。",[],"夸父逐日","《夸父逐日》中有一句话“弃其杖，化为邓林。”这里的“邓林”就是桃林的意思。",0],[2441,3,"“其鸣自叫也，见则其邑有讹火。”中的“讹火”指的是____。",[],"磷火","讹火意思是指怪火，也指磷火。",14],[2442,3,"与王建齐名，并称“张王乐府”的唐代诗人是____。",[],"张籍","张籍（约766年- 约830年），字文昌，和州乌江（今安徽和县乌江镇）人，唐代诗人，世称“张水部”、“张司业”。张籍为韩门大弟子，其乐府诗与王建齐名，并称“张王乐府”。",9],[2443,3,"“刑天舞干戚”“女娲补天”“精卫填海”都是出自____。",[],"山海经","它们都出自《山海经》。",0],[2444,3,"根据《史记》当中的记载，秦始皇姓____。",[],"赵","庄襄王为秦质子于赵，见吕不韦姬，悦而取之，生始皇。以秦昭王四十八年正月生于邯郸。及生，名为政，姓赵氏。",1],[2445,3,"战国时期著名变法家商鞅姓____。",[],"姬","商鞅（约公元前390年－公元前338年），姬姓，公孙氏，名鞅，卫国人。",1],[2446,3,"____是六国中最后灭亡的。",[],"齐国","从公元前230年攻打韩国到前221年灭齐国结束，共计10年的时间，先后按顺序消灭韩、赵、魏、楚、燕、齐六国，结束了中国自春秋以来长达500多年的诸侯割据纷争的局面。",2],[2447,3,"秦统一六国的年代是____。",[],"公元前221年","从公元前230年攻打韩国到前221年灭齐国结束，共计10年的时间，先后按顺序消灭韩、赵、魏、楚、燕、齐六国，结束了中国自春秋以来长达500多年的诸侯割据纷争的局面。",1],[2448,3,"为了有效地控制地方，元朝统治者在地方设置的管理机构是____。",[],"行中书省","行中书省，元朝（中统、至元年间）开始实施的直属中央政府管辖的一级行政区，民间简称“行省”或“省”。",1],[2449,3,"____的内容反映的历史时期是春秋时期。",[],"左传","《左传》内容反映的历史时期是春秋时期。《左传》记叙了春秋时期250多年的历史，主要记录了周王室的衰微，诸侯争霸的历史，对各类礼仪规范、典章制度、社会风俗、民族关系、道德观念、天文地理、历法时令、古代文献、神话传说、歌谣言语均有记述和评论。",2],[2450,3,"“花甲”是指____岁。",[],"六十","不满周岁——襁褓；\n2-3岁——孩提；\n7岁（女）——髫年；\n8岁（男）——龆年；\n幼年泛称——总角；\n10岁以下——黄口，即乃稚气未脱的少儿代称也；\n13岁（女）——豆蔻年华，\n15岁（女）——及笄之年；\n15岁（男）——志学之年；\n16岁（女）——破瓜年华、碧玉年华，二八年华；\n15~20岁——舞象之年；\n20岁（女）——桃李年华；\n20岁（男）——弱冠；\n30岁（女）——半老徐娘；\n30岁（男）——而立之年；\n40岁（男）——不惑之年、强壮之年；\n50岁——年逾半百、知非之年、知命之年、艾服之年、大衍之年；\n60岁——花甲、平头甲子、耳顺之年、杖乡之年、还历之年；\n70岁——古稀、杖国之年、致事之年、致政之年，从心之年、悬车之年；\n80~90岁——耄耋之年；\n100岁——期颐，又可称为“人瑞”。",4],[2451,3,"“抛绣球、碰红蛋、抢花炮”是我国____歌圩节举行的活动。",[],"壮族","壮族的歌圩节是壮族民间传统歌节，流行于广西、云南等地。在每年春、秋两季，尤其是三月三，要搭彩棚、摆歌台，举办唱山歌的歌圩。节日期间还举行抛绣球、碰红蛋、踢毽子、抢花炮等活动。",5],[2452,3,"“八仙”之中手握芭蕉扇的是____。",[],"汉钟离","汉钟离，本名钟离权。又称为正阳祖师。法宝是芭蕉扇，此宝扇扇火火灭，扇水水潇，变化无穷，能遮天蔽日。",1],[2453,3,"____有“行道树之王”的美称。",[],"悬铃木","悬铃木原产于东南欧等外国地区，引入中国后作为观赏树和行道树，悬铃木适合温暖的气候，可以有效的应对空气污染，其叶片还可以吸收毒气灰尘,有“行道树之王\"的称号。",1],[2454,3,"背水一战说的是____。",[],"韩信","“汉将韩信率兵攻赵，出井陉口，令万人背水列阵，大败赵军。”“信乃使万人先行，出，背水陈。赵军望见而大笑。”（西汉·司马迁《史记·淮阴侯列传》）。",1],[2455,3,"巧用计谋，二桃杀三士的是齐国丞相____。",[],"晏婴","《晏子春秋·内篇谏下》载：春秋时，公孙接、田开疆、古冶子三人是齐景公的臣子，勇武骄横。齐相晏婴想要除去这三人，便请景公将两个桃子赐予他们，让其论功取桃，结果三人都弃桃自杀。",3],[2456,3,"在中国书法史上被誉为“草圣”的书法家是____。",[],"张旭","张旭,盛唐时期知名书法家,以狂草著名,被尊为“草圣”,唐文宗曾下诏称李商隐的诗、裴文的舞剑与戏法张旭的草书为“三绝”,代表作品有《古诗四帖》。",8],[2457,3,"甲骨文，是中国的一种古老文字，又称“契文”、“甲骨卜辞”、殷墟文字或“龟甲兽骨文”。是汉字的早期形式，是现存中国王朝时期最古老的一种成熟文字，最早出土于河南省安阳市殷墟。历史上发现、收藏和研究甲骨文的第一人是____。",[],"王懿荣","光绪二十五年（1899年），王懿荣因通晓医术在鹤年堂抓药时，买到一种叫龙骨的药材，对其上面的图形文字进行研究，并通过山东古董商人范维卿大量收购，王懿荣首次发现甲骨文，并将其断为商代。该发现轰动中外学术界，把汉字的历史推到公元前1700多年的殷商时代，成为甲骨文研究的奠基人。",1],[2458,3,"弈秋是我国春秋时期著名的____老师。",[],"围棋","弈秋是第一个史上有记载的围棋专业棋手，也是史上第一个卜、卜徒父是也。此名弈秋，故知秋为其名，因通国皆谓之善弈，故以弈加名称之。",13],[2459,3,"10世纪初（916年）契丹族首领____，统一契丹各部，建立契丹国（辽）。",[],"耶律阿保机","10世纪初，契丹族的杰出首领耶律阿保机统一了契丹各部，916年，他建立契丹政权，定都上京，今内蒙古巴林左旗南，后来改国号为辽。",1],[2460,3,"现今通行的中国象棋，相传为唐代牛僧孺所制。刻圆木或牙、骨为棋子____枚，红黑各半。",[],"32","象棋主要流行于华人及汉字文化圈的国家，有32枚棋子，双方各16枚。",13],[2461,3,"唐代楷书大家中，有“颜筋柳骨”之说，其中“颜筋”指的是颜真卿，“柳骨”指的是____。",[],"柳公权","柳公权（778年-865年），唐朝中期著名书法家、诗人，与颜真卿齐名，人称“颜柳”，又与欧阳询、颜真卿、赵孟頫并称“楷书四大家”。柳公权幼年好学，善辞赋，懂韵律。官至太子少师，世称“柳少师”。后柳公权封河东郡公，亦称“柳河东”。其书法以楷书著称，初学王羲之，自创独树一帜的“柳体”，以骨力劲健见长，后世有“颜筋柳骨”的美誉，著有作品《金刚经碑》《玄秘塔碑》等。",8],[2462,3,"项庄舞剑意在沛公，沛公是指____。",[],"刘邦","这则成语指项庄席间舞剑，企图刺杀刘邦。比喻说话和行动的真实意图别有所指。出自西汉·司马迁 《史记·项羽本纪》。",0],[2463,3,"“东施效颦”中，东施效仿的是____。",[],"西施","故西施病心而矉（通‘顰’，皱眉）其里，其里之丑人见而美之，归亦捧心而矉其里。其里之富人见之，坚闭门而不出；贫人见之，絜（通‘挈’，带领）妻子而去之走。彼知颦美，而不知颦之所以美。（《庄子·天运》）。",2],[2464,3,"八大菜系比四大菜系多出了____、浙菜、徽菜和湘菜四个菜系。",[],"闽菜","八大菜系是鲁、川、粤、苏、闽、浙、湘、徽菜的合称，是指在选料、切配、烹饪等技艺方面，经长期演变而自成体系，具有鲜明的地方风味特色，并为社会所公认的中国饮食的菜肴流派。",12],[2465,3,"中国的茶饮风俗源于____地区。",[],"四川","四川茶文化源远流长，四川是我国饮茶和种植茶叶的最早的地区之一，我国最早有价值的文献，也恰巧出自四川文人之手。",5],[2466,3,"杭州虎跑泉与龙井茶相配，被称为____。",[],"西湖双绝","西湖龙井驰名中外，色绿、香郁、味醇；虎跑泉水天下第三泉，泉水甘洌醇厚、水质纯净，而龙井茶只有虎跑水才能泡出它独特的茶香，因此二者被世人合称为“西湖双绝”.",7],[2467,3,"宋元时期有别于官学的私学是____。",[],"书院教育","书院教育是古代一种教育方式，起源于先秦时期，宋朝将这种教育方式发扬光大。著名的有朱熹的岳麓书院、石介的泰山书院。",1],[2468,3,"“不胫而走”的“胫”指的是身体部位中的____。",[],"小腿","形容没有腿却能跑，多指消息无声地散播；胫指小腿，即从膝盖到脚跟的部分。",14],[2469,3,"历史上著名的“针灸铜人”是在北宋太医____的主持下制造的。",[],"王惟一","王惟一是北宋医家，对针灸学很有研究，集宋以前针灸之大成，著有《铜人腧穴针灸图经》一书。同时,他主持制造了外科铜人，作为学生练针的样本。",11],[2470,3,"年少时，梦见所用之笔头上生花，后来名闻天下的是____。",[],"李白","《开元天宝遗事·梦笔头生花》：“李太白少时，梦所用之笔头上生花，后天才赡逸，名闻天下。”",0],[2471,3,"____是历史上著名的医学家，他发明的药剂“麻沸散”，具有全身麻醉的功能。",[],"华佗","华佗东汉末年著名的医学家，与董奉和张仲景被并称为“建安三神医”。他精通内、外、妇、儿、针灸各科，对外科尤为擅长，发明了“麻沸散”来辅助外科手术，被后人称为“外科圣手”“外科鼻祖”。",11],[2472,3,"2008年北京奥运开幕式上的主题背景音乐是著名古曲____。",[],"春江花月夜","《春江花月夜》原名《夕阳箫鼓》，又名《夕阳箫歌》《浔阳琵琶》《浔阳夜月》《浔阳曲》，是一首著名的琵琶传统大的套曲，被选为2008年北京奥运会开幕式演唱者的背景音乐之一。",9],[2473,3,"现代京剧的行当有生、旦、净、丑四行，而昆曲则除此之外，还有____。",[],"末","京剧并非源于北京的剧种,而是由南方入京的安徽徽调和湖北汉调吸收流行于北京的风行梆子、昆曲、京腔的营养,融会本地语言形成的剧种。京剧有生、旦、净、丑四大行当,而昆曲除此之外还有末。",9],[2474,3,"____的发明源于古代道士的“炼丹术”。",[],"火药","火药火枪是我国古代的四大发明之一,源于古代的炼丹术。据文献记载,最迟在唐代火药已经被发现和利用,唐代孙思邈的《孙真人丹经》首次记载了制造火药的方法,是世界上关于火药的最早记载。",11],[2475,3,"在淝水之战中，“闻风声鹤唳，皆以为王师已至”的是谁？",[],"苻坚","淝水之战指的是前秦皇帝苻坚对东晋发动的战争，失败后在奔逃的路上，远处山上郁郁葱葱的树木被风吹得簌簌作响，高度紧张的前秦士兵以为那是晋军的追兵，越发拼命逃窜。",1],[2476,3,"最早的印本书籍____是在莫高窟发现的。",[],"金刚经","我国和世界现存最早的有日期的雕版排印的书是《金刚经》，撕掉于唐咸通九年(868)。这卷举世闻名的《金刚经》，原藏于甘肃敦煌莫高窟，1899年被发现，1907年后被英国人斯坦因盗去，原藏伦敦不列颠博物馆。",2],[2477,3,"五月五日划龙舟纪念____。",[],"屈原","相传起源于古时楚国人因舍不得贤臣屈原投江死去，许多人划船追赶拯救。他们争先恐后，追至洞庭湖时不见踪迹，之后每年五月五日划龙舟以纪念屈原，借划龙舟驱散江中之鱼，以免鱼吃掉屈原的身体。",5],[2478,3,"成语“病入膏肓”和“讳疾忌医”都源于____治病的典故。",[],"扁鹊","扁鹊是春秋战国时期名医，奠定了中医学的切脉外科手术方法，跨入了中医学的先河。成语“起死回生”“病入膏肓”和“讳疾忌医”都源于他的治病经历。",0],[2479,3,"国内仅存的一座帝王庙位于____的阜成门。",[],"北京市","帝王庙是供奉祭祀上至伏羲、轩辕祖先，下至明、清各朝的历代帝王和名臣的场所，是我国唯一纪念历代帝王名臣的坛庙。帝王庙位于北京西城区阜成门内大街路北。",1],[2480,3,"中国第一大佛是四川的____。",[],"乐山大佛","乐山大佛，又名凌云大佛，是中国最大的石刻佛像。",2],[2481,3,"中国开凿最早的大佛是山西太原____。",[],"西山大佛","太原西山大佛位于太原晋源区的拉维县蒙山，始凿于南北朝时期的北齐天保二年(551年)，历时26年凿成，至今已有近1500年的历史，是我国乃至世界最早的露天摩崖石刻。",2],[2482,3,"以佛教经典为主，囊括印度、中国等佛教著述在内的大型丛书是____。",[],"大藏经","《大藏经》是佛教经书的五卷。佛教经典被称为“藏”,分为经、律、论三个部分,称为“三藏”,经论合编在一起称“大藏经”。",2],[2483,3,"中州是古代____省的别称，其简称是豫。",[],"河南","中州是河南的古称。",7],[2484,3,"从秦汉到隋代实行____，从唐宋到辽金实行道路制，元明清三代实行行省制。",[],"郡县制","秦始皇在位时推行“郡县制”；西汉沿袭了秦的郡县制，与郡国并存；东汉为加强中央集权，将原本起监察作用的“州”设为最高级一级政区，形成“州、郡、县三级制”；隋又改为“郡(州)、县二级制”。唐设“道”对地方实行监察；宋改“道”为“路”,实行“路、州、县三级制”；辽袭唐制，将全国分为5道；金采宋制,行政区域实行路、府(州)、县三级管理,路为一级行政区。元推行行省制；明承元制，改行省为“承宣布政使司”；清承明制，改司为省，省名与今相近。",1],[2485,3,"江苏之名是其境内江宁与____两地的合称。",[],"苏州","江苏的名字是以江宁、苏州各取一字得名。清康熙6年(1667年)设江苏省,取两江总督驻所江宁(今南京市)和巡抚驻所苏州(今苏州市)两府首字组成江苏省。取全称中的“苏”字作为简称。",7],[2486,3,"安徽之名是其境内安庆与____两地的合称。",[],"徽州","“安徽”是其境内合为安庆与徽州两地的合称，名称始于清康熙。",7],[2487,3,"甲骨文也称____。",[],"卜辞","记录商代的社会情况的文字主要是甲骨文，是刻在甲骨上的文字，都是商代王室占卜的记录，因而也称卜辞。",1],[2488,3,"中国历史的准确纪年始于____时期的共和元年，即公元前841年。",[],"西周","公元前841年，西周时期的共和元年，是中国历史上有明确纪年的开始。",1],[2489,3,"现存最早的天文台遗址在今天的河南洛阳市，古名为____。",[],"灵台","灵台位于故城河南省洛阳市汉魏阳城南郊,由班固于东汉中元元年(56)主持修建,是历史文献最早的天文台遗址。据文献记载,灵台连续使用达二百五并建十余年,为我国古代天文学的发展作出了巨大贡献。",10],[2490,3,"唐代出现的一种著名的陶器被称为____。",[],"唐三彩","陶瓷业在唐朝有重要发展，越窑青瓷、邢窑白瓷和唐三彩最为有名，其中唐三彩造型美观，釉色绚丽，是世界工艺的珍品。",10],[2491,3,"北宋理学四大家是二程、张载和____。",[],"周敦颐","北宋理学四大家有：周敦颐、张载、程颐、程颢。",2],[2492,3,"所谓先秦的诸子百家，实际上就是指儒、墨、____、道、阴阳、名家、纵横家、兵家、农家和杂家这几个门派及其代表人物。",[],"法","诸子百家是对先秦晚期总称学术思想派别的总称，主要包括儒、道、墨、法、阴阳、农、名、兵、纵横和杂家。诸子百家各自阐发立论，已经形成了学术争鸣的局面，对中国古代思想史产生了可贵的神话传说影响。",2],[2493,3,"李斯和韩非都是儒家大师____的门人弟子。",[],"荀子","李斯和韩非都是儒家大师荀子的门人弟子。",2],[2494,3,"藏传佛教又称____，是在我国西藏、青海、内蒙古等地区流传的佛教。",[],"喇嘛教","藏传佛教，又称藏语系佛教，或俗称喇嘛教，是指传入中国西藏的佛教分支。",2],[2495,3,"现存最古老的宗祠是位于山西省闻喜县的____。",[],"裴氏祠","素有“中华宰相村”房氏之称的裴柏村是裴氏宗祠所在地,裴氏祠堂原称晋公祠,建于唐贞观三年(629年),有前殿、后殿、状元坊、碑廊等,规模宏大,但屡遭兵燹,屡修屡毁。",7],[2496,3,"中国画史上，被认为是第一幅山水画的现存作品是____。",[],"游春图","《游春图》长卷，绢本，横80.5厘米，设色纵43厘米。作者是展子虔，展子虔是北齐至隋之间（约550年~600年）的一位大画家，他擅长画山水人物，这幅经宋徽宗题写为展子虔所作的《游春图》卷，是画家唯一的传世作品，也是迄今为止中国存世最古老的画卷，现存最早的一副山水画。",8],[2497,3,"现存最早的类书是隋末虞世南的____。",[],"北堂书钞","现存最早的类书是隋末虞世南编纂的《北堂书钞》。",1],[2498,3,"在中国古代建筑史上，“汉三宫”和“唐三宫”非常著名，前者长乐宫、未央宫和建章宫；后者指____、大明宫、和兴庆宫。",[],"太极宫","我国古代历史时期的“汉三宫”是指长乐宫、未央宫和建章宫。其中，东宫由秦代旧宫整修改建而成；未央宫是明清两代以前中国古代最大的宫殿,为汉高祖前半期萧何督建；建章宫为汉景帝下令修建。“唐三宫”是指太极宫、大明宫、兴庆宫，其中，太极宫是在隋朝大兴宫的基础上改建而成，其北门为玄武门；大明宫是唐太宗专为李渊避暑而建；兴庆宫于唐玄宗时期建造，唐玄宗和杨贵妃的故事绝大多数发生于此。",1],[2499,3,"中国现存最早的古典宗祠园林建筑群是____。",[],"晋祠","晋祠是中国现存最早的古典宗祠园林建筑群，集庄严壮观与清雅秀丽，宗祠祭祀建筑与自然山水完美结合的典范。",10],[2500,3,"中国古塔按照造型来分类，有____、密檐式、喇嘛式、花式和金刚宝座式五种。",[],"楼阁式","塔源于印度的“浮屠”,用于收藏佛祖舍利,又称“舍利塔”，后用于藏经、埋葬，成为纪念性建筑。按照它的造型可分为：楼阁式、密檐式、喇嘛式、花式和夜叉宝座式。",10],[2501,3,"汉代雕塑的代表作是____墓前的“马踏匈奴”石雕。",[],"霍去病","霍去病墓石刻雕像《马踏匈奴》是汉代石刻雕像代表作品，它形象概括，雕刻手法稚拙粗放，显现出造型冼练，浑厚质朴的风格特征。",1],[2502,3,"古代乐器按演奏方法分为吹、拉、弹、打四类，按乐器的材料可分为____、石、土、木、匏、革、丝、竹八类。",[],"金","乐器按照各自使用的物质材料分为八种类别：即金，石，土，革，丝，木，匏，竹，称为八音。乐器分为四类：吹，拉，弹，唱。",9],[2503,3,"明代废爵堉著有《乐律全书》，他提出的____是对古代音乐理论的巨大贡献。",[],"十二平均律","明代丁年朱载堉利用开方的方法来计算律的长度,使十二律间的音程达到严格的均匀性,这就是他的“新法”。朱载堉的“新法”实现了将一个纯八度的震动体长度均匀地分为12份比值相等的“十二平均律”,这是音乐艺术史上出现明显最早出现的十二平均律学理论,比北美的类似理论更早、更精确。",1],[2504,3,"北宋数学家____提出的“大衍求一术”被国际数学界称为“中国剩余定理”。",[],"秦九韶","秦九韶是南宋汉学家，于淳祐七年(1247)著成《数书九章》十八卷。这是一部极其重要的巨著，它总结了前人在开方中剖析所使用的列筹方法，将其整齐而又系统地应用到有理的高次方程或无理根的求解上去，其中的“大衍求一术”(一次同余组解法)在世界数学握有史上占有崇高的优势地位，被称为“中国剩余定理”。",11],[2505,3,"最早提出勾股定理的是我国古代数学家____。",[],"商高","商高是西周初数学家。他在公元前1000年发现勾股定理的一个特例,即勾三,股四,弦五,早于原子论定理五百到迟六百年。",11],[2506,3,"著名的《四库全书总目提要》是著名学者____撰写的。",[],"纪晓岚","《四库全书总目提要》简称四库全书总目、四库总目、四库提要，共二百卷，是中国清代纪昀等编纂的一部大型解题书目，是中国古典目录学方法的集大成者。",0],[2507,3,"明清时，殿试的地点均在北京故宫的____殿。",[],"保和","殿试又称御试、廷试、廷对，殿试为科举考试中的最高一段，由皇帝亲自出题考试，明清时，科举殿试的地点均在北京故宫保和殿。",3],[2508,3,"地理学名著《水经注》的作者是北魏的____。",[],"郦道元","《水经注》是古代中国地理名著，共四十卷。作者是北魏晚期的郦道元。",2],[2509,3,"现存的古碑荟萃之地，著名的有两处：第一位是____碑林；第二位是曲阜的孔庙碑林。",[],"西安","长方形者为碑，上圆而下方者为碣，合称“碑碣”。碑碣起源于先秦的无字碑（宫碑、丰碑和庙碑），墓前丰碑到秦汉演变为纪念性建筑；东汉时立碑刻字成为风气，用于歌功颂德、宣扬门阀；隋唐更甚，始立庙中，往往留存大量书法真迹。现存的古碑集中地主要有两处：西安碑林，位于陕西省西安市，为中国第一碑刻艺术宝库；孔庙碑林，位于山东省曲阜市，仅次于西安碑林，为中国第二碑林。",8],[2510,3,"北京的“三海”也是著名的园林建筑，指的是____、中海、南海。",[],"北海","三海，即北海、中海、南海的合称，位于北京城内故宫和景山的西侧，明、清时期称为西苑。它是中国现存历史悠久、规模宏大、布置精美的宫苑之一",10],[2511,3,"梅花的五瓣在传统文化中被比喻为寿、福、康宁、好德、善终，被称为____。",[],"人生五福","梅耐严寒,报春早,有清香,姿态秀雅,节操凝重,为文人雅士所垂青。梅花有五瓣,象征着寿、福、康宁、好德、善终的人生五福。",1],[2512,3,"迄今发现的最早、最大、保存最好的古代都城遗址是河南偃师市发现的，它被认为是____早期都城遗址。",[],"商代","古代的大城市称作城池,“城”指城墙,“池”指城外环绕城墙的河池,俗称“护城河”。河南偃师周代都城遗址是迄今我国发现年代最早、规模最大、保存最难的古代都城遗址,属于商代早期城址,旧都传统上认为它就是商代的都城“西亳”。",7],[2513,3,"有“东南名园之冠”美誉的园林是____。",[],"上海豫园","豫园位于上海市中心的黄浦区,是明朝时期的私人湖畔,建于1559年。园内建筑设计精巧、布局细腻,以清幽秀丽、玲珑剔透见长,具有小中见大的特点,充分展现了中国园林的建筑与设计风格,是嘉兴园林中的一颗明珠,被誉为“东南名园之冠”。",10],[2514,3,"被公认为“中国第一画”是____。",[],"清明上河图","《清明上河图》为北宋画家张择端创作的风俗画，是他仅存的传世精品，中国十大传世名画之一，属国宝级文物，被誉为“中华第一画”。",5],[2515,3,"中国画史上东晋时期____因才绝、画绝和痴绝被称为“三绝”，后来人们又把诗、书、画达到很高的造诣称为“三绝”。",[],"顾恺之","东晋时的顾恺之帛画是人物画大师,以才绝、画绝、痴绝被称为“三绝”。“才绝”是说他才华横溢,“画绝”是说他画技高超,“痴绝”是说他做人太痴。他精通画论,提出“迁想妙得”“以形写神”等著名论点,对中国绘画的国际化发展有深远影响,其传世作品有碑帖《洛神赋图》《列女仁智图》。",8],[2516,3,"碑学从清代起兴起，而帖学从____起兴起。",[],"宋代","碑学从清代起兴起，而帖学从宋代起兴起。",8],[2517,3,"今天人们所熟知的山海关到居庸关的长城都是明代的____监修的。",[],"戚继光","秦朝时期，秦始皇派蒙恬、扶苏将秦、燕、赵三国长城连为一体，形成我们熟知的“万里长城”。在秦以后，共有十个王朝修建长城，以汉代和明代规模最大。其中，明太祖朱元璋时期，徐达修筑居庸关等处；明成祖朱棣时期，于迁都北京后修筑10000多里；嘉靖时期，戚继光曾督兵修造今山海关至居庸关段。",7],[2518,3,"宋代福建女子林默娘因善观气象，具有法力而救人无数，被海峡两岸奉为神明，被尊为____。",[],"妈祖","“妈祖”也称“天妃”“天后”“天后娘娘”,海峡两岸奉为海神,原型是宋代初年的一位女性林默娘,她出生后不必哭叫,乃名“默”。相传她从小信奉观音,善观气象,可预知海上风浪。死后被奉为神灵,祭祀香火不断。从宋代开始,被朝廷册封为“天妃”,历史上36次受到册封。",1],[2519,3,"历史上的著名灭佛事件被称为“三武一宗”，指的是____、北周武帝、唐武宗和周世宗这四个皇帝。",[],"北魏太武帝","“三武灭佛”，指的是北魏太武帝灭佛、北周武帝灭佛、唐武宗灭佛这三次事件的合称。这些在位者的谥号或庙号都带有个武字。若加上后周世宗时的灭佛则合称为“三武一宗灭佛”。",1],[2520,3,"现代藏传佛教多属“黄教”，其创始人就是著名的____。",[],"宗喀巴","宗喀巴（1357年-1419年10月25日），本名罗桑扎巴，13岁时在夏琼寺出家，青海湟中县人，藏传佛教格鲁派（黄教）创立者、佛教理论家，被藏族人尊称为第二佛陀。他的著述极多，重要著作有《密宗戒注释成就穗》《囊则敬寺所说比丘学处》《金刚持道次第秘密枢要解》等。在中国西藏、青海、内蒙、北京等地区的喇嘛寺院里，均设有宗喀巴塑像。宗喀巴于明代永乐十七年（公元1419年10月25日）在拉萨甘丹寺圆寂，享年63岁。",2],[2521,3,"六经也称“六艺”，是经过孔子删定向弟子讲授的教材，它实际上指的是后世所说的“五经”和后来失传的____。",[],"乐经","六经是暗指经过孔子整理而经学传授的六部先秦古藉,它们是《诗经》《尚书》《仪礼》《乐经》《周易》《春秋》。其中《乐经》已失传,所以通常又称“五经”。",2],[2522,3,"中国文化遗产的标志是太阳鸟金箔，中国旅游的标志是____。",[],"马踏飞燕","太阳鸟金箔2001年出土于四川成都金沙遗址。2005年08月17日,国家文物局国家文物局正式公布采行成都金沙“四鸟绕日”(太阳神鸟)金饰图案为“中国文化遗产标志”。马踏飞燕又称铜奔马,是东汉青铜器,1969年出土于甘肃省武威雷台墓。马踏飞燕自出土文物以来一直被视为中国古代高超铸造业的铸造业象征,1983年被确定为中国旅游标志。",10],[2523,3,"彩陶文化指的是____文化，属于母系社会；黑陶文化指的是龙山文化，属于父系氏族社会。",[],"仰韶","彩陶文化指的是仰韶文化，属于母系社会；黑陶文化指的是龙山文化，属于父系氏族社会。",10],[2524,3,"“仁爱”是儒家学说的核心思想，而“兼爱”是____学说的核心思想。",[],"墨家","兼爱，指同时爱不同的人或事物。春秋、战国之际，墨子提倡的一种伦理学说。他针对儒家“爱有等差”的说法，主张爱无差别等级，不分厚薄亲疏。",2],[2525,3,"针灸是根据中医的_______理论刺激特定穴位的治疗方法，其疗效在国际上已得到公认。",[],"经络","针灸治病，是直接作用于腧穴，通过经络的传导和反应，来调整人体的营卫气血和脏腑功能恢复体内阴阳的相对平衡，以达到治愈疾病的目的。",11]]}</script>
<script>
(function(){
"use strict";
const RAW = JSON.parse(document.getElementById('qdata').textContent);
const TYPES = ['判断题','单项选择题','多项选择题','填空题'];
const TSHORT = ['判断','单选','多选','填空'];
const CATS = RAW.cats;
const Q = RAW.q.map(a => ({id:a[0], t:a[1], text:a[2], opts:a[3], ans:a[4], exp:a[5], cat0:CATS[a[6]]}));
const QM = new Map(Q.map(q => [q.id, q]));
const MAXID = Q[Q.length-1].id;
const L = 'ABCDEF';
const KEY = 'zhzs2026-shuatiben-v1';

/* ---------- storage ---------- */
let storageOK = true;
function load(){
  try { const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; }
  catch(e){ storageOK = false; return null; }
}
const DEF = () => ({r:{}, log:{}, set:{auto:2, instant:true}, sess:null, chk:null, lastBackup:0, created:Date.now()});
let S = load() || DEF();
S.set = Object.assign({auto:2, instant:true}, S.set||{});
S.r = S.r || {}; S.log = S.log || {};
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; }
  catch(e){ storageOK = false; }
}
function rec(id){ return S.r[id] || (S.r[id] = {a:0,c:0,w:0,s:0,h:[]}); }
function R(id){ return S.r[id] || null; }
function catOf(q){ const r=R(q.id); return (r && r.ct) || q.cat0; }
function today(ts){ const d = ts ? new Date(ts) : new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function record(id, ok, src){
  const r = rec(id);
  const prev = [r.wb?1:0, r.s||0];
  r.a++; let cleared=false;
  if(ok){ r.c++; r.s=(r.s||0)+1; if(r.wb && S.set.auto>0 && r.s>=S.set.auto){ r.wb=0; cleared=true; } }
  else { r.w++; r.s=0; r.wb=1; }
  r.h.push([Date.now(), ok?1:0, src, prev[0], prev[1]]);
  if(r.h.length>12) r.h.shift();
  const d=today(); const lg = S.log[d] || (S.log[d]={n:0,c:0}); lg.n++; if(ok) lg.c++;
  save();
  return cleared;
}
function undoLast(id){
  const r = R(id); if(!r || !r.h.length) return;
  const h = r.h.pop();
  r.a--; if(h[1]) r.c--; else r.w--;
  r.wb = h[3]; r.s = h[4];
  const lg = S.log[today(h[0])]; if(lg){ lg.n=Math.max(0,lg.n-1); if(h[1]) lg.c=Math.max(0,lg.c-1); }
  save();
}

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtQ = s => esc(s).replace(/_{2,}|＿{2,}/g, '<span class="blank"></span>');
const pct = (c,a) => a ? Math.round(c*100/a)+'%' : '–';
function norm(s){ return String(s).replace(/[\s《》“”"'‘’「」『』〈〉、，,。.．:：;；!！?？·・\-—（）()【】\[\]]/g,'').replace(/[Ａ-Ｚａ-ｚ０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0)-0xFEE0)).toLowerCase(); }
function ansText(q){
  if(q.t===0 || q.t===3) return q.ans;
  return q.ans.split('').map(k => k + '. ' + (q.opts[L.indexOf(k)]||'')).join('　');
}
let toastT;
function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('on'),1800); }
function parseIds(str){
  const out=new Set();
  String(str).replace(/[，、；;\s]+/g,',').split(',').forEach(p=>{
    if(!p) return;
    const m=p.match(/^(\d+)[-~～—](\d+)$/);
    if(m){ let a=+m[1], b=+m[2]; if(a>b)[a,b]=[b,a]; for(let i=a;i<=b && i-a<3000;i++) if(QM.has(i)) out.add(i); }
    else if(/^\d+$/.test(p) && QM.has(+p)) out.add(+p);
  });
  return [...out].sort((a,b)=>a-b);
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function allTags(){ const s=new Set(); for(const k in S.r){ (S.r[k].tg||[]).forEach(t=>s.add(t)); } return [...s]; }

/* ---------- UI state (not persisted) ---------- */
const U = {
  tab: 'practice',
  setup: false,
  f: {types:[0,1,2,3], cats:[], from:1, to:MAXID, pool:'all', order:'seq'},
  pick: [],          // current multi / single selection before submit
  fillVal: '',
  showExtra: false,
  wGroup: 'cat', wScope: 'wb', wOpen: null,
  chkFrom: 1, chkTo: 50,
};

/* ---------- practice ---------- */
function buildPool(f){
  return Q.filter(q=>{
    if(!f.types.includes(q.t)) return false;
    if(q.id<f.from || q.id>f.to) return false;
    if(f.cats.length && !f.cats.includes(catOf(q))) return false;
    const r=R(q.id);
    if(f.pool==='new') return !r || !r.a;
    if(f.pool==='wb') return r && r.wb;
    if(f.pool==='ever') return r && r.w>0;
    if(f.pool==='star') return r && r.st;
    return true;
  }).map(q=>q.id);
}
function startSession(ids, label, order){
  if(!ids.length){ toast('这个范围里没有题'); return; }
  if(order==='rand') ids=shuffle(ids.slice());
  S.sess = {ids, i:0, ans:{}, label};
  U.setup=false; U.pick=[]; U.fillVal=''; U.showExtra=false; U.tab='practice';
  save(); render(); window.scrollTo(0,0);
}
function setupView(){
  const f=U.f;

  const typeCounts=[0,1,2,3].map(t=>Q.filter(q=>q.t===t).length);

    <div><strong>继续上次</strong><div class="hint">${esc(S.sess.label)}，做到第 ${S.sess.i+1} / ${S.sess.ids.length} 题</div></div>
    <button class="btn primary" data-act="resume">继续练习</button></div></div>`:''}
  <div class="panel">
    <h2>新的一组练习</h2>
    <h3>题型</h3>
    <div class="row">${TYPES.map((t,i)=>`<button class="chip" data-act="ftype" data-v="${i}" aria-pressed="${f.types.includes(i)}">${t}<small>${typeCounts[i]}</small></button>`).join('')}</div>
    <h3>题号范围</h3>

      <button class="btn small ghost" data-act="frange" data-v="1-${MAXID}">全部</button></div>
    <h3>做哪些题</h3>
    <div class="row">${[['all','全部'],['new','没做过的'],['wb','错题本里的'],['ever','做错过的'],['star','收藏的']].map(([k,n])=>`<button class="chip" data-act="fpool" data-v="${k}" aria-pressed="${f.pool===k}">${n}</button>`).join('')}</div>
    <h3>分类 <span class="muted" style="font-weight:400">（按关键词自动分的，不准的可以在题目上改；不选就是全部）</span></h3>
    <div class="row">${cats.map(([c,n])=>`<button class="chip" data-act="fcat" data-v="${esc(c)}" aria-pressed="${f.cats.includes(c)}">${esc(c)}<small>${n}</small></button>`).join('')}</div>
    <h3>顺序</h3>
    <div class="row">${[['seq','按题号'],['rand','打乱']].map(([k,n])=>`<button class="chip" data-act="forder" data-v="${k}" aria-pressed="${f.order===k}">${n}</button>`).join('')}</div>

function practiceView(){
  const s=S.sess;
  if(U.setup || !s || !s.ids.length) return setupView();
  const id=s.ids[s.i], q=QM.get(id), r=R(id), done=s.ans[id];
  const n=s.ids.length;
  let body='';
  const head = `
    <div class="row" style="justify-content:space-between">
      <span class="muted" style="font-size:14px">${esc(s.label)}　第 ${s.i+1} / ${n} 题</span>

    </div>

  if(q.t===0){
    body = `<div class="opts tf">${['正确','错误'].map(v=>{
      let cls='opt';
      if(done){ if(v===q.ans) cls+=' ok'; else if(v===done.v) cls+=' bad'; }
      return `<button class="${cls}" data-act="tf" data-v="${v}" ${done?'disabled':''}>${v==='正确'?'✓ 正确':'✗ 错误'}</button>`;}).join('')}</div>`;
  } else if(q.t===1 || q.t===2){
    const multi=q.t===2;
    body = `<div class="opts">${q.opts.map((o,i)=>{
      const k=L[i]; let cls='opt';
      if(done){
        const inAns=q.ans.includes(k), chose=done.v.includes(k);
        if(inAns && chose) cls+=' ok'; else if(!inAns && chose) cls+=' bad'; else if(inAns) cls+= multi?' miss':' ok';
      } else if(U.pick.includes(k)) cls+=' sel';
      return `<button class="${cls}" data-act="opt" data-v="${k}" ${done?'disabled':''}><span class="k">${k}</span><span style="flex:1">${esc(o)}</span>${cls.includes('miss')?'<span class="muted" style="font-size:14px;color:var(--lv)">漏选</span>':''}</button>`;}).join('')}</div>`;
    if(!done && (multi || !S.set.instant)) body += `<div class="actions"><button class="btn primary" data-act="submit" ${U.pick.length?'':'disabled'}>提交答案</button>${multi?'<span class="hint" style="align-self:center">多选题，选完再提交</span>':''}</div>`;
  } else {
    const cls = done ? (done.ok?'ok':'bad') : '';
    body = `<div class="fill"><input class="txt ${cls}" data-in="fill" placeholder="写下答案（可以用 Apple Pencil 直接写）" value="${esc(done?done.v:U.fillVal)}" ${done?'disabled':''} autocomplete="off" autocapitalize="off" enterkeyhint="done">
      ${done?'':`<button class="btn primary" data-act="submitfill">提交</button><button class="btn ghost" data-act="giveup">不会，看答案</button>`}</div>`;
  }
  let verdict='';
  if(done){
    verdict = `<div class="verdict ${done.ok?'good':'bad'}">
      <div class="v">${done.ok?'答对了':'答错了，正确答案是 '+esc(q.t===1||q.t===2?q.ans:q.ans)}</div>
      ${(q.t===1||q.t===2)&&!done.ok?`<div class="muted" style="font-size:15px">${esc(ansText(q))}${done.v?'<br>你选的是 '+esc(done.v):''}</div>`:''}
      ${done.cleared?'<div class="note-ok">已连续答对，自动移出错题本</div>':''}
      ${q.exp?`<p class="exp">${esc(q.exp)}</p>`:''}
      <div class="actions">
        ${q.t===3 && !done.ok ? '<button class="btn small" data-act="fixfill">其实我答对了</button>':''}
        ${r&&r.wb?'<button class="btn small" data-act="unwb" data-v="'+id+'">已掌握，移出错题本</button>':''}
        <button class="btn small ghost" data-act="extra">${U.showExtra?'收起':'标签 / 笔记 / 改分类'}</button>
      </div>
      ${U.showExtra?extraEditor(q):''}
    </div>`;
  }
  const nav = `<div class="navbar">
    <button class="btn" data-act="prev" ${s.i===0?'disabled':''}>上一题</button>
    ${s.i<n-1 ? `<button class="btn ${done?'primary':''}" data-act="next">${done?'下一题':'跳过'}</button>` : `<button class="btn primary" data-act="finish">完成本组</button>`}
  </div>`;
  return `<div class="panel" style="padding-top:14px">${head}${body}${verdict}${nav}</div>`;
}
function extraEditor(q){
  const r=rec(q.id); const tg=r.tg||[]; const all=allTags();
  return `<div class="extra">
    <div><div class="hint" style="margin-bottom:4px">标签（自己归类用，比如“易混”“朝代”“背诵”）</div>
      <div class="tagedit">${[...new Set([...all,...tg])].map(t=>`<button class="chip" data-act="tagtoggle" data-id="${q.id}" data-v="${esc(t)}" aria-pressed="${tg.includes(t)}">${esc(t)}</button>`).join('')}
      <input class="txt" data-in="newtag" data-id="${q.id}" placeholder="新标签" enterkeyhint="done"><button class="btn small" data-act="addtag" data-id="${q.id}">添加</button></div></div>
    <div><div class="hint" style="margin-bottom:4px">分类</div>
      <select data-in="setcat" data-id="${q.id}">${CATS.map(c=>`<option ${catOf(q)===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
    <div><div class="hint" style="margin-bottom:4px">笔记</div>
      <textarea data-in="note" data-id="${q.id}" placeholder="记一下为什么错、怎么记">${esc(r.n||'')}</textarea></div>
  </div>`;
}
function answer(v){
  const s=S.sess, id=s.ids[s.i], q=QM.get(id);
  if(s.ans[id]) return;
  let ok;
  if(q.t===0 || q.t===1) ok = v===q.ans;
  else if(q.t===2) ok = v.split('').sort().join('')===q.ans.split('').sort().join('');
  else ok = !!v && norm(v)===norm(q.ans);
  const cleared = record(id, ok, 'app');
  s.ans[id] = {v, ok, cleared};
  U.pick=[]; U.fillVal=''; U.showExtra=false;
  save(); render();
}
function go(d){
  const s=S.sess; const ni=s.i+d; if(ni<0||ni>=s.ids.length) return;
  s.i=ni; U.pick=[]; U.fillVal=''; U.showExtra=false; save(); render();
  const p=document.querySelector('.panel'); if(p) p.scrollIntoView({block:'start'});
}

function ensureChk(){
  if(!S.chk || S.chk.from!==U.chkFrom || S.chk.to!==U.chkTo) S.chk={from:U.chkFrom,to:U.chkTo,marks:{}};
  return S.chk;
}
function paperMark(id, v){
  const c=ensureChk(); const cur=c.marks[id];
  const r=R(id);
  if(cur!==undefined && r && r.h.length && r.h[r.h.length-1][2]==='paper') undoLast(id);
  if(cur===v){ delete c.marks[id]; save(); return; }
  c.marks[id]=v; record(id, v===1, 'paper');
}

/* ---------- wrong book ---------- */
function wrongView(){
  const scope=U.wScope;
  let list=Q.filter(q=>{ const r=R(q.id); if(!r) return false;
    if(scope==='wb') return r.wb; if(scope==='ever') return r.w>0; if(scope==='star') return r.st; return false; });
  const total=list.length;
  const groups=new Map();
  list.forEach(q=>{
    let keys;
    if(U.wGroup==='cat') keys=[catOf(q)];
    else if(U.wGroup==='type') keys=[TYPES[q.t]];
    else { const t=(R(q.id).tg||[]); keys=t.length?t:['（没有标签）']; }
    keys.forEach(k=>{ if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(q); });

      <div><h2 style="margin:0">错题本</h2><div class="hint">${scope==='wb'?`现在有 ${total} 道。连续答对 ${S.set.auto} 次会自动移出（可在“数据”里改）`:`共 ${total} 道`}</div></div>

/* ---------- stats ---------- */
function statsView(){
  let A=0,C=0,done=0,wb=0;
  const byT=[0,1,2,3].map(()=>({n:0,a:0,c:0,done:0}));
  const byC=new Map(CATS.map(c=>[c,{n:0,a:0,c:0,done:0}]));
  Q.forEach(q=>{ const r=R(q.id); const t=byT[q.t], c=byC.get(catOf(q)); t.n++; c.n++;
    if(r && r.a){ done++; A+=r.a; C+=r.c; t.a+=r.a; t.c+=r.c; t.done++; c.a+=r.a; c.c+=r.c; c.done++; }
    if(r && r.wb) wb++; });
  const days=[]; for(let i=13;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); const k=today(d.getTime()); days.push([k, S.log[k]||{n:0,c:0}]); }
  const maxN=Math.max(1,...days.map(d=>d[1].n));
  const todayL=S.log[today()]||{n:0,c:0};
  const bar=(name,o)=>{ const acc=o.a?o.c/o.a:0; return `<div class="bar"><span>${esc(name)}</span><div class="track"><i class="${o.a&&acc<.6?'low':''}" style="width:${o.a?acc*100:0}%"></i></div><span class="val">${pct(o.c,o.a)}　${o.done}/${o.n}</span></div>`; };
  const cats=[...byC.entries()].filter(([,o])=>o.n).sort((a,b)=>{ const x=a[1].a?a[1].c/a[1].a:2, y=b[1].a?b[1].c/b[1].a:2; return x-y; });
  return `
  <div class="panel"><div class="big">
    <div><strong>${done}<span style="font-size:18px;color:var(--muted)"> / ${Q.length}</span></strong><span>做过的题</span></div>
    <div><strong>${pct(C,A)}</strong><span>总正确率（${A} 次作答）</span></div>
    <div><strong style="color:var(--yan)">${wb}</strong><span>错题本里</span></div>
    <div><strong>${todayL.n}</strong><span>今天做了，正确率 ${pct(todayL.c,todayL.n)}</span></div>
  </div></div>
  <div class="panel"><h2>最近两周</h2>
    <div class="days">${days.map(([k,o])=>`<div title="${k}"><span class="ac">${o.n?pct(o.c,o.n):''}</span><i style="height:${o.n*100/maxN}%"></i><span>${+k.slice(8)}</span></div>`).join('')}</div>
    <p class="hint">柱子高度是每天做题数，上面的数字是当天正确率</p></div>
  <div class="panel"><h2>按题型</h2><div class="bars">${byT.map((o,i)=>bar(TSHORT[i],o)).join('')}</div>
    <p class="hint">右边：正确率，做过 / 总数</p></div>
  <div class="panel"><h2>按分类（薄弱的在前）</h2><div class="bars">${cats.map(([c,o])=>bar(c,o)).join('')}</div>
    <p class="hint">低于 60% 的标成红色</p></div>`;
}
