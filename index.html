致",7],[991,1,"三十六计是指中国古代三十六个兵法策略。下列选项中，不属于“三十六计”的是____。",["瞒天过海","围魏救赵","纸上谈兵","声东击西"],"C","“纸上谈兵” 是成语，源自战国时期赵括只懂兵法理论、不会实战的故事，并非 “三十六计” 中的策略。",8],[992,1,"北宋的苏轼是中国古代文化艺术集大成者。下列作品中，作者是苏轼的有____。",["《念奴娇・赤壁怀古》","《蜀道难》","《春望》","《登高》"],"A","《念奴娇・赤壁怀古》是苏轼的代表作之一，属于豪放派词的经典，词中 “大江东去，浪淘尽，千古风流人物” 广为流传。",0],[993,1,"我国素以“礼仪之邦”著称，我国古代有“五礼”之说，下列选项中，不属于“五礼”的有____。",["嘉礼","吉礼","宾礼","冠礼"],"D","“五礼”包括吉礼、凶礼、军礼、宾礼、嘉礼。",4],[994,1,"下列关于《论语》的说法，错误的是____。",["《论语》约成书于春秋战国时期，由孔子弟子及再传弟子编写而成","儒家学派的经典著作之一，主要记录孔子及其弟子的言行","全书共20篇，以语录体和对话体为主","书中提出了“仁政”学说"],"D","D项仁政学说是孟子提出的。",2],[995,1,"下列人物中，“文章四友”不包括以下哪个选项？",["杨炯","李峤","杜审言","崔融"],"A","“文章四友”是李峤、杜审言、崔融、苏味道，因此排除A选项。",0],[996,1,"下列哪些事物在古诗中未被用作表现春天的意象？",["荷花","燕子","小草","杏花"],"A","A项荷花表现夏天的意象。",0],[997,1,"正所谓“故不积跬步，无以至千里”，下面选项中没有讲述这个道理的是____。",["绳锯木断，水滴石穿","尺有所短，寸有所长","冰冻三尺，非一日之寒","不积小流，无以成江海"],"B","B项“尺有所短，寸有所长”比喻各有长处，也各有短处，彼此都有可取之处。",7],[998,1,"下列哪些作品不是张衡的著作？",["《西京赋》","《归田赋》","《东京赋》","《过秦论》"],"D","D《过秦论》是贾谊政论文的代表作，分上中下三篇。全文从各个方面分析秦王朝的过失，故名为《过秦论》。",0],[999,1,"下面不属于藏戏传统剧目的是____。",["《文成公主》","《诺桑王子》","《牡丹亭》","《朗萨雯蚌》"],"C","《牡丹亭》是明代汤显祖的昆曲剧目，讲述杜丽娘与柳梦梅的爱情故事，属于汉族戏曲，不属于藏戏传统剧目。",9],[1000,1,"白居易《大林寺桃花》中将春天的短暂美好通过桃花在山上山下的不同开放时间表现了出来，下列诗词中描写桃花的有____。",["“墙角数枝梅，凌寒独自开”","“人间四月芳菲尽，山寺桃花始盛开”","“接天莲叶无穷碧，映日荷花别样红”","“停车坐爱枫林晚，霜叶红于二月花”"],"B","“人间四月芳菲尽，山寺桃花始盛开” 出自白居易《大林寺桃花》，直接描写了山寺中桃花在四月开放的景象，是描写桃花的诗词。",0],[1001,1,"中医博大精深，历史悠久，才人辈出。下列不属于中医学方面杰出人物的有____。",["张仲景","宋应星","孙思邈","董奉"],"B","宋应星是明朝著名科学家，他的著作和研究领域涉及自然科学及人文科学的不同学科，而其中最杰出的作品《天工开物》被誉为“中国17世纪的工艺百科全书”。",11],[1002,1,"下列风景中不属于“洛阳八景”的有____。",["天津晓月","太液秋风","铜驼暮雨","洛浦秋风"],"B","洛阳八大景：一、龙门山色 二、马寺钟声 三、金谷春晴 四、邙山晚眺 五、天津晓月 六、洛浦秋风 七、平泉朝游 八、铜驼暮雨",10],[1003,1,"宋明时期兴盛不衰的理学，又被称为____。",["汉学","朴学","新儒学","玄学"],"C","宋明理学是在儒家思想基础上，融合道家、佛教思想形成的新儒学体系，以 “理” 为核心概念，探讨宇宙、人性、道德等问题，因此又被称为 “新儒学”。",2],[1004,1,"衡山美景很多，最著名的是“衡山四绝”。下列哪些美景不属于“衡山四绝”?",["藏经殿之秀","水帘洞之奇","温泉水之清","祝融峰之高"],"C","衡山四绝是指方广寺之深、水帘洞之奇、藏经殿之秀、祝融峰之高。",7],[1005,1,"《陌上桑》中不是侧面描写罗敷美貌的句子是哪个选项？",["行者见罗敷，下担捋髭须","少年见罗敷，脱帽著悄头","秦氏有好女，自名为罗敷","耕者忘其犁，锄者忘其锄"],"C","C项是正面描写。",0],[1006,1,"苏轼与____合称“三苏”。",["苏洵、苏辙","苏舜钦、苏洵","苏辙、苏舜钦","苏洵、苏武"],"A","三苏是指其中的苏洵、苏轼、苏辙这三人。在唐宋时期，三苏是唐宋八大家当中的三位，其中苏洵是苏轼和苏辙的父亲，苏轼是苏辙的哥哥。",0],[1007,1,"成语“刮目相看”的故事中涉及下列哪个人物?",["吕蒙","刘备","张飞","周瑜"],"A","主要涉及吕蒙与鲁肃。",0],[1008,1,"下列作品中属周部族史诗的，除了以下哪个选项？",["《生民》","《公刘》","《绵》","《伐檀》"],"D","《诗经·大雅》中《生民》、《公刘》、《绵》、《皇矣》和《大明》这五首构成了周部族史诗,这五首史诗记录了周部族发展史的几次重要的部族大事,再现了周部族发展史,具有非凡的艺术魅力",0],[1009,1,"明代中晚期市民⽂学的理论表现是____。",["文以载道","童心说","性灵说","格调说"],"B","“文以载道” 是宋代古文运动的核心理论（如韩愈、柳宗元倡导，宋代欧阳修等继承），强调文学的道德教化功能，A 项排除；“童心说” 由明代李贽提出，主张文学应表现 “童心”（未受世俗污染的纯真本性），契合中晚期市民阶层追求个性解放的需求，是市民文学的重要理论表现，B 项正确；“性灵说” 是清代袁枚等倡导的诗歌理论，强调抒发个人真情实感，C 项排除；“格调说” 是清代沈德潜提出的，主张诗歌应讲究格律、格调，尊崇儒家诗教，D 项排除。",0],[1010,1,"先秦诸子百家中，被称为“显学”的是儒家和____。",["墨家","法家","道家","纵横家"],"A","儒家是先秦诸子百家中较大的一支学派,与墨家并称“显学”。",2],[1011,1,"下列人物属春秋时代的是____。",["孔子","孟子","荀子","韩非子"],"A","孔子（前 551 - 前 479 年）生活于春秋末期，是儒家学派创始人",2],[1012,1,"下列人物不属于战国时代的是____。",["老子","庄子","韩非","荀子"],"A","老子属于春秋时代人物。",2],[1013,1,"下列人物属儒家学派的是____。",["庄子","墨子","孟子","韩非子"],"C","庄子属道家，墨子属墨家，韩非子属法家，A、B、D 项排除；孟子是战国时期儒家 “亚圣”，继承孔子 “仁” 的思想，提出 “仁政”“性善论”，属儒家学派，C 项正确。",2],[1014,1,"荀子是____。",["春秋时期儒家代表，主张 “性善论”","战国时期儒家代表，主张 “性恶论”","战国时期道家代表，主张 “无为而治”","战国时期法家代表，主张 “法治”"],"B","荀子生活于战国末期，属儒家学派（非道家、法家），A、C、D 项排除；他与孟子 “性善论” 不同，主张 “性恶论”，认为人的本性需通过后天教化（“礼法并施”）约束，是战国儒家重要代表，B 项正确。",2],[1015,1,"“春秋三传”不包括____。",["《春秋》","《春秋左氏传》","《春秋公羊传》","《春秋榖梁传》"],"A","古代“传”的意思是解读别的书的书籍。春秋三传就是解读《春秋》的书，包括《春秋左氏传》《春秋公羊传》《春秋榖梁传》。",2],[1016,1,"以下著作属于国别史的是____。",["《左传》","《国语》","《史记》","《资治通鉴》"],"B","国别史以国家为单位记载历史，《国语》分记周、鲁、齐、晋、郑、楚、吴、越八国史事，是中国最早的国别体史书，B 项正确；《左传》是编年体（按时间顺序记载），《史记》是纪传体（以人物为中心），《资治通鉴》是编年体通史，A、C、D 项排除。",2],[1017,1,"以下著作属于编年史的是____。",["《国语》","《战国策》","《左传》","《史记》"],"C","编年史以时间为线索编排历史事件。《左传》按鲁君年号（如隐公元年、桓公二年）记载春秋史事，属编年体，C 项正确；《国语》《战国策》是国别体，《史记》是纪传体，A、B、D 项排除。",2],[1018,1,"屈原的政治主张不包括____。",["举贤授能","修明法度","联齐抗秦","兼爱与非攻"],"D","“兼爱”与“非攻”是墨家学派创始人墨子的主要思想观点。",0],[1019,1,"“汉赋四大家”不包含____。",["枚乘","司马相如","扬雄","班固"],"A","汉赋四大家包括：司马相如、扬雄、班固、张衡。",0],[1020,1,"下列关于《九歌》的描述正确的有____。",["是屈原创作的单篇叙事诗，描写楚国历史","是屈原整理的楚地祭神组诗，共11篇","是宋玉创作的悲秋组诗，共9篇","是汉代乐府民歌，反映民间生活"],"B","《九歌》非单篇、非叙事诗，也不侧重楚国历史，A 项排除；它是屈原根据楚地民间祭神乐歌整理加工而成的组诗，共 11 篇（含《东皇太一》《国殇》等），B 项正确；《九辩》是宋玉的悲秋组诗（9 篇），C 项排除；《九歌》是先秦楚辞，非汉代乐府，D 项排除。",0],[1021,1,"以下作品属于抒情小赋的是____。",["《吊屈原赋》","《两都赋》","《子虚赋》","《鹦鹉赋》"],"D","赋按体裁形式可分为骚体赋、散体大赋和抒情小赋三种。《吊屈原赋》属于骚体赋体裁，《两都赋》属于大体体裁。《子虚赋》为典型的汉大赋。",0],[1022,1,"下列关于《史记》的描述正确的有____。",["是我国第一部编年体通史，作者司马迁","是我国第一部纪传体通史，记载了从黄帝到汉武帝的历史","是我国第一部国别体史书，作者班固","是我国第一部纪传体断代史，记载了西汉历史"],"B","《史记》作者是司马迁，非班固；是纪传体通史（以人物传记为中心，贯通古今），非编年体（A 错）、国别体（C 错）、断代史（D 错，断代史是《汉书》）；其记载范围从黄帝到汉武帝太初年间，B 项正确。",1],[1023,1,"《史记》共分五部分，其中不包括____。",["十二本纪","八志","十表","三十世家"],"B","《史记》是中国的一部纪传体通史，被人们称为信史，由西汉武帝时期的司马迁花了13年的时间所写成的。全书共一百三十卷，约五十二万六千五百字，有十表、八书、十二本纪、三十世家、七十列传。",1],[1024,1,"贾谊的作品不包括____。",["《新书》","《论贵粟疏》","《治安策》","《论积贮疏》"],"B","《论贵粟疏》是汉代大臣晁错的文章，出自《汉书·食货志》，是当时给汉文帝的奏疏。文章全面论述了“贵粟”（重视粮食）的重要性，提出重农抑商、入粟于官、拜爵除罪等一系列主张。",0],[1025,1,"顾况诗歌的特点不包括____。",["受民歌影响","通俗明快","有怪奇风格","高雅闲淡"],"D","顾况诗歌的特点包括受民歌影响、通俗明快、有怪奇风格。",0],[1026,1,"柳宗元的诗歌主要包括____。",["山水田园诗与贬谪抒怀诗","边塞征战诗与咏史怀古诗","宫廷应制诗与咏物诗","闺怨诗与送别诗"],"A","柳宗元的诗作大部分作于贬官的永州、柳州时期。他诗作的重要内容就是抒写被贬谪的抑郁悲伤和思乡之情。柳宗元在贬谪期间也写过一些山水田园诗，并且试图以清静幽寂的自然境界来净化心灵，从而消除现实郁闷。",0],[1027,1,"《孔雀东南飞》的男女主人公是____。",["梁山伯与祝英台","牛郎与织女","焦仲卿与刘兰芝","许仙与白娘子"],"C","《孔雀东南飞》的男主是焦仲卿,女主是刘兰芝。",10],[1028,1,"下列东汉乐府诗歌属乐府民歌中的爱情题材不包括____。",["《艳歌行》","《上邪》","《有所思》","《江南》"],"A","《艳歌行》是汉代乐府古辞，属《相和歌辞·瑟调曲》。此诗写游子思乡。一个普通的家庭“兄弟两三人”为了生计，流浪他乡。因女主人为他们缝补衣裳而被归来的女主人丈夫发现而产生了误会。",9],[1029,1,"字写得是否漂亮，与毛笔的质量有直接的关系，毛笔的质量不包括____。",["尖","齐","圆","粗"],"D","判断毛笔的质量主要在以下几个方面：笔有“四德”，即“尖、齐、圆、健”。",8],[1030,1,"下列作品属曹植的有____。",["《赠白马王彪》","《蒿里行》","《桃花源记》","《山居秋暝》"],"A","《赠白马王彪》是曹植的重要诗作，写于其兄曹丕称帝后，因与白马王曹彪分别而作，诗中充满了对兄弟离散、政治压抑的悲愤，情感真挚深沉。B 项《蒿里行》是曹操的作品；C 项《桃花源记》是陶渊明的散文；D 项《山居秋暝》是王维的山水诗，故排除。",0],[1031,1,"下列作家属\"元嘉三大家”的有____。",["陶渊明","谢灵运","李白","杜甫"],"B","“元嘉三大家” 是指南朝宋文帝元嘉年间的三位著名诗人，分别是谢灵运、颜延之、鲍照。",0],[1032,1,"“北地三才”指的是____。",["曹操、曹丕、曹植","苏洵、苏轼、苏辙","温子升、邢劭、魏收","袁宗道、袁宏道、袁中道"],"C","北地三才，指在北朝文人中能自觉学习南朝文化，对南北文学的合流起到推动作用的作家温子昇、邢邵、魏收的并称。",0],[1033,1,"庾信的代表作是____。",["《哀江南赋》","《两京赋》","《三都赋》","《赤壁赋》"],"A","庾信的辞赋与徐陵一起被称为“徐庾体”,代表作品有《怨歌行》、《杨柳歌》、《寄王琳》、《哀江南赋》等。",0],[1034,1,"骈文的主要特征不包括____。",["对偶","夸饰","用典","声律"],"B","骈文的特点主要有：讲究声律的调谐、用字的绮丽、辞汇的对偶和用典。",14],[1035,1,"韩愈散文包括多种文体，其中不包括____。",["杂文","赠序文","稗志","话本"],"D","韩愈散文包括多种文体，其中有杂文、赠序文、稗志和传记。",0],[1036,1,"下列说法错误的是____。",["《世说新语》记述了汉末至东晋的士族阶层的遗闻轶事，特别是士族人物的清谈","《世说新语》是中国魏晋南北朝时期“笔记小说”的代表作","《世说新语》的作者是干宝","《世说新语》是一部志人小说"],"C","C选项《世说新语》的作者是刘义庆。",0],[1037,1,"下列句中名词作状语的不包括____。",["秦惠王车裂商君以徇","既东封郑","齐桓公合诸侯而国异姓","其一犬坐于前"],"C","A选项，车裂是名词做状语，用车裂的刑罚。B选项，方位名词“东”作动词“封”的状语，表处所：在东边。D选项，犬是名词做状语，像狗一样。",1],[1038,1,"下列作品不属于岑参的有____。",["《白雪歌送武判官归京》","《走马川行奉送出师西征》","《燕歌行》（汉家烟尘）","《逢人京使》"],"C","《燕歌行》（汉家烟尘）为高适作品。",0],[1039,1,"下列不属于李白的作品有____。",["《蜀道难》","《登高》","《行路难》（金樽清酒斗十千）","《将进酒君不见）"],"B","《登高》是唐代诗人杜甫的诗作。故排除B选项。",0],[1040,1,"下列不属于杜甫的作品有____。",["《自京赴奉先县咏怀五百字》","“三吏”、“三别”","《梦游天姥吟留别》","《茅屋为秋风所破歌》"],"C","《梦游天姥吟留别》是唐代诗人李白的诗作。故排除C选项。",0],[1041,1,"明清之际对君主专制展开猛烈批判的启蒙思潮代表⼈物有____。",["王阳明","黄宗羲","朱熹","董仲舒"],"B","黄宗羲是明清之际启蒙思想家，在《明夷待访录》中猛烈批判君主专制，提出 “天下为主，君为客” 的主张，是该思潮的代表人物。",2],[1042,1,"下列作家不属于中唐的有____。",["李商隐","刘禹锡","韩愈","元稹"],"A","李商隐为唐末的著名诗人，并非中唐时期。",0],[1043,1,"下列不属于“元白诗派“的有____。",["元稹","白居易","姚合","王建"],"C","元白诗派：重写实，尚通俗，主要代表人物是白居易、元稹、王建、张籍等。",0],[1044,1,"白居易把自己的诗歌分为四类，其中不包括____。",["讽喻诗","乐府诗","感伤诗","闲适诗"],"B","白居易曾把自己的诗分为四类：讽喻诗、闲适诗、感伤诗、杂律诗。",0],[1045,1,"“韩孟诗派“的代表人物有____。",["孟郊","白居易","元稹","刘禹锡"],"A","“韩孟诗派”是中唐的一个诗歌创作流派,以韩愈为领袖,代表人物还有孟郊、李贺、卢仝、马异、刘叉等人。",0],[1046,1,"下列作品不属于韩愈的有____。",["《师说》","《送孟东野序》","《小石潭记》","《杂说》"],"C","《小石潭记》是唐朝诗人柳宗元的作品。",0],[1047,1,"下列诗歌中属于李商隐作品的是____。",["《登高》","《无题・相见时难别亦难》","《琵琶行》","《静夜思》"],"B","B 项《无题・相见时难别亦难》是李商隐的经典 “无题诗”，以隐晦的语言抒发爱情与仕途的失意，是晚唐无题诗的代表",0],[1048,1,"晚唐继承新乐府写实批判精神的诗人有____。",["杜牧","李商隐","皮日休","温庭筠"],"C","除了皮日休,继承元、白新乐府写实批判精神的晚唐诗人,还有聂夷中(837--884)、杜荀鹤(846--907)、罗隐(833--909)等,他们忧时忧民,用诗歌揭露尖锐的社会矛盾,语言质朴浅近。",0],[1049,1,"宋初诗坛流行的诗歌流派不包括____。",["白体","西昆体","晚唐体","馆阁体"],"D","宋初诗派林立,但主要有白体、西昆体、晚唐体三派。",1],[1050,1,"下列作家不属于北宋初期的有____。",["柳开","王禹僵","杨亿","白居易"],"D","白居易是唐代伟大的现实主义诗人，故排除D选项。",0],[1051,1,"江西诗派“一祖三宗”中的“三宗”不包括____。",["陈与义","黄庭坚","杜甫","陈师道"],"C","江西诗派有“一祖三宗”之说,其中“一祖”是指杜甫,而“三宗”是指黄庭坚、陈师道、陈与义三人。江西诗派强调的特点是“点石成金”和“夺胎换骨”。",0],[1052,1,"黄庭坚著名的文论观点有____。",["“点铁成金”","“文章合为时而著”","“惟陈言之务去”","“诗中有画”"],"A","A 项 “点铁成金” 是黄庭坚的核心文论观点，意为借用古人的诗意、典故，经过改造创新，使作品 “化腐朽为神奇”，是江西诗派的重要创作原则；B 项是白居易的主张；C 项是韩愈的主张；D 项是苏轼对王维的评价，故答案为 A。",0],[1053,1,"下列关于苏轼的描述错误的是____。",["宋代文学发展到巅峰时期的伟大代表作家","宋代古文家里最重视“文”的一位","苏轼是婉约派的代表词人","对宋诗能别开生面起关键作用的作家"],"C","苏轼代表的是豪放派。",0],[1054,1,"下列作家中，属于南宋“中兴四大诗人”的有____。",["苏轼","陆游","黄庭坚","柳永"],"B","南宋“中兴四大诗人”包括尤袤、杨万里、范成大、陆游。",0],[1055,1,"下列著作属于陆游的有____。",["《漱玉词》","《剑南诗稿》","《容斋随笔》","《稼轩长短句》"],"B","B 项《剑南诗稿》是陆游的诗集，收录其诗歌九千余首，内容涵盖家国情怀、田园生活等，是陆游诗歌成就的集中体现。",0],[1056,1,"下列作家属于辛派词人的有____。",["李清照","姜夔","刘过","柳永"],"C","辛派词人指的是南渡前后词风与辛弃疾相似或相近的作家。既包括早于辛弃疾的南渡初期作家张元干、颖孝祥等，也包括和辛弃疾同时或后于辛弃疾在作词方面追步辛弃疾的作家陈亮、刘过等人。",0],[1057,1,"下列关于吴文英的描述错误的是____。",["《梦窗词》的作者","在南宋词坛与辛弃疾、姜夔鼎足而三的作家","在讲究字面漂亮和章法绵密方面，是周邦彦的继承者","是姜夔的羽翼"],"D","D项史达祖可称姜夔的羽翼。",0],[1058,1,"楚⽂化的特点有____。",["以儒家思想为核心，强调礼乐秩序","浪漫奔放，重视巫鬼文化与自然崇拜","以农耕为唯一经济基础，排斥商业","艺术风格质朴厚重，与中原文化完全一致"],"B","楚文化具有浪漫奔放的特质，如屈原《楚辞》中的奇幻想象，且重视巫鬼祭祀（如《九歌》是祭祀乐歌）、自然崇拜（如对日月、山川的崇拜）",2],[1059,1,"下列关于关汉卿的描述错误的是____。",["元杂剧最优秀的代表作家","由金人元的作家","历史剧《赵氏孤儿》的作者","元代杂剧作家申创作数量最多的作家"],"C","《赵氏孤儿》是元代纪君祥创作的杂剧，是元代四大悲剧之一。",1],[1060,1,"下列作品用到比兴手法的是____。",["《桃夭》","《离骚》","《喻老》","《关雎》"],"C","《韩非子·喻老》出自《韩非子》。在短篇幅中，用二十五则历史故事和民间传说分别解释了《老子》十二章，其中《德经》八章、《道经》四章，使《老子》抽象的哲学思想有了具体可感的呈现，在中国哲学史和训诂学史上起着发凡起例的作用，同时也使他的刑名法术之学有了比较精深的理论凭藉。《弹歌》为上古歌谣。",2],[1061,1,"下列作品中元代四大传奇有____。",["《拜月亭》","《牡丹亭》","《桃花扇》","《长生殿》"],"A","元代四大传奇包括《荆钗记》、《拜月亭记》、《白兔记》、《杀狗记》，时人以传奇称之。",10],[1062,1,"中国戏曲角色的基本行不包括____。",["生","旦","净","末"],"D","戏曲行当的名称。戏曲角色的分行十分细致，早先分为十行，后来才归并为生旦净丑四行。",9],[1063,1,"韩愈古文运动的理论主张不包括____。",["文以明道","惟陈言之务去","不平则鸣","用事绵密"],"D","韩愈在贞元九年（793）所写的《争臣论》中，第一次提出“文以明道”的观念，从而确定了“古文”创作的指导思想。从“明道”的要求出发，韩愈特别强调“惟陈言之务去”的重要性。在具体的创作实践中，他又提出了“不平则鸣”（《送孟东野序》）的口号。这一看法，把“明道”与对现实的批判联系了起来。",0],[1064,1,"唐代传奇在艺术上的主要特点有____。",["以志怪为主，情节简单","情节完整曲折，人物形象鲜明","语言质朴，多为口语化","以四言为主，句式整齐"],"B","唐代传奇标志着中国古代小说的成熟，艺术上突破了此前志怪小说 “粗陈梗概” 的局限。B 项 “情节完整曲折，人物形象鲜明” 是其核心特点，如《柳毅传》《莺莺传》等，都有复杂的情节与鲜活的人物；A 项是魏晋南北朝志怪小说的特点；C 项 “口语化” 多为宋元话本的特点；D 项 “四言为主” 是《诗经》等早期文学的语言特征。",1],[1065,1,"北宋瓦舍表演中，最能体现市民⼝味的表演形式包括蹴鞠和____。",["武术","⽪影","杂剧","雅乐"],"C","瓦舍勾栏是当时市民娱乐时候最主要去的场所,也是宋朝市民文化兴盛的一种体现。瓦舍勾栏时演出的内容很多,形式也多种多样,主要有说唱、戏剧、杂技和武术等等。",13],[1066,1,"李贺诗歌的艺术特点包括____。",["语言浅近，通俗易懂","风格沉郁顿挫，忧国忧民","想象奇特，善用神话意象，风格奇崛","风格豪放飘逸，充满浪漫主义色彩"],"C","李贺被称为 “诗鬼”，其诗歌最突出的特点是想象奇特，常借用神话传说、鬼魅意象，风格奇崛冷艳。C 项符合其特点；A 项是白居易新乐府诗的特点；B 项是杜甫诗歌的特点；D 项是李白诗歌的特点。",0],[1067,1,"19世纪末以来中国文化在现代化的过程中，文化思潮的互动不包括？",["全盘西化论","中体西化论","综合创新论","儒学复兴论与综合创新论"],"C","综合创新论是多民族文化融合与中外文化交汇。这并不是中国文化在现代化的思潮互动。",2],[1068,1,"下列人物不属于《桃花扇》的有____。",["李香君","席方平","阮大铖","侯方域"],"B","《席方平》是清代文学家蒲松龄创作的文言短篇小说，席方平是其主人公。",1],[1069,1,"下列戏剧大家不属于清代前期的有____。",["李玉","李渔","洪昇","汤显祖"],"D","汤显祖是中国明代戏曲家、文学家。",9],[1070,1,"下列戏剧著作属于洪昇的有____。",["《桃花扇》","《长生殿》","《牡丹亭》","《西厢记》"],"B","洪昇是清代前期的传奇大家，其代表作《长生殿》以唐玄宗与杨玉环的爱情故事为核心，融合历史兴亡之感。B 项正确；A 项《桃花扇》作者是孔尚任；C 项《牡丹亭》作者是汤显祖；D 项《西厢记》作者是王实甫。",9],[1071,1,"下列作家不属于桐城派的有____。",["陈维崧","姚鼐","方苞","刘大櫆"],"A","姚鼐与方苞、刘大櫆并称为“桐城派三祖”。",7],[1072,1,"“文”的本义是指各色交错的纹理，其后来的引申意义有____。",["文章、文献","武器、战争","粮食、作物","房屋、建筑"],"A","“文” 的本义是 “纹理”，后因 “纹理” 有 “条理、装饰” 之义，逐渐引申为与 “文字、文章” 相关的含义，如 “文辞”“文献”。A 项正确；B 项 “武器、战争” 与 “武” 的含义相关；C 项 “粮食、作物” 与 “禾”“谷” 等字相关；D 项 “房屋、建筑” 与 “宅”“宇” 等字相关，均非 “文” 的引申义。",10],[1073,1,"我国新石器文化最集中、最有代表性的区域是____。",["黄河流域和长江流域","珠江流域和黑龙江流域","塔里木河流域和淮河流域","雅鲁藏布江流域和澜沧江流域"],"A","我国新石器文化最集中、最有代表性的区域是黄河流域、长江流域。",7],[1074,1,"夏商周时期中国传统文化的主要标志不包括____。",["创造了甲骨文与金文","宗法制度和家国同构政治结构的形成","诸子蜂起，百家争鸣","初步形成传统伦理道德思想"],"C","诸子蜂起，百家争鸣不是夏商周时期中国传统文化的主要标志。",2],[1075,1,"秦汉科技方面的主要成果不包括____。",["造纸术","《甘石星经》","《氾胜之书》","《九章算术》"],"B","《甘石星经》不是秦汉科技方面的主要成果。《甘石星经》是一部天文学专著，甘经、石经各八卷，共十六卷，大致成书于战国时期。",11],[1076,1,"魏晋南北朝时期中国传统文化的主要标志是____。",["中央集权强化、科举制完善","玄学兴起、佛教传播、书法艺术成熟","理学形成、宋词兴盛","小说繁荣、戏曲成熟"],"B","魏晋南北朝时期的传统文化标志：玄学兴起（以老庄思想为核心，如王弼、郭象）、佛教传入后广泛传播（如石窟艺术兴起）、书法艺术成熟（如王羲之《兰亭集序》，楷书、行书定型）。B 项正确；A 项中央集权强化、科举制完善在隋唐；C 项理学形成、宋词兴盛在宋代；D 项小说繁荣、戏曲成熟在明清，均不属于魏晋南北朝时期。",8],[1077,1,"魏晋南北朝时期文学成就的主要标志不包括____。",["以曹操父子、建安七子为代表的建安文学","陶渊明为代表的田园、山水诗","赋与五言古诗","刘勰《文心雕龙》为代表的文学评论"],"C","赋与五言古诗不是魏晋南北朝时期文学成就的主要标志。",0],[1078,1,"魏晋南北朝时期科技成就的主要标志有____。",["造纸术发明、火药应用","《齐民要术》（贾思勰）、《水经注》（郦道元）、祖冲之计算圆周率","活字印刷术发明、指南针应用","《本草纲目》问世、地动仪发明"],"B","魏晋南北朝科技成就：北魏贾思勰《齐民要术》是中国现存最早的农书；北魏郦道元《水经注》是地理学专著；南朝祖冲之将圆周率计算到小数点后七位，领先世界。B 项正确；A 项造纸术发明于汉代，火药应用于唐代；C 项活字印刷术、指南针应用于宋代；D 项《本草纲目》是明代著作，地动仪发明于东汉，均不符合时期。",11],[1079,1,"下列不属于中国古代儿童识字教材的有____。",["《三字经》","《百家姓》","《千字文》","《诗经》"],"D","我国古代儿童启蒙教育都是从《百家姓》，《三字经》，《千字文》开始。",2],[1080,1,"宋代最突出的科技成果发明不包括？",["造纸术","指南针","印刷术","火药武器"],"A","造纸术不是宋代的科技成果。",11],[1081,1,"明代至清代中期（1840年前）的科技成果主要有____。",["《本草纲目》（李时珍）、《农政全书》（徐光启）、《天工开物》（宋应星）","活字印刷术、指南针","火药、造纸术","《齐民要术》、地动仪"],"A","明代至清代中期的科技成果：明代李时珍《本草纲目》是药物学巨著；明代徐光启《农政全书》是农学名著；明代宋应星《天工开物》是手工业技术专著。A 项正确；B 项活字印刷术、指南针在宋代；C 项火药、造纸术在唐、汉；D 项《齐民要术》是北魏著作，地动仪是东汉发明，均不符合时期。",11],[1082,1,"中国古人避讳的方式有____。",["改字、空字、缺笔","改姓、改名、改籍贯","改官职、改年号、改地名","改日期、改服饰、改礼仪"],"A","避讳的方法有四种：\n1. 改字法：就是把帝王及所尊者之名改用其他同义字或同音字来代替。\n2. 空字法：即将应避讳的字空而不书，或作“某”，或作“口”。\n3. 缺笔法：即对所避之字少写一笔。但少写的一笔在什么地方是有严格规定的。\n4. 改音法：就是读书时遇到讳字，应改变声调或读别的字音。",4],[1083,1,"明代至清代中期（1840年前）的主要图书典籍不包括____。",["《永乐大典》","《康熙字典》","《本草纲目》","《四库全书》"],"C","明代至清代中期（ 1840 年前）的图书典籍不包括《本草纲目》。",11],[1084,1,"中国传统人本主义精神不包括____层次。",["以民为本","重人伦远鬼神","“人文”精神","肯定个体的心性向善"],"C","中国传统人本主义精神不包括“人文”精神层次。",2],[1085,1,"中国传统文化的基本特征有____。",["伦理中心、天人合一、注重整体、务实精神","宗教主导、个人主义、注重个体、冒险精神","科技主导、理性主义、注重分析、创新精神","商业主导、利益至上、注重竞争、开放精神"],"A","中国传统文化的基本特征：伦理中心（以儒家伦理为核心，如 “三纲五常”）、天人合一（强调人与自然和谐，如儒家 “仁者乐山，智者乐水”、道家 “道法自然”）、注重整体（如中医的整体观、哲学的 “阴阳五行” 整体思维）、务实精神（如儒家重视现实生活，反对空谈）。A 项正确；其他选项中的 “宗教主导”“科技主导”“商业主导” 均不符合中国传统文化的核心特征。",11],[1086,1,"《周易》建构了中国伦理精神的原初的哲学模式，即____。",["阴阳五行模式","天人合一模式","性善论模式","因果报应模式"],"B","《周易》的核心思想是 “天人合一”，认为天、地、人三者相互关联、和谐统一，这种思维模式为中国伦理精神奠定了哲学基础 —— 伦理规范需符合 “天道”，如 “天行健，君子以自强不息”“地势坤，君子以厚德载物”。B 项正确；A 项 “阴阳五行” 是战国时期发展的学说；C 项 “性善论” 是孟子的观点；D 项 “因果报应” 是佛教传入后影响的观念，均非《周易》建构的原初哲学模式。",2],[1087,1,"孟子的“四端”包括人性天然就具有的____。",["仁、义、礼、信","忠、孝、节、义","仁、义、礼、智","温、良、恭、俭"],"C","孟子提出 “性善论”，认为人性本善，“四端” 是人性中天然具有的善的萌芽，即 “恻隐之心，仁之端也；羞恶之心，义之端也；辞让之心，礼之端也；是非之心，智之端也”，对应 “仁、义、礼、智”。",2],[1088,1,"法家的主要代表著作有____。",["《老子》《庄子》","《墨子》《吕氏春秋》","《韩非子》《商君书》","《论语》《孟子》"],"C","法家的主要代表著作有《商君书》、《韩非子》。",2],[1089,1,"王充的主要哲学观点有____。",["天人感应、君权神授","元气自然论、批判谶纬神学","性善论、仁政思想","心外无物、知行合一"],"B","王充是东汉唯物主义思想家，其主要哲学观点：元气自然论（认为世界由 “元气” 构成，万物自然生成，否定 “神创论”）、批判谶纬神学（反对汉代流行的迷信思想，如 “天人感应”“祥瑞灾异”，著有《论衡》）。B 项正确；A 项 “天人感应、君权神授” 是董仲舒的观点；C 项 “性善论、仁政思想” 是孟子的观点；D 项 “心外无物、知行合一” 是王阳明的观点。",2],[1090,1,"王夫之的主要哲学著作不包括____。",["《周易外传》","《尚书引义》","《明儒学案》","《读四书大全说》"],"C","《明儒学案》不是王夫之的哲学著作。",2],[1091,1,"董仲舒天人感应说的要点有____。",["天与人相互独立，互不影响","天是万物的主宰，人是天的副本，天能干预人事，人能感应上天","世界由元气构成，万物自然生成","心外无物，心外无理"],"B","董仲舒是西汉儒家代表，天人感应说的核心是：天是有意志的主宰，人是天的 “副本”（“人副天数”）；天通过 “祥瑞”（如嘉禾、麒麟）奖励君主的善政，通过 “灾异”（如地震、水灾）警示君主的过失，即 “天能干预人事，人能感应上天”。B 项正确；A 项是唯物主义观点，与董仲舒不符；C 项是王充的元气自然论；D 项是王阳明的唯心主义观点。",1],[1092,1,"人本主义精神主要不包括____层次。",["以民为本","重人伦远鬼神","肯定个体的心性向善","重义轻利"],"D","人本主义精神不包括重义轻利层次。",2],[1093,1,"春秋战国时期文学领域的主要成就不包括____。",["《诗经》","《楚辞》","诸子百家的著作","乐府诗"],"D","春秋战国时期文学领域的成就不包括乐府诗。",2],[1094,1,"汉语共同语在不同的时代有着不同的称谓，下列属于共同语别称的有____。",["雅言","方言","土语","俚语"],"A","汉语共同语在不同时代有特定称谓，如先秦时期称 “雅言”，汉代称 “通语”，明清称 “官话” 等。B、C、D 均指某一地区的地方语言，不属于共同语别称，故排除。",4],[1095,1,"魏晋南北朝时期文学领域的主要成就不包括____。",["曹操父子、建安七子为代表的建安文学","陶渊明为代表的田园、山水诗","乐府诗","刘勰《文心雕龙》为代表的文学评论"],"C","魏晋南北朝时期文学领域的成果不包括乐府诗。",0],[1096,1,"魏晋南北朝时期科技领域的主要成果不包括____。",["刘徽的《九章算术注》","祖冲之计算出的圆周率和编制的《大明历》","造纸术","贾思勰的《齐民要术》"],"C","魏晋南北朝时期科技领域的成果不包括造纸术。",11],[1097,1,"隋唐时期科技领域的重要成就主要有____。",["《本草纲目》编撰","火药发明与应用","《天工开物》问世","地动仪发明"],"B","A 项《本草纲目》是明代李时珍的著作；C 项《天工开物》是明代宋应星的作品；D 项地动仪是东汉张衡发明。隋唐时期已发明火药，并开始应用于军事（如唐末火药箭），故选 B。",11],[1098,1,"孔子以后，孟子从主观能动的方面发挥了孔子的伦理思想，其中不包括____。",["五伦说","性善论","修养论","义利合一说"],"D","孔子以后，孟子从主观能动的方面发挥了孔子的伦理思想，其中不包括义利合一说。",2],[1099,1,"宋元时期史学领域的代表作不包括____。",["《资治通鉴》","《通鉴纪事本末》","《通典》","《文献通考》"],"D","《文献通考》不是宋元时期史学领域的代表作。",1],[1100,1,"董仲舒把人性分为三类，其中不包括____。",["“君子之性”","“中民之性”","“斗筲之性”","“圣人之性”"],"A","董仲舒把人性分“中民之性” 、“斗筲之性”、“圣人之性”。",1],[1101,1,"中国优秀传统伦理道德规范包括____。",["损人利己","诚实守信","骄奢淫逸","见利忘义"],"B","A、C、D 均为负面道德行为，与传统优秀伦理相悖。“诚实守信” 是中国传统伦理的核心规范之一（如孔子 “言必信，行必果”），贯穿儒家伦理体系，故选 B。",2],[1102,1,"孝悌之德的基本内容是____。",["尊敬师长、团结同学","孝顺父母、友爱兄弟","忠于君主、报效国家","关爱他人、乐于助人"],"B","“孝” 指孝顺父母，“悌”（tì）指友爱兄长，二者是儒家伦理的基础（《论语・学而》：“孝悌也者，其为仁之本与”）。A、C、D 均不属于 “孝悌” 的核心内涵，故选 B。",2],[1103,1,"我国原始宗教有很多分野，总的来讲，主要不包括____。",["自然崇拜","动植物崇拜","图腾崇拜","圣贤崇拜"],"D","我国原始宗教有很多分野，不包括圣贤崇拜。",4],[1104,1,"封建正统法律思想的内容主要有____。",["德主刑辅","无为而治","严刑峻法","法律面前人人平等"],"A","B 项是道家治国思想，与 “正统法律思想” 无关；C 项是法家思想（如秦朝），非封建正统（封建正统以儒家为核心）；D 项是近代法治理念，古代封建法律无此原则。封建正统法律思想以儒家 “德治” 为核心，主张 “德主刑辅”（如董仲舒提出），故选 A。",2],[1105,1,"中国伦理思想体系的三大构成要素不包括____。",["人情","人伦","人道","人性"],"A","中国伦理思想体系的三大构成要素是人伦、人道、人性。",14],[1106,1,"孔子将修身称为____。",["明明德","克己复礼","致良知","知行合一"],"B","A “明明德” 出自《大学》，是宋代理学强调的修养目标；C “致良知”、D “知行合一” 均是王阳明的主张。孔子在《论语・颜渊》中提出 “克己复礼为仁”，“克己复礼” 即通过约束自身、遵守礼的规范来修身，故选 B。",2],[1107,1,"____是中国佛教石窟的代表。",["敦煌莫高窟","云冈石窟","龙门石窟","以上都是"],"D","以上都正确。",2],[1108,1,"____不属于封建法律“八议”制度内容。",["议亲","议贤","议功","议尊"],"D","“八议”为：一议亲，二议故，三议贤，四议能，五议功，六议贵，七议勤，八议宾。",14],[1109,1,"____不是《开皇律》确定的刑名。",["死刑","流刑","肉刑","徒刑"],"C","《开皇律》删除了魏晋以来一些残酷的刑罚,确立了封建时代比较进步的五种刑名: 答 、杖、徒、流、死。",1],[1110,1,"玄学不以____为主要依据企图用道家学说调整失衡的社会关系和伦理关系，其宗旨是“贵无” ,崇尚自然。",["《孟子》","《周易》","《老子》","《庄子》"],"A","玄学没有以《孟子》为主要依据企图用道家学说调整失衡的社会关系和伦理关系，其宗旨是“贵无” ,崇尚自然。",2],[1111,1,"中国传统文化的形成有两个重要的基础，即____。",["小农经济、中央集权","小农经济、宗法制度","商品经济、宗法制度","商品经济、中央集权"],"B","中国传统文化的核心基础是经济与社会结构：经济上，小农经济（自给自足的农耕经济）是传统经济的主体，决定了文化的务实、保守特质；社会结构上，宗法制度（以血缘为核心的家族制度）是传统社会的骨架，决定了文化的伦理导向（如孝悌、等级）。A 中中央集权是政治制度，是文化的上层建筑；C、D 中商品经济非传统经济基础，故选 B。",2],[1112,1,"孔子对教师职业道德的要求有____。",["学而不厌，诲人不倦","因材施教，有教无类","为人师表，以身作则","以上都是"],"D","以上都正确。",2],[1113,1,"《学记》与教育教学的原则无关的有____。",["预防性原则","及时施教原则","长善救失原则","有教无类"],"D","有教无类出自《论语》。",7],[1114,1,"《学记》关于教学方法的内容不包括___。",["讲解法","问答法","讨论法","练习法"],"C","《学记》概括的教学方法有：讲解法、问答法、练习法、类比法。",7],[1115,1,"朱子读书六法不包括____。",["循序渐进","熟读精思","虚心涵泳","温故知新"],"D","循序渐进、熟读精思、虚心涵泳、切己体察、着紧用力、居敬持志是朱子读书六法。",14],[1116,1,"中国传统的中医学的基础理论包括____。",["四诊法","阴阳五行学说","针灸疗法","本草学"],"B","A 四诊法（望、闻、问、切）是诊断方法；C 针灸疗法是治疗方法；D 本草学是药物学体系。阴阳五行学说是中医学的核心基础理论，贯穿生理、病理、诊断、治疗等所有领域（如 “阴阳平衡”“五行相生相克” 解释人体机能），故选 B。",11],[1117,1,"孟子存养式教学法的主要内容包括____。",["循序渐进、积少成多","存心养性、深造自得","知行合一、学以致用","格物致知、穷理尽性"],"B","以上都正确。",2],[1118,1,"荀子积渐式教学法的内容不包括____。",["闻、见、知、行的教学审视过程","虚壹而静，专心有恒","解蔽救偏，兼陈中恒","教亦多术"],"D","教亦多术是孟子存养式教学法的主要内容。",2],[1119,1,"中国古代最具特色的思维模式不包括____。",["整体思维","抽象思维","类比思维","辩证思维"],"B","中国传统思维方式最有特色的是整体思维、直观思维、类比思维、辨证思维。",14],[1120,1,"孔子通过对春秋以前中国文化成果的总结，继承周公的思想，创造了以____为核心的一整套伦理思想体系。",["德","道","法","仁"],"D","春秋时期,孔子通过对春秋以前中国文化成果的总结,成功地对中国社会的生活秩序进行了伦理化、道德化的提升,创造了以礼、仁、中庸为内核的伦理思想体系。",2],[1121,1,"李白的著名诗篇不包括____。",["《蜀道难》","《梦游天姥吟留别》","《将进酒》","《丽人行》"],"D","《丽人行》是杜甫所作。",0],[1122,1,"近代_____被称为“四大谴责小说”。",["李宝嘉的《官场现形记》","吴沃尧的《二十年目睹之怪现状》","刘鹗的《老残游记》","以上都是"],"D","以上都正确。",0],[1123,1,"中国传统的天文学包括____。",["历法制定","行星观测","星象占卜","以上都是"],"D","中国传统天文学兼具实用性和政治性：实用性方面，包括制定历法（如农历，指导农业生产）、观测行星（记录日月食、彗星等）；政治性方面，包括星象占卜（认为星象与国运相关，如 “天人感应”）。三者均属于中国传统天文学的范畴，故选 D。",6],[1124,1,"唐代颜真卿的主要书法作品不包括____。",["《颜氏家庙碑》","《多宝塔感应碑》","《颜勤礼碑》","《皇甫诞碑》"],"D","《皇甫诞碑》是欧阳询所书。",8],[1125,1,"欧阳询的主要书法作品不包括____。",["《九成宫醴泉铭》","《卜商帖》","《寒切贴》","《皇甫诞碑》"],"C","《寒切贴》是王羲之所书。",8],[1126,1,"魏晋南北朝时期的著名史学家不包括____。",["陈寿","裴松之","荀悦","范晔"],"C","荀悦是东汉史学家。",1],[1127,1,"北宋书法家米芾的传世墨迹主要有____。",["《蜀素帖》","《兰亭序》","《九成宫醴泉铭》","《祭侄文稿》"],"A","B《兰亭序》（王羲之，东晋）；C《九成宫醴泉铭》（欧阳询，唐）；D《祭侄文稿》（颜真卿，唐）。米芾是北宋 “宋四家”（苏、黄、米、蔡）之一，其传世墨迹《蜀素帖》被誉为 “天下第八行书”，故选 A。",8],[1128,1,"元代赵孟頫的主要书法作品不包括____。",["《仇锷墓碑铭》","《鹊华秋色图》","《度人经》","《兰亭十三跋》"],"B","《鹊华秋色图》属于赵孟頫的山水画。",8],[1129,1,"建于公元前3世纪的都江堰工程不包括以下哪个部分组成。",["大坝","宝瓶口","飞沙堰","分水鱼嘴"],"A","都江堰主要由鱼嘴、飞沙堰、宝瓶口三大主体工程构成。",11],[1130,1,"我国汉代时的医学已有“四诊”的诊断技术，“四诊”指的是____。",["望、闻、问、切","视、听、触、叩","望、触、叩、听","问、闻、查、验"],"A","“四诊法” 是汉代张仲景在《伤寒杂病论》中系统总结的诊断方法，包括望诊（观察面色、舌苔）、闻诊（听声音、闻气味）、问诊（询问症状、病史）、切诊（摸脉象）。B、C 是现代医学的物理诊断方法；D 是现代医学的诊断流程，故选 A。",11],[1131,1,"战国时期是先秦史学发展的繁荣时期， ____不是该时期留存于现在的史籍。",["《左传》","《战国策》","《春秋》","《竹书纪年》"],"C","《春秋》不属于战国时期的作品。",2],[1132,1,"____不是宋元时期的薪金石学和考古学的代表性著作。",["欧阳修的《集古录》","吴大临的《考古图》","赵明诚的《金石录》","裴秀所绘的《禹贡地域图》"],"D","裴秀是魏晋时期名臣。约在泰始四年至七年(268～271)，裴秀主编完成《禹贡地域图》18篇，它是中国有文献可考的最早的历史地图集，并在序言中提出了绘制地图的6项原则，即著名的“制图六体”，为中国传统地图（平面测量绘制的地图）奠定了理论基础。",1],[1133,1,"编年体史书发展过程中的分支不包括____。",["纪事本末体","起居注","实录","纲目"],"A","纪事本末体不属于编年体。",14],[1134,1,"____属于 “史才四长”的内容。",["德、智、体、美","才、学、识、德","仁、义、礼、智","忠、孝、节、义"],"B","“史才四长” 是唐代史学家刘知几在《史通》中提出的史学人才标准，包括 “才”（编撰能力）、“学”（史学知识）、“识”（历史见识），清代章学诚补充 “德”（史学道德），形成 “才、学、识、德” 四长。B 是现代教育目标；C 是孟子 “四德”；D 是传统道德规范，故选 A。",2],[1135,1,"中国传统科技的特点有____。",["注重实用","注重理论","注重实验","注重抽象"],"A","中国传统科技以解决实际问题为核心，注重实用（如农学服务于农业生产，医学服务于治病救人，天文学服务于历法制定），但缺乏系统的理论总结和实验验证。B 注重理论、C 注重实验、D 注重抽象是西方近代科技的特点，故选 A。",11],[1136,1,"____不属于古代吉礼范围。",["祭天神","祭地祗","祭人鬼","荒礼"],"D","吉礼是五礼之冠，主要是对天神、地祇、人鬼的祭祀典礼。主要内容有：（1）祀天神：昊天上帝；祀日月星辰；祀司中、司命、雨师。（2）祭地祗：祭社稷、五帝、五岳；祭山林川泽；祭四方百物，即诸小神。（3）祭人鬼：祭先王、先祖；禘祭先王、先祖；春祠、秋尝、享祭先王、先祖。",7],[1137,1,"____不属于古代嘉礼范围。",["饮食之礼","大田之礼","婚冠之礼","宾射之礼"],"B","嘉礼，西周五礼之一，嘉礼是饮宴婚冠、节庆活动方面的礼节仪式。嘉，美、善的意思。后代的帝王登基、太后垂帘、帝王圣诞、立储册封、帝王巡狩等，也属嘉礼。嘉礼是和合人际关系、沟通、联络感情的礼仪。其主要内容有六：一曰饮食，二曰婚冠，三曰宾射，四曰飨燕，五曰脤膰，六曰庆贺。",12],[1138,1,"中国长期流传的饮食观念不包括____。",["民本思想","节约粮食","好客","人格教育"],"C","中国长期流传的饮食观念主要包括：1、民本思想；2、人格教育；3、食疗观；4、节约粮食。",12],[1139,1,"____属于古代婚礼“六礼”范围。",["纳采","问名","纳征","以上均是"],"D","以上都正确。",5],[1140,1,"____属于古代的丧葬习俗。",["火葬","石棺葬","悬棺葬","以上均是"],"D","以上都正确。",5],[1141,1,"容仪有整主要不包括____。",["衣着容貌","行为举止","言语辞令","礼尚往来"],"D","容仪有整不包括礼尚往来。",12],[1142,1,"头衣亦称“元衣”，即我们现代的帽子。____属于我国传统的头衣种类。",["冠","冕","帻","以上均是"],"D","以上都正确。",12],[1143,1,"____不是古代最主要的运输工具。",["船","车","轿","马"],"D","马不是古代最主要的运输工具。",14],[1144,1,"____是我国古代经验科学出现的标志，是当时人们从实践经验加以抽象概括的成果。",["《墨经》","《论语》","《道德经》","《韩非子》"],"A","《墨经》是墨家学派的著作，包含丰富的自然科学知识（如力学、光学、几何学），是对当时生产实践经验的抽象概括，标志着我国古代经验科学的出现。B《论语》是儒家伦理著作；C《道德经》是道家哲学著作；D《韩非子》是法家政治著作，均无系统的科学知识，故选 A。",2],[1145,1,"居住建筑的文化含义主要表现不包括____。",["居住方式","居住风水","居住建筑格局","居住建筑仪式"],"B","居住建筑的文化含义主要表现在三个方面：居住方式、居住建筑格局和仪式。",10],[1146,1,"中国传统艺术的民族特色不包括____。",["天人合一、物我合一的审美境界追求","重言志，追求美善合一的审美旨趣","圆融贯通的表现手法","较强的功利性"],"D","中国传统艺术的民族特色没有功利性。",14],[1147,1,"学习中国传统文化的目的、意义____。",["可以增强民族自豪感和爱国情怀","有助于改革开放和现代化建设","有助于祖国统一、振兴中华","以上均是"],"D","以上都正确。",1],[1148,1,"中国传统科学技术的总体特征不包括____。",["实用功利性","辨证整体性","科学实践性","经验直观性"],"C","中国传统科学技术的总体特征包括实用功利性、辨证整体性和经验直观性。中国古代科学技术的总体特征三方面既不可分割，又相互独立。",2],[1149,1,"中国传统哲学的特点是____。",["侧重于人生哲理的探讨","哲学与政治、伦理含融不分","整体把握、直觉体悟的思维方式","以上均是"],"D","以上都正确。",14],[1150,1,"中国传统文化在西方的传播主要包括____。",["造纸术约在唐朝中期传入西亚，再到欧洲","火药 13、14世纪由阿拉伯人传到欧洲，很快被应用于军事","中国美术、绘画、陶瓷对欧洲人来说不仅实用，而且是有价值的艺术品","以上均是"],"D","以上都正确。",11],[1151,1,"中国优秀的史学文化传统包括____。",["求实精神","惩恶扬善的批判精神","以史为鉴的经邦致用精神","以上均是"],"D","以上都正确。",2],[1152,1,"中华民族传统美德的主要内容包括____。",["仁爱孝悌、谦和好礼","诚信知报、精忠爱国","克己奉公、修己独慎","以上均是"],"D","以上都正确。",2],[1153,1,"董仲舒的思想主要不包括____。",["人君受命于天","“道之大原出于天，天不变，道亦不变\"","效法天道，德刑并用","经世致用"],"D","经世致用一词由明清之际思想家王夫之、黄宗羲、顾炎武等提出。",1],[1154,1,"中国古代书法的特点不包括____。",["通过书法的点、划结构和章法表现形式美","通过字的力度来展现神采美","通过字的形态来展现神采美","通过字的形、神表现书法家的精神美和时代特征"],"B","中国古代书法是通过字的形态来展现神采美，而非字的力度。",8],[1155,1,"魏晋南北朝史学发展的特点不包括____。",["史著数量大为增加","史学发展成熟期","史学成为一门独立的学科","史著种类繁多"],"B","史学发展成熟期在隋唐时期。",1],[1156,1,"关于《齐民要术》的描述，正确的是____。",["由唐代贾思勰编撰，是我国现存最早的农书","涵盖农业生产、农产品加工，还涉及畜牧、渔业等领域","主要记载南方农业生产技术，对北方农业无参考价值","是一部综合性的医学著作，重点论述中医养生之道"],"B","《齐民要术》是北魏农学家贾思勰编撰的农书，并非唐代（选项 A 错误），是我国现存最早、最完整的农书。其内容丰富，不仅包含粮食作物、经济作物的种植技术，还涉及农产品加工（如酿造、腌制）、畜牧养殖、渔业捕捞等领域（选项 B 正确）。该书以黄河流域（北方）农业生产为主要记载对象，但其中的许多农业原理对南方农业也有借鉴意义（选项 C 错误），且其本质是农书，而非医学著作（选项 D 错误），故选择 B。",11],[1157,1,"“⽂化”之“⽂”的引申义有____。",["纹理，如 “木成文”","文字、文章，如 “文以载道”","自然界的原始形态，如 “天文”","未经加工的粗糙状态"],"B","“文” 的本义是 “纹理”（选项 A 属于本义，非引申义），指事物表面的纹路。随着语义发展，“文” 引申为与 “文字”“文章” 相关的含义，如 “文以载道” 中的 “文” 即指文章，这是典型的引申义（选项 B 正确）。选项 C 中 “天文” 的 “文” 虽与自然现象相关，但仍偏向 “条理、秩序” 的本义延伸，未形成独立的引申义；选项 D 描述的是 “质” 的含义，与 “文”（代表修饰、条理）相反，并非 “文” 的引申义，故选择 B。",2],[1158,1,"“中”字的引申义有____。",["内部、里面，如 “室内”","方位词，指东方","⽂化政治中⼼","军事堡垒"],"C","“中”字的引中义有空间的中央、文化政治的中心。",2],[1159,1,"“中体西⽤”论的严重缺陷是____。",["颠倒经济与伦理的序列关系","以忠孝为本， 以中国经史之学为基","主张学习西方先进技术，推动了近代化","回避现实冲突，停留在⼀种经验论的理论⽔平上"],"D","“中体西用”论的严重缺陷是仍存“华夷”等级秩序、文化中心主义心理定势;回避现实冲突, 停留在一种经验论的理论⽔平上。",2],[1160,1,"按照四分法，以下哪个不是中国文化？",["物质文化","宗教文化","精神文化","制度文化"],"B","还有语言文化。",14],[1161,1,"竺可桢先生在《中国近五千年气候变化的初步研究》一文中将我国五千年的气候变化分为四个大的时期，其中不包括____。",["温暖期","寒暖交错期","寒冷期","第一冷期"],"D","中国五千年气候的变化大势是由暖变冷,大致分为四个大的时期:1)温暖期：从公元前3000年到公元前1100年,下限正好在商朝末年。2)寒暖交错期：从公元前1100年到公元1400年,下限到明朝初期。3)方志时期,又叫寒冷时期。从公元1400年到1900年,下限到清朝末年。4)仪器观测期。",1],[1162,1,"中国古代文化的基干包括____。",["源于齐鲁的儒家文化、源于三晋的法家文化","戏曲文化","源于江浙的商业文化","源于印度的佛教文化"],"A","中国古代文化的基干包括源于齐鲁的儒家文化 、源于三晋的法家文化、源于南楚的道家及楚辞文化。",2],[1163,1,"概括起来说，我国古代改造利用自然的成就包括____。",["水利的兴修","土地的开垦","都江堰的修建","AB均是"],"D","传说:大禹治水。战国:都江堰和郑国渠。关中:井渠法。汉代:王景治黄河",11],[1164,1,"新石器时代三大文明成就是不包括____。",["青铜器制造","农业","制陶","石器的磨制与钻孔"],"A","（1）农业的发展：农业的发生是人类历史划时代的大事。在世界为数不多的几个农业起源中心中，中国独一无二，即黄河中下游地区的耐旱谷物农业和长江中下游地区的稻作农业。\n（2）石器的磨制与钻孔：石器的磨制和钻孔，体现着生产力水平的提高。磨制石器的发展与农业发生同步。　　\n（3）制陶业的发展：陶器的制造是贯穿于新石器时代重要的手工业。制陶技术经历过贴塑、泥条盘筑及慢轮加工和快轮加工几个大的阶段。快轮加工陶器在仰韶文化时就已经出现，经过不断提高，到龙山时期已遍及黄河及长江流域。",10],[1165,1,"在汉武帝数十年对匈奴的战争中，大的战役不包括____。",["河南战役","河西战役","河东战役","漠北战役"],"C","河东战役是显王三年至四十七年(公元前366年—前322年)，秦军收复被魏国夺占的河西地区(今山西、陕西间黄河南段以西地区)的作战。",1],[1166,1,"“三公九卿”中“三公”不包括____。",["丞相","尚书","太尉","御史大夫"],"B","秦以丞相，太尉，御史大夫为三公。",3],[1167,1,"中国古代四大发明中，在唐宋之际发明并应用的不包括____。",["火药","指南针","造纸术","活字印刷术"],"C","造纸术，是中国四大发明之一，发明于西汉时期、改进于东汉时期。",11],[1168,1,"明末清初的“三先生”不包括____。",["王夫之","顾炎武","黄宗羲","徐光启"],"D","清初出现了许多具有唯物主义思想与民主色彩的先进知识份子，黄宗羲、王夫之、顾炎武就是其杰出代表。他们被并称为“清初三先生” ，均曾参加过反清复明的爱国活动，失败后，拒绝同满清权贵合作，表现出崇高的民族气节。",1],[1169,1,"我国传统的市商贸易活动的主要模式不包括____。",["市","商","墟","集"],"B","市、墟、集、会是传统市商贸易活动的主要模式。",1],[1170,1,"唐宋以来，行会的管理方式主要不包括____。",["祖师崇拜","行业竞争","师徒传承","行业禁忌"],"B","我国古代行会的主要管理方式：\n① 祖师崇拜,各行各业都有自己崇拜的祖师。\n②师徒传承,手工行业的技术传承是在师傅和徒弟之间进行的,徒弟入行、拜师、岀师都有一套行规,不可逾越。\n③行业禁忌,传统手工业有许多行业忌讳,反映了过去手工业生存艰难的另一面。",1],[1171,1,"“福”字，是我国最古老的文字之一，目前发现的“福”字，最早见于____。",["甲骨文","金文","大篆","小篆"],"A","目前发现的最早的“福”字见于甲骨文，早期文字具有图画性的特点，象形性很强。甲骨文中的“福”字为合体会意字，与祭祀祈祷有关。",8],[1172,1,"《陈情表》“臣生当陨首，死当结草”一句中的“结草”，后世常用来代指报恩，请问“结草”的典故最早出自____。",["《庄子》","《左传》","《列子》","《史记》"],"B","“结草”的典故见于《左传·宣公十五年》。公元前594年的秋七月，秦桓公出兵伐晋，晋军和秦兵在晋地辅氏（今陕西大荔县）交战，晋将魏颗与秦将杜回相遇，二人厮杀在一起，正在难分难解之际，魏颗突然见一老人用草编的绳子套住杜回，使这位堂堂的秦国大力士站立不稳，摔倒在地，当场被魏颗所俘，使得魏颗在这次战役中大败秦师。",2],[1173,1,"下列关于孟浩然《过故人庄》一诗中字词的解释，不正确一项的是____。",["“故人具鸡黍”中的“具”意思为“准备”","“绿树村边合”中的“合”意思为“环绕”","“青山郭外斜”中的“郭”意思为“古代城墙的内城”","“还来就菊花”中的“就”意思为“靠近”"],"C","古代城墙有内外两重，内为城，外为郭。这里的“郭”指村庄的外墙。",7],[1174,1,"在唐代，针对时人耻学于师的偏见，韩愈不顾流俗，勇为人师，广招后学，并抨击时弊、倡导师道，撰写《师说》一文送给______",["李商隐","李蟠","李颀","李治"],"B","《师说》最后一段说：“李氏子蟠，年十七，好古文，六艺经传皆通习之，不拘于时，学于余。余嘉其能行古道，作《师说》以贻之。”",0],[1175,1,"2022年北京冬季奥运会是第____届。",["23","24","25","26"],"B","第24届冬季奥林匹克运动会，简称2022年北京冬季奥运会，是由中国举办的国际性奥林匹克赛事，于2022年2月4日开幕，2月20日闭幕。",14],[1176,1,"五行是指什么？",["圣行、梵行、天行、佛行、病行","行动、行为、形成、行测、行乐","幸福、快乐、健康、平安、长寿","金、木、水、火、土"],"D","金、木、水、火、土合称五行，五行是“气”的五种运行状态，是“气”运行产生的结果，“行”即运动。中国古代哲学家用五行理论来说明世界万物的形成及其相互关系。",11],[1177,1,"《国语》是____。",["一部国别体史书","一部编年体史书","一部纪传体史书","一部纪事本末体史书"],"A","《国语》相传是春秋时期左丘明所撰的一部国别体著作。他的编纂方法是以国分类，以语为主，故名“国语”。",2],[1178,1,"一口气提出170名个问题的屈原的长诗是____。",["《离骚》","《天问》","《招魂》","《九歌》"],"B","在《天问》中，屈原以诗人哲学家的胸怀与视野，一口气提出了170多个问题，他以恢宏的气势、深刻的追问、奇幻的哲思为中国诗歌埋藏了一条理性和质疑的河流。",0],[1179,1,"《九章》共____篇。",["9","18","90","99"],"A","《九章》是短篇抒情诗集，包括9篇作品。依王逸《楚辞章句》的次序是：《惜诵》、《涉江》、《哀郢》、《抽思》、《怀沙》、《思美人》、《惜往日》、《橘颂》、《悲回风》。这9篇的作者，王逸都定为屈原。",11],[1180,1,"“不要人夸好颜色，只留清气满乾坤”出自哪一首诗？",["《乡村四月》","《滁州西涧》","《墨梅》","《古朗月行》"],"C","墨梅\n吾家洗砚池头树，个个花开淡墨痕。\n不要人夸好颜色，只留清气满乾坤。",0],[1181,1,"因秦王不愿用城池换美玉，而持璧倚柱、怒发冲冠的是哪一个人？",["廉颇","蔺相如","赵括","赵奢"],"B","完璧归赵是一个历史典故演化而成的成语，出自《史记·廉颇蔺相如列传》。",1],[1182,1,"《七发》的作者是____。",["贾谊","东方朔","王褒","枚乘"],"D","在文学上，枚乘所作的《七发》在辞赋的发展史上具有重要地位，是汉大赋正式形成的标志性作品；在思想上，枚乘的政治思想表现为对大一统有精神上的认同。",0],[1183,1,"中国历史上第一次大规模的平民起义，发生在现在的安徽境内的是____。",["赤眉起义","陈胜吴广起义","绿林起义","黄巾起义"],"B","大泽乡起义，又称“陈胜吴广起义”，是秦末农民战争的一部分。此次起义沉重打击了秦朝，揭开了秦末农民起义的序幕，是中国历史上第一次大规模的平民起义。",1],[1184,1,"我国古代第一部历史散文集是____。",["《尚书》","《逸周书》","《论语》","《春秋》"],"A","《尚书》是儒家主要经典之一，是我国第一部上古历史文献和部分追述古代事迹著作的汇编，保存了商周特别是西周初期的一些重要史料，对研究上古历史具有很高的价值。就文学成就而言，《尚书》是中国古代散文已经形成的标志。",2],[1185,1,"“美”字最初的含义是____。",["羊大即为美","戴着头饰站立的人","土地里生长的花朵","远方茂盛的森林"],"B","美，初文见于商代甲骨文。美的古字形像戴着头饰站立的人，本义指漂亮、好看。",2],[1186,1,"“芒种”属于哪一个季节？",["春季","夏季","秋季","冬季"],"B","二十四节气\n1.春季：立春、雨水；惊郵、春分：清明、谷雨。\n2.夏季：立夏、小满;芒种、夏至：小暑、大暑。\n3.秋季：立秋、处暑：白露、秋分：寒露、霜降。\n4.冬季：立冬、小雪；大雪、冬至：小寒、大寒。",6],[1187,1,"重阳佳节是在农历几月几？",["五月初五","七月十五","八月十五","九月初九"],"D","重阳(九月初九)：习俗有登高望远、赏菊赋诗、喝菊花酒、插菜英等。现定为老人节。",5],[1188,1,"以下哪一项并非兵马俑制成兵马的形状的殉葬品？",["战车","战马","士兵","战地"],"D","兵马俑是古代墓葬雕塑的一个类别。古代施行人殉，奴隶是奴隶主生前的附属品，奴隶主死后奴隶要作为殉葬品为奴隶主陪葬。兵马俑即制成兵马（战车、战马、士兵）形状的殉葬品。",1],[1189,1,"把汉大赋推向高峰的人是____。",["班固","张衡","司马相如","扬雄"],"C","“因为司马相如生活的时代,大一统政权、汉民族国家正处于蒸蒸日上的发展态势。为此而欢欣鼓舞并产生自豪夸耀心理,才是大赋创作的底色,讽谏之意并不是全部的创作初衷。豪迈的时代精神,铺陈的赋体特性,不甚独立的作家身份和维护盛世的诚意,种种因素综合考量,“曲终奏雅”相对来说倒是顺理成章的处理方案。",11],[1190,1,"饺子由____演变而来的。",["汤圆","年糕","面粉","馄饨"],"D","饺子由馄饨演变而来 ，源于中国古代的角子，原名“娇耳”，汉族传统面食，距今已有一千八百多年的历史 。由东汉南阳涅阳（今河南南阳邓州）人张仲景发明  ，最初作为药用。饺子又称水饺，深受中国人民喜爱，是中国北方民间的主食和地方小吃，也是年节食品。",11],[1191,1,"四大名著包括？",["《三国演义》","《水浒传》","《红楼梦》","以上皆正确"],"D","中国古典长篇小说四大名著，简称四大名著，是指《水浒传》《三国演义》《西游记》《红楼梦》（按照成书先后顺序）这四部巨著。",0],[1192,1,"木版水印的生产主要分四道工序是什么？",["勾描→印刷→装裱→雕刻木版","勾描→雕刻木版→印刷→装裱","雕刻木版→印刷→装裱→勾描","勾描→雕刻木版→装裱→印刷"],"B","木版水印的生产主要分四道工序：勾描→雕刻木版→印刷→装裱。",11],[1193,1,"孔子认为“身正”是为政者的重要品质，“不能正其身，如正人何?”韩非子主张立法者“不游意于法之外，不为惠于法之内”。他们这是倡导统治者____。",["推行仁政","以法治国","规范行为","监督民众"],"C","根据“不能正其身，如正人何？”可得出孔子强调要身正。根据“不游意于法之外，不为惠于法之内”可得出韩非子强调要遵守法律。二者分别从不同的角度要求人们要遵守规则，规范行为，C项正确；A项是孟子的，B项是法家的，排除；D项在材料中没有体现，排除。",2],[1194,1,"《桃花扇》的故事发生在哪个城市？",["苏州","上海","南京","杭州"],"C","《桃花扇》所写的是明代末年发生在南京的故事。全剧以侯方域、李香君的悲欢离合为主线，展现了明末南京的社会现实。同时也揭露了弘光政权衰亡的原因，歌颂了对国家忠贞不渝的民族英雄和底层百姓，展现了明朝遗民的亡国之痛。",7],[1195,1,"下列对文化常识的解说，错误的一项是：____",["削：革职罢官。谪：降职远调。","免：免除官职。黜：废黜、贬退。","拜：授给官职。废：罢免或废黜。","除：免除官职。退：（1）撤销或降低官职；（2）自己辞职。"],"D","除：免除旧职任新职。",3],[1196,1,"《钦定四库全书》分多少部？",["4","16","40","44"],"A","四库全书：全称《钦定四库全书》，分“经、史、子、集”四部，故名四库。",2],[1197,1,"冬奥会、冬残奥会主题口号是____。",["一起向未来","激情同在","激情冰火属于你","用炽热的心"],"A","2022年北京冬奥会：一起向未来（Together for a Shared Future)\n2018年平昌冬奥会：激情同在（Passion Connected)\n2014年索契冬奥会：激情冰火属于你（Hot Cool Yours)\n2010年温哥华冬奥会：用炽热的心（With Glowing Hearts)",14],[1198,1,"贾谊的文集是_____。",["《新书》","《新语》","《至言》","《治安策》"],"A","贾谊的文集有:《新书》、《贾长沙集》、《贾谊集》,其中以《贾谊集》最为有名,代表作有《过秦论》、《论积贮疏》、《陈政事疏》等。",1],[1199,1,"以下哪一项并非制做皮影的雕刻用料？",["马皮","驴皮","羊皮","猪皮"],"D","在影人的制作上要选用坚固耐用、柔韧性好的材料，可以用羊皮、驴皮、马皮、牛皮等，其中驴皮应用最为广泛，刻画出的影人形态逼真、薄厚均匀、色彩鲜亮，各种精美的皮影艺术造型标志着皮影制作技术日渐成熟。",8],[1200,1,"以下哪一项属于中国古代十大乐器里的“革”类乐器？",["钟","鼓","瑟","笙"],"B","中国古典乐器一般按“八音”分类。\n“金”类：钟\n“土”类：埙\n“革”类：鼓\n“丝”类：琴、瑟、二胡、琵琶等\n“匏”类：笙\n“竹”类：箫、笛等",9],[1201,1,"五脏六腑的“五脏”是哪五个？",["心、肝、腰、肺、肾","心、肝、脾、肺、肾","心、肝、脾、胆、肾","心、脏、脾、肺、肾"],"B","五脏六腑是人体脏器的总称，五脏指肝、心、脾、肺、肾，与之相对应或者相表里的六腑是指胆、小肠、大肠、胃、膀胱，还有特殊的腑，称为三焦。",10],[1202,1,"饺子起源于我国哪个时期？",["隋","东汉","秦","春秋战国"],"B","饺子起源于东汉时期，为东汉河南邓州人\"医圣\"张仲景首创。当时饺子是药用，张仲景用面皮包上一些祛寒的药材用来治病(羊肉、胡椒等)，避免病人耳朵上生冻疮。",1],[1203,1,"以下关于甲骨文的表述不正确的是____。",["甲骨文对研究夏朝的历史有非常重要的价值","甲骨文是殷墟出士的刻在龟甲和兽骨上的文字","甲骨文是目前中国己知最早的一种成系统的文字","甲骨文字形成熟，奠定了汉字的基础"],"A","甲骨文是我国商朝时期的一种文字。甲骨文主要指中国商朝晚期王室用于占卜记事而在龟甲或兽骨上契刻的文字，是中国及东亚已知最早的成体系的商代文字的一种载体。",1],[1204,1,"汉宇形体的演变过程为____。",["金文→隶书→楷书→篆书","甲骨文→金文→篆书→隶书。","隶书→篆书→楷书→金文","金文→隶书→篆书→楷书"],"B","演变顺序：甲骨文→金文→大篆→小篆→隶书→草书→楷书→行书。",8],[1205,1,"武术的作用表述中,正确的一项是____。",["改善和增强体质,提高防身自卫能力,广泛适应性,内外合一","磨练意志,培养道德情操娱乐观赏,寓技击于体育中","改善和增强体质,提高防身自卫能力,磨练意志培养道德情操,娱乐观赏丰富文化生活","提高防身自卫能力,娱乐观赏丰富文化生活,寓技击于体育中，广泛适应性"],"C","武术是古代军事战争一种传承的技术。习武可以强身健体，亦可以防御敌人进攻。习武之人以“制止侵袭”为技术导向、引领修习者进入认识人与自然、社会客观规律的传统教化（武化）方式，是人类物质文明的导向和保障，是当代传统武学艺术的一种展示。",13],[1206,1,"“赋”作为一种文体，最早见于____。",["贾谊的文章","屈原的文章","荀子的文章","宋玉的文章"],"C","“赋”的名称最早见于战国后期荀况的《赋篇》。",0],[1207,1,"《汉书》的作者是____。",["范晔","张衡","司马迁","班固"],"D","《汉书》的作者是班固。《汉书》,又称《前汉书》,是中国第一部纪传体断代史,“二十四史”之一。由汉朝东汉时期史学家儒客大家班固编撰,前后历时二十余年,于建初年中基本修成,后唐朝颜师古为之释注。",11],[1208,1,"中国古代十大乐器里的瑟有多少根弦？",["20","25","30","35"],"B","瑟，形状似琴，有25根弦，弦的粗细不同，每弦瑟有一柱，按五声音阶定弦。最早的瑟有五十弦，故又称“五十弦”。",9],[1209,1,"基本茶类可分为绿茶、红茶、乌龙茶、白茶、____和黑茶六类。",["花茶","黄茶","青茶","春茶"],"B","“茶叶的六大基本茶类有白茶、黄茶、绿茶、红茶、乌龙茶、黑茶”。",12],[1210,1,"傣族建造竹筒楼的原因不包括？",["防蛇","防热","防潮","防洪"],"D","防洪不是竹筒楼的功能。",10],[1211,1,"《红楼梦》中贾蓉向王熙凤要一件“借去略摆一摆”的用来隔断和装饰的家具是什么？",["椅子","桌子","屏风","柜子"],"C","屏风，中国传统建筑物内部挡风用的一种家具，所谓“屏其风也”。屏风作为传统家具的重要组成部分，历史由来已久。屏风一般陈设于室内的显著位置，起到分隔、美化、挡风、协调等作用。它与古典家具相互辉映，相得益彰，浑然一体，成为中式家居装饰不可分割的整体，而呈现出一种和谐之美、宁静之美。《红楼梦》中贾蓉向王熙凤要一件“借去略摆一摆”的用来隔断和装饰的家具便是“屏风”。",10],[1212,1,"战国中后期，屈原根据民间祭祀歌所加工而成的作品是____。",["《九章》","《九歌》","《天问》","《招魂》"],"B","战国中后期屈原根据民间祭祀所加工而成的作品是《九歌》。",0],[1213,1,"甲骨文中已经出现记数单字，最小的是一，最大的是____。",["三千","三万","三十万","三亿"],"B","目前发现的最大的甲骨文数字是30000。",2],[1214,1,"下列哪种青铜器不属于用来盛装食物的食器？",["青铜鼎","青铜簋","青铜甗","青铜爵"],"D","青铜爵是夏商周时期重要的酒器，作用相当于酒杯。圆腹，也有个别方腹，一侧的口部前端有流（即倒酒的流槽），后部有尖状尾，流与口之间有立柱，腹部一旁有把手，下有三个锥状长足。",10],[1215,1,"古代代表性的兵器有战车与投石器，而一下哪一项并非典型武器？",["剑","枪","斧","箭"],"D","“代表性的兵器有战车与投石器，而武器的典型则是剑、枪、斧。”",10],[1216,1,"在哪个朝代中秋节才开始成为固定的节日？",["唐朝","宋朝","元朝","明朝"],"A","中秋节从唐朝开始成为固定节日。",1],[1217,1,"张衡发明的地动仪上有几条龙？",["8","10","12","18"],"A","“张衡发明的地动仪上共有八条龙,每一条龙代表着一个方位,分别是东、南、西、北、东南、西南、东北、西北,每个方位上均有口含龙珠的龙头,而且在每条龙头的下方都有一只蟾蜍与之相对应。",11],[1218,1,"中国古代兵器____除了是实战作用，又被列于门前，体现主人身份地位。",["铖","戈","戟","矛"],"C","中国古代兵器戟除了实战作用又被列于门前，以体现主人的身份地位。戟是古代兵器之一，是戈和矛的合体，具有勾啄和刺击双重功能，杀伤力比戈矛强，古代的显贵之家，将戟立于门前，以示官勋，所以戟有兼为仪仗。后来军队中戟逐渐为刀所取代，但仍作为仪仗器具。",10],[1219,1,"2011年3月30日国务院常务会议将每年的____确定为中国旅游日。",["五月十九","五月二九","九月十九","九月二九"],"A","中国旅游日，是每年的5月19日，非法定节假日。该节日起源于2001年5月19日，浙江宁海人麻绍勤以宁海徐霞客旅游俱乐部的名义，向社会发出设立“中国旅游日”的倡议，建议《徐霞客游记》首篇《游天台山日记》开篇之日（5月19日）定名为中国旅游日。",7],[1220,1,"我国人口最多及最少的少数民族分别是____、_____。",["回族、裕固族","壮族、珞巴族","回族、珞巴族","壮族、裕固族"],"B","我国共有56个民族，壮族是我国少数民族中人口最多的民族；人口最少的是珞巴族。",14],[1221,1,"饮茶可以延年益寿，解渴提神，下列选项中哪些不属于饮茶的益处？",["防蛀牙","抗原子辐射","治坏血病","治疗颈椎病"],"D","饮茶并不能治疗颈椎病。",12],[1222,1,"“宰相”的“宰”最早指____。",["高级官吏","官吏统称","低级官吏","皇帝"],"B","宰相”的“宰”最早指夏商周时期祭祀用的祭品,之后发展为国家的官职。 “宰”的意思是主宰,“宰相”是商朝时为管理家务和奴隶之官;周朝有执掌国政的太宰,也有掌贵族家务的家宰、掌管一邑的邑宰,实已为官的通称。",3],[1223,1,"乌龙茶又称青茶，属半发酵茶。主产于福建、广东和____。",["广西","江西","海南","台湾"],"D","台湾乌龙的主要产区包括扩台北、桃园、新竹、苗栗和宜兰等地，著名品种有青心乌龙、冰顶乌龙、东方美人、金萱茶、翠玉茶、阿里山茶、杉林溪高山茶、梨山高冷茶等。",12],[1224,1,"目的在手 “究天人之际，通古今之变，成一家之言”的著作是____。",["《楚辞》","《史记》","《汉帛》","《新书》"],"B","“究天人之际,通古今之变,成一家之言”的文学巨著是《史记》.",0],[1225,1,"“尽道隋亡为此河，至今千里赖通波。若无水殿龙舟事，共禹论功不较多。”下列关于大运河说法正确的是____。",["从扬州借助大运河可以到达大兴（长安）","大运河以汴州为中心","大运河全程是人工开挖的","大运河的主要作用是供隋炀帝乘船南下江南游玩"],"A","大运河以洛阳为中心；大运河运用了原有的自然河道，并不全是人工开挖的；大运河的主要作用是军事、经济方面；从扬州经大运河到巩县后，经三门峡，过广通渠可以到达长安（大兴）。",7],[1226,1,"在古代月圆和月缺一般形容什么？",["天气好坏","悲欢离合","凶吉象征","身体是否健康"],"B","在古代月圆和月缺一般形容人的悲欢离合。“人有悲欢离合，月有阴晴圆缺”，在地球上所看到的月球被日光照亮部分的不",14],[1227,1,"我国现存最早的药学专著是____。",["《海药本草》","《新修本草》","《五七二病方》","《神农本草经》"],"D","我国现存最早的中药学著作是《神农本草经》《神农本草经》又称《本草经》或《本经》,托名“神农”所作,实 成书于汉代,是中医四大经典著作之一,是现存最早的中药学著作。",11],[1228,1,"传说中的嫦娥是吃了谁送的灵药才飞进广寒宫的？",["西王母","东王母","玉帝","太白金星"],"A","传说是后羿射下九个太阳后被贬下凡，嫦娥叫后羿到西王母那里去求长生不老药，后羿求得两包并打算和嫦娥一起服下，",11],[1229,1,"青铜器有什么用途？",["货币","乐器","牛产工貝","以上皆是"],"D","古代青铜器的主要用于食器、酒器、水器、乐器、兵器、车马器、农器与工具、货币、玺印与符节、度量衡器、铜镜、杂器等。",10],[1230,1,"成语“一衣带水”中的“水”原指什么？",["黄河","长江","淮河","珠江"],"B","“一衣带水”中的“水”原指长江。长江发源于青藏高原的唐古拉山脉各拉丹冬峰西南侧，全长约6300㎞，比黄河长800余公里，在世界大河中长度仅次于非洲的尼罗河和南美洲的亚马逊河",7],[1231,1,"《诗经》被称为“经”是在____。",["先秦","秦代","汉代","南北朝"],"C","诗经被称为经是在“西汉时期”。《诗经》在先秦时期称为《诗》，或取其整数称《诗三百》。西汉时被尊为儒家经典，始称《诗经》，并沿用至今。",2],[1232,1,"“从来佳茗似佳人”是我国古代哪位著名诗人的名句？",["李白","杜甫","苏轼","李清照"],"C","“从来佳茗似佳人”出自苏轼的《次韵曹辅寄壑源试焙新芽》。",0],[1233,1,"____拳是一种流传于我国南方个省拳势刚烈的拳术",["太极拳","形意拳","长拳","南拳"],"D","南拳又称南方拳，是明代以来流行于南方的拳种的总称。它以福建、广东为中心，广泛流传于长江以南地区，故称南拳。作为南少林等拳种与中国南方各地拳种相结合的产物，技术套路繁多，遍布各省。由于历史悠久，再加上师承关系的演变，形成了多种打法，但多数套路...",13],[1234,1,"《左传》全称是____。",["《春秋左氏传》","《左氏春秋》","《春秋内传》","《春秋外传》"],"A","《春秋左传》又名《左传》，是我国现存的史类文学作品。相传为春秋末年的左丘明为解释孔子的《春秋》而作，实际上成书时间当在战国或两汉之间。作品记事起于鲁隐公元年(公元前722年)，止于鲁悼公十四年(公元前454年)，比《春秋》记事时间延长了许多。",2],[1235,1,"先秦最后一位儒学大师是____。",["孟子","子夏","颜渊","荀子"],"D","先秦最后一位儒学大师是荀子，他是先秦集诸子百家之大成的著名学者，是我国古代杰出的唯物主义哲学家，又是卓有成效的大教育家。",2],[1236,1,"夏季烈日炎炎，骄阳似火，古人常常借此机会曝晒衣物、书籍及其他物品，这一天被俗称为曝晒节。曝晒节是农历哪一天？",["五月初八","六月初六","七月初五","六月初九"],"B","暴晒节，是指阴历六月初六，正是盛夏，是一年中太阳光最猛的日子。",6],[1237,1,"“文章合为时而著，歌诗合为事而作”是由谁提出的？",["白居易","柳宗元","周敦颐","刘禹锡"],"A","白居易是中唐时期影响极大的大诗人，他提出了自己的文学主张：“文章合为时而著，歌诗合为事而作。”而他的诗歌主张，也主要是就早期的讽谕诗的创作而发的。",0],[1238,1,"传说中的嫦娥，是谁的妻子？",["黄帝","后羿","大禹","纣王"],"B","后羿，本称羿，是中国古代神话传说中的人物，擅于射箭，曾助尧帝射落九日，只留一日，因此在民间流传有“羿射九日”的典故。其为太阳神帝俊的臣子，嫦娥(姮娥)仙子的丈夫。",1],[1239,1,"《战国策》的编订者是____。",["孔子","刘向","班固","司马迁"],"B","《战国策》是西汉刘向整理编订的。这是我国历史上第一部国别体史书,主要记述了战国时期的纵横家(游说之士)的政治主张和策略,展示了战国时代的历史特点和社会风貌,是研究战国历史的重要典籍。",2],[1240,1,"钢笔书法书写前的执笔角度大约为____度。",["10","20","40","60"],"C","执笔的角度一般以40度左右为宜，执笔不要太低。",8],[1241,1,"月饼最初是用来做什么的？",["馈赠亲友的礼物","祭奉月神的祭品","节日食品","地方小吃"],"B","祭月在我国是一种十分古老的习俗，月饼是古代中秋拜祭月神的供品，也是中秋节的时节食品。月饼圆又圆，又是合家分吃，象征着团圆和睦。在古时候每逢中秋夜都要举行祭月。设大香案，摆上月饼、水果等祭品。在月下，将月亮神像放在月亮的那个方向，红烛高燃，全家人依次拜祭月亮，然后由当家主妇切开团圆月饼。",5],[1242,1,"“白日依山尽，黄河入海流。欲穷千里目，更上一层楼。”是王之涣《登鹳雀楼》中的诗句，请问，鹳雀楼在下面哪个省？",["山西","陕西","山东","江西"],"A","鹳雀楼在山西省。鹳雀楼又名鹳鹊楼,因时有鹳雀栖其上而得名,位于山西省永济市蒲州古城西面的黄河东岸。",7],[1243,1,"中国四大名楼不包括哪一项？",["黄鹤楼","红楼","滕王阁","岳阳楼"],"B","中国四大名楼一般指四大名楼。 四大名楼，中国古代四大名楼的总称，江西南昌滕王阁，湖北武汉黄鹤楼，湖南岳阳岳阳楼，山东烟台蓬莱阁。",10],[1244,1,"武术最初作为_____训练手段。",["搏斗","军事","健身","娱乐"],"B","武术最初作为军事训练手段，与古代军事斗争紧密相连，技击性非常明显。",13],[1245,1,"下列哪个不是合肥的别称？",["庐州","泸州","庐阳","合州"],"B","泸州，古称“江阳”，别称酒城、江城，四川省辖地级市，全国区域中心城市。",7],[1246,1,"下列书法文字最多的篇目是_____。",["千字文","兰亭序","平复帖","圣教序"],"D","《千字文》，内容有1000字；《兰亭序》全文28行、324字；《平复帖》共9行84字；《圣教序》有1904字。",8],[1247,1,"史称陶渊明不事权贵的性格表现是____。",["土木形骸，不自藻饰，恬静寡欲","傲然独得，任性不羁，而喜怒不形于色","岂能为五斗米折腰向乡里小儿","安能摧眉折腰事权贵，使我不得开心颜"],"C","中国古代有不少因维护人格，保持气节而不食的故事。“陶渊明不为五斗米折腰”就是其中最具代表性的一例。",0],[1248,1,"红茶属于什么茶？",["不发酵茶","半发酵茶","完全发酵茶","微发酵茶"],"C","红茶属于全发酵茶类，为六大茶类之一，是采摘茶树鲜叶为原料，经萎凋、揉捻、发酵、干燥、精制等工艺制成，成品茶具有条索紧结、金毫显露、滋味甜爽、汤色红亮等特点，如金骏眉、正山小种、滇红、祁门红茶、川红、英德红茶、九曲红梅都属于红茶。",12],[1249,1,"在人类历史上，第三次“兵器革命”是指什么发明？",["导弹","弓箭","火药","原子弹"],"C","在人类历史上,具有“兵器革命”意义的事件共有五次，分别是弓与投石带的发明，车轮与战车的发明，火药的发明，军用飞行器的实用化以及原子弹的发明。",11],[1250,1,"“中国结”一般都是由多少条丝绳编织而成的？",["一","二","三","四"],"A","中国结从头到尾都是用一根丝线编结而成，每一个基本结又根据其形、意命名。把不同的结饰互相结合在一起，或用其它具有吉祥图案的饰物搭配组合，就形成了造型独特、绚丽多彩、寓意深刻、内涵丰富的中国传统吉祥装饰物品。",10],[1251,1,"“揭竿为旗，斩木为兵”形容的是哪一场起义？",["赤眉起义","陈胜吴广起义","绿林起义","黄巾起义"],"B","“揭竿为旗，斩木为兵”形容的是秦末陈胜、吴广领导的农民起义。公元前209年，九百多个农民被征发到渔阳守长城。他们走到大泽乡，遇上了连日大雨冲毁了道路，不能按期到达。按照秦法，误期者要被处斩。小队长陈胜和吴广设计杀死军官，号召大家起义，于是秦末农民起义爆发 。",1],[1252,1,"“拱手而立”表示对长者的尊敬，一般来说，男子行拱手礼时应该____。",["左手在外","右手在外","双手交叉","双手相握"],"A","男子行拱手礼时，右手握拳在内，左手在外。以左示人，表示真诚与尊敬。男子右手代表攻击，左手代表尊敬，因此是左手在外包着右手。",4],[1253,1,"“一琴一鹤”所形容的是什么样的品质？",["为政清简","平安长乐","淡泊名利","骄奢淫逸"],"A","一琴一鹤原指宋朝赵抃去四川做官随身携带的东西仅有一张琴和一只鹤；形容行装简少，也比喻为官清廉。",1],[1254,1,"壁画《飞天》是下面哪个石窟的代表作？",["莫高窟","云冈石窟","龙门石窟","麦积山石窟"],"A","敦煌飞天从艺术形象上说，它不是一种文化的艺术形象，而是多种文化的复合体。飞天的故乡虽在印度，但敦煌飞天却是印度文化、西域文化、中原文化共同孕育成的。它是佛教天人和道教羽人、西域飞天和中原飞天长期交流后融合为一，具有中国文化特色的飞天。它是不长翅膀不生羽毛、没有圆光、借助云而不依靠云，主要凭借飘逸的衣裙、飞舞的彩带而凌空翱翔的飞天。敦煌飞天可以说是中国艺术家最天才的创作，是世界美术史上的一个奇迹。",8],[1255,1,"“近朱者赤，近墨者黑”所蕴含的道理和下列哪句话最相似？",["青出于蓝而胜于蓝","蓬生麻中，不扶而直","公生明，偏生暗","出淤泥而不染，濯清涟而不妖"],"B","二者都是用于比喻客观环境对人有很大影响。",1],[1256,1,"“桃李满天下”的“桃李”指什么？",["朋友","学生","同事","产业"],"B","比喻所栽培的后辈或所教的学生很多，各地都有。",14],[1257,1,"“楚河”和“汉界”在今天的哪个省？",["湖北","河南","河北","湖南"],"B","“楚河汉界”指的是河南省荥阳市黄河南岸广武山上的鸿沟。相传“楚河汉界”是汉高祖刘邦和西楚霸王项羽划定的楚汉边界，后来才慢慢搬到了棋盘上。",7],[1258,1,"“鼎”的最初用途是什么？",["祭祀用礼器","地位象征物","烹煮器具","家具装饰"],"C","最初的鼎是由远古时期陶制的食具演变而来的，主要用途是烹煮食物。自从青铜鼎出现后，它又多了一项功能，成为祭祀神灵的一种重要礼器。",10],[1259,1,"“水”字属于下列哪种汉字构成方式？",["象形字","表意字","形声字","假借字"],"A","水字属于汉字构成方式里的象形字。 象形字又被称为表意文字,是一 种最古老的字体,是由图画文字演化而来的。",1],[1260,1,"中国古代哲学中，有“阴阳八卦”的理论，这一理论出自什么书？",["《尚书》","《论语》","《周易》","《孟子》"],"C","阴阳八卦的理论出自《周易》。易为太极,是生两仪,两仪生四象,四象生八卦。",2],[1261,1,"李白的诗风是什么？",["沉郁、雄浑","豪迈、奔放","通俗、易懂","狂傲、不驯"],"B","李白的诗风:豪迈奔放,清新飘逸,想象丰富,意境奇妙,语言奇妙,浪漫主义,立意清晰。",0],[1262,1,"传说春节放炮是为了驱赶一个怪兽，这个怪兽是____。",["麒麟","蒲牢","年","龙"],"C","“年”是汉族民间传说的凶兽,头长尖角,凶猛异常。年兽长年深居海底,每到除夕,爬上岸来吞食牲畜伤害人命。因此每到除夕,村村寨寨的人们扶老携幼,逃往深山,以躲避“年”的伤害。后来,一个老人用“贴红纸”和“放鞭炮”的办法成功赶走了年兽,人们从此过年不再惧怕年兽,于是过年放鞭炮的传统也就流传了下来。",5],[1263,1,"2022年是农历什么年？",["乙亥年","丁亥年","壬寅年","辛亥年"],"C","2022年,农历是壬寅年,属相虎。",6],[1264,1,"《霓裳羽衣曲》是由谁编制的道教乐曲？",["唐太宗","唐高宗","唐玄宗","唐宪宗"],"C","《霓裳羽衣曲》即《霓裳羽衣舞》是唐玄宗为道教所作之曲,用于在太清宫祭献老子时演奏。",1],[1265,1,"我国小说史上繁荣时期在____。",["秦汉","三国","隋唐","明清"],"D","明清时期是我国古典小说的繁荣时期，秦汉、三国和隋唐时期的主要文学形式不是小说。",1],[1266,1,"主持修建芍陂水利工程的是____。",["孙叔敖","李冰","西门豹","郑国"],"A","楚国令尹孙叔敖主持治水,倾尽家资,历时三载,终于修筑了中国历史上第一座水利工程——芍陂。",11],[1267,1,"中国的古典小说中，有些在成书之前就有说书人说演。下列哪部作品在成书之前没有说书人说演？",["《西游记》","《红楼梦》","《三国演义》","《水浒传》"],"B","四大名著中《红楼梦》在成书之前没有说书人说演。",0],[1268,1,"古琴是在哪一年被联合国教科文组织列为世界第二批“人类口头和非物质遗产代表作”之一的？",["2001年","2002年","2003年","2004年"],"C","2003年11月7日下午，联合国教科文组织总干事松浦晃一郎在巴黎宣布，中国的古琴成为“人类口头和非物质文化遗产”。",9],[1269,1,"明代思想家、文学家____继承了王阳明的心学思想，他提出的“童心说”对当时的思想界以及文坛形成了巨大冲击。",["袁宏道","袁中道","李梦阳","李贽"],"D","《童心说》是明代末期杰出思想家李贽的一篇议论文，收录于《焚书》。该文写于明神宗万历十四年（1585年），主要是用来驳斥耿定向的理论。李贽在该文中主要阐述了“童心”的文学观念。“童心”就是赤子之心，“一念之本心”，实际上只是表达个体的真实感受与真实愿望的“私心”，是真心与真人得以成立的依据。李贽将认知的是非标准归结为童心。他认为文学都必须真实坦率地表露作者内心的情感和人生的欲望。",2],[1270,1,"《论语》“父母在，不远游，游必有方”一句中“方”的意思是____。",["方向，去处","方法，办法","区域，地方","理由，道理"],"A","“父母在世的时候,不出远门去求学、做官,万一要出远门,必须有一定的去处.这里“方”指一定的去处,不让父母担心的去处。”",2],[1271,1,"我国第一个热带植物园是____。",["兴隆热带植物园","呀路古热带植物园","葫芦岛热带植物园","西双版纳热带植物园"],"D","中国科学院西双版纳热带植物园，隶属于中国科学院，始建于1958年，是我国第一个热带植物园位于中国云南省西双版纳傣族自治州勐腊县勐仑镇，是集科学研究、物种保存和科普教育为一体的综合性研究机构和风景名胜区，在2011年7月被评为国家5A级旅游景区。",7],[1272,1,"位于滇西边陲、高黎贡山西麓，早在公元前2世纪便是西南丝绸之路上的边关小镇，被称为“极边第一城”的是____。",["施甸","祥云","腾冲","龙陵"],"C","​​腾冲被称为“极边第一城”,相传是徐霞客所题。",10],[1273,1,"抗日战争时期，中国唯一的一条国际通道是____。",["中印公路","滇桂公路","滇缅公路","滇黔公路"],"C","抗日期间，我国沿海口岸及对外交通要道先后沦陷，1938年新开辟的滇缅公路，成为战时我国唯一的国际通道。",1],[1274,1,"韩非子是战国末期法家思想的集大成者，下列著作中，与韩非子无关的是____。",["《孤愤》","《五蠹》","《德立》","《说难》"],"C","《德立》的作者为慎子。",2],[1275,1,"作为先秦法家的主要代表人物，商鞅在推行变法改革中最大的特点是____。",["“壹刑”","“重刑”","“任法”","“明法”"],"B","商鞅变法核心内容是“重农”和“法治”。为推行“法治”而提出“重刑”,指轻罪重罚,就是用恐怖手段制造一种威慑力量,驱使民众就统治阶级之范。即公开主张“禁奸止过,莫若重刑”。",1],[1276,1,"春秋时期，推行富国强兵的改革措施，建议齐桓公树立“尊王攘夷”旗帜的是____。",["管仲","鲍叔牙","孙叔敖","商鞅"],"A","齐桓公元年（前685年），管仲得到鲍叔牙推荐，担任国相，辅佐齐桓公成为春秋五霸之首。对内大兴改革、富国强兵；对外尊王攘夷，九合诸侯，一匡天下，被尊称为“仲父”。",2],[1277,1,"神话是苗族文学中最古老的类型，体现了苗族先民对宇宙万物的认识。下列神话故事中，不属于苗族的是____。",["《天地争霸》","《枫木生人》","《板东辰》","《人祖阿丹》"],"D","《人祖阿丹》是回族古代神话传说之一。",0],[1278,1,"谁通过多年征战，于1616年统一了女真各部，建立后金政权？",["完颜阿骨打","努尔哈赤","皇太极","多尔衮"],"B","明朝后期，女真杰出首领努尔哈赤统一了女真各部。1616年努尔哈赤自立为汗，建立了后金。后金建立后，多次打败明军，夺取了明朝广大地区。1635年，皇太极改女真族名为满洲，1636年，皇太极改国号为清。",1],[1279,1,"在中国古代科举考试制度中，殿试的第一名被称为____。",["状元","榜首","榜眼","解元"],"A","中国古代科举制度中，通过最后一级考试者，称为进士。是古代科举殿试及第者之称。意为可以进授爵位之人。此称始见于《礼记·王制》。隋炀帝大业年间始置进士科目。唐亦设此科，凡应试者谓之举进士，中试者皆称进士。元、明、清时，贡士经殿试后，及第者皆赐出身，称进士。且分为三甲：一甲3人，赐进士及第；二、三甲，分赐进士出身、同进士出身。考中进士，一甲即授官职，其余二甲参加翰林院考试，学习三年再授官职。",3],[1280,1,"《三国演义》讲述了许多经典故事，也塑造了许多栩栩如生的人物形象。“单骑救主”故事中的主人公是____。",["关羽","张飞","赵云","马超"],"C","单骑救主，出自元末明初罗贯中的小说《三国演义》第四十一回“刘玄德携民渡江 赵子龙单骑救主”，原型为东汉建安十三年(公元208年)曹操追击刘备于当阳长坂坡，随军眷属被曹军围困，部将赵云身抱刘备之子阿斗，奋勇血战，力保刘妻甘夫人突围，使其母子二人幸免于难之事。",0],[1281,1,"被世人形容“口蜜腹剑”的是唐朝哪一个大臣？",["李林甫","杨国忠","魏征","房玄龄"],"A","“口蜜腹剑”是李林甫官场攀升之路的武器，凡是有才能、功绩、声望的人才必定要受到李林甫的打压，他依靠这种本事，久居宰相之位，对朝廷和国家造成不可估量的损失。",3],[1282,1,"我国长期以来把“和平共处五项原则”作为我们处理对外关系的基本准则。请问，它与哪位思想家“兼爱非攻”的思想不谋而合？",["韩非子","墨子","庄子","荀子"],"B","“兼爱非攻”墨家学派的主要思想观点。其它节用、节葬、非乐等主张，也都是由此而派生出来的。",2],[1283,1,"俗称“昆明海”或“昆明湖”，为中国西南地区第一大湖，有“高原明珠”之誉的是____。",["鄱阳湖","太湖","滇池","青海湖"],"C","滇池,位于昆明市的西南,它也被称昆明湖和滇海。注入它的河流有很多,有盘龙江等,所以它的面积是很大的。它还是云南省最大的淡水湖,有着高原明珠的称号。",7],[1284,1,"在云南，三多节是哪个少数民族的传统节日？",["傈僳族","纳西族","景颇族","傣族"],"B","三多节为每年的农历二月初八，纳西语叫“三多颂”，源于白沙玉龙村北岳庙会，是纳西族法定民族节日、纳西族传统节日、纳西族祭祀本民族的最大保护神的盛大节日。",5],[1285,1,"《猴梨园》讲述了一只猴子经过主人训练之后，可以灵活模仿梨园戏子的各种动作的故事。《猴梨园》的作者是____。",["朱熹","袁枚","徐芳","李梦阳"],"C","《猴梨园》讲述了一只猴子经过主人训练之后，可以灵活模仿梨园戏子的各种动作的故事。",9],[1286,1,"“止戈为武”的意思是，停止动用武器才是真正的武功，最早提出这一观点的是____。",["齐桓公","楚庄王","晋文公","汉文帝"],"B","“止戈为武”的意思是，停止动用武器才是真正的武功，最早提出这一观点的是楚庄王。",1],[1287,1,"在《论语·宪问》里，孔子说：“微管仲，吾其披发左衽矣。”其中“衽”的意思是____。",["压襟","袖口","衣襟","腰带"],"C","《论语·宪问》里有一条孔子语录：“微管仲，吾其被发左衽矣”。这句话直接翻译的意思是：如果没有管仲，我们恐怕要披头散发穿左衽的衣服了。其中“衽”指的是衣襟。",2],[1288,1,"“我善养吾浩然之气”是诸子中谁说的？",["孔子","孟子","庄子","老子"],"B","“我善养吾浩然之气”是孟子说的。原文：（公孙丑问曰）：“敢问夫子恶乎长？”曰：“我知言，我善养吾浩然之气。”",2],[1289,1,"“古今多少事，都付笑谈中”表达了词人淡泊洒脱的情怀，词句的作者是____。",["苏轼","陆游","杨慎","辛弃疾"],"C","“古今多少事,都付笑谈中”表达了词人淡泊洒脱的情怀,词句的作者是杨慎。",0],[1290,1,"我国自古就是农业大国，水患治理和农业灌溉关系国计民生。春秋战国时期，掌管土木工程的大臣官职名称为____。",["司徒","司空","司马","司寇"],"B","司徒掌管土地和劳役；司马掌管军事；司空掌管土木工程建立；司寇掌管刑罚。",2],[1291,1,"汉武帝时期实施的____首次将“二十四节气”订入历法。",["《大衍历》","《太初历》","《授时历》","《大明历》"],"B","汉武帝时期实施的《太初历》首次将“二十四节气”订入历法。",6],[1292,1,"“今圣王没，名守慢，奇辞起，名实乱。”这句话出自____。",["《荀子》","《孟子》","《论语》","《老子》"],"A","“今圣王没，名守慢，奇辞起，名实乱”出自《荀子》。《荀子》全书一共32篇，是战国时期荀子和弟子们整理或记录他人言行的哲学著作。",2],[1293,1,"中国古代著名医药典籍《滇南本草》的作者是____。",["张仲景","兰茂","李时珍","孙思邈"],"B","《滇南本草》是我国民族医药经典名著。作者兰茂，字廷秀，号止庵，云南嵩明杨林人，祖籍河南洛阳。",11],[1294,1,"《三十六计》是体现我国古代卓越军事思想的一部兵书，下列不属于《三十六计》的是____。",["浑水摸鱼","反戈一击","笑里藏刀","反客为主"],"B","反戈一击不是三十六计。 反戈一击不属于三十六计,反戈一击的出处明代罗贯中的《三国演义》第十七回,反戈一击指的是调转枪头向原来所属的阵营进攻,比喻一旦觉悟,回过头来对自己一方的坏人坏事进行揭露和斗争。",1],[1295,1,"下面哪个剧种被称为“中国百戏之师”？",["京剧","黄梅戏","昆曲","越剧"],"C","昆曲。昆曲是明朝中叶至清代中叶戏曲中影响最大的声腔剧种，很多剧种都是在昆剧的基础上发展起来的，被称为“百戏之祖，百戏之师”，有 “中国戏曲之拓展资料昆剧（Kun Opera），原名“昆山腔”、“昆腔”，是中国古老的戏曲声腔、剧种。清代以来被称为“昆曲”，现又被称为“昆剧",9],[1296,1,"被誉为“万国之园”的是____。",["颐和园","圆明园","静明园","西花园"],"B","被誉为“万国之园”的是圆明园。 圆明园又称圆明三园,是清代一座大型皇家园林,它坐落在北京西北郊,与颐和园毗邻,由圆明园、长春园和绮春园组成,所以也叫圆明三园。",1],[1297,1,"哪个不是中国六大古都？",["南昌","开封","西安","洛阳"],"A","六大古都是西安、洛阳、开封、杭州、南京、北京。",7],[1298,1,"柳宗元在《三戒》中通过叙述哪三种动物的故事，隐喻应当引以为戒的三种社会现象？",["麋鹿、驴子、老鼠","老虎、驴子、老鼠","狼、狐狸、老虎","麋鹿、狼、狐狸"],"A","作者通过麋、驴、鼠这三种动物形象，借题发挥，揭露了当时一些达官贵人、得意小人的丑态，并预言其必然灭亡的命运。文章语言简洁凝练，以小见大，耐人寻味，具有强烈的现实讽刺意义。",0],[1299,1,"老子认为，“失道而后德，失德而后仁，失仁而后义，失义而后礼”。孔子则说，“不学礼，无以立”，要“非礼勿视，非礼勿听，非礼勿言，非礼勿动”。这反映出，当时的他们____。",["迎合封建贵族政治诉求","反思西周的礼乐文化","主张维护夏商周制度","得到统治者的积极支持"],"B","老子的意思是，失去了“道”而后才有“德”，失去了“德”而后才有“仁”，失去了“仁”而后才有“义”，失去了“义”而后才有“礼”。他认为礼是道德缺失后的产物，所以是反对礼；而孔子则认为礼是一个人立身之本，倡导礼。这体现了两位思想家对周礼的反思，B项正确。",2],[1300,1,"李清照“绿肥红瘦”描写的是什么季节的景色？",["晚春","仲夏","孟夏","深秋"],"A","李清照词中的绿肥红瘦描写的是晚春的景色。",0],[1301,1,"西汉初期，道家学说兼采阴阳、儒、墨、名、法各家学说的精髓；后来董仲舒的儒家学说也吸收阴阳五行、法、道等各种思想。促成当时学术思想上呈现这种特征的主要因素是____。",["王国势力强大","百家争鸣局面的延续","现实统治需要","兼收并蓄的文化政策"],"C","根据所学知识可知，“王国势力强大”是董仲舒新儒学出现的一个因素，但不是主要因素，A项错误；百家争鸣局面在秦朝建立后被中断，其政治、经济社会环境均不存在，B项错误；汉初，统治者信奉黄老之学，是适应汉初经济恢复的需要，汉武帝时代，为适应加强中央集权的需要，董仲舒修正儒家学说，兼采他家思想，符合时代需求，故C项正确。汉武帝采纳董仲舒的建议，实行“罢黜百家，独尊儒术”的思想政策，D项错误。",2],[1302,1,"八斗正在参观一场书法展，当他看到一幅幅书法作品时便觉得好奇——古人是如何创造出汉字的？为了解开心中的疑惑，八斗准备去图书馆查找相关图书，探究古人造字的艺术。下面哪本书对八斗最有帮助？",["《尔雅》","《方言》","《释名》","《说文解字》"],"D","《尔雅》是我国最早的一部词典，收集了比较丰富的古代汉语词汇，它是辞书之祖;《方言》是世界语言学史上最早的方言比较词汇集;《释名》是我国词源学第一部专著，该书主要以声训来探寻事物命名之源;《说文解字》是中国第一部系统地分析汉字字形和考究字源的字书，首次对汉字造字法（即“六书”）做出了具体的解释。",8],[1303,1,"祝岁习俗古已有之。《诗经》云:“称彼兕觥(酒杯)，万寿无疆。”汉代岁首，皇帝“大朝受贺”“百官受赐宴飨”。民间亦在岁首祭祀，其时全家依次列坐，向家长敬酒祝寿。该习俗____。",["出现于战国并兴盛于汉代","体现礼仪教化与伦理秩序","植根于我国古代商业文明","仅是官方举行的庆祝仪式"],"B","由材料可知，祝岁习俗由来已久，从皇帝到普通百姓都很重视，通过举行各种仪式来体现对君主或长辈的敬意与美好期盼，体现了通过节庆礼仪进行教化和对伦理秩序的认同，B项正确。由材料中《诗经》的记述可知，该习俗在西周时就已经出现，排除A项；该习俗植根于我国古代农耕文明，排除C项；由材料可知，祝岁习俗并不仅是官方举行的庆祝仪式，在民间也有，排除D项。",1],[1304,1,"木板年画发源于四大名镇中的____。",["汉口镇","景德镇","朱仙镇","佛山镇"],"C","木版年画发源于四大名镇中的朱仙镇。朱仙镇木版年画起源于唐，兴于宋，鼎盛于明清，历史悠久，源远流长，是中国四大木版年画之一，其制作采用木版与镂版相结合，水印套色，种类繁多，所用原料为炮制工序，用纸讲究，色彩艳丽，庄重深厚，题材和内容大多取材于历史戏剧、演义小说、神话故事和民间传说",1],[1305,1,"李贺在唐代被称为____。",["诗佛","诗仙","诗圣","诗鬼"],"D","诗佛是唐代诗人王维，诗仙是指李白，诗圣是杜甫。",0],[1306,1,"唐代著名画家阎立本的《步辇图》，描绘了唐太宗李世民接见吐蕃使臣的情景。该作品体现了____。",["西域风情与中土文化的交汇","文人意趣与市井风情的杂糅","艺术审美与史料价值的统一","现实主义与浪漫主义的融合"],"C","《步辇图》反映的是唐太宗接见吐蕃使臣的情景，可作为研究唐朝民族关系的史料，具有一定的史料价值；该绘画作品典雅绚丽，线条流畅，构图错落有致，画面中人物栩栩如生，具有较高的艺术价值，可见该作品是艺术审美和史料价值的统一，C项正确。该绘画作品反映的是唐太宗接见吐蕃使者，不能体现西域风情与中土文化交汇，排除A项；“市井风情”“浪漫主义”在材料中不能体现，排除B、D项。",1],[1307,1,"经魏晋多名士，有著名的竹林七贤，《与山巨源绝交书》是竹林七贤中的谁写给山涛的？",["阮籍","嵇康","刘伶","向秀"],"B","嵇康《与山巨源绝交书》,是魏晋时期“竹林七贤”之一的嵇康写给朋友山涛(字巨源)的一封信,也是一篇名传千古的著名散文。",2],[1308,1,"唐代杜佑《通典》称:“理(治)道之先，在乎行教化。”该书内容分为食货、选举、职官、礼、乐、兵、刑、州郡、边防九门，其中“礼门”占全书篇幅的一半。从内容上看，杜佑修撰《通典》特别强调____。",["道家的无为而治","史学的通古贯今","儒家的伦理纲常","理学的格物致知"],"C","结合所学内容可知，礼是儒家重要的思想范畴，“礼门”占了《通典》全书篇幅的一半，说明该书强调儒家的伦理纲常，C项正确。根据“礼门”所占篇幅可知是强调了儒家的伦理纲常，而非道家的无为而治和史学的通古贯今，排除AB项；理学出现在宋代，排除D项。",2],[1309,1,"我国首次完成太空授课的是____。",["刘洋","王亚平","杨利伟","聂海胜"],"B","我国首次太空授课的人是王亚平。授课的具体时间是神舟十号，在2013年6月20日10时许，当时我国首次太空授课开始，由王亚平航天员在天宫一号开展基础物理实验，展示失重环境下物体运动特性、液体表面张力特性等物理现象。",1],[1310,1,"北宋时期，平民____发明了活字印刷术。",["毕昇","蔡伦","张衡","祖冲之"],"A","北宋毕昇发明的活字印刷术。印刷术是中国古代汉族劳动人民的四大发明之一。它开始于唐朝的雕版印刷术，经宋仁宗时代的毕昇发展、完善，产生了活字印刷。",11],[1311,1,"下列历史事件发生在我国封建社会的是____。",["夏朝建立","盘庚迁都","武王伐纣","陈胜吴广起义"],"D","A、B、C项均是发生在我国奴隶社会时期的历史事件，D项发生在秦朝末年。",1],[1312,1,"我国第一部纪传体通史是____。",["《尚书》","《春秋》","《左传》","《史记》"],"D","我国第一部纪传体通史是《史记》。《史记》是我国西汉著名史学家司马迁撰写的一部纪传体史书,位列二十四史之首,与后来的《汉书》、《后汉书》、《三国志》合称。",2],[1313,1,"明中叶以后，添加插画的书籍大量刊行，出现了众多以绘画为主体的画本，甚至一些知名画家也受雇于坊刻。这说明当时____。",["画本成为知识传播主要载体","市民文化是社会主流文化","社会审美旨趣出现阶层分化","书籍出版商业化程度加深"],"D","根据“添加插画的书籍大量刊行，出现了众多以绘画为主体的画本，甚至一些知名画家也受雇于坊刻”可得出随着商品经济的发展，书画为了适应商品经济发展而作出了调整，即应市场所需进行创作，D项正确。A项与材料主旨无关，排除；市民文化不是主流，排除B项；阶级分化的说法从材料不能得出，排除C项。",8],[1314,1,"被誉为“东方的莎士比亚”的明代戏剧家是____。",["关汉卿","汤显祖","王实甫","孔尚任"],"B","汤显祖是明代伟大的戏剧家，被誉为“东方的莎士比亚”。他的代表作是《牡丹亭》。",9],[1315,1,"在我国古代的朋友交往中，情趣一致、十分要好的朋友是下面的哪一种？",["肺腑之交","莫逆之交","八拜之交","同道之交"],"B","“莫逆之交”指非常要好的朋友，出自于战国·庄周《庄子·大宗师》。",4],[1316,1,"我国现存唐代最古老，规模最大的木质建筑群是____。",["唐代五台山古刹佛光寺和南禅寺","应县木塔","阿房宫","唐代西安大雁塔"],"A","我国现存最早的木建筑古建木结构建筑是山西五台山南禅寺。",10],[1317,1,"国画《愚公移山》作者是____。",["齐白石","徐悲鸿","祝允明","唐伯虎"],"B","《愚公移山》创作于1940年，是徐悲鸿在印度期间历时三个月绘制完成的巨幅设色水墨画。",8],[1318,1,"唐宋八大家属于唐朝的是____。",["韩愈","王安石","苏轼","欧阳修"],"A","唐宋八大家是唐代韩愈、柳宗元和宋代欧阳修、苏洵、苏轼、苏辙、王安石、曾巩八位散文家的合称。",0],[1319,1,"台湾在三国时期称为____。",["夷州","流求","东番","铜鼎"],"A","台湾在三国时期被称为夷州。根据西晋陈寿《三国志·吴志·孙权传》中记载，孙权听说夷州（今台湾）有数万家。",10],[1320,1,"中国小年要吃____。",["元宵","饴糖","腊八粥","饺子"],"B","小年这一天，有吃饴糖的习俗，如有民谣说“二十三，糖瓜粘”。",5],[1321,1,"明清两代的科举考试中,会试放榜在农历四月十五日,该榜也被称为以下哪种?",["杏榜","桂榜","正榜","副榜"],"A","因为当时正值阳春四月，杏花绽放，故称“杏榜”。会试放榜，可谓“杏榜题名”，得中者就是“贡士”，杏榜的头名就是“会元”。",3],[1322,1,"张渭《别韦郎中》一诗中有“不知郎中桑落酒，教人无奈别离何”一句，句中所提到的“桑落酒”原产地在____。",["永济","桑落","汾阳","绵竹"],"A","桑落酒是我国传统的历史名酒，产于永济市。永济古称“河东”“阿中”“蒲州” 据文献记载：“北魏，河东郡多流离，谓之徙民。民有姓刘名白堕者，宿擅工酿，采挹河流，酿成芳酎，悬食同枯枝之年，排干桑落之辰，故酒得其名，最佳酌矣。”距今已有1600年的历史。",12],[1323,1,"“天道有常，不为尧存，不为桀亡。”是百家中哪位思想家的观点？",["孟子","韩非子","荀子","老子"],"C","“天道有常,不为尧存,不为桀亡”是儒家荀子的观点。",2],[1324,1,"下列哪个不是端午节的意义？",["纪念屈原","纪念伍子胥","纪念范蠡","纪念秋瑾"],"C","端午节的意义有纪念屈原、伍子胥和秋瑾。",5],[1325,1,"下列不属于中医的“五术”是____。",["山","医","命","坤"],"D","中医中的五术是指山、医、命、相、卜。",11],[1326,1,"爵是一种典礼时用的酒器，那么爵有几只脚?",["三只脚","两只脚","四只脚","五只脚"],"A","爵是中国古代一种用于饮酒的容器，三足，以不同的形状显示使用者的身份，在商代和的西周青铜礼器的考古发现中是非常常见的。",10],[1327,1,"孔子是____人。",["秦国","鲁国","卫国","宋国"],"B","孔子(公元前551年9月28日－公元前479年4月11日)，子姓，孔氏，名丘，字仲尼，鲁国陬邑(今山东曲阜市)人，祖籍宋国栗邑(今河南省夏邑县)，中国古代思想家、政治家、教育家，儒家学派创始人。",2],[1328,1,"陶渊明的故乡是____。",["九江县","星子县","九江市","南昌市"],"A","陶渊明的故乡在今天的江西九江。",0],[1329,1,"以下哪一个名称的由来与伍子胥有关?",["月老","千金小姐","新郎","岳父"],"B","古时把富贵人家的未婚女孩称为“千金小姐”。公元前522年，伍子胥父兄被楚平王杀害。伍子胥逃离楚国，投奔吴国。途中他饥困交加，见一位浣纱姑娘竹筐里有饭，于是上前求乞。姑娘顿生恻隐之心，慨然相赠。伍子胥饱餐之后，出于安全原因，要求对方为他的行为保密。姑娘觉得人格受辱，遂抱起一石，投水而亡，以死明志。伍子胥见状，羞愤不已。他咬破手指，在石上血书：“尔浣纱，我行乞；我腹饱，尔身溺。十年之后，千金报德！”后来，伍子胥在吴国当了国相，吴王调遣劲旅攻入楚国。公元前506年，伍子胥“掘楚平王墓，其尸鞭之三百”。伍子胥报了大仇之后，又想到要报恩，但苦于不知姑娘家地址，于是就把千金投入她当时跳水的地方。这就是千金小姐的由来。",7],[1330,1,"苏轼的《题西林壁》如今刻在____。",["西林寺","东林寺","庐山","龙虎山"],"A","苏轼的题西林壁原本是刻在江西庐山西林寺,后面经过移动后,又到了庐山的东林寺,随着时间的推移,遗迹早已被毁,为了纪念当时,东林寺现有仿制刻在东林寺寺碑之上。",10],[1331,1,"王维擅长的诗体是____。",["咏物诗","咏景诗","山水田园诗","叙事诗"],"C","王维擅长的诗体是山水田园诗。",0],[1332,1,"耳环最原始的作用是____。",["女性身份的象征","约束女性的行为","装扮作用","表示女性已婚"],"B","“耳环最原始的作用是约束女性的行为,据说当时因为有些妇女过于活跃,不甘居守,有人便想出在女子的耳上扎上一孔,并悬挂上耳珠,以提醒她们生活检点,行动谨慎。",14],[1333,1,"我们用“羞花”来形容历史上哪位美女？",["西施","杨贵妃","貂蝉","王昭君"],"B","西施、王昭君、貂蝉和杨玉环被称为中国古代四大美女,沉鱼讲的是西施浣纱的故事,落雁讲的是昭君出塞的故事,闭月讲的是貂蝉拜月的故事,羞花讲的是杨玉环醉酒观花的故事。",1],[1334,1,"王冕在“冰雪林中著此身，不同桃李混芳尘。忽然一夜清香发，散作乾坤万里春。”这首诗中赞美的是什么花？",["菊花","兰花","梅花","杏花"],"C","这首诗歌咏了白梅的高洁品格。它生长在冰天雪地的严冬，傲然开放，不与桃李凡花相混同。忽然一夜花开，芳香便传遍天下。诗人既是咏物，也是歌咏人的精神品格。表达了作者对白梅的喜爱之情。",0],[1335,1,"在我国汉代,缴纳一定数额的钱财，就可以入选做官，这种方式属于下面的哪一种？",["献赋","纳赀","通经","通事"],"B","纳赀捐官，意思是向朝廷交纳钱财得到一个官职。赀的意思是钱财。",3],[1336,1,"《红楼梦》四大家族中没有下列哪个姓氏？",["吴","贾","王","史"],"A","《红楼梦》中的四大家族是：贾家、史家、王家、薛家。",0],[1337,1,"以下不属于中医别称的是____。",["杏林","悬壶","黄芪","歧黄"],"C","杏林、岐黄及悬壶都是中医的别称。",11],[1338,1,"中国古代宫殿建筑普遍采用什么颜色？",["黄色","紫色","红色","蓝色"],"C","中国古代宫殿主体能够被阳光晒到的地方一般都是用的暖色，特别是朱红色，在阴影的部位一般都是用更多蓝绿相配的冷色，形成一种悦目的对比。",10],[1339,1,"中国全部少数民族语言分为几个系？",["5个","6个","7个","8个"],"A","中国的全部少数民族语言分属五个语系:汉藏语系、阿尔泰语系、南亚语系、南岛语系、印欧语系。",1],[1340,1,"七夕节中国人通常吃____。",["蒿饼","巧果","汤圆","竹筒饭"],"B","七夕节中国人通常吃巧果、酥糖等。巧果即是七夕果、乞巧果子,主要原材料是面粉和鸡蛋,是山东地区的特色传统糕点、七夕的应节食品,也是绍兴地区的七夕必备食品。",5],[1341,1,"苗族的传统乐器是____。",["笙","笛","萧","芦笙"],"D","苗族的传统乐器有芦笙、唢呐、箫笛、胡琴、月琴等。",9],[1342,1,"清代，纂修宗谱成为一种普遍的社会行为，每部宗谱均有族规、家训，其内容主要包括血缘伦理、持家立业、报效国家等。这表明，宗谱的纂修____。",["反映了科举制度的导向作用","体现了儒家思想观念","维持了士族家庭的血统纯正","确立了四民社会结构"],"B","根据题目中“主要包括血缘伦理、持家立业、报效国家等”可知清代纂修宗谱重视宗族血缘关系，强调齐家治国平天下的理念，可见深受儒家思想的影响，B项正确。题目中没有涉及科举选官制的作用，排除A项；宗谱中族规是对各阶层的本宗族成员日常生活行为的规定，不只是针对士族家庭，排除C项；四民社会是传统中国社会形态特征，其主体由士、农、工、商四大社会集团构成，题目中未涉及这一内容，排除D项。",3],[1343,1,"不属于中国四大佛山的是____。",["普陀山","武当山","九华山","峨眉山"],"B","四大佛山分别是山西五台山、浙江普陀山、四川峨眉山、安徽九华山。",7],[1344,1,"秦始皇统一了全国汉字，这种字叫做____。",["隶书","小篆","楷书","行书"],"B","秦始皇统一天下后,丞相李斯在大篆的基础上创制小篆,作为秦朝文字的统一标准。",8],[1345,1,"中华民族的摇篮是____。",["黑龙江流域","松花江流域","黄河流域","长江流域"],"C","我国境内早期的先民称华夏族,华夏民族的祖先是炎帝和黄帝,他们都生活在黄河中游一带,因此,黄河流域是中华民族的摇篮。",7],[1346,1,"我们常说”鸿雁传书“源自于哪个历史故事？",["文姬归汉","霸王别姬","苏武牧羊","楚汉相争"],"C","我们常说的鸿雁传书源自于汉武帝时期苏武的故事。汉武帝时期，有个特别有名的人物叫苏武。",1],[1347,1,"“一日不见，如隔三秋”里的“三秋”是指____。",["三个月","三年","三个季度","三十年"],"C","“三秋”指的是时间：三个季度/季节（九个月时间）。经常用“一日不见，如隔三秋”来表达对别人的思念。一般被用来比喻虽然时间很短暂，却但却让人感觉很久一样。",2],[1348,1,"“阳关大道”原是指通往____的道路。",["东海","西域","南国","中原"],"B","阳关大道原指经过阳关通往西域的官道，阳关是汉朝设置的边关名，故址在今甘肃省敦煌县西南，古代跟玉门关同是出塞必经的关口。《元和郡县志》云，因在玉门之南，故称阳关。",7],[1349,1,"下列哪个称号不是端午节的别称？",["诗人节","六月节","地腊节","女儿节"],"B","六月节不是端午节的别称。在我国传统节日中,端午节有别名近30个,堪称节日别名之最,如端阳节、重午节、五月节、午日节、浴兰节、菖蒲节、女儿节、龙舟节、龙日节、天中节、地腊节、躲午节、当五汛、解粽节、粽子节、屈原日、诗人节等。",5],[1350,1,"《爱莲说》中，“花之隐逸者，花之富贵者，花之君子者”分别指的是哪个？",["梅 兰 竹","菊 牡丹 竹","菊 牡丹 莲","兰 牡丹 莲"],"C","予谓菊，花之隐逸者也；牡丹，花之富贵者也；莲，花之君子者也。",1],[1351,1,"下列选项中不属于古文字范畴的是____。",["小篆","行书","金文","甲骨文"],"B","书是一种字体，不属于古文字范畴。",8],[1352,1,"宗教对文学艺术作品的创作影响深远，下列艺术作品中，受到道教影响的是哪一项？",["吴道子《八十七神仙卷》","顾恺之《洛神赋图》","黄公望《富春山居图》","张萱《捣练图》"],"A","《八十七神仙卷》是一幅白描画像，描绘了87位道教人物从天而降，列队行进的场景。",0],[1353,1,"下列哪项不是端午节的习俗？",["挂香包","插艾蒿","登高采菊","喝雄黄酒"],"C","登高采菊是重阳节的习俗。",5],[1354,1,"“福兮祸之所倚，祸兮福之所伏”一语出自哪里？",["孔子","老子","庄子","孟子"],"B","《老子》第五十八章：“祸兮福之所倚；福兮祸之所伏。”",2],[1355,1,"孟子说：“不以规矩，不成方圆”，这里“规矩”的意思是____。",["法律法度","美德善行","圆规曲尺","道德准则"],"C","“不以规矩,不成方圆。”其中“规矩”的意思是圆规曲尺。",2],[1356,1,"中国古代以干支纪年。韩国平昌冬奥会举办的2018年是戊戌年，那么北京冬奥会举办的2022年是什么年？",["甲辰年","壬寅年","辛丑年","庚子年"],"B","冬奥会的举办时间是 2022 年，对应的是壬寅年。",6],[1357,1,"道家思想在我国影响深远，请问历史中的哪一时期最接近道家所主张的无为而治？",["文景之治","光武中兴","贞观之治","开元盛世"],"A","文景之治是指西汉汉文帝、汉景帝统治时期出现的治世。汉初，因多年战乱导致社会经济凋敝，汉廷推崇黄老治术，采取“轻徭薄赋”、“与民休息”的政策。",2],[1358,1,"下列哪个不是北京的别称？",["大都","中都","上都","北平"],"C","自秦汉以来北京地区一直是中国北方的军事和商业重镇，名称先后称为蓟城、燕都、燕京、涿郡、幽州、南京、中都、大都、京师、顺天府、北平、北京等。上都地区在金代称金莲川或凉陉﹐筑有景明宫。位于今内蒙古自治区锡林郭勒盟正蓝旗境内，多伦县西北闪电河畔。所以说“上都”不是北京古代的称号。",7],[1359,1,"八斗的爷爷正在翻阅一本有关古代器具的书，八斗凑过去看到了很多有趣的器皿。爷爷将图注遮住，问他：你知道哪个是专门用来盛酒的器皿吗？八斗一时回答不上来，你能帮他找出来吗？",["觚","爵","鼎","卣"],"D","觚、爵是古代的饮酒器，鼎是古代用来煮肉和盛肉的器皿，卣是古代的盛酒器。",10],[1360,1,"《古诗十九首》是中国古代文人五言诗选辑，有人认为它是“五言之冠冕”，还有人认为其“文温而丽，意悲而远，惊心动魄”，这两句对《古诗十九首》的评价出自以下哪两位名家？",["锺嵘、严羽","严羽、袁枚","刘勰、锺嵘","刘勰、袁枚"],"C","“五言之冠冕”是刘勰在《文心雕龙》中对《古诗十九首》的评价，言其代表五言诗的最高成就;“文温而丽，意悲而远，惊心动魄”是锺嵘在《诗品》中对《古诗十九首》的高度赞美，极言其辞藻华丽、意境深邃、深入人心。",0],[1361,1,"假如你是古希腊时期的公民，正在街头围观苏格拉底宣扬他的哲学思想，而此刻，你的好友小文正在位于世界东方的中国聆听当地思想家的言论，那么他可能听到以下哪种言论？",["万物皆只是一个天理","刑过不避大臣，赏善不遗匹夫","己所不欲，勿施于人","天行有常，不为尧存，不为桀亡"],"C","“己所不欲，勿施于人”是孔子（公元前551年—公元前479年）的主張，他生活的时期早于苏格拉底（公元前469年—公元前399年）。“万物皆只有一个天理”是宋代二程（程颢、程颐）（约1032—1107年）的思想主张。“刑过不避大臣，赏善不遗匹夫”是韩非子（约公元前280年—公元前233年）的主张。“天行有常，不为尧存，不为桀亡”是荀子（约公元前313年—公元前238年）的观点。",2],[1362,1,"下列说法不正确的一项是____。",["癸巳、戊戌都指年份。中国自古便有十天干与十二地支，形成天干地支纪年法。","微服，是指为隐藏身份、避人耳口而改换成平民的服装，古代专指有身份的官吏私访。","请老，指古代官吏请求退休。退休制度是我国古代官僚制度的一个重要组成部分。","行辈，即排行和辈分。儒家文化强调论资排辈，汉族重宗族的观念一直延续至今。"],"B","“专指有身份的官吏”错误，还有帝王。",6],[1363,1,"下列说法不正确的一项是____。",["从春秋战国至宋元明清，多把中原王朝政权统辖范围之内的地区称为“中国”。","北宋时，为加强中央集权，将领不能专兵，凡遇战事，在将领中选拔一人给予“都统制”的名义节制兵马。","年号是中国古代封建皇帝用以纪年的名号，一个皇帝只有一个年号，所以常常用年号来称呼皇帝。","古代的官员因为年龄或别的原因辞官不做了，称“致仕”或“休致”，也指官员退休。"],"C","一个皇帝可以有多个年号。",1],[1364,1,"下列说法正确的一项是____。",["嗣位、即位：特指皇帝登上皇位，表示此意思的词还有登基、禅位、践阼等等。","古代常用纪年法有干支纪年法（十天干与十二地支两字相配，60年周而复始），王公即位年次纪年法，年号纪年法，年号干支兼用法，生肖纪年法等。","进士，中国古代科举制度中，通过朝廷最后一级考试者，称为进士。古代科举考试按照等级次序先后分为院试、会试、乡试、殿试。","车驾、陛下指皇帝，习惯上，唐朝以前对殁世的皇帝一般简称谥号，如汉武帝、隋炀帝；唐朝以后，由于谥号的文字加长，则改称庙号，如唐太宗、宋太祖等，到了明清两代才用年号来称呼，比如“英宗”。"],"B","A项，嗣位指父亲传位或传业给嫡长子，不是皇帝登临皇位。\nC项，古代科举考试按照等级次序先后分为院试、乡试、会试、殿试。\nD项，“英宗”是庙号，不是年号。",6],[1365,1,"下列说法不正确的一项是____。",["“中嘉祐二年进士第”中“第”指科举考试及格的等次，“进士”是古代科举制度中通过最后一级考试者，意为可以进授爵位之人。","古代任命或调任官职的词语很多，“拜中书舍人”指“授予中书舍人一职”，“徙明、亳、沧三州”指“调任明州、亳州、沧州知州”。","“丁母艰”是指母亲去世，回乡守丧。守丧有一定的时间规定，这在古代是一种孝顺行为，表明当事人对已故之人的崇敬和不舍。","“六经”指六部儒家经典著作，是指经过孔子整理而传授的六部先秦古籍。它们是《论语》《诗经》《尚书》《礼记》《乐经》《周易》。"],"D","《论语》不是六经。",2],[1366,1,"下列说法不正确的一项是____。",["明经，汉朝出现之选举官员的科目，始于汉武帝时期，至宋神宗时期废除。被推举者须明习经学，故以“明经”为名。","行在，也称行在所。第一释义指天子所在的地方。第二释义专指天子巡行所到之地。此处是第二种释义。","社稷是土神和谷神的总称。由于古时的君主为了祈求国事太平，五谷丰登，每年都要到郊外祭祀土地和五谷神。社稷也就成了国家的象征，后来人们就用“社稷”来代表国家。","视事，视察、巡视政事。旧时指官吏被皇帝派往某地巡视政事，考核官员。"],"D","视事，旧时指官吏到职办公。",1],[1367,1,"下列说法不正确的一项是____。",["国子监，我国封建时代最高的教育管理机关，在有的朝代兼为最高学府。","教授，学官名。始于宋代，为讲解经义、掌管课试的一种文职官员。","礼部，中国古代官署，掌管国家的典章制度、祭祀、贡举、户籍等事项。","受禅，是中国古代推举部落首领的一种方式。文中指新皇帝接受旧皇帝让给的帝位。"],"C","户籍应该是由户部掌管。",1],[1368,1,"下列说法不正确的一项是____。",["贞元，年号。年号是我国从汉朝初年开始使用的封建王朝用来纪年的一种名号，古代帝王凡遇到大事、要事，常常要更改年号。","明经，汉朝出现的选举官员的科目，始于汉武帝时期，至宋神宗时期废除。被推举者须明习经学，故以“明经”为名。","谥号是朝廷对死去的帝王、大臣、贵族（包括其它地位很高的人）、平民按其生平事迹进行评定后，给予或褒或贬或同情的称号。","乞骸骨，乞求自己的尸骨能回到故乡安葬，指古代官吏因年老请求退职，回老家安度晚年。这是古代官员请求退休的萎婉说法。"],"C","朝廷不会给平民封谥号。",1],[1369,1,"下列说法不正确的一项是____。",["“知峨眉县”意思是担任峨眉知县。宋代多用中央机关的官做县官，称“知县事”，后简称为“知县”。","天宝，为唐玄宗李隆基的年号。中国古代的纪年法有许多种，采用皇帝年号来纪年是其中一种。","户部是尚书省六部之一，掌管全国土地、户籍、屯田、赋税、财政收支、典章法度等事务。","青苗法为宋代王安石变法的措施之一，也称“常平新法”，其最终目的是充实国库，调节贫富差距。"],"C","户部尚书掌管全国土地、赋税、户籍、军需、俸禄、粮饷、财政收支。“典章法度”属礼部掌管。",3],[1370,1,"下列说法不正确的一项是____。",["六经，是《诗》《书》《礼》《易》《论语》《春秋》的合称。“六艺经传皆通习之”中的“六艺”指的就是“六经”。","参知政事，宋代的一个常设官职，相当于副宰相，设置这一官职的根本目的是削弱相权，加强皇权。","枢密院，官署名称，长官称枢密使，在宋代，枢密院主要管理军事机密及边防等事，与中书省合称“二府”。","致仕，指古代官员交还官职，即退休。《张衡传》中的“乞骸骨”也是这个意思。"],"A","《论语》不是六经。",3],[1371,1,"下列说法不正确的一项是____。",["唐初设翰林院，作为文人和卜医技术待诏的处所，并非中央机关。后来另建学士院，入院的称为翰林学士，专掌皇帝的机密诏令。","南面，古代以坐北朝南为尊位，故帝王召见群臣时，都面向南而坐，因此南面指帝王之位。后泛指居尊位或官位。","宰相指辅助皇帝、统领群僚、总揽政务的最高行政长官，其中宰是辅助、相是主宰的意思。","礼部，为六部之一，主管典礼、科举、学校等事务，长官为礼部尚书，副长官为侍郎。"],"C","“宰”指主宰、“相”指辅助。",3],[1372,1,"下列说法不正确的一项是____。",["古代男女成年时要行冠礼，戴上表示已经成人的帽子，而“弱冠”就是还没有成年。","“释褐”通常是指脱去平民衣服，开始担任官职；有时也指新考中的进士被授予官职。","“人爵”是与天爵相对而言的，它是指尘世人们所封的爵位，例如国君所赐的公、侯等。","古人认为我国疆土四面为海所环抱，因而称国境以内为“海内”，国境以外为海外。"],"A","应为“古代男子成年时要行冠礼”，另外“还没有成年”有误，男子20岁称弱冠，此时已经成年。",12],[1373,1,"下列说法不正确的一项是____。",["国子监，中国封建时代最高的教育管理机构，有的朝代兼为最高学府。","朔，农历每月月中。古人用“晦”“朔”“望”既望等名称来标识日期。","衣冠，“衣”指衣服“冠”指帽子。“衣冠”指士大夫的穿戴，借指士大夫、官绅。","经传，原指经典和注释、阐述经义的著作，后来泛指比较重要的古书。"],"B","朔，农历每月初一。",12],[1374,1,"下列说法不正确的一项是____。",["韩愈世称韩昌黎，又称韩吏部。谥号“文”，又称韩文公。宋代苏轼称他“文起八代之衰”，明人推他为唐宋八大家之首，与柳宗元并称“韩柳”。","“汝”即你，多用于后辈。古汉语中表示“你”的称呼还有“尔、公、君、卿、足下”等。","“矣、呜呼”语气助词的运用强化了这一段情感发展变化的节奏，也准确地抒发了作者强烈的不愿相信、不能相信又不得不相信的失去亲人的悲痛感情。","殁在殡葬中的区别：古代对身份和地位不同的人去世后，称呼也不同。天子死曰崩，诸侯死曰薨，大夫死曰禄，士死称不卒，庶人死称死。小孩夭折和病死的，称为殁。"],"D","D项表述错误，大夫死曰卒，士死称不禄。",0],[1375,1,"下列说法不正确的一项是____。",["“漕运”是指利用水道调运粮食（主要是公粮）的一种专业运输。运送粮食的目的是供宫廷消费、百官俸禄、军饷支付和民食调剂。","“隆庆”属于年号，“隆庆元年”指该帝王即位第一年。年号是我国从汉武帝开始使用封建王朝用来纪年的一种名号。","“致仕”是指古代官员正常退休，古人还常用致事、致政、休致等名称，一般致仕的年龄为七十岁，有疾患则提前。","“卒”是古代称大夫的死，古代帝王和王后死叫崩，古代诸侯王死叫薨，古代所有人之死亡均可称“死”。"],"D","死就是指古代平民的死亡，而非泛指所有人的死亡。",3],[1376,1,"下列说法不正确的一项是____。",["庶吉士，其名称源自《书经·立政》篇中“庶常吉士”之意。是中国明、清两朝时翰林院内的短期职位。由通过科举考试中进士的人当中选择有潜质者担任，为皇帝近臣，负责起草诏书，有为皇帝讲解经籍等责，是为明内阁辅臣的重要来源之一。","言官又称谏官，职在讽议左右，以匡人君，监察方式主要是谏诤封驳，审核诏令章奏。统治者既然把特权赋予言官，也就会对言官的政治素质提出特别的要求。正如宋代司马光所言：“凡择言官，当以三事为先：第一不爱富贵，次则重惜名节，次则晓知治体。","中国儒家学派创始人孔子晚年整理的《诗》《书》《礼》《易》《乐》《春秋》，后人称之为“六经”。其中《乐经》已失传，所以通常称“五经”。","古代官员正常退休叫作“致仕”，古人还常用致事、致政、休致等名称，盖指官员辞职归家。按照封建礼法，官员欲退，则皇帝必称社稷所倚而加以挽留，官员则以不能阻塞后人予以坚持，反复数次之后，皇帝不再勉强，以优厚待遇让官员回乡安度晚年。“乞骸骨”“丁忧”也可理解为告老还乡，退休之意。"],"D","为父母守制27个月，称丁忧。处于丁优期间的一些人由于国家需要，不必弃官去职，不着公服，素服治事，不预庆贺，祭祀、宴会等由佐贰代理，称“夺情”。或有的守制未满，而应朝廷之召出来应职者，称起复。",3],[1377,1,"下列说法不正确的一项是____。",["丁忧，也称“丁艰”。在我国古代，官员的父亲或母亲去世，官员则必须停职守制，处于丁忧期间的人皆不得为官，概无例外。","笏，古代君臣在朝廷上相见时手中所拿的长方形板子，按品第分别用玉、象牙或竹制成，以为指画及记事之用。","古代官员正常退休叫作“致仕”，古人还常用致政、休致等名称，都指官员辞职归家。","谥号是一般指古代帝王、诸侯、卿大夫、高官大臣等死后，朝廷根据他们的生平行为颁赐的一种称号，带有评定性质。"],"A","处于丁优期间的一些人由于国家需要，不必弃官去职，不着公服，素服治事，不预庆贺，祭祀、宴会等由佐贰代理，称“夺情”。或有的守制未满，而应朝廷之召出来应职者，称起复。",3],[1378,1,"下列说法不正确的一项是____。",["“牙将”即牙门将，负责在防御工事“牙门”里统领士兵指挥作战的将领被称为牙门将，后来演变成类似于主将帐下的偏将、副将的职位。","“迁”，意思是调动官职，一般指提升，但有时候也表示降职远调，如《岳阳楼记》中的“迁客骚人”和《琵琶行》中的“予左迁九江郡司马”。","“节度使”，唐代设立的地方军政长官，因受职之时，朝廷赐以旌节而得名，节度使集军、民、財三政于一身，威权甚重，最终酿成安史之乱。","“河朔”，地区名，古代泛指黄河以北地区，“朔”在古代又可以表示时间概念，朔日是农历每个月的初一，而晦日是农历每个月的三十。"],"D","晦日是农历每个月的最后一天。",6],[1379,1,"下列说法不正确的一项是____。",["明清形成了完备的科举考试制度，共分四级：院试、乡试、会试和殿试。考中会试的称为进士。","舅，文中是指丈夫的父亲。有如“洞房昨夜停红烛，待晓堂前拜舅姑”。","古代人的名字和现代有很大的差别。名是出生后不久父母起的，供长辈呼唤；字是二十岁举行冠礼或行笄礼时才起的，以表示对本人尊重或供朋友称呼。","除，是任命，授职，如“除徽州推官”；擢，是在原官职上提拔，如“擢礼科给事中”。"],"A","考中会试的称为贡士。",3],[1380,1,"下列说法不正确的一项是____。",["户部，中国古代官署名。明清时，户部掌管田地、户籍、赋税、俸饷及一切财政事宜，长官为户部尚书，副职为左、右侍郎。","大计，是明清两代考核官员的制度，分为京察、外察，每三年举行一次。通过考核来决定在京和在外官员的任免及职位的升降。","嫡母，是封建家庭中子女对亲生母亲的称呼。在古代，嫡妻所生子女称作嫡出，而姬妾所生的子女称作庶出。","登极，本指登上屋顶，后指皇帝即位。古代还有很多类似的词语，生动形象地形容皇帝即位，如：践极、南面、荣登大宝等。"],"C","“是封建家庭中子女对亲生母亲的称呼”错，嫡母是“妾生的子女对父亲的正妻的称呼”。",3],[1381,1,"下列说法不正确的一项是____。",["七庙，天子的宗庙。即帝王设七庙供奉祖先，太祖庙位居正中，其左右各为三昭三穆。后世以“七庙”作为王朝的代称，《过秦论》中的“七庙隳”就是指秦朝灭亡。","终丧，守完父母的丧期。这缘于古代的“丁忧”制度。古代官员的父母死去，官员一般须停职守丧三年，因特殊原因国家强招丁忧的人为官，叫做“起复”。","乞骸骨是古代官吏因年老请求退职的一种说法，意谓使骸骨得归葬故乡。下文的“听致仕”，表示朝廷同意了，批准他退休。","古代帝王、诸侯、卿大夫、高官大臣等死后，朝廷根据他们的生平行为给予一种称号以褒贬善恶，称为谥或谥号。比如“唐高祖”、“隋炀帝”都是谥号。"],"D","中国古代，皇帝的称呼往往和年号、谥号和庙号联系在一起，唐高祖就是庙号。",3],[1382,1,"下列说法不正确的一项是____。",["“会试”，是中国古代科举制度中的中央考试，是考取贡士的考试，考中的前三名分别叫状元、榜眼、探花。","“勤王”,多指君主的统治受到威胁而动摇时,臣子起兵救援王朝。","“工部”,三省六部是西汉以来逐步形成的封建王朝最高政府机构。三省:中书省、门下省、尚书省。六部:吏部、户部、礼部、兵部、刑部、工部。","“敕”,中国古代帝王诏令文书的名称之一，用于任官封爵和告诫臣僚。"],"A","在会试中考中的贡生，再参加由皇帝主持的殿试，殿试一般分为三甲（宋代为五甲），其中第一甲的前三名分别为状元、榜眼、探花。",3],[1383,1,"下列说法不正确的一项是____。",["字，古人幼时取字，成年取名。对平辈或尊辈称字是出于礼貌或尊敬，如文中“刘文静字肇仁。”","高祖，庙号，庙号是皇帝死后，在太庙立室奉祀时特起的名号。","关，古代在险要地方或国界设立的守卫处所。如：关塞，关卡，关隘。","践，文中特指皇帝登临帝位，如:践作，践极。"],"A","幼时取名，成年取字。",4],[1384,1,"下列说法不正确的一项是____。",["《汉书》是我国第一部纪传体断代史，它与《史记》、《后汉书》、《三国志》合称为“前四史”。","“吏部”掌管全国文武官员的选用、任免、考核、调动等事务，主管是吏部尚书和吏部侍郎。","“春秋”既可指春季秋季，也可指我国特定的历史时代，还可指儒家经典，文中用以指年龄。","“少牢”指我国古代祭祀时用羊和猪当祭品，“太牢”则指祭祀帝王时用牛、羊和猪当祭品。"],"B","吏部掌管全国文官，兵部掌管全国武官。",2],[1385,1,"下列说法不正确的一项是____。",["后唐是五代政权之一，李存勖所建，都洛阳。五代指后梁、后唐、后晋、后汉、后周，文中“汉祖（南下）”指“后汉高祖（南下时）”。","称疾，是古文中较为常见的一种托词，当事人本身或许没有生病，却以生病为由，以回避某事某人，文中“称疾不行”暗示传主的微妙心态。","祭酒，古代学官名。晋武帝咸宁四年设，以后历代多沿用，为国子学或国子监的主管官。刘温叟当时以工部侍郎的身份兼任国子监主管。","丁内艰，是指遭遇父亲去世。丁忧就是遭遇父母亲去世。古代朝廷官员，无论任什么官职，从得知丧事的那一天起，必须回到祖籍守丧一段时间。"],"D","丁内艰，是遭遇母亲去世。",1],[1386,1,"下列说法不正确的一项是____。",["博士是学官名，秦汉时是指掌管书籍文典、通晓史事的官职，后指学术上专通一经或精通一艺、从事教授生徒的官职。","出，常常指官员离开家居地出任某个官职或京官外调为地方官员。本文的“出”指的是后者，相当于京官外放、外迁。","祠部是东晋时设的以祠部尚书为主官、掌祭祀之事的官署。朝代不同，其主官有不同的称呼，管辖的部门也有所不同。","我国古代常用的纪年法有王公即位年次纪年法、年号纪年法、干支纪年法等，“永明三年”是用王公即位年次来纪年的。"],"D","“永明三年”是年号纪年法。",6],[1387,1,"下列说法不正确的一项是____。",["“幼孤，随母适胡氏”，古人有“鳏寡孤独”之说，其中“鳏”指无妻或丧偶，“寡”指女子丧夫，“孤”指幼年丧父，“独”指老而无子。","“洪熙元年”中，“洪熙”足指明仁宗年号。年号始于汉武帝，此后皇帝即位都要改元，并以年号纪年，如“庆历四年”“元和十年”均是如此。","“海盐民”中，“民”足对百姓的称谓，常见的百姓称谓还有布衣、黔首、黎民、生民、庶民、黎庶、苍生、黎元、氓和足下等。","由于受时代的限制，^人对四方异族的了解有限，往往用蛮、夷、戎、狄、胡、越等来泛指四方异族，对南方各族常称“百越”或“越族”。"],"C","“足下”不是对百姓的称谓。",4],[1388,1,"下列说法不正确的一项是____。",["古代中国汉族男性年满二十岁要举行冠礼，表示成年。未冠又称弱冠，即不到二十岁。白居易就是在尚未成年时得到了顾况的高度称赞。","擢进士，指被选拔为进士。中国古代科举制度中，通过最后一级中央政府朝廷考试者（古代科举殿试及第者），称为进士。","浮屠，亦作浮图、休屠。古人称佛教徒为浮屠，都是佛陀的异译。后人认为佛陀二字太麻烦，于是简化成了一个字“佛”。","“赞”是纪传体史书中写在篇末的评论性文字，可用来表达对传主的肯定和赞美。本文篇末的“赞”中称赞白居易为贤者。"],"A","“未冠”不是“弱冠”。",3],[1389,1,"下列说法不正确的一项是____。",["“赵葵，字南仲”。古人幼时命名，成年(男20岁、女15岁)取字，字和名使用有别，名供长辈呼唤；字是供平辈和晚辈称呼。","文中“授两淮宣抚使、判扬州，进封鲁国公”中的“授”指授给、给予官职。“判”指低位兼低职。“封”指帝王把土地、封号或爵位授予亲属或臣僚。","文中“寻奉祠”的“奉祠”指只领官俸而无职事。宋代设宫观使、判官、都监、提举、主管等职，以安置五品以上不能任事或年老退休的官员。因宫观使等职原主祭祀,故亦称奉祠。","文中“谥忠靖”的“谥”是谥号。古代帝王、贵族、大臣或其他有地位的人死后被追加的称号叫谥号，一般根据他们的生平事迹与品德修养，进行一种褒扬的评价，也有表贬抑的评价。"],"B","“判”指高位兼低职。",4],[1390,1,"下列说法不正确的一项是____。",["偏将，副将，将军的辅佐，此官制始设于春秋，通常由帝王拜授，也有大将军拜授的。","刑部，古代“六部”之一，掌管刑法、狱讼事务的官署职务，其最高掌管为刑部尚书。","实封，食邑制度之一。封户有虚实之别，其封国并无疆土，封户亦徒有虚名，唯加实封者，才能收其所得封户的租税。","“迁”一般指升官，但也有作一般调动讲的，也有作降职远调的例“左迁”，表升迁的词语还有“擢”、“升”、“出”、“陟”等。"],"D","出：指出京受任。《张衡传》中“永和初，出为河间相”的“出”，就是指张衡离京任河间王的相。",3],[1391,1,"下列说法不正确的一项是____。",["“教授”是指把知识技能传授给学生，后成为一种学官名，掌管学校课试等事，位居提督学事司之下。现在是高等学校教师学衔或职务名称之一。","“母忧乞身”是指遭逢母亲去世，在朝廷任职的官员，请求辞职前去为母守孝。","“五更”是指年老还乡但富有学识经验的德高望重之人。古代设五更之位，天子要以父兄之礼来对待。","“结发”，汉族婚姻习俗，一种象征夫妻结合酌仪式。当夫妻成婚时，各取头上一根头发，合而作一结。"],"D","此处“结发”意为“束发，扎结头发”。古代汉族男子20岁束发而冠，女子15岁束发而笄，表示成年。男女成年的标志分别为“加冠”“加笄”。",3],[1392,1,"下列说法不正确的一项是____。",["制书，即制式文书，是朝廷大员颁布重要法令或褒奖惩戒官员时采用的专用文书。","弃市，为死刑的一种，自商周即有。《礼记》：“刑人于市，与众弃之。”即在人众聚集的闹市，对犯人执行死刑，用于处决某些罪大恶极者。","乾德，是北宋太祖赵匡胤的年号。年号是帝王为纪在位之年而立的名号。古人纪年主要有干支纪年和帝王纪年两种。","卒，古代指大夫死亡，后为死亡的通称。《礼记·曲礼下》：“天子死曰崩，诸侯死曰薨，大夫曰卒，士曰不禄，庶人曰死。”"],"A","制就是皇帝说的话。所谓“天子之言曰制，书则载其言”。在周代，帝王的命令叫命。秦始皇灭六国后，改命为制，“制”即成为用以颁布皇帝重要的法制命令的专用文书。",4],[1393,1,"下列说法不正确的一项是____。",["每月的初一称为“望日”，“夏四月之望”是指初夏的四月一日。","野史，是私家编撰的史书，“野史氏”在文中是作者自谓。","古代科举殿试及第者称为进士，武侯是丁丑年的进士。","“庙社”指宗庙和社稷，古人在春季和秋季祭祀社神。"],"A","在农历的每月十五日称为“望日”，每月的初一称为“朔”。“夏四月之望”是指夏历（农历）的四月十五日。",3],[1394,1,"1932年，清华大学招生试题中有一道对对子题，上联孙行者，下面下联中最合适的是____。",["胡适之","周作人","郁达夫","唐三藏"],"A","解答此类题目首先要看字数，对联要求字数相等，内容相关；其次要求词性相当、结构相称。猢狲，“孙”对“胡”；“适”在古文中是“到、行”的意思，所以所以“行”对“适”；“之”和“者”是文言文里的常用虚词（之乎者也），所以“之”对“者”。",2],[1395,1,"后羿斩巴蛇的雕像立在____广场。",["人民广场","恒隆广场","牡丹广场","巴陵广场"],"D","后羿斩巴蛇的雕像立在巴陵广场。",14],[1396,1,"下列对相关文化常识的解说，不正确的一项是____。",["举孝廉，同“察茂才”“征”“辟”一样，都是自上而下选拔官吏的制度。","博士：指专管经学传授的的学官。","“劾”意为揭发罪状，劾奏，向皇帝检举官吏的过失或罪行。","疏是一种文体，是臣子分条向帝王分条陈述说明的意见书。"],"A","举孝廉，同“察茂才”一样，是自下而上选拔官吏的制度。",1],[1397,1,"下列对相关文化常识的解说，不正确的一项是____。",["羽林，皇帝卫军的名称，其意为国羽翼，如林之盛。是中国古代封建王朝时专门护卫皇帝、皇家、皇城的特殊军队。","“陛下”的“陛”指帝王宫殿的台阶，“陛下”原来指的是站在台阶下的侍者，后来被借用为对帝王的尊称。","公，诸侯获封赐的封建等级，爵位的一种，旧说周代有公、候、伯、子、爵等爵位，而后代爵位制度往往因时而异。","朔望，即朔日和望日，晦朔，即晦日和朔日。晦，阴历每月的第一日。朔，阴历每月的最后一日。望，阴历每月的十五日。"],"D","“朔”是农历每月的初一，“晦”是农历每月的最后一天。",6],[1398,1,"下列对相关文化常识的解说，不正确的一项是____。",["武帝是皇帝谥号，“武”是褒扬皇帝生前德行之词，有“威武睿智”之意。","吕望即姜子牙，他与文王相遇渭滨，因功封于吕地，后代指辅佐国君的贤才。","神兽门，即神武门，又称玄武门。玄武主北方，后宫宫殿将北宫门称为玄武门。","践祚, 也称践位，在古代专门用来指帝王即位登基。践，践履。祚，天祚、福祚。"],"C","玄武门是帝王宫殿的北宫门，而非后宫宫殿的北宫门。",1],[1399,1,"下列对相关文化常识的解说，不正确的一项是____。",["进士，指古代科举殿试及第者，根据成绩分为一甲、二甲、三甲，一甲的第一、二、三名依次叫做状元、榜眼、探花。","社稷，我国古代称谷神为社，土神称为稷，粮食和土地是以农为本的中华民族的根本所在，故而人们也用社稷代指国家。","礼部，古代官署，掌管祭祀、典礼、外宾接待等事务，科举取士、学校事务也归礼部管辖。礼部的最高长官是礼部尚书。","服除，意思是脱掉丧服，即守丧期满。根据传统孝道观念，官员遭逢父母去世，一般都要辞官回到祖籍，为父母守制。"],"B","古代称土神为社，谷神为稷。",3],[1400,1,"下列对相关文化常识的解说，不正确的一项是____。",["“男” 是中国封建社会爵位名，其位次为第五等，位列于公侯伯子之后。","“公主”是中国古代对望族女子的称谓。唐朝开始公主只是帝女或者和亲公主的称谓。","“疏”是一种文体，“上疏”中的“疏”是指在朝官员专门上奏皇帝的一种文书形式。","“先帝”指远古帝王，也指前代已故的帝王或本朝皇帝的亡父，本文即为此意。"],"B","“公主”是中国古代对皇女。王女，宗女的称谓。",1],[1401,1,"下列对相关文化常识的解说，不正确的一项是____。",["总角，古时未成年的人把头发梳成两个发髻，如头顶两角，后来代称儿童时代。","龙门，古代身份高的人的府邸，“一世龙门”是指文人所崇仰的人物，后起的文人登门拜访，可称为“登龙门”。","长揖，是古代的相见礼节。行礼时，施礼者屈膝跪地，左手按右手，拱手于地，头也缓缓至于地，向对方表示敬意。","三公，中国古代朝廷中最尊显的三个官职的合称，在不同朝代对三公的具体所指不尽相同。"],"C","长揖，是古代不分尊卑的相见礼。稽首行礼时，施礼者屈膝跪地，左手按右手，拱手于地，头也缓缓至于地，向对方表示敬意。",3],[1402,1,"下列对相关文化常识的解说，不正确的一项是____。",["《周易》即《易经》，相传系周文王姬昌所作，与《诗经》《尚书》《礼记》《春秋》合称“五经”。","伊、吕指伊尹和吕尚，殷商时期伊尹、吕尚两位贤臣辅佐朝政，皆有大功，后来以伊吕来泛指辅弼重臣。","征是我由皇帝征聘社会知名人士充任官职。辟，指由中央官署征聘，然后向上举荐，任以官职。","太建为年号，年号是中国封建王朝用来纪年的一种名号，自汉武帝始，此后每个皇帝即位都要改元。"],"B","伊尹是商朝重臣，辅佐商汤；吕尚是西周重臣，辅佐周武王。李白《行路难（其一）》中“闲来垂钓，碧溪上忽复乘舟梦日边” 即用此典故。",2],[1403,1,"下列对相关文化常识的解说，不正确的一项是____。",["三公，是中国古代朝廷中最尊显的三个官职的合称。自周代以来，三公专指太师、太傅、太保，唐宋后成为一种虚职。","敕，封建社会常作自上命下之词，特指皇帝的诏书，如奉敕、宣敕。本文“敕镇代”指皇帝下令让于烈镇守代邑。","称制，指封建社会里君主即位执政，也可指由皇后、皇太后或太皇太后等女性统治者代理皇帝执掌国政。","稽首，古代一种跪拜礼，叩头至地，是九拜中最恭敬者。本文中“稽首”即为臣子跪拜国君的礼节。"],"A","“专指”错误。",1],[1404,1,"下列对相关文化常识的解说，不正确的一项是____。",["太学，古代设于京城的最高学府。博士，古代设置的国家最高学位。","知贡举，主试者称为“知贡举”，就是“特命主掌贡举考试”的意思。","经筵,是指汉唐以来帝王为讲经论史而特没的御前讲席。","循吏，正史中记述的那些重农宣教、奉公守法、爱民富民的地方官。"],"A","“博士，古代设置的国家最高学位”错，博士，在文中是官名。",1],[1405,1,"下列对相关文化常识的解说，不正确的一项是____。",["至元，是元世祖忽必烈的年号，从1264年到1294年忽必烈驾崩，一共使用了31年，因此忽必烈又被称为“至元大帝”。","丞相，是封建官僚机构中的最高官职，是辅佐皇帝总理百政的官员，自有此职以来就只能由一人担任，处于一人之下，万人之上的位置。","御史，本为史官，秦以后置御史大夫，职位仅次于丞相，主管弹劾、纠察官员过失诸事。","闾巷，古时二十五家为一闾，后来称居民的区域为闾里、闾巷，泛指乡里民间。"],"B","“自有此职以来就只能由一人担任 ”错，有些朝代可由多人担任。",3],[1406,1,"下列对相关文化常识的解说，不正确的一项是____。",["御史，自秦朝开始，御史专门为监察性质的官职，一直延续到清朝。汉朝御史统归御史台领导，按职掌分为侍御史和治书侍御史。","国本，古代特指确定皇位继承人，建立太子为国本。“国本”也指国家藏本。例如韩愈《画记》中“余少时，常有志乎兹事，得国本，绝人事而摸得之”。","闾阎，间泛指门户；人家。阎指里巷的门。闾阎，原指古代里巷内外的门，后泛指平民百姓，不再指房屋建筑。","公卿，“三公九卿”的简称，夏朝始设，周代沿袭。“公”即是周代封爵之首，“卿”是古时高级长官或爵位的称谓。“三公”即是最尊贵的三个官职的合称。周之“三公”指太师、太傅、太保，也有说为司马、司空、司徒。"],"C","“不再指房屋建筑”错误，“闾阎”也指房屋建筑。",3],[1407,1,"下列对相关文化常识的解说，不正确的一项是____。",["讼牒，诉状的旧称，即封建社会打官司的文书。讼，在法庭上争辩是非曲直；牒，文书，常指古代官府的往来文书。","御史，古代行政官职。自秦朝开始，御史专门作为监察性质的官职，负责监察朝廷、诸侯官吏，一直延续到清朝。","“卒”，古代称大夫的死，古代称帝王和王后的死为“崩”，称诸侯王的死为“薨”。古代所有人之死亡均可称作“死”。","“壬戌”是干支之一，夏历中用干支来编排年号和时日，选文中指的是壬戌年。壬戌年的前一年是辛酉年，后一年是癸亥年。"],"C","古代所有人之死亡均可称作“死”错。",3],[1408,1,"下列对相关文化常识的解说，不正确的一项是____。",["孝宗，南宋皇帝赵眘的庙号。庙号指皇帝死后，在太庙立室奉祀时特起的名号。如：太祖、高祖、世祖、圣祖、太宗、高宗、显宗、肃宗等。","宫、商、角、徵、羽是中国五声音阶中五个不同音的名称，古人认为这五声分别代表君、臣、民、事、物，五声不乱，国家的政治就会清明。","定省，即昏定晨省，本指晚间为父母安定床衽，早晨起来省问父母安否，即称子女早晚向亲长问安；后来泛指探望问候父母或亲长。","陛辞，临行前向皇帝告别。陛，特指皇帝宫殿的台阶；“陛下”与“殿下”都指宫殿的台阶下，后来用于对帝王的尊称。"],"D","“陛下”用于对帝王的尊称，而“殿下”用于对皇族成员的尊称，次于代表君主的陛下。汉朝开始称呼太子、诸侯王为殿下，三国开始皇太后、皇后也称殿下。",1],[1409,1,"下列对相关文化常识的解说，不正确的一项是____。",["在古代官职变化方面，代表升官的词语有拜、晋、迁、拔、擢、徙、升、提等。","“赠”，一是指把东西给别人，二是皇帝为已死的官员及其亲属加封，亦叫追赠。","舍人在古代的意思有：豪门贵族家里的门客，官职名称，宋元后用以称呼权贵子弟。","谥号是古人死后被授予的称号，帝王的谥号一般由礼官议上，大臣的谥号由朝廷赐予。"],"A","迁、徙，都不一定是升官。",3],[1410,1,"中国传统文化是以什么文化为主体的文化？",["儒家文化、道家文化、法家文化","儒家文化、道家文化、墨家文化","儒家文化、道家文化、佛家文化","儒家文化、道家文化、农家文化"],"C","中国传统文化是以儒家文化、道家文化、佛家文化为主体的文化‌。儒家文化强调仁、义、礼、智、信，道家文化注重领悟道、修养德、求自然，佛家文化则强调奉献和心灵安定。‌",2],[1411,1,"以下哪个不是修建长城的材料？",["石头","芦苇","土","水泥"],"D","古代是没有水泥的，石头、芦苇、柳条、土都是修建长城的重要原料。一般用糯米、红糖、加一些竹条搅拌，有点像混凝土。",7],[1412,1,"“一门三文子，都是大文豪。诗赋传千古，峨眉共比高”是指____。",["曹操、曹植、曹丕","苏洵、苏轼、苏澈","班彪、班固。班超","杜甫、杜牧、杜苟鹤"],"B","该说法说的是苏洵苏辙苏轼三人。",0],[1413,1,"中国古代的教育，可分为____和____两大类。",["官学 私学","正学  私学","国学 民学","国学 家学"],"A","中国古代的教育，可分为官学和私学两大类。",3],[1414,1,"我国最古老的词典是____。",["诗经","尔雅","说文解字","七录"],"B","我国最早的词典是《尔雅》。",2],[1415,1,"截止民国，我国规模最大，数字最多的一部字典是____。",["《康熙字典》","《辞源》","《辞海》","《中华大字典》"],"D","现在收录汉字最多的是《中华大字典》。",1],[1416,1,"《尚书》中的“尚”是什么意思？",["上古","崇尚","官名","姓氏"],"A","“尚”即“上”，《尚书》就是上古时代的书，它是中国最早的一部历史文献汇编。",3],[1417,1,"在我国历史上”学士”是指什么？",["学位","官名","文人","以上都是"],"B","南北朝以后，以学士为司文学撰述之官。",1],[1418,1,"《窦娥冤》的作者是____。",["关汉卿","白朴","马致远","郑光祖"],"A","《感天动地窦娥冤》（简称《窦娥冤》）是元代戏曲家关汉卿创作的杂剧，刊行于明万历十年（公元1582年）。",9],[1419,1," 南针为什么不叫“指北针”？",["面南为尊,面北为卑","因为磁针箭头总是朝向南面","因为磁针箭头总是朝向北面","因为南方经济更发达"],"A","这与我国对方位的认识有关，在我国古代文化里，南为阳，北为阴，且有“南面为王，北面而朝”之说，即面朝南方位的称帝王，面朝北方的则是朝拜君王的臣子。正屋的门窗都开向南，所以指示方向也以南为主。在我国叫指南针是习惯叫法，当然也可以叫指北针，在国外和军事领域就都叫指北针。",11],[1467,1,"按风俗,“腊八粥”应在阴历哪一天喝？",["十二月初八","正月初八","十一月初八","二月初八"],"A","腊八节，即每年农历十二月八日，又称为“法宝节”“佛成道节”“成道会”等。本为佛教纪念释迦牟尼佛成道之节日，后逐渐也成为民间节日。",5],[1468,1,"“有板有眼”的\"板\"是我国传统音乐节奏中的____。",["弱拍","强拍","三连音","大切分"],"B","“有板有眼”指民族音乐和戏曲中的节拍，每小节中最强的拍子叫板，其余的拍子叫眼。",9],[1469,1,"李白笔下的“飞流直下三千尺,疑是银河落九天”指的是哪个风景区？",["黄山","九华山","普陀山","庐山"],"D","《望庐山瀑布二首》是唐代大诗人李白创作的两首诗，一为五言古诗，一为七言绝句。这两首诗，紧扣题目中的“望”字，都以庐山的香炉峰入笔描写庐山瀑布之景。",7],[1470,1,"先秦时,龙的形象和图案被普遍地比喻为____。",["国王","君子","神灵","妖魔"],"B","先秦时，龙的形象和图案被普遍比喻为君子。",1],[1471,1,"中国的尼姑最早是何时出现的？",["南北朝","汉代","唐代","宋代"],"A","中国的尼姑最早是南北朝时出现的。",1],[1472,1,"吴敬梓是____一书的作者。",["《儒林外史》","《红楼梦》","《镜花缘》","《老残游记》"],"A","《儒林外史》是清代吴敬梓创作的长篇小说，成书于乾隆十四年（1749年）或稍前，现以抄本传世，初刻于嘉庆八年（1803年）。",0],[1473,1,"下列哪部作品不是冯梦龙的著作？",["《古今谭概》","《喻世明言》","《醒世恒言》","《西厢记》"],"D","《崔莺莺待月西厢记》（简称《西厢记》，又称《王西厢》《北西厢》）是元代王实甫创作杂剧，大约写于元贞、大德年间（1295~1307年）。",0],[1474,1,"中国近代签订的第一个不平等条约是？",["《黄埔条约》","《望厦条约》","《南京条约》","《虎门条约》"],"C","《南京条约》是中国近代史上第一个不平等条约。",14],[1475,1,"“山药蛋派”形成于20世纪50年代,作品坚持现实主义的创作方法和口语化的写作特点,追求生活的真实,反映生活的矛盾和问题。这一流派的代表作家是____。",["赵树理","柳青","贾平凹","苏童"],"A","山药蛋派是中国当代小说流派之一，形成于20世纪50年代至60年代中期。指以赵树理为代表的一个当代的文学流派。又称为“赵树理派”“山西派”或“火花派”，这是因为新中国成立后该派的作品大都发表在山西文艺刊物《火花》上。",0],[1476,1,"“不著一字，尽得风流”，出自我国唐代诗论家司空图的哪一篇文章？",["《与李生伦诗书》","《诗品》","《丁末岁归王官谷》","《四溟诗话》"],"B","不著一字，尽得风流是唐司空图关于诗的艺术特征的命题。即要求文学创作做到含蓄蕴藉、意在言外。“不著一字，尽得风流。语不涉难，已不堪忧。是有真宰，与之沉浮。浅深聚散，万取一收，”（《二十四诗品·含蓄》）认为无一字直接述说自己的情思，而自己的情思却在寻常事物的描绘中得到了最完满的表现。",0],[1477,1,"古代的“会稽”在今天什么省？",["浙江","江苏","山东","安徽"],"A","会稽郡中国古代郡名，位于长江下游江南一带。于公元前222年（秦朝）置郡，郡治山阴县（今浙江省绍兴市），历史上曾管辖春秋时长江以南的越国和吴国故地。",7],[1478,1,"中国古代称戏曲演员为“梨园子弟”，“梨园子弟”的称号出自哪个朝代？",["宋朝","元朝","唐朝","明朝"],"C","“梨园子弟”的称号出现在唐朝。出自：清·吴敬梓《儒林外史》第三十回：“通省梨园子弟各班愿与者，书名画知，届时齐集湖亭，各演杂剧。",9],[1479,1,"北宋一个皇帝爱琴，特别设立了“官琴局”；又善画画，代表作有《听琴图》。请问这位皇帝下面的哪一位？",["赵佶","赵祯","赵构","赵昀"],"A","《听琴图》是传为北宋宋徽宗赵佶创作的一幅绢本设色工笔画，此画现藏于北京故宫博物院。", 。对藏族同胞而言，白色象征着____。",["纯洁","如意","吉祥","善良"],"ABCD","藏族是一个特别崇尚白色的民族, 且将白色视为吉祥的象征，因此以上选项均是白色的象征意义。",2],[1815,2,"大观楼始建于康熙年间，见证了昆明三百多年来的成长、变化与发展，下面出自大观楼长联的选项有____。",["汉习楼船","唐标铁柱","宋挥玉斧","洪武开疆"],"ABC","上联\n五百里滇池奔来眼底，披襟岸帻，喜茫茫空阔无边。看：东骧神骏，西翥灵仪，北走蜿蜒，南翔缟素。高人韵士何妨选胜登临。趁蟹屿螺洲，梳裹就风鬟雾鬓；更苹天苇地，点缀些翠羽丹霞，莫辜负：四围香稻，万顷晴沙，九夏芙蓉，三春杨柳。\n下联\n数千年往事注到心头，把酒凌虚，叹滚滚英雄谁在？想：汉习楼船，唐标铁柱，宋挥玉斧，元跨革囊。伟烈丰功费尽移山心力。尽珠帘画栋，卷不及暮雨朝云；便断碣残碑，都付与苍烟落照。只赢得：几杵疏钟，半江渔火，两行秋雁，一枕清霜。通读全诗，由此排除D选项。",1],[1816,2,"我国有很多名楼皆因文人杰作而名扬天下，下列选项中文人与其所写的关于名楼的作品对应正确的是____。",["辛弃疾——《岳阳楼记》","王勃——《滕王阁序》","王之涣——《登鹳雀楼》","崔颢——《黄鹤楼》"],"BCD","A项岳阳楼记是范仲淹所写。",10],[1817,2,"战国时期频繁的战争产生了众多的军事家和能征善战的名将。下列选项中属于“战国四大名将”的是____。",["白起","李牧","廉颇","张良"],"ABC","战国四大名将，秦赵各半，秦有白起、王翦，赵有李牧、廉颇，因此排除D项。",1],[1818,2,"《史记》不仅反映了中国古代历史，其本身也是一部优秀的文学作品，它主要分为____和列传五个部分。",["本纪","世家","表","书"],"ABCD","《史记》分为本纪、世家、列传、表、书等五个部分。",0],[1819,2,"被后人称为“天下三大行书”的字帖是____。",["《兰亭序》","《祭侄文稿》","《曹全碑》","《黄州寒食帖》"],"ABD","天下三大行书”指的分别是王羲之的《兰亭序》、颜真卿的《祭侄文稿》和苏轼的《寒食帖》，因此排除C选项。",8],[1820,2,"孔林圣地承载着传播儒家文化的使命，影响一代又一代的人们，下列选项中有关孔林的叙述错误的是____。",["孔子“杏坛讲学”的杏坛亭是孔林的主要建筑之一","孔林的主殿名为大成殿，与故宫太和殿、泰山岱庙天贶殿并称“东方三大殿”","孔林的核心是“铁山园”","孔子墓因墓形如隆起的马背，故名“马鬣封”"],"ABC","A选项中，孔子“杏坛讲学”的杏坛亭不是孔林的主要建筑之一，孔林的主要建筑包括大成殿、铁山园等，而杏坛亭位于孔庙内，并非孔林的一部分‌。B选项中，东方三大殿分别为山东曲阜孔庙的主殿大成殿、北京故宫太和殿、山东泰安岱庙天贶殿。C选项中，孔林的核心是“孔子墓”。",10],[1821,2,"下列哪些材料是用来制作活字印刷所使用的活字块的常见材料？",["木头","胶泥","金属","龟甲"],"ABC","最早的活字是胶泥字（陶字）,木字、金属字是后来的进步之作。因此可以排除D选项。",11],[1822,2,"中国瓷器闻名世界，下列选项中哪些是清代的瓷器制作技艺？",["釉里红","五彩","粉彩","珐琅彩"],"BCD","A项釉里红瓷是传统陶瓷中的艺术珍品，属于元代中期景德镇劳动人民的重要发明之一。",10],[1823,2,"苏州园林中比较有代表性的有沧浪亭、狮子林、拙政园、留园，它们代表的朝代的艺术风格包括____。",["唐","宋","元","明"],"BCD","沧浪亭、狮子林、拙政园和留园分别代表着宋、元、明、清四个朝代的艺术风格，因此排除A选项。",1],[1824,2,"造纸术在4世纪传到了___，直至19世纪中叶，造纸术已传遍世界。",["美洲","朝鲜半岛","日本","越南"],"BCD","造纸术在四世纪传到了朝鲜半岛、日本、越南，因此排除A选项。",11],[1825,2,"莫高窟为我们呈现出一个神秘、瑰丽的艺术世界，下列关于莫高窟壁画描述正确的是____。",["莫高窟壁画题材与佛教息息相关，有佛像画、佛教故事的画作等","莫高窟壁画绘画技巧风格多样，线条精细","壁画所用的全部颜料均从矿石中提炼而来","莫高窟壁画有4500平方米"],"ABC","D项目莫高窟壁画面积约45000平方米。",8],[1826,2,"宋代是瓷器发展的重要时期，其中五大名窑包含____。",["定窑","官窑","哥窑","钧窑"],"ABCD","中国古代五大名窑是钧窑、汝窑、官窑、定窑、哥窑。",10],[1827,2,"下列选项中哪些是东巴经籍文学的代表作品？",["《创世纪》","《黑白战争》","《彩虹》","《鲁般鲁饶》"],"ABD","《东巴经》除记载迎神驱鬼、祈福求寿、消灾消难等内容外,还记载了大量的纳西族古典文学作品,包括神话故事、叙事长诗、谚语歌谣等。 神话中最著名的是创世史诗《创世纪》、英雄史诗《黑白战争》、悲剧长诗《鲁般鲁饶》。它们合称纳西族的三大史诗。",0],[1828,2,"《战国策》重点记述了战国时期纵横家们游说各国的历史，下列选项中属于战国时期纵横家的有____。",["董仲舒","张仪","鲁仲连","诸葛亮"],"BC","A项董仲舒是西汉哲学家，D项诸葛亮是三国时期蜀汉丞相。",1],[1829,2,"下列史书与其体例搭配正确的有____。",["《国语》——纪事本末","《史记》——纪传体","《左传》——编年体","《战国策》——国别体"],"BCD","A项《国语》是我国第一部国别体史记。",2],[1830,2,"形声是一种造字方法。下列汉字属于形声字的是____。",["睁","吐","咏","灰"],"ABC","形声字是由两个文或字复合成体，其中的一个文或字表示事物的类别而另一个表示事物的读音，因此选择A,B,C选项。",0],[1831,2,"关于夸父追日的神话故事，下列描述正确的是____。",["夸父倒下后变成了一座大山","在追逐太阳的过程中，夸父即便又渴又累，也没有放弃","夸父最终追上了太阳","夸父最终死在了路上"],"ABD","夸父追日指的是相传在黄帝时期，夸父族首领夸父想要把太阳摘下，于是开始逐日，和太阳赛跑，在口渴时喝干了黄河、渭水之后，在奔于大泽路途中渴死。死后他的手杖化作桃林，身躯化作夸父山，因此排除C选项。",7],[1832,2,"传说神农对中华民族的生存繁衍和发展做出了重要贡献。人们为了纪念这位无私爱民的首领，尊称他为____。",["“药王”","“药圣”","“五谷之神”","“五谷先帝”"],"AD","B项药圣是李时珍；C项五谷之神为后稷。",11],[1833,2,"清明节是我国的重要传统节日之一，下列哪些属于清明节的节日习俗？",["扫墓","踏青","吃粽子","放风筝"],"ABD","C项吃粽子是端午节的习俗。",5],[1834,2,"下列属于寒食节节日习俗的有____。",["禁火","吃冷食","扫墓","猜灯谜"],"ABC","D项猜灯谜又称打灯谜，是从古代就开始流传的元宵节特色活动。",5],[1835,2,"传说夸父在追赶太阳的路途上，因为口渴，喝干了哪些河流里的水？",["长江","黄河","渭河","淮河"],"BC","《山海经·海外北经》:“夸父与日逐走，入日，渴欲得饮，饮于河渭，河渭不足，北饮大泽。未至，道渴而死。弃杖，化为邓林。”古文中“河”常特指黄河。渭河，古称渭水，是黄河的最大支流。因此选B,C选项。",7],[1836,2,"请问，下面哪些神话传说与太阳有关？",["夸父逐日","愚公移山","后羿射日","天狗食日"],"ACD","B项愚公移山讲述的是愚公不畏艰难，坚持不懈，挖山不止，最终感动天帝而将山挪走的故事，与太阳无关。",7],[1837,2,"下列选项中，既属于农历二十四节气，又是我国传统节日的是____。",["清明","端午","冬至","七夕"],"AC","二十四节气中,既是节气又是传统节日的是清明和冬至，因此选A,C选项。",5],[1838,2,"在我国，每个地区、每个民族都有自己的特色美食，下列选项中，哪些属于云南地区的特色美食？",["过桥米线","竹筒饭","汽锅鸡","虾饺"],"ABC","D项虾饺是广东的特色美食。",12],[1839,2,"六经，是六部儒学经典的统称，下列选项中属于六经的是____。",["《诗经》","《论语》","《礼记》","《春秋》"],"ACD","六经，是指《诗》、《书》、《礼》、《易》、《乐》、《春秋》的合称，排除B选项。",2],[1840,2,"尊老爱幼是我们中华民族的传统美德。下列选项中，属于尊老爱幼的是____。",["单老孤稚有所养","老吾老以及人之老，幼吾幼以及人之幼","子不学，非所宜。幼不学，老何为","臣无祖母，无以至今日；祖母无臣，无以终余年"],"ABD","C项意思是：一个人倘若小时候不好好学习，到老的时候既不懂做人的道理，又无知识，那么到老的时候都很难有所作为的，与题目不符。",14],[1841,2,"婉约派为中国宋词流派。下列词人属于婉约派的是____。",["李清照","辛弃疾","晏殊","周邦彦"],"ACD","婉约派代表人物有柳永、晏殊、秦观、周邦彦、李清照等人；B选项辛弃疾是豪放派代表人物。",0],[1842,2,"豪放派是形成于宋代的词学流派之一，豪放派的代表人物有____。",["李煜","辛弃疾","柳永","苏轼"],"BD","豪放派的代表人物主要有苏轼、辛弃疾、王安石等；A,C选项是婉约派代表人物。",0],[1843,2,"百日礼，是我国古代较为重要的礼俗之一。下列哪些关键词与“百日礼”有关？",["三月看相，百日看长","满月酒","百家衣","洗三朝"],"AC","B项满月酒，是指婴儿出生后一个月而设立的酒宴。D项洗三朝是婴儿出生3日后重要的洗浴仪式，意在洗净秽污，令其洁白入世，使其健康成长。",12],[1844,2,"《周礼》记载的“六艺”包括____。",["诗","礼","射","书"],"BCD","“六艺”分别是：礼、乐、射、御、书、数，因此排除A选项。",13],[1845,2,"射箭已经成为现代奥运会的比赛项目之一，我国自古以来就有这项运动，下列哪些人物是射箭能手？",["李广","养由基","蒙万赢","长孙晟"],"ABD","C项蒙万赢是相扑高手。",13],[1846,2,"汉语中有很多词语是从“纺织”中发展而来的。下列选项中的词语，哪些与纺织无关？",["综合","分析","经纬","规矩"],"BD","A项综合：综，是织布机上使经线上下交错以受纬线的装置；综合，就是把几千根不同的经线合并起来，后来便引申为将不同事物或不同部分合并为一个整体。C项经纬：原指织物的纵线和横线，后来引申为地球的经度和纬度。",10],[1847,2,"作为中国古代四大发明之一，印刷术为人类文明的进步做出了重大贡献。下列哪些词语与印刷无关？",["模勒","叫板","付梓","亮相"],"BD","B、D项“叫板”“亮相”是戏曲行业中的术语。",11],[1848,2,"在瓷器鉴赏节目中，我们常常能听到一些专业术语，下列哪些术语与瓷器有关？",["重皮","棕眼","倒口儿","口磕"],"ABD","C项“倒口儿”是曲艺行业术语，意思是“说方言”。",10],[1849,2,"太和殿是故宫内规模最大、最高的殿宇。主要供____大朝会和其他大典，如皇帝登基或大婚册封时使用。",["花朝节","寒食","元旦","冬至"],"CD","太和殿是紫禁城外朝主殿,是供天子登基、颁布重要政令、召见朝臣、授命出兵征讨,以及举行元旦、冬至大朝会和万寿(皇帝诞辰)等活动的主要场所，因此排除A,B选项。",5],[1850,2,"清朝有专门供皇家使用的藏书楼即“北方四阁”,下列哪些属于“北方四阁”？",["文渊阁","文津阁","文澜阁","文源阁"],"ABD","“北方四阁”分别是：北京故宫的文渊阁、沈阳故宫的文溯阁、北京圆明园的文源阁、河北承德避暑山庄的文津阁。",10],[1851,2,"北京是我国首都，也是文化中心，这里有许多名胜古迹。下列名胜古迹位于北京的是____。",["故宫","颐和园","灵隐寺","鄱阳湖"],"AB","C项灵隐寺位于杭州西湖，D项鄱阳湖位于江西。",7],[1852,2,"颐和园规模宏大，气象万千。下列选项中，哪些景点位于颐和园中？",["沁芳亭","冠云峰","万寿山","昆明湖"],"CD","A项沁芳亭位于北京的大观园中，B项冠云峰位于苏州的留园中。",7],[1853,2,"中国文化又可称为____。",["中华文化","华夏文化","炎黄文化","中原文化"],"ABC","中国文化又称中华文化、华夏文化、炎黄文化，它属于国别文化。",1],[1854,2,"古代人们对月亮有着美好的想象，对其有很多种称呼，下列哪项不是古人对月亮的称呼？",["玉盘","羲和","婵娟","金乌"],"BD","B项羲和与D项金乌是对太阳的别称。",10],[1855,2,"《四时幽赏录》主要记述西湖一年四季的不同境趣，如春时____，夏时____，秋时“西泠桥畔醉红树”，冬时“三茅山顶望雪霁”。",["天然阁上看雨","东风渐绿西湖柳","花褪残红青杏小","三生石谈月"],"AD","B选项出自宋代周密的《高阳台·送陈君衡被召》，C项出自宋代苏轼的《蝶恋花·春景》。",7],[1856,2,"历史上对学生的称谓种类繁多，下列称谓哪些是对学生的称呼？",["生员","监生","弟子","足下"],"ABC","D项足下常用于对平辈或是朋友之间的敬称。",4],[1857,2,"中元节与___同为中国传统的祭祖节日。",["除夕","清明节","端午节","重阳节"],"ABD","清明节、中元节、重阳节、除夕是中国民间传统的四大祭祖大节，因此排除C选项。",5],[1858,2,"“岁寒三友”指的是____。",["兰花","松树","翠竹","梅花"],"BCD","“岁寒三友”意思是松、竹经冬不凋，梅花耐寒开放，因此有“岁寒三友”之称。",2],[1859,2,"下列名称中属于茶的古称或别称的有____。",["荼","茗","炙","诧"],"ABD","茶的别称很多，据陆羽《茶经》中介绍，除茶外，其名尚有槚、蔎、茗和荈。另外，据其他古籍中的记载，还有诧、皋芦、葭荼、酪妈等称呼，因此排除C选项。",12],[1860,2,"我国古代就已出现了专门为学童编写的书目。下列选项中，属于古代启蒙教材的有____。",["《三字经》","《增广贤文》","《菜根谭》","《弟子规》"],"ABD","C项《菜根谭》是以处世思想为主的格言式小品文集，采用语录体，揉合了儒家的中庸思想和佛家的出世思想的人生处世哲学。",2],[1861,2,"下列诗句中，描写的是洞庭湖的有____。",["月落乌啼霜满天，江枫渔火对愁眠","湖光秋月两相和，潭面无风镜未磨","最爱湖东行不足，绿杨阴里白沙堤","气蒸云梦泽，波撼岳阳城"],"BD","A项地处苏州；C项描写的是钱塘湖。",7],[1862,2,"下列句子中，描写西湖风光的有____。",["雾凇沆砀，天与云与山与水，上下一白","寒雨连江夜入吴，平明送客楚山孤","一道残阳铺水中，半江瑟瑟半江红","水光潋滟晴方好，山色空蒙雨亦奇"],"AD","B项描述王昌龄在芙蓉楼送别时的吴江夜雨，C项是诗人白居易在赴杭州任刺史的途中写的，表示出诗人自愿远离朝廷后轻松愉悦的解放情绪和个性色彩。",7],[1863,2,"下面属于瑶族盘王节习俗的是____。",["跳“盘王舞”","唱“盘王歌”","还盘王愿","吃五色饭"],"ABC","D项是壮族歌圩时候的习俗。",5],[1864,2,"茶马古道是中国西南民族经济文化交流的走廊。下面对茶马古道介绍正确的是____。",["易武、倚帮都是茶马古道上的重要古镇","茶马古道始于明清","运输的最主要货物是云南大叶种晒青紧压茶","普洱是茶马古道上独具优势的货物产地和中转集散地，具有悠久的历史"],"ACD","B项茶马古道始于唐代。",12],[1865,2,"明代围棋之风兴盛，流派纷起，形成了三个著名的流派，这三个流派分别是____。",["永嘉派","江西派","新安派","京师派"],"ACD","明代正德、嘉靖年间，形成了三个著名的围棋流派：以鲍一中为冠的永嘉派，以程汝亮为冠的新安派，以及以颜伦、李釜为冠的京师派，因此排除B选项。",13],[1866,2,"《三国演义》中出现了两次美人计，涉及的两位美人分别是____。",["小乔","貂蝉","蔡琰","孙尚香"],"BD","《三国演义》中有两个著名的美人计，第一个是貂蝉离间吕布与董卓，另一个则是孙权把妹妹孙尚香嫁给刘备，预想骗其到东吴作人质。",0],[1867,2,"戏曲演员要具备的四项基本功，俗称“四功”，包括____。",["唱","说","念","做"],"ACD","“四功”是唱、念、做、打，因此排除B选项。“唱”指歌唱，是戏曲表演中的核心内容；“念”指具有音乐性的念白；“做”指舞蹈化的形体动作，即戏曲演员在戏曲表演过程中做工的基本功夫；“打”指武打和翻跌的技艺，即戏曲表演艺术中武戏中的武打功夫。",9],[1868,2,"下面的关键词中，与陶渊明有关的是____。",["端午节","桃花源","采菊东篱下","五柳先生"],"BCD","A选项端午节是为了纪念战国时期跳汨罗江自尽的楚国诗人——屈原。",0],[1869,2,"书法碑帖集中展示了中国传统书法之美，下列书法碑帖中现存于山东曲阜孔庙的有____。",["《乙瑛碑》","《史晨碑》","《礼器碑》","《曹全碑》"],"ABC","D项《曹全碑》现存于西安碑林博物馆。",8],[1870,2,"下列属于韩愈在文学上的主张有____。",["“致君尧舜上，再使风俗淳”","“文道合一”","“务去陈言”","“文从字顺”"],"BCD","A项“致君尧舜上，再使风俗淳”，出自唐代杜甫《奉赠韦左丞丈二十二韵》诗。",0],[1871,2,"每逢春节，大街小巷就会挂上红色的中国结，以营造喜庆的节日氛围。下列属于中国结特点的有____。",["上下一致","左右对称","首尾互衔","正反不同"],"ABC","中国结讲究上下一致，左右对称，正反相同，首尾可接，因此排除D选项。",5],[1872,2,"下列书法家与其作品搭配正确的有____。",["王羲之——《快雪时晴帖》","怀素——《自叙帖》","张旭——《论书帖》","黄庭坚——《鸭头丸帖》"],"AB","C项《论书帖》的作者是怀素，D项《鸭头丸帖》的作者是王献之。",8],[1873,2,"下列属于相声演
