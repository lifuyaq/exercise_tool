字体系。",1],[444,0,"甲骨文发现于清末的河南安阳殷墟。",[],"正确","1899年王懿荣首先鉴识甲骨文，其出土地为河南安阳小屯村殷墟。",1],[445,0,"秦始皇统一后\"书同文\"，以小篆为标准字体。",[],"正确","秦统一后推行小篆为全国统一的规范文字。",1],[446,0,"楷书是由隶书演变而来的。",[],"正确","楷书萌芽于汉末，由隶书简化演变而成，盛行于魏晋南北朝。",8],[447,0,"《四库全书》按经、史、子、集四部分类。",[],"正确","乾隆年间编成的《四库全书》按经史子集四部分类，是我国最大的一部丛书。",2],[448,0,"孔子创办私学，打破了\"学在官府\"的垄断局面。",[],"正确","孔子首开私人讲学之风，使学术下移民间。",2],[449,0,"太学设立于汉武帝时期。",[],"正确","汉武帝采纳董仲舒建议，设立太学，是中国古代第一所官办最高学府。",1],[450,0,"岳麓书院是宋代著名的书院。",[],"正确","岳麓书院创建于北宋，与白鹿洞、嵩阳、应天书院并称四大书院。",7],[451,0,"科举殿试一甲只录取三人。",[],"正确","殿试一甲赐进士及第，仅取三名，即状元、榜眼、探花。",3],[452,0,"古代考试作弊夹带文字称\"怀挟\"。",[],"正确","科举考场上夹带小抄、资料进场被称为\"怀挟\"，一经查出即予重惩。",3],[453,0,"\"颜筋柳骨\"说的是颜真卿、柳公权书法各自的特色。",[],"正确","颜体浑厚丰腴、筋力饱满，柳体骨力劲健，故称\"颜筋柳骨\"。",8],[454,0,"\"扬州八怪\"是清代活跃于扬州画坛的画家群体。",[],"正确","扬州八怪指清代扬州一批风格独特的画家，如郑板桥、金农等。",8],[455,0,"《千里江山图》是北宋王希孟的青绿山水名作。",[],"正确","十八岁的王希孟在宋徽宗指点下绘成《千里江山图》，是青绿山水的巅峰之作。",8],[456,0,"编钟是中国古代重要的打击乐器。",[],"正确","编钟由大小不同的钟编成，按音阶排列，用于宗庙祭祀和宴飨。",9],[457,0,"曾侯乙编钟出土于湖北随州。",[],"正确","1978年湖北随州曾侯乙墓出土的编钟共六十五件，音域宽广。",9],[458,0,"中国是世界上最早种茶、饮茶的国家。",[],"正确","中国是茶的故乡，种茶、制茶、饮茶都起源于中国。",12],[459,0,"被后人尊为\"茶圣\"的唐代人是陆羽。",[],"正确","陆羽著《茶经》，系统总结种茶、制茶、饮茶之道，被尊为\"茶圣\"。",12],[460,0,"满汉全席是清代宫廷中盛大的宴席。",[],"正确","满汉全席集满、汉菜肴之大成，是清代宫廷豪华宴席的总称。",12],[461,0,"四合院是北京等北方地区典型的传统民居。",[],"正确","四合院四面房屋围合庭院，坐北朝南，是北方民居的典型形式。",1],[462,0,"福建土楼是客家民居的典型代表。",[],"正确","福建西南部客家人聚族而居建起的圆楼方楼，被称为土楼。",10],[463,0,"围棋古称\"弈\"，是中国古人发明的棋类。",[],"正确","围棋古称弈，相传为尧所造，是中国最古老的棋类游戏之一。",13],[464,0,"中国象棋棋盘上\"楚河汉界\"的名称与楚汉相争有关。",[],"正确","\"楚河汉界\"源于刘邦项羽以鸿沟为界中分天下的历史。",13],[465,0,"春节在古代曾被称为\"元旦\"，指农历正月初一。",[],"正确","辛亥革命前，农历正月初一称\"元旦\"，后公历1月1日改称元旦。",5],[466,0,"除夕\"守岁\"寓意辞旧迎新。",[],"正确","除夕围炉不眠、待到天明叫守岁，寓意珍惜时光、辞旧迎新。",5],[467,0,"清明节既是节气又是传统节日。",[],"正确","\"清明\"在二十四节气中占一位，又融合寒食禁火、扫墓踏青等习俗而成为节日。",5],[468,0,"端午节有赛龙舟、吃粽子的习俗。",[],"正确","龙舟竞渡、包粽子相传都与纪念屈原有关。",5],[469,0,"腊月二十三（或二十四）祭灶，俗称\"小年\"。",[],"正确","祭灶是春节的前奏，民间称这一天为小年。",5],[470,0,"贴春联时，上联一般贴在面对大门的右侧。",[],"正确","按传统，上联贴右、下联贴左（面对大门），横批从右往左读。",5],[471,0,"属相（生肖）十二年一个轮回。",[],"正确","十二生肖与十二地支相配，十二年一个轮回。",5],[472,0,"古代把一夜分为五更。",[],"正确","一夜分为五更，每更约两个小时，三更即半夜。",6],[473,0,"\"五岳\"指泰山、华山、衡山、恒山、嵩山。",[],"正确","东岳泰山、西岳华山、南岳衡山、北岳恒山、中岳嵩山，合称五岳。",7],[474,0,"\"文房四宝\"以湖笔、徽墨、宣纸、端砚最为著名。",[],"正确","浙江湖州的笔、安徽徽州的墨、宣城的纸、肇庆的砚并称四宝名品。",8],[475,1,"春节贴____字，是中国民间由来已久的风俗，寄托了人们对美好生活的向往，也是对未来的祝愿。",["福","喜","吉","祥"],"A","春节贴“福”字，是中国民间由来已久的风俗，寄托了人们对美好生活的向往，也是对未来的祝愿。据宋代《梦粱录》记载:“岁旦在迩，席铺百货，画门神桃符，迎春牌儿……”“士庶家不论大小，俱洒扫门闾，去尘秽，净庭户，换门神，挂钟馗，钉桃符，贴春牌，祭祀祖宗”。文中的“贴春牌”即是写在红纸上的“福”字。",5],[476,1,"有“文章巨公”和“百代文宗”之名的是____。",["李白","韩愈","杜甫","白居易"],"B","韩愈，字退之，有“文章巨公”和“百代文宗”之称。",0],[477,1,"《定风波》这首词是苏轼被贬于____时外出有感而作的。",["黄州","惠州","儋州","杭州"],"A","苏轼的《定风波·莫听穿林打叶声》是记事抒怀之词。作于宋神宗元丰五年（公元1082年）春，当时是苏轼因“乌台诗案”被贬为黄州团练副使的第三个春天。词人与朋友春日出游突遇风雨，词人却毫不在乎，泰然处之，吟咏自若，缓步而行。",0],[478,1,"“琴棋书画”是中国古代文人修身必备，被誉为“文人四友”，这里的“棋”指的是____。",["围棋","中国象棋","国际象棋","跳棋"],"A","四艺，通常指中国文人所推崇和要掌握的四门艺术，即琴、棋、书、画，又称为“文人四艺”，或“秀才四艺”。“琴”指的是弹琴（多指古琴）、“棋”指的是弈棋（多指围棋和中国象棋）、“书”指的是书法、“画”指的是绘画。",13],[479,1,"写出下诗中缺失部分：____花落去，似曾相识燕归来。",["无可奈何","似曾相识","等闲识得","无边落木"],"A","出自宋代晏殊的《浣溪沙·一曲新词酒一杯》\n一曲新词酒一杯，去年天气旧亭台。夕阳西下几时回？\n无可奈何花落去，似曾相识燕归来。小园香径独徘徊。",0],[480,1,"“唐太宗”的“太宗”指的是他的____。",["庙号","谥号","年号","尊号"],"A","庙号是中国君主死后在庙中被供奉时所称呼的名号，起源于重视祭祀与敬拜的商朝。唐太宗，名李世民（599年1月23日—649年7月10日。他的名字意思是“济世安民”，太宗是他死后的庙号。",4],[481,1,"“三人行，必有我师”、“敏而好学，不耻下问”出自____。",["《孟子》","《论语》","《大学》","《中庸》"],"B","《论语》，是春秋时期思想家、教育家孔子的弟子及再传弟子记录孔子及其弟子言行而编成的语录文集，成书于战国前期。全书共20篇492章，以语录体为主，叙事体为辅，较为集中地体现了孔子及儒家学派的政治主张、伦理思想、道德观念、教育原则等。",2],[482,1,"“好来宝”是____族的即兴诗。",["蒙古","维吾尔","藏族","壮族"],"A","好来宝是中国蒙古族曲艺曲种，用蒙古语演唱。好来宝在蒙古语中意为“联韵”，即各句唱词的头一个音节谐韵，故又称联头韵。有的则将好来宝译为“连起来唱”或 “串起来唱”。2008年6月7日，好来宝经国务院批准列入第二批国家级非物质文化遗产名录。",0],[483,1,"世界遗产委员会第24届会议决定把龙门石窟列入《世界遗产名录》，龙门石窟位于河南省____市。",["洛阳","郑州","开封","安阳"],"A","龙门石窟位于河南省洛阳市，是世界上造像最多、规模最大的石刻艺术宝库，被联合国科教文组织评为“中国石刻艺术的最高峰”，位居中国各大石窟之首。现为世界文化遗产、全国重点文物保护单位、国家AAAAA级旅游景区。",7],[484,1,"中国的四大发明是造纸术、指南针、火药、____。",["印刷术","纺织术","冶铁术","制瓷术"],"A","中国四大发明是造纸术、指南针、火药、印刷术。四大发明是中国古代创新的智慧成果和科学技术，四大发明的概念却来源于西方学者，并在之后被中国人接受。意大利数学家杰罗姆·卡丹早在1550年就第一个指出，中国对世界所具有影响的“三大发明”：是司南（指南针）、印刷术和火药。来华传教士艾约瑟最先在三大发明中加入造纸术。",11],[485,1,"我国思想家____曾提出：学校应成为民主议政的场所。",["黄宗羲","孔子","孟子","朱熹"],"A","黄宗羲“学校议政”思想主要体现于其著作《明夷待访录学校》中。该书曾被称为“反对君主专制主义的战斗檄文，代表了中国古代民主思想的最高成就”。学校议政思想可以概括为：学校反映民意，参与决策，舆论监督限制皇权、官权。在他看来，不是皇帝，而是“学校”形成的舆论，才是天下是非的标准，身为天子的皇上也要以其是非为是非。",2],[486,1,"“破釜沉舟”这个成语出于____。",["巨鹿之战","长平之战","官渡之战","赤壁之战"],"A","巨鹿之战，是秦末大起义中项羽率领数万楚军（后期各诸侯义军也参战）同秦名将章邯、王离所率四十万秦军主力在巨鹿（现属邢台市平乡县地区）进行的一场重大决战性战役，也是中国历史上著名的以少胜多的战役之一。项羽破釜沉舟，以大无畏精神在各诸侯军畏缩不进时率先猛攻秦军，带动诸侯义军，一起最终全歼王离军，并于八个月后迫使另二十万章邯秦军投降。从此项羽确立了在各路义军中的领导地位。经此一战，加之刘邦西路大军攻破武关、蓝田，秦朝主力尽丧，加速覆亡。",1],[487,1,"“博士”作为官名最早出现在____朝。",["秦","汉","唐","宋"],"A","博士，古为官名。秦汉时是掌管书籍文典、通晓史事的官职。",1],[488,1,"“吴带当风”是形容我国唐代画家____的笔法。",["吴道子","阎立本","张萱","周昉"],"A","吴道子是中国山水画的祖师，被后人尊称为“画圣”，素有“吴带当风”的美誉，他的人物绘画更是“冠绝于世”。所绘人物，善用状如兰叶或蓴菜条之线条表现衣褶，使有飘举之势，人称“吴带当风”；又喜以焦墨勾线，略加淡彩设色，又称“吴装”。",8],[489,1,"我国历史上第一部编年体史书是____。",["《左传》","《春秋》","《史记》","《资治通鉴》"],"B","《春秋》是中国第一部编年体史书，共三十五卷，是儒家经典之一且为十三经中篇幅最长的，在四库全书中列为经部。记述范围从公元前722（鲁隐公元年）至公元前468。",2],[490,1,"徐霞客曾经盛赞一座山为“四海名山皆过目，就中此景难图录”。这座山指的是____。",["黄山","庐山","雁荡山","武夷山"],"C","徐霞客曾经盛赞一座山为：“四海名山皆过目，就中此景难图录。”这座山指的就是以山水奇秀闻名，素有“海上名山、寰中绝胜”之誉，史称中国“东南第一山”的雁荡山。据说，是因山顶有湖，芦苇茂密，结草为荡，南归秋雁多宿于此，故名雁荡。雁荡山开山凿胜始于南北朝，兴于唐，盛于宋。历代文人墨客纷至沓来，谢灵运、沈括、徐霞客等都是雁荡山的忠实拥趸，留下了不少诗篇。",7],[491,1,"____是中国境内最早的直立人。",["北京人","元谋人","山顶洞人","蓝田人"],"B","元谋人，学名元谋直立人，或称元谋猿人，是在中国发现的直立人化石。1965年发现于云南元谋上那蚌村附近，共计左右门齿两颗。",7],[492,1,"三星堆遗址位于四川省广汉市，古蜀文化遗址，被誉为____文明之源。",["辽河","黄河","珠江","长江"],"D","三星堆古遗址位于四川省广汉市西北的鸭子河南岸，分布面积12平方千米，距今已有5000至3000年历史，是迄今在西南地区发现的范围最大、延续时间最长、文化内涵最丰富的古城、古国、古蜀文化遗址。三星堆遗址被称为20世纪人类最伟大的考古发现之一，昭示了长江流域与黄河流域一样，同属中华文明的母体，被誉为“长江文明之源”。",7],[493,1,"最早关于八段锦的记录是在____代。",["唐","明","宋","清"],"C","依据现有文献，八段锦之名最早出现在南宋洪迈撰写的《夷坚乙志》。",1],[494,1,"北宋书法四大家是黄庭坚、苏轼、米芾、____。",["苏轼","蔡襄","赵孟頫","柳公权"],"B","宋四家是中国北宋时期四位书法家苏轼、黄庭坚、米芾和蔡襄的合称。这四个人大致可以代表宋代的书法风格，而且成就最高，故称“宋四家”。",8],[495,1,"“三吏三别”是《石壕吏》、《潼关吏》、《新安吏》和____、《垂老别》、《无家别》。",["《新婚别》《从军别》","《离别别》","《征人别》"],"A","“三吏三别”即《新安吏》《石壕吏》《潼关吏》《新婚别》《无家别》《垂老别》，是杜甫的作品，深刻写出了民间疾苦及在乱世之中身世飘荡的孤独，揭示了战争给人民带来的巨大不幸和困苦，表达了作者对倍受战祸摧残的老百姓的同情。",0],[496,1,"四大名旦是梅兰芳、程砚秋、尚小云、____。",["张君秋","荀慧生","言慧珠","李世济"],"B","京剧四大名旦是指梅兰芳、程砚秋、尚小云、荀慧生，他们是中国京剧旦角行当中四大艺术流派的创始人。他们的优秀艺术，给人留下了不可磨灭的印象。",8],[497,1,"《水浒传》中吴用的绰号是____。",["智多星","及时雨","豹子头","黑旋风"],"A","智多星是《水浒传》人物吴用的绰号。吴用满腹经纶，通晓文韬武略，足智多谋，常以诸葛亮自比，道号“加亮先生”，人称“智多星”。",0],[498,1,"“海上生明月，天涯共此时”的作者是____。",["李白","杜甫","张九龄","王维"],"C","“海上生明月，天涯共此时”出自张九龄的《望月怀远》。表示一轮明日从海上慢慢升起，远在天边的亲人这时候一定和我一样在凝视着它。后用来表达对远方亲人的思念之情。",0],[499,1,"“无边落木萧萧下，不尽长江滚滚来”是____的作品。",["李白","杜甫","王维","白居易"],"B","“无边落木萧萧下，不尽长江滚滚来”出自唐朝诗人杜甫的古诗作品《登高》第三四句，其全诗文如下：风急天高猿啸哀，渚清沙白鸟飞回。无边落木萧萧下，不尽长江滚滚来。万里悲秋常作客，百年多病独登台。艰难苦恨繁霜鬓，潦倒新停浊酒杯。",0],[500,1,"红杏尚书指的是____。",["欧阳修","宋祁","晏殊","柳永"],"B","宋祁(公元998年-公元1061年)，字子京，小字选郎。是北宋官员、著名文学家、史学家、词人。司空宋庠之弟，宋祁与兄长宋庠并有文名，时称“二宋”。诗词语言工丽，因《玉楼春》词中有“红杏枝头春意闹”，世称“红杏尚书”。",3],[501,1,"词这种文体起于唐代盛于____代。",["元","明","清","宋"],"D","词最初称为“曲词”或“曲子词”,是配音乐的。 后来词也跟乐府一样，逐渐跟音乐分离，成为诗的别体，所以有人把词 称为“诗余”。 因其每句的长短丌一，所以又称“长短句”。",1],[502,1,"将军百战死，壮士十年归中用了____的修辞手法。",["比喻","互文","拟人","夸张"],"B","互文这种修辞手法，是古汉语中一种特殊的修辞手法。即 互文见义 ，是指在有意思相对或文句相关的词句里面，前后两句词语互相呼应，互相交错，意义上互相渗透、互相补充，使文句更加整齐和谐、更加精炼的一种修辞手法。",1],[503,1,"负荆请罪的故事主角是廉颇和____。",["诸葛亮","蔺相如","周瑜","曹操"],"B","《史记·廉颇蔺相如列传》：相如曰：“夫以秦王之威，而相如廷叱之，辱其群臣，相如虽弩，独畏廉将军哉！顾吾念之，强秦之所以不敢加兵予赵者，徒以吾两人在也，今两虎共斗，其势不俱生，吾所以为此者，以先国家之急而后私仇也。”廉颇闻之，肉袒负荆。因宾客至蔺相如门谢罪，曰：“鄙贱之人，不知将军宽之至此也!”卒相与欢，为刎颈之交。后世据此典故提炼出成语“负荆请罪”。",1],[504,1,"“师者，所以传道受业解惑也。”中的“道”指的是____家礼教、思想。",["儒","道","法","墨"],"A","此句出自韩愈的《师说》，意思是：老师，是用来传授知识、教授学业、解答疑惑的人。“道”指的是儒家礼教、思想。",8],[505,1,"岳飞出征前，岳母在他的背上刺了____四个大字。",["精忠报国","忠君报国","尽忠报国","报国杀敌"],"C","岳飞出仕之前，其母在其背上刺上“尽忠报国”四字，以期岳飞日后能够为国竭尽忠诚。这是中国最著名的历史典故之一，常用以教育，激发青少年的爱国主义精神。",7],[506,1,"“就像没有那回事一样，形容态度镇定，不把事情放在心上。”这句话描述的是成语____。",["泰然自若","处之泰然","若无其事","从容不迫"],"C","好像没有那么回事似的，形容不动声色或漠不关心。",0],[507,1,"《道德经》它是依据____的教诲编写而编写的。",["孔子","庄子","墨子","老子"],"D","《道德真经》即《道德经》，又称《老子》、《老子五千文》。共81章，5000余言，分上下篇。老子著。",2],[508,1,"我国传统图案里以石榴象征____。",["富贵","长寿","吉祥","多子"],"D","在中国传统文化中，石榴是吉祥的象征。它的果实里有很多石榴籽，寓意多子多福。所以可以送给已婚夫妇，代表多子多福。",14],[509,1,"“欲将轻骑逐”中“将”的意思是____。",["率领","将要","将领","把"],"A","欲将轻骑逐，大雪满弓刀。出自卢纶的《和张仆射塞下曲六首》，意思是：正想要率领轻骑一路追杀，纷纷大雪，却已经洒满了将士的弓刀。",0],[510,1,"“在危急的时刻，猛然想出办法。”这句话描述的是成语____。",["急中生智","随机应变","从容不迫","胸有成竹"],"A","急中生智是，汉语成语，拼音是jí zhōng shēng zhì，意思是形容事态紧急的时候，突然想出办法。出自《和微之诗二十三首序》。",0],[511,1,"“斯恶已”中“恶”的解释是____。",["丑陋","邪恶","厌恶","恶劣"],"A","天下皆知美之为美,斯恶已。皆知善之为善,斯不善已。摘自《老子·道经·第二章》 解释：当天下的人都知道都认为这件事是美好的话,那么它丑恶的一面就显现出来了。",2],[512,1,"我国文房四宝是____。",["琴棋书画","笔墨纸砚","梅兰竹菊","诗词歌赋"],"B","笔墨纸砚，是中国独有的文书工具，即文房四宝。",8],[513,1,"《礼记》中认为人的七情是指喜、怒、哀、乐、爱、恶、____。",["惧","欲","忧","思"],"B","七情按《礼记》的观点指喜、怒、哀、惧、爱、恶、欲，按儒家的说法是喜、怒、哀、惧、爱、恶、欲，按佛教的说法则是喜、怒、忧、惧、爱、憎、欲，而医家的七情是喜、怒、忧、思、悲、恐、惊。",2],[514,1,"“天下第一行书”是王羲之的____。",["《快雪时晴帖》","《丧乱帖》","《兰亭集序》","《二谢帖》"],"C","《兰亭集序》，又题为《临河序》、《禊帖》、《三月三日兰亭序》等。晋穆帝永和九年（公元353）三月三日，时任会稽内史的王羲之与友人谢安、孙绰等四十一人会聚兰亭，赋诗饮酒。王羲之将诸人名爵及所赋诗作编成一集，并作序一篇，记述流觞曲水一事，并抒写由此而引发的内心感慨。这篇序文就是《兰亭集序》。此序受石崇《金谷诗序》影响很大，其成就又远在《金谷诗序》之上。",8],[515,1,"书法史上的“二王”是指王羲之和____两位书法家。",["王徽之","王凝之","王献之","王玄之"],"C","“二王”书法家是指王羲之和王献之，他们二人为父子，是东晋时期的大书法家。",8],[516,1,"《祭侄文稿》被誉为“天下第二行书”，它的作者是____。",["柳公权","欧阳询","颜真卿","褚遂良"],"C","《祭侄文稿》，全名《祭侄赠赞善大夫季明文文稿》，俗谓《祭侄稿》。为唐朝书法家颜真卿所书，后世誉为“天下行书第二”，真迹现藏于台北国立故宫博物院。",8],[517,1,"我国文学史上第一部诗歌总集____。",["《楚辞》","《乐府诗集》","《诗经》","《古诗十九首》"],"C","《诗经》，是中国古代诗歌开端，最早的一部诗歌总集，收集了西周初年至春秋中叶(前11世纪至前6世纪)的诗歌，共311篇，其中6篇为笙诗，即只有标题，没有内容，称为笙诗六篇(《南陔》《白华》《华黍》《由庚》《崇丘》《由仪》)，反映了周初至周晚期约五百年间的社会面貌。",0],[518,1,"杰出的女纺织家黄道婆向____妇女学习棉纺织技术。",["壮族","傣族","黎族","彝族"],"C","黄道婆，又名黄婆、黄母，是原松江府乌泥泾(今属上海市)人，宋末元初著名的棉纺织家、技术改革家。幼时为童养媳，曾因不堪虐待流落崖州(治所在今海南省三亚市崖城镇)，定居约40年，向黎族妇女学习棉纺织技艺并有改进，总结出“错纱、配色、综线、挈花”的织造技术。",10],[519,1,"傈傈族语属于____语系。",["汉藏","阿尔泰","南岛","印欧"],"A","傈僳语属汉藏语系-藏缅语族-彝语支。",1],[520,1,"芳华越剧团的创始人是____。",["袁雪芬","尹桂芳","傅全香","王文娟"],"B","福建省芳华越剧团，原为上海市芳华越剧团，由著名越剧表演艺术家尹桂芳于1946年在上海创建。",9],[521,1,"“徐黄异体”指的是五代画家____和黄筌的花鸟画风格。",["徐渭","黄居寀","徐熙","赵昌"],"C","徐熙画派，中国画流派之一。为五代花鸟画派的一支，代表画家徐熙。北宋郭若虚在《图画见闻志》\"论黄、徐体异\"时说\"黄家富贵，徐熙野逸。\"又说\"徐熙江南处士\"，\"多状江南所有，汀花野竹，水鸟渊鱼。\"此派多作粗笔浓墨，略施杂彩，而笔迹不隐，素有\"落墨花\"之称。",8],[522,1,"中国现存最大的两座古代木构殿堂是____和凌恩殿。",["中和殿","保和殿","乾清宫","太和殿"],"D","太和殿俗称金銮殿，为汉族宫殿建筑之精华，东方三大殿之一。中国现存最大的木结构大殿。位于北京紫禁城(故宫)南北主轴线的显要位置，明永乐十八年(1420年)建成，称奉天殿。明嘉靖四十一年(1562年)改称皇极殿，清顺治二年(1645年)改今名。建成后屡遭焚毁，多次重建，今殿为清康熙三十四年(1695年)重建后的形制。",10],[523,1,"补全诗句：“沧海月明珠有泪，蓝田日暖____。”",["玉生烟","珠生辉","月生辉","石生烟"],"A","沧海月明珠有泪，蓝田日暖玉生烟：在明亮的月色中，我的眼泪流泻不止；在温暖的阳光下，依稀望见蓝田山上紫玉化成的青烟。",0],[524,1,"在我国古代，“鱼书”指的是____。",["鱼类图鉴","书信","捕鱼工具","渔业书籍"],"B","鱼书是古时对书信的称谓。纸张出现以前，书信多写在白色丝绢上，为使传递过程中不致损毁，古人常把书信扎在两片竹木简中，简多刻成鱼形，故称鱼书。",4],[525,1,"袁雪芬、严凤英、红线女、叶盛兰分别是越剧、____、粤剧、京剧的著名演员。",["评剧","黄梅戏","豫剧","吕剧"],"B","袁雪芬、严凤英、红线女、叶盛兰分别是越剧、黄梅戏、粤剧、京剧的著名演员。",9],[526,1,"《兰亭序》、《九成宫醴泉铭》、《石门颂》、《泰山刻石》分别是行书、楷书、隶书和____的代表作。",["大篆","草书","小篆","魏碑"],"C","《泰山刻石》是刊刻于秦代的一方摩崖石刻，分为两部分，传为李斯撰文并书丹， 又称“李斯碑”等，属小篆书法作品。",8],[527,1,"诗句“天下伤心处，劳劳送客亭。春风知别苦，不遣柳条青”的作者是____。",["杜甫","李白","王维","白居易"],"B","《劳劳亭》，是由唐代著名诗人、文学家、浪漫主义诗人李白所作的一首五言绝句，其所作年代殆已不可切考，似为作者漫游金陵时作。诗中虽有送别之意，却无送别之人、之事，只是因地起意，借景抒情，故以亭为题来表达人间的离别之苦。",0],[528,1,"京杭大运河数段中最早开凿的是____。",["邗沟","通济渠","永济渠","江南河"],"A","京杭大运河最早开凿的河段是邗沟，从春秋吴王夫差十年起，以通江淮为起始点，之后是隋朝的运河系统，历经了元、明、清三个朝代的扩展，才初具规模，有了世界第一大运河的雏形，为我国的经济文化繁荣发展做出了杰出的贡献。",7],[529,1,"儒家文化主要是政治、伦理道德文化。如果说儒家文化是“入世”文化的话，那么道、佛文化则是____文化。",["出世","入世","现世","济世"],"A","儒家文化主要是政治、伦理道德文化。如果说儒家文化是“入世”文化的话，那么道、佛文化则是“出世”文化。它们相辅相成，互为表里，构成传统文化的主体。出世：古代一种对世俗之事不关注的思想。“世”则指凡尘俗世。",2],[530,1,"耄耋之年指____岁。",["五六十","八九十","七八十","六七十"],"B","耄耋之年是一个汉语成语，用作对老年人的泛称，指八九十岁。出自曹操《对酒》：“耄耋皆得以寿终，恩泽广及草木昆虫。”",4],[531,1,"上元节的时间是____，张灯为戏，又叫“灯节”。",["正月初一","正月十五","五月初五","八月十五"],"B","元宵节，又称上元节、小正月、元夕或灯节，时间为每年农历正月十五。\n正月是农历的元月，古人称“夜”为“宵”，正月十五是一年中第一个月圆之夜，所以称正月十五为“元宵节”。根据道教“三元”的说法，正月十五又称为“上元节”。元宵节习俗自古以来就以热烈喜庆的观灯习俗为主。",5],[532,1,"汉字六书是____、指事、形声、会意、转注、假借。",["象形","象声","指示","假使"],"A","六书，首见于《周礼·地官·保氏》，汉代学者把汉字的构成和使用方式归纳成六种类型，总称六书。普遍采取的是许慎的名称、班固的次序。后世学者定名为象形、指事、会意、形声、转注、假借。 六书是后人对汉字进行分析而归纳出来的系统，也是最早的关于汉字构造的系统理论。当有了六书系统以后，人们再造新字时，都以该系统为依据。",1],[533,1,"书法九势是____、转笔、藏峰、藏头、护尾、疾势、掠笔、涩势、横鳞竖勒。",["落笔","起笔","收笔","运笔"],"A","书法九势为落笔、转笔、藏锋、藏头、护尾、疾势、掠笔、涩势、横鳞竖勒，为汉代书法家蔡邕对书法中行笔技巧的总结。",8],[534,1,"竹林七贤是____、刘伶、阮籍、山涛、阮咸、向秀、王戎。",["曹植","嵇康","陶渊明","谢灵运"],"B","竹林七贤指的是三国魏正始年间（240年—249年），嵇康、阮籍、山涛、向秀、刘伶、王戎及阮咸七人。因常在当时的山阳县(今河南焦作修武县，可能为现今云台山一带)竹林之下，喝酒、纵歌，肆意酣畅，世谓七贤，后与地名竹林合称。",1],[535,1,"饮中八仙为____、贺知章、李适之、李琎、崔宗之、苏晋、张旭、焦遂。",["杜甫","王维","李白","白居易"],"C","醉八仙，指唐朝嗜酒的八位学者名人，亦称酒中八仙、饮中八仙。《新唐书·李白传》载，李白、贺知章、李适之、汝阳王李琎、崔宗之、苏晋、张旭、焦遂为“酒中八仙人”。杜甫有《饮中八仙歌》。瓷器画面绘饮中八仙，每每于人物之上书以人名，以清朝为多见。",0],[536,1,"扬州八怪是郑板桥、汪士慎、李鱓、黄慎、金农、高翔、李方鹰、____。",["吴昌硕","罗聘","齐白石","任伯年"],"B","扬州八怪，是清康熙中期至乾隆末年活跃于扬州地区的一批风格相近的书画家总称，美术史上也常称其为“扬州画派”，指：金农、郑燮、黄慎、李鱓、李方膺、汪士慎、罗聘、高翔。",10],[537,1,"“河鼓二”在天文学上是指____。",["织女星","牛郎星","天狼星","北极星"],"B","河鼓二指天鹰座α星，又称“牛郎星”。古代传说牛郎织女七月七日鹊桥相会。实际上牛郎织女相距16光年，即使乘现代最强大的火箭，几百年后也不曾相会。河鼓二的两侧各有一颗较暗的星，分别称为河鼓一、河鼓三，它们与河鼓二合称为“河鼓三星”。河鼓三星像一根长长的扁担，所以民间又叫它“扁担星”。",10],[538,1,"唐宋八大家是____、柳宗元、欧阳修、苏洵、苏轼、苏辙、王安石、曾巩。",["韩愈","李白","杜甫","白居易"],"A","唐宋八大家，又称为“唐宋散文八大家”，是唐代和宋代八位散文家的合称，分别为唐代韩愈、柳宗元和宋代欧阳修、苏洵、苏轼、苏辙、王安石、曾巩八位。其中韩愈、柳宗元是唐代古文运动的领袖，欧阳修、三苏（苏轼、苏辙、苏洵）等四人是宋代古文运动的核心人物，王安石、曾巩是临川文学的代表人物。他们先后掀起的古文革新浪潮，使诗文发展的陈旧面貌焕然一新。",0],[539,1,"四大民间传说是____、孟姜女、梁山伯与祝英台、白蛇与许仙。",["牛郎织女","八仙过海","嫦娥奔月","愚公移山"],"A","在我国的古典文学宝库中，除了有史书记载的古典文学作品外，还有一类就是民间广为流传的神话传说，它不仅数量众多，内容丰富，而且绚丽多彩，充满诗情画意和艺术魅力，其中牛郎织女、孟姜女、梁山伯与祝英台与白蛇传被称为中国四大民间传说。",10],[540,1,"元代四大戏剧是____、王实甫《西厢记》、马致远《汉宫秋》、白朴《梧桐雨》。",["关汉卿《窦娥冤》","洪升《长生殿》","白朴《墙头马上》","郑光祖《倩女离魂》"],"A","元代四大戏剧是关汉卿的《窦娥冤》、王实甫的《西厢记》、汤显祖的《牡丹亭》、洪升的《长生殿》。",1],[541,1,"相声八德是____、玉德隆、焦德海、张德全、周德山、马德禄、刘德治、李德祥。",["马三立","李德钖","侯宝林","刘宝瑞"],"B","李德钖(1881-1926)，相声艺人。原名李佩亭，艺名万人迷。北京人。时人誉之为“相声大王”，与其他七位“德”字辈著名相声艺人并称“相声八德”。作品有《老老年》《对对子》《哭当票》《十八愁绕口令》。",9],[542,1,"五代是后梁、后唐、后晋、后汉、____。",["后周","北周","北齐","南齐"],"A","五代是指唐天佑四年(907年)唐朝灭亡后依次定都于中原地区的五个政权，即后梁、后唐、后晋、后汉和后周。",1],[543,1,"五贡是____、拔贡、岁贡、副贡、优贡。",["功贡","恩贡","劳贡","勋贡"],"B","清代科举制度中对五类贡生的总称.。包括:恩贡、拔贡、副贡、岁贡和优贡。这五类都是正途出身资格。另有捐纳取得的贡生，称为例贡。",3],[544,1,"六历是____、《颛顼历》、《夏历》、《殷历》、《周历》、《鲁历》。",["《神农历》","《伏羲历》","《黄帝历》","《尧历》"],"C","古六历通常是指从春秋战国到秦朝时期制定的黄帝、颛、夏、殷、周、鲁六种历法。六历的不同主要是“历元”（年的起算点）、施行地区和所用的元朔。",6],[545,1,"三山是指安徽____、江西庐山、浙江雁荡山。",["天柱山","九华山","黄山","齐云山"],"C","三山是指旅游胜地闻名的黄山、庐山、雁荡山。",7],[546,1,"五岭是指____、都庞岭、萌诸岭、骑田岭、大庾岭。",["武夷山","越城岭","南岭","秦岭"],"B","五岭：三个在湘桂间，因此一般是由西到东地排列，指越城岭(湘桂间)、都庞岭(湘桂间)、萌渚岭(湘桂间)、骑田岭(湘南)、大庾岭(赣粤间，腹地在江西大庾县)，横亘在湖南、两广、江西之间。是史称南岭者的主要构成。",7],[547,1,"“但愿人长久，千里共婵娟”，其中“婵娟”指的是____。",["时光","书信","美人","月亮"],"D","“婵娟,指美好的事物，在这首诗里特指月亮。“但愿人长久，千里共婵娟。”的意思是:只希望自己思念的人平安长久，不管相隔千山万水，都可以一起看到明月皎洁美好的样子。这句话常用于表达对远方亲人的思念之情以及美好祝愿。",0],[548,1,"“爆竹声中一岁除，春风送暖入屠苏”，这里的“屠苏”指的是____。",["服饰","房屋","酒","食物"],"C","屠苏，是酒名。古代汉族风俗于农历正月初一饮屠苏酒以避瘟疫。",12],[549,1,"“月上柳梢头，人约黄昏后”描写的传统节日是____。",["端午节","中秋节","元宵节","七夕节"],"C","“月上柳梢头，人约黄昏后”是北宋诗人欧阳修写的一首词，名为：《生查子•元夕》 ，全词：去年元夜时，花市灯如昼。月上柳梢头，人约黄昏后。今年元夜时，月与灯依旧。不见去年人，泪湿春衫袖。整首词创作背景是一年的伊始之际——元宵。",5],[550,1,"百家姓中没有____姓。",["肖","萧","赵","钱"],"A","百家姓中没有肖姓,只有萧姓。 《百家姓》成文于北宋初,原收集姓氏411个,后增补到504个，其中单姓444个，复姓60个。在《百家姓》中并没有肖姓。我国在20世纪70年代推行二简字之后，“萧”整个字的所有义项都被合并到“肖”(不仅姓氏)。于是所有的萧姓被写为肖姓，可后来正式废除二简字。",2],[551,1,"诸子百家中名家的特点是注重逻辑辩证，____这个典故能表达名家的这一特点。",["守株待兔","白马非马","刻舟求剑","掩耳盗铃"],"B","“名家”是先秦时期以辩论名实问题为中心的一个思想派别,重视“名”(概念)和“实”(事)的关系的研究。包括“白马非马”、“离坚白”、“合同异”等观点。",2],[552,1,"古人的婚礼在____（时间）举行。",["清晨","正午","深夜","黄昏"],"D","古人结婚时间一般是黄昏。无论是因为黄昏的昏和结婚的婚读音很接近的缘故，还是因为黄昏风景美丽的缘故，古人大多数都选择在黄昏结婚。",5],[553,1,"“天时不如地利，地利不如人和”出自____。",["《韩非子》","《老子》","《孟子》","《论语》"],"C","《天时不如地利，地利不如人和》出自《孟子·公孙丑下》。天时不如地利，地利不如人和的意思是：有利的时机和气候不如有利的地势，有利的地势不如人心所向。",2],[554,1,"文学史上被称作“小李杜”的是杜牧和____。",["李白","杜甫","李商隐","李贺"],"C","唐诗中以李白、杜甫的作品最享负盛名。至中晚唐，诗风的发展已近末流。因珠玉在前，后人已难有突破。当时一般诗人虽偶有佳作，但惟有杜牧和李商隐二人，能被时人一致公认为最杰出的作家。鉴於二人刚巧一位姓李,一位姓杜，与盛唐李杜相同，故称其为小李杜，以示与李白杜甫齐名。",0],[555,1,"我国书法艺术博大精深，“欧体”是指____的字体。",["欧阳修","欧阳通","欧阳询","欧大任"],"C","书法上的“欧体”是指欧阳询的字体，对应于楷书四大家“颜柳欧赵”中的欧，欧体结构严谨，于平正中见险绝，被尊为“唐人楷书第一”。",8],[556,1,"“大禹治水”的故事家喻户晓，大禹治理的是____流域的洪水。",["长江","淮河","黄河","珠江"],"C","大禹治水(鲧禹治水)是古代的汉族神话传说故事，著名的上古大洪水传说。他是黄帝的后代，三皇五帝时期，黄河泛滥，鲧、禹父子二人受命于尧、舜二帝，任崇伯和夏伯，负责治水。这一时期，黄河流域水患特别严重，百姓经常因为水患而流离失所，庄家更是颗粒无收，正因如此，治理黄河水患的问题一直困扰着人们。到了尧舜时期，黄河流域流水情况更加不稳定，已经到了不可不治的状况了。",7],[557,1,"《西游记》中唐僧的原型是____。",["鉴真","法显","玄奘","一行"],"C","唐僧，俗家姓陈，生于河南洛阳，法号“玄奘”，被尊称为“三藏法师”，世俗称为“唐僧”，小名叫“江流儿”。中国古典名著《西游记》中的主角之一，原型为唐代高僧玄奘。",0],[558,1,"被誉为“万园之园”的是____。",["颐和园","拙政园","圆明园","留园"],"C","圆明园是清代大型皇家园林，由圆明园及其附园长春园和绮春园（后改称万春园）组成，通称为“圆明三园”。圆明园占地面积3.5平方千米，规模宏伟，有一百五十余景，融会了各式园林风格，有“万园之园”之称，被誉为“一切造园艺术的典范”。",1],[559,1,"京剧《贵妃醉酒》是根据____这部古代戏曲改编而成的。",["《西厢记》","《牡丹亭》","《桃花扇》","《长生殿》"],"D","京剧中《贵妃醉酒》是由《长生殿》这部古代戏曲改编而成的，这首曲子讲述的是唐玄宗和杨玉环的爱情故事。",9],[560,1,"“讳疾忌医”典故中的君王是____。",["楚庄王","晋文公","齐桓公","蔡桓公"],"D","讳疾忌医是一个汉语成语，最早出自战国韩非的《韩非子·喻老》，讲述扁鹊为蔡桓公多次“诊病”而蔡桓公却多次“忌医”的故事。",1],[561,1,"“一门父子三词客，千古文章八大家”这幅对联中提到的“三父子”是苏洵、苏轼、____。",["苏秦","苏代","苏过","苏辙"],"D","“一门父子三词客，千古文章八大家”中三词客为：北宋苏洵、苏轼、苏辙；这是对苏轼、苏辙、苏洵三父子在文坛上的成就的褒奖",0],[562,1,"“一问三不知”，“三不知”说的是事情的开始、经过、____。",["原因","影响","背景","结果"],"D","出自《左传·哀公二十七年》，原意是对某一事情的开始、发展、结果都不知道，现在用来表示对实际情况一点也不知道。",2],[563,1,"“弱冠”指的是男子____岁。",["十八","十六","十五","二十"],"D","古代男子二十岁行冠礼，表示已经成人，因还没到壮年，叫作弱冠，后泛指男子二十左右的年纪。",4],[564,1,"唱念做打是中国戏曲表演的四种艺术手段，也是戏曲表演的四项根本功，其中____指的是器械表演。",["打","念","唱","做"],"D","唱念做打是京剧表演的四种艺术手段，也是京剧表演的四项基本功。唱指歌唱，念指具有音乐性的念白，二者相辅相成，构成歌舞化的京剧表演艺术两大要素之一的“歌”，做指舞蹈化的形体动作，打指武打和翻跌的技艺，二者相互结合，构成歌舞化的京剧表演艺术两大要素之一的“舞”。",9],[565,1,"水浒一百单八将中有____位女性。",["三","四","五","二"],"A","水浒传108将中的三名女将分别是顾大嫂、扈三娘、还有孙二娘，其中顾大嫂的结局最好。",0],[566,1,"____节来源于二十四节气。",["清明","端午","中秋","春节"],"A","清明节的得名源于我国农历24节气中的清明节气。清明节气共有15天，作为节气的清明，时间在春分之后。",5],[567,1,"____是我国北宋年间司马光主编的一部编年体。",["《资治通鉴》","《史记》","《汉书》","《后汉书》"],"A","《资治通鉴》（常简作《通鉴》），由北宋司马光主编的一部多卷本编年体史书，共294卷，历时19年完成。主要以时间为纲，事件为目，从周威烈王二十三年（公元前403年）写起，到五代后周世宗显德六年（公元959年）征淮南停。",1],[568,1,"“尚巧主景”是前人对____的诗的评价。",["岑参","王昌龄","高适","王之涣"],"A","“尚巧主景”指的是岑参边塞诗善于抓住边塞富有特色的景物进行描写，善于渲染景物、长于寓情于景、注重通过对客体的描绘传达诗人的主观情感的特点。",0],[569,1,"诗句“二十四桥明月夜，玉人何处教吹箫”中的“二十四桥”位于____。",["扬州","苏州","杭州","南京"],"A","一说扬州城里原有二十四座桥；一说即吴家砖桥，因古时有二十四位美女吹箫于桥上而得名。",10],[570,1,"苏轼在《念奴娇·赤壁怀古》中提到了“羽扇纶巾，谈笑间，樯橹灰飞烟灭”，“羽扇纶巾”形容的是____。",["周瑜","诸葛亮","曹操","孙权"],"A","羽扇纶巾，意思是拿着羽毛扇子，戴着青丝绶的头巾。形容态度从容。出自宋·苏轼《念奴娇·赤壁怀古》，指代汉末儒将周瑜的便装打扮 。",0],[571,1,"“归去来兮，吾归何处？”是苏轼所发出的哀叹之音,似有归隐田园之意。东晋一田园诗人曾有《归去来兮辞》文章，其诗人是____。",["陶渊明","谢灵运","阮籍","嵇康"],"A","《归去来兮辞》是晋宋之际文学家陶渊明创作的抒情小赋，也是一篇脱离仕途回归田园的宣言。这篇文章作于作者辞官之初，叙述了他辞官归隐后的生活情趣和内心感受，表现了他对官场的认识以及对人生的思索，表达了他洁身自好、不同流合污的精神情操。",0],[572,1,"唐诗大变于中唐，代表这种新变的第一诗人群是____诗派。",["韩孟","元白","山水田园","边塞"],"A","“韩孟诗派”是中唐的一个诗歌创作流派，以韩愈为领袖，包括孟郊、李贺、卢仝、马异、刘叉。他们主张“不平则鸣”，苦吟以抒愤，并互相切磋酬唱他们具有变态的审美趣味，“以丑为美”，以震荡光怪为美，以瘁索枯槁为美，以五彩斑斓为美。表现出重主观心理、尚奇险怪异的创作倾向。诗歌形成一种奇崛硬险的风格。他们在艺术上力求避熟就生，标新立异，力矫大历诗风的平弱纤巧。这种诗歌的新的追求与新的变化，积极推动了盛唐以后诗歌艺术境界的开拓。",8],[573,1,"元曲在元代被称作____。",["新乐府","长短句","乐府","词余"],"A","元曲在元代被称“乐府”，“新乐府”，“北乐府”。人们通常所说的元曲，包括剧曲和散曲。剧曲指的是杂剧的曲辞，它是戏剧这一在舞台上表演的综合艺术的密不可分的组成部分。",9],[574,1,"鲁迅先生称史记为“史家之绝唱，____”。",["有韵之《尚书》","无韵之离骚","史家之经典","千古之绝唱"],"B","“史家之绝唱，无韵之离骚”的意思是史家独一无二的文章，没有韵的《离骚》。史家之绝唱，无韵之离骚是鲁迅对司马迁《史记》的评价，这是一个相当高的评价。《离骚》是屈原的代表作，在我国古代文学史上有着划时代的意义，书写了高洁的志向和人格。",2],[575,1,"与曹操有关的著名典故为____。",["三顾茅庐","望梅止渴","草船借箭","火烧赤壁"],"B","南朝宋，刘义庆《世说新语·假谲》：有一次曹操带兵在外行军，一时找不到取水的地方，士兵都渴极了，曹操就骗他们说：“前面有个大梅林，梅子又甜又酸，可以解渴。”士兵听了，一个个都流出了口水，暂时止住了口渴。",0],[576,1,"我国古代最早提出“废黜百家，独尊儒术”的是____。",["孔子","董仲舒","孟子","荀子"],"B","“罢黜百家，独尊儒术”，是董仲舒于元光元年(公元前134年)提出的治国思想，在汉武帝时开始推行。",2],[577,1,"碧螺春是____茶的一种。",["红","绿","黑","白"],"B","碧螺春是中国传统名茶，中国十大名茶之一，属于绿茶类，已有1000多年历史。碧螺春产于江苏省苏州市吴县太湖的东洞庭山及西洞庭山(今苏州吴中区)一带，所以又称“洞庭碧螺春”。",7],[578,1,"____是我国湖北省的简称。",["湘","鄂","豫","皖"],"B","湖北省，位于中国中部偏南、长江中游，洞庭湖以北，故名湖北，简称“鄂”，省会武汉。",7],[579,1,"____指的是我国武汉市的美称。",["蓉城","江城","春城","山城"],"B","江城，指江河在本地文化中占据突出地位的城市，现特指湖北省武汉市。",7],[580,1,"“文武二圣”指的是孔子和____。",["刘备","关羽","曹操","孙权"],"B","“文武二圣”分别指的是孔子和关羽。两者代表了文武两个方面的最高成就。",2],[581,1,"“乌纱帽”正式成为做官为宦的代名词是在____朝。",["唐","明","宋","元"],"B","乌纱帽，古代官吏戴的一种帽子。乌纱帽原是民间常见的一种便帽，官员头戴乌纱帽起源于东晋，但作为正式官服的一个组成部分，却始于隋朝，兴盛于唐朝，到宋朝时加上了“双翅”，明朝以后，乌纱帽才正式成为做官为宦的代名词 。",1],[582,1,"《史记》中的“列传”共有____篇。",["十二","七十","三十","十"],"B","《史记》共一百三十篇。《史记》全书包括十二本纪（记历代帝王政绩）、三十世家（记诸侯国和汉代诸侯、勋贵兴亡）、七十列传（记重要人物的言行事迹，主要叙人臣。其中最后一篇为自序）、十表（大事年表）、八书（记各种典章制度记礼、乐、音律、历法、天文、封禅、水利、财用）。",1],[583,1,"长江三峡是指由巫峡、瞿塘峡和____。",["虎跳峡","三门峡","西陵峡","刘家峡"],"C","长江三峡又名峡江或大三峡，位于中国重庆市、恩施州、宜昌市地区境内的长江干流上，西起重庆市奉节县的白帝城，东至湖北省宜昌市的南津关，全长193千米，由瞿塘峡、巫峡、西陵峡组成。",7],[584,1,"五经《诗》、《书》、《易》、《礼》、《春秋》，其中《礼》为三礼，包含____、周礼、仪礼。",["《礼运》","《礼器》","《礼记》","《曲礼》"],"C","三礼指《仪礼》、《周礼》、《礼记》儒家经典。古代中国礼乐文化的理论形态，对礼法、礼义作了最权威的记载和解释，对历代礼制的影响最为深远。",2],[585,1,"孔子的政治思想核心内容是“礼”与____，在治国的方略上，他主张“为政以德”，用道德和礼教来治理国家是最高尚的治国之道。",["义","智","仁","信"],"C","孔子是儒家创始人，他的思想核心是“仁”“礼”。 “仁”的主张是“仁者爱人”，这一主张是要求统治阶级体察民情，反对苛政。“礼”的主张是“克己复礼”，就是说要克制自己，使自己符合“礼”要求。",2],[586,1,"“四象二十八星宿”是我国古代天文学最重要的成就，也是中国传统文化中最神秘的部分之一。其中的“四象”被称为“四方神”，影响及于我国古代的军事、宗教、文学、风水等各个领域。四象指的是青龙、____、朱雀、玄武。",["黄龙","麒麟","白虎","凤凰"],"C","“四象”通常指的是左青龙,右白虎,前朱雀,后玄武。古代汉族人民把东、西、南、北四方每一方的七宿想象为四种动物形象，叫作四象。",0],[587,1,"我国古代贵族四术为诗、书、礼和____。",["射","御","乐","数"],"C","《诗经》中的歌曲曾被列为上层社会教育的主要科目，所谓诗、书、礼、乐并称“四术”。",2],[588,1,"中国四大名绣为苏绣、湘绣、蜀绣、____。",["浙绣","闽绣","粤绣","鲁绣"],"C","中国四大名绣，是指中国中部湖南省的“湘绣”，中国西部四川省的“蜀绣”，中国南部广东省的“粤绣”和中国东部江苏省的“苏绣”的合称。",7],[589,1,"中国古代的四大书院分别是____、岳麓书院、嵩阳书院、应天书院。",["东林书院","石鼓书院","白鹿洞书院","茅山书院"],"C","“四大书院”指应天府书院（今河南商丘睢阳区商丘古城南湖畔）、岳麓书院（今湖南长沙岳麓区岳麓山）、白鹿洞书院（今江西九江庐山市庐山）和嵩阳书院（今河南郑州登封市嵩山）。",7],[590,1,"六义是诗经学名词，指的是风、雅、颂、赋、比、____。",["讽","喻","兴","咏"],"C","《诗经》是中国文学史上第一部诗歌总集，收入西周初期至春秋中叶间的诗歌三百零五篇。所谓《诗经》中的“六义”，是指“风、雅、颂”三种诗歌形式与“赋、比、兴”三种表现手法。",2],[591,1,"“按图索骥”中的“骥”本意指的是____。",["虎","豹","马","鹿"],"C","索：找；骥：良马。按照画像去寻求好马。比喻墨守成规办事；也比喻按照线索去寻求。",8],[592,1,"被称为菊月的月份是____。",["八月","十月","九月","七月"],"C","一月：瑞月 二月：花月 三月：桐月 四月：梅月 五月：蒲月 六月：荷月 七月：兰月 八月：桂月 九月：菊月 十月：阳月 十一月：辜月 十二月：霜月",14],[593,1,"“环肥燕瘦”中的“燕”是指谁_____",["杨玉环","西施","赵飞燕","王昭君"],"C","环是指的唐玄宗贵妃杨玉环，燕是指的汉成帝皇后赵飞燕。形容女子形态不同，各有各好看的地方。也借喻艺术作品风格不同，而各有所长。",1],[594,1,"屈原在____中写道，“吾令羲和弭节兮，望崦嵫而勿迫。”",["《九歌》","《天问》","《离骚》","《九章》"],"C","《离骚》是战国诗人屈原创作的文学作品。“离骚”，东汉王逸释为：“离，别也；骚，愁也。”《离骚》以理想与现实的冲突为主线，以花草禽鸟的比兴和瑰奇迷幻的“求女”神境作象征，借助于自传性回忆中的情感激荡，和复沓纷至、倏生倏灭的幻境交替展开全诗。作品倾诉了对楚国命运和人民生活的关心，“哀民生之多艰”，叹奸佞之当道。主张“举贤而授能”，“循绳墨而不颇”。提出“皇天无私阿”，对天命论进行批判。作品中大量的比喻和丰富的想像，表现出积极浪漫主义精神，并开创了中国文学上的“骚”体诗歌形式，对后世有深远影响。有东汉王逸《楚辞章句》、南宋朱熹《楚辞集注》、清代戴震《屈原赋注》等注本。",0],[595,1,"“尔曹身与名俱灭，不废江河万古流。”出自____的《戏为六绝句》(其二)。",["李白","王维","白居易","杜甫"],"D","出处：唐，杜甫《戏为六绝句》（其二）全文为：王杨卢骆当时体，轻薄为文哂未休。尔曹身与名俱灭，不废江河万古流。",0],[596,1,"“相见争如不见，有〔多〕情何似无情。”出自宋代____的《西江月》。",["苏轼","欧阳修","柳永","司马光"],"D","相见争如不见，有情何似无情。出自宋代司马光的《西江月》，全文是：“宝髻松松挽就，铅华淡淡妆成。青烟翠雾罩轻盈，飞絮游丝无定。相见争如不见，有情何似无情。笙歌散后酒初醒，深院月斜人静。”",0],[597,1,"“夫仁者，己欲立而立人，己欲达而达人”出自____。",["《中庸》","《大学》","《孟子》","《论语》"],"D","“己欲立而立人，己欲达而达人”出自于《论语·雍也》，意思是：仁爱之人，自己决定对人建立仁爱之心，别人才会对你仁爱，自己决定对人豁达（宽容），别人才会对你豁达（宽容）。",2],[598,1,"“泪眼问花花不语，乱红飞过秋千去。”出自____的《蝶恋花》。",["李清照","柳永","苏轼","欧阳修"],"D","出自欧阳修的《蝶恋花》。全文是：“庭院深深深几许，杨柳堆烟，帘幕无重数。玉勒雕鞍游冶处,楼高不见章台路。雨横风狂三月暮，门掩黄昏，无计留春住。泪眼问花花不语，乱红飞过秋千去。”",0],[599,1,"及笄之年是指____岁。",["二十","十八","十六","十五"],"D","及笄是指女子满了15岁。形容古代女子已到了结婚的年龄。",4],[600,1,"中元节是我国的传统节日之一,而在民间中元节也被人们称为____。",["寒食节","乞巧节","灯节","鬼节"],"D","中元节是我国的传统节日之一，而在民间中元节也被人们称为鬼节。当日祭拜时着装得体，以黑色灰色着装为宜。忌红色等大红大紫之色。否则容易招致煞气，惹祸上身。拜祭时要态度端正，不要大声喧哗，出言不逊或有不雅举止。据说否则会打扰到死者的灵魂，重者更会招致怨气。七月十五要外出游玩的朋友，要在太阳落山前返回。否则阳气退去，阴气见长，体弱多病之人则容易受到阴气袭扰。",5],[601,1,"补全词：“杜郎俊赏，算而今，重到须惊。纵豆蔻词工，青楼梦好，____。”",["别是一般滋味","忍把浮名","谁会凭阑意","难赋深情"],"D","出自宋诗人姜夔的《扬州慢·淮左名都》。全文为：淳熙丙申至日，予过维扬。夜雪初霁，荠麦弥望。入其城，则四顾萧条，寒水自碧，暮色渐起，戍角悲吟。予怀怆然，感慨今昔，因自度此曲。千岩老人以为有“黍离”之悲也。淮左名都，竹西佳处，解鞍少驻初程。过春风十里。尽荠麦青青。自胡马窥江去后，废池乔木，犹厌言兵。渐黄昏，清角吹寒。都在空城。杜郎俊赏，算而今、重到须惊。纵豆蔻词工，青楼梦好，难赋深情。",0],[602,1,"2013年4月，本着生态性、文化性、地方特色与时代性相结合的原则统筹考虑，最终选出“屯溪八景”，分别是谜窟探奇、新安怀古、华山思贤、老街问市、三江烟霞、稽灵松涛、龙山禅月和____。",["南湖秋月","东湖春晓","西湖烟雨","鬲山荷韵"],"D","“屯溪八景”分别是“谜窟探奇”、“新安怀古”、“华山思贤”、“老街问市”、“三江烟霞”、“稽灵松涛”、“龙山禅月”和“鬲山荷韵”。",7],[603,1,"____与武当山、青城山、龙虎山并称中国四大道教名山。",["九华山","五台山","普陀山","齐云山"],"D","四大道教名山为中国四处最主要的道教圣地，分别是：位于湖北十堰的武当山；位于江西鹰潭的龙虎山；位于安徽黄山的齐云山和位于四川都江堰的青城山。",7],[604,1,"清代出现的以满族菜为主，沿袭明代宫廷风格的菜肴，被称为____。",["宫廷菜","满族菜","明代菜","满汉全席"],"D","满汉全席，清朝时期宫廷盛宴。既有宫廷菜肴之特色，又有地方风味之精华；突出满族与汉族菜的特殊风味，烧烤、火锅、涮涮锅几乎不可缺少的菜点，同时又展示了汉族烹调的特色，扒、炸、炒、熘、烧等兼备，实乃中华菜系文化的瑰宝和最高境界。满汉全席原是清代宫廷中举办宴会时满人和汉人合坐的一种全席。",12],[605,1,"中国画史上，被公认为水准最高的山水画作是元代画作____。",["《溪山行旅图》","《清明上河图》","《千里江山图》","《富春山居图》"],"D","富春山居图是元代画家黄公望于1350年创作的纸本水墨画，中国十大传世名画之一。",8],[606,1,"五岳中以“险”著称的是____。",["泰山","衡山","嵩山","华山"],"D","五岳即东岳泰山、西岳华山、北岳恒山、中岳嵩山、南岳衡山。论景观，五岳又各具特色：泰山雄、衡山秀、华山险，恒山奇，嵩山奥。",7],[607,1,"中国传统的祥瑞动物中，“四灵”指的是麟、龙、凤、龟，再加上____，则称为“五灵”。",["熊","豹","狮","虎"],"D","五灵，谓麟、凤、龟、龙、白虎。《杜预春秋左氏传序》：“麒凤五灵，王者之嘉瑞也。”《疏》：“麟、凤与龟、龙、白虎五者，神灵之鸟兽，王者之嘉瑞也，独举麟、凤而云五灵，知二兽以外，为龟、龙、白虎。”",2],[608,1,"成语“胸有成竹”源于宋代____画竹的故事。",["文同","苏轼","米芾","蔡襄"],"A","北宋时候，有一个著名的画家，名叫文同，他是当时画竹子的高手。文同为了画好竹子，不管是春夏秋冬，也不管是刮风下雨，或是天晴天阴，他都常年不断地在竹林子里头钻来钻去，为的就是把竹子不同时期的姿态记在心头。由于文同长年累月地对竹子作了细微的观察和研究，竹子在春夏秋冬四季的形状有什么变化；在阴晴雨雪天，竹子的颜色、姿势又有什么两样；在强烈的阳光照耀下和在明净的月光映照下，竹子又有什么不同；不同的竹子，又有哪些不同的样子，他都摸得一清二楚。所以画起竹子来，根本用不着画草图。有个名叫晁补之的人，称赞文同说：文同画竹，早已胸有成竹了。",0],[609,1,"凉州词是乐府曲名，内容多描写西北边塞的风光及战争情景，请问凉州在现在的哪个省____？",["甘肃","青海","宁夏","陕西"],"A","凉州词，又称凉州曲，是盛唐时流行的一种曲调名。凉州即今武威市，甘肃省辖地级市，位于甘肃省中部。",9],[610,1,"“知己知彼，百战不殆”是举世闻名的兵法名句，出自《孙子兵法》，其作者是我国古代杰出的军事家____。",["孙武","孙膑","吴起","白起"],"A","“知彼知己，百战不殆”，意思是对敌人的情况和自己的情况都有透彻的了解，作战就不会失败，出自《孙子兵法·谋攻篇》。",0],[611,1,"历史上共有十个黄帝亲往曲阜祭祀孔子，最早的是____。",["刘邦","汉武帝","唐太宗","宋太祖"],"A","中国历史上第一位到曲阜祭祀孔子的皇帝是汉高祖刘邦。",1],[612,1,"中国古代祭祀天地的仪式很多，其中最为隆重的是____。",["封禅","郊祭","庙祭","社祭"],"A","封禅，封为“祭天”，禅为“祭地”，意思是指中国古代帝王在太平盛世或天降祥瑞之时的祭祀天地的大型典礼，一般由帝王亲自到泰山上举行。远古暨夏商周三代，已有封禅的传说。出自《管子·封禅篇》。",1],[613,1,"自秦至今，我国一直沿用的行政区划单位是____。",["县","郡","州","省"],"A","秦始皇即位时推行“郡县制”；秦代沿袭了秦的郡县制，与郡国并存；东汉形成“州、郡、县三级制”；隋又改为“郡(州)、县二级制”；唐设“道”对地方实行监察，将“郡”改称“州”，实行“道、州、县三级制”；宋改“道”为“路”，实行“路、州、县三级制”；元推行行省制,形成“省、道路、州(府)、县四级制”；明承元制，改行省为“承宣布政使司”,形成“司、府(州)、县”三级制；清承明制，改司为省，省名与今相近。由此，“县”是自秦迄今一直沿用的行政区划单位。",1],[614,1,"北魏时期，提出“除去三张伪法”，鼓动灭佛、改革天师道的道士是____。",["寇谦之","葛洪","陶弘景","陆修静"],"A","北魏道士寇谦之称太上老君亲临嵩岳授以“天师之位”，赐以《云中音诵新科之戒》20卷，传其服气导引口诀之法；令其“清整道教，除去三张（指张陵、张衡、张鲁——引者）伪法，租米钱税及男女合气之术”。",9],[615,1,"中国有四大高原，分别是云贵高原、青藏高原、黄土高原和____。",["内蒙古高原","帕米尔高原","云贵高原","黄土高原"],"A","中国最大的四个高原分别为：青藏高原、内蒙古高原、黄土高原、云贵高原。它们集中分布在地势第一、二级阶梯上，由于高度、位置、成因和受外力侵蚀作用的不同，高原的外貌特征也各异。中国陆地的主要地形即为高原和山地。",7],[616,1,"《金匮要略》是我国著名医学家____的传世著作。",["张仲景","华佗","孙思邈","李时珍"],"A","《金匮要略》是我国东汉著名医学家张仲景所著《伤寒杂病论》的杂病部分，也是我国现存最早的一部论述杂病诊治的专书，原名《金匮要略方论》。“金匮”是存放古代帝王圣训和实录的地方，意指本书内容之珍贵。全书分上、中、下三卷，共25篇，载疾病60余种，收方剂262首。所述病证以内科杂病为主，兼及外科、妇科疾病及急救卒死、饮食禁忌等内容。被后世誉为“方书之祖”。",12],[617,1,"中国“四大石窟”指的是____、云冈石窟、龙门石窟、麦积山石窟。",["莫高窟","炳灵寺石窟","克孜尔石窟","响堂山石窟"],"A","四大石窟指的是以中国佛教文化为特色的巨型石窟艺术景观，包括：莫高窟（甘肃敦煌）、云冈石窟（山西大同）、龙门石窟（河南洛阳）、麦积山石窟（甘肃天水），是中国古代传统文化艺术的历史瑰宝。",7],[618,1,"战国七雄指的是齐、楚、燕、韩、赵、魏、____。",["秦","鲁","宋","卫"],"A","战国七雄是战国时期七个最强大的诸侯国的统称，包括齐、楚、燕、韩、赵、魏、秦这七个诸侯国。",1],[619,1,"“敦煌学”的概念由____提出。",["陈寅恪","王国维","罗振玉","王静安"],"A","1925年8月，日本学者石滨纯太郎在大阪怀德堂讲演时，使用过“敦煌学”一词。1930年，著名国学大师陈寅恪先生在为陈垣先生编《敦煌劫余录》所作序中，概括了“敦煌学”的概念。",10],[620,1,"我国历史上第一个提出不依靠农业富国的改革家是____。",["商鞅","桑弘羊","王安石","张居正"],"B","桑弘羊(公元前152年——公元前80年)，西汉法家人物、专长为财政。因能“言利事，析秋毫”，深得汉武帝赏识，被委以重任，历任大农丞、大农令、搜粟都尉兼大司农等要职，统管中央财政近40年之久。是我国历史上第一个提出不依靠农业富国的改革家。",1],[621,1,"我国最早一部家庭教育专著是____的《颜氏家训》。",["颜真卿","颜之推","颜杲卿","颜回"],"B","《颜氏家训》是汉民族历史上第一部内容丰富，体系宏大的家训，也是一部学术著作。作者颜之推，是南北朝时期著名的文学家、教育家。",8],[622,1,"“鹅湖之会”是书院史上的著名事件，他指的是朱熹和____在鹅湖书院进行的辩论。",["陆九龄","陆九渊","吕祖谦","张栻"],"B","著名学者吕祖谦为了调和朱熹“理学”和陆九渊“心学”两派之间在学术上的矛盾，邀请他们在江西鹅湖寺举行学术交流，史称“鹅湖之会”。这次大会进行了三天，双方各持己见、互不相让。虽然学术上的分歧没能得到解决。但是这次讨论会影响很大，是中国哲学史上堪称典范的一次学术讨论会，而且开启了书院会讲的先河。",2],[623,1,"纯粹的教育书院出现于____。",["唐代","北宋","南宋","元代"],"B","书院是中国传统高等教育中最有价值的一部份。先秦时候孔子兴办私学﹐可说是书院教育之雏形﹔而汉唐时候的精舍﹐可说是书院的前身﹔到北宋时候﹐书院教育才正式确立。",1],[624,1,"根据古代“左庙右学”的传统，国子监与____毗邻。",["社稷坛","孔庙","天坛","地坛"],"B","国子监是我国元、明、清三代国家管理教育的最高行政机关和国家设立的最高学府，孔庙则是皇家祭孔之地，两者相伴形成“左庙右学”。",1],[625,1,"汉代的五经博士是专门传授儒家经学的____。",["官员","学官","学者","儒生"],"B","五经博士在汉武帝时设立，是专门传授儒家经学的学官。汉初，《易》、《书》、《诗》、《礼》、《春秋》每经只有一家，每经置一博士，各以家法教授，故称五经博士。",2],[626,1,"最初的指南针是____。",["司南","罗盘","指南鱼","指南龟"],"A","指南针最早叫司南，是中国古代四大发明之一。司南是中国古代辨别方向用的一种仪器，是中国古代劳动人民在长期的实践中对物体磁性认识的发明。",11],[627,1,"世界上第一部国家药典是我国____朝政府组织编修的。",["唐","宋","明","清"],"A","世界上第一部国家药典是中国唐朝的《新修本草》，共54卷，分药图、药经、本草三部分，记载药物844种。",1],[628,1,"江南三大名楼是____、岳阳楼、黄鹤楼。",["滕王阁","鹳雀楼","蓬莱阁","大观楼"],"A","江南三大名楼指的是江西南昌的滕王阁、湖北武汉的黄鹤楼和湖南岳阳的岳阳楼。",10],[629,1,"苏州四大园林指的是____、狮子林、拙政园和留园。",["沧浪亭","网师园","环秀山庄","艺圃"],"A","沧浪亭、狮子林、拙政园和留园并称苏州四大园林，代表着宋（公元960～1278年）、元（公元1271～1368年）、明（公元1368～1644年）、清（公元1644～1911年）四个朝代的艺术风格，被称为苏州四大名园。",10],[630,1,"被誉为“中国戏曲之母”的剧种是____。",["昆曲","京剧","越剧","黄梅戏"],"A","昆剧（别称昆腔、昆曲），原名“昆山腔”，发源于元末明初的苏州府昆山县，是中国戏曲的剧种之一，被誉为“百戏之祖”。",9],[631,1,"诗歌起源于_____",["劳动","祭祀","爱情","战争"],"A","诗歌起源于上古的社会生活，因劳动生产、两性相恋、原始宗教等而产生的一种有韵律、富有感情色彩的语言形式。",0],[632,1,"被誉为“唐人楷书第一”的是____。",["欧阳询","颜真卿","柳公权","褚遂良"],"A","欧阳询唐朝著名书法家、书法理论家，与虞世南、褚遂良、薛稷并称初唐四大家。",8],[633,1,"《广陵散》成为千古名曲，与“竹林七贤”之一的____有很大关系。",["嵇康","阮籍","山涛","刘伶"],"A","据《晋书》记载，此曲乃嵇康游玩洛西时，为一古人所赠。",7],[634,1,"佛教四大名山是九华山、____、普陀山、峨眉山。",["五台山","武当山","青城山","齐云山"],"A","中国佛教四大名山分别是安徽九华山、山西五台山、浙江普陀山、四川峨眉山，分别是地藏王菩萨、文殊菩萨、观世音菩萨、普贤菩萨的道场。",7],[635,1,"中国历史上第一部比较系统的封建成文法典是____。",["《法经》","《秦律》","《汉律》","《唐律疏议》"],"A","《法经》是中国历史上第一部比较系统的封建成文法典，但它并不是我国历史上第一部成文法典，在《法经》之前，已经颁布了很多法典，只是不太完善。",1],[636,1,"天干地支纪年始于汉代，这种纪年是以_____为起点",["立春","正月初一","冬至","春分"],"A","干支纪年是以立春作为一年的开始。农历最根本包含两部分,即农历历月和节气,其它的部分是由这两部分派生出来的,是为农业服务的。所以是以立春作为一年的起点。",6],[637,1,"中国古代典章制度史的创立者是____。",["杜佑","司马迁","班固","司马光"],"A","中国第一部典章制度的百科全书是唐朝杜佑的《通典》，该书记载：“（汉）文帝十三年，以御史不奉法，下失其职，乃遗承相史出刺并督监察御史。”",3],[638,1,"我国古代将科举殿试的第三名称为____。",["探花","榜眼","状元","传胪"],"A","探花是中国古代科举考试中对位列第三的进士的称谓，与第一名状元、第二名榜眼合称“三鼎甲”。",3],[639,1,"都江堰位于四川省，是____时期在李冰父子的主持下兴建的。",["战国","秦代","汉代","唐代"],"A","都江堰始建于战国时期，是蜀郡太守李冰父子在前人鳖灵开凿的基础上组织修建的大型水利工程。",11],[640,1,"颐和园是乾隆皇帝为其母孝圣宪皇太后祝寿而建，其前身是____。",["清漪园","圆明园","静明园","静宜园"],"A","颐和园，中国清朝时期皇家园林，前身为清漪园，坐落在北京西郊，距城区十五公里，占地约二百九十公顷，与圆明园毗邻。",1],[641,1,"“天下第一泉”共有四处，分别是庐山谷帘泉、____、济南趵突泉、镇江中泠泉。",["北京玉泉","无锡惠山泉","杭州虎跑泉","苏州观音泉"],"A","分别是北京玉泉山玉泉、山东济南趵突泉、镇江扬子江中冷泉和庐山康王谷谷帘泉。",7],[642,1,"中国历史上的第一个王朝的建立者是____。",["大禹","启","黄帝","尧"],"A","公元前2070年，禹建立了夏朝，这是我国历史上第一个王朝。",1],[643,1,"考古发现，____已经大量使用石器并且懂得人工取火和管理火。",["元谋人","北京人","山顶洞人","半坡人"],"B","北京人遗址是世界上出土古人类遗骨和遗迹最丰富的遗址。先后发现五个比较完整的北京人头盖骨化石和一些其他部位的化石，还有大量的石器和石片，共十万件以上。距今约七十万年至二十万年，发现于北京周口店，保留了猿的某些特征，使用打制石器，已会使用天然火，过着群居的生活。",10],[644,1,"由汉武帝派遣出使西域的第一个使者是____。",["班超","张骞","甘英","苏武"],"B","张骞富有开拓和冒险精神，建元二年(前139年)，奉汉武帝之命，由甘父做向导，率领一百多人出使西域，打通了汉朝通往西域的南北道路，即赫赫有名的丝绸之路，汉武帝以军功封其为博望侯。",1],[645,1,"迄今发现的铭文最多的古代青铜器是____。",["后母戊鼎","毛公鼎","大克鼎","散氏盘"],"B","毛公鼎为西周晚期的重器，鼎内壁铸有铭文，32行，近500字，是现存青铜器铭文中最长的一篇，堪称西周青铜器中铭文之最。其内容叙事完整，记载详实，被誉为“抵得一篇《尚书》”，是研究西周晚年政治史的重要史料。",10],[646,1,"被誉为“中华第一玉龙”的玉猪龙，是____时期的玉器。",["良渚文化","红山文化","仰韶文化","龙山文化"],"B","玉猪龙是红山文化时期中的代表玉器,又被称为玉兽玦,被专家们认为是龙最早的雏形。",10],[647,1,"古代被称为“国瓷”的著名瓷器品种是____。",["青瓷","青花瓷","白瓷","粉彩瓷"],"B","青花瓷，属于釉下彩瓷，是我国的国瓷。白地蓝花，素雅洁净，是景德镇的名品佳作。",10],[648,1,"提出“宇宙便是吾心，吾心便是宇宙”哲学家是____。",["朱熹","陆九渊","王阳明","程颢"],"B","陆九渊是宋代著名的理学家、主观唯心主义哲学家。他主张“吾心即是宇宙”，又倡“心即理”说。",2],[649,1,"战国时代，与儒家学说并称为两大显学的是____。",["道家","墨家","法家","名家"],"B","战国时代的两大显学是：儒家和墨家。显学的意思：指盛行于世而影响较大的学术派别。",2],[650,1,"《庄子》名篇《逍遥游》中写：“北冥有鱼，其名为鲲。鲲之大，不知其几千里也。”这种名叫鲲的大鱼可以变化成鸟，请问鸟的名字是____。",["鸾","鹏","凤","鹤"],"B","北冥有鱼，其名为鲲。鲲之大，不知其几千里也。化而为鸟，其名为鹏。鹏之背，不知其几千里也，怒而飞，其翼若垂天之云。",2],[651,1,"以法制为中心，综合运用“法势术”是法家成熟的表现，而提出这一理论的是____。",["商鞅","韩非子","申不害","慎到"],"B","“法势术”这一理论是由秦国的韩非子提出的。在韩非之前已有申不害、商鞅、慎到等法家人物对法家学说做了许多论述，商鞅主要讲“法”，申不害主要讲“术”，慎到主要讲“势”。",2],[652,1,"首次在中国哲学史上明确提出“知行合一”的是____。",["朱熹","王阳明","陆九渊","程颐"],"B","知行合一，致良知，是阳明文化的核心。明武宗正德四年（1509），心学集大成者王守仁在贵阳文明书院讲学，首次提出知行合一说。",2],[653,1,"建构了以“理”“气”解释宇宙人生的哲学理论体系的是____先生。",["阳明","紫阳","象山","横渠"],"B","朱熹（1130年10月22日－1200年4月23日），字元晦，一字仲晦，斋号晦庵、考亭，晚称晦翁，又称紫阳先生，建构了以“理”“气”解释宇宙人生的哲学理论体系。",1],[654,1,"“水则载舟，水则载舟”是我国古代思想史上____提出的著名论点。",["孔子","荀子","孟子","老子"],"B","“水则载舟,水则覆舟”出自《荀子・王制》。荀子,战国末期赵国人,著名思想家、文学家、政治家,荀子对儒家思想有所发展,在人性问题上,提倡性恶论,否认天赋的道德观念,强调后天环境和教育对人的影响。",2],[655,1,"“天人合一”的说法是宋代哲学家____明确提出的。",["朱熹","张载","程颢","陆九渊"],"B","真正明确提出“天人合一”的是北宋哲学家张载。张载在天、人关系的研究上独树一帜，承前启后，以《孟子》《中庸》《大学》等经典之“性”“诚”“明”的理念贯通天人。",2],[656,1,"儒家提倡的“内圣外王”之道有其循序渐进的途径，依次是修身、齐家、治国、____。",["格物致知","平天下","致良知","诚意正心"],"B","《礼记·大学》：“古之欲明明德于天下者，先治其国；欲治其国者，先齐其家；欲齐其家者，先修其身；欲修其身者，先正其心；欲正其心者，先诚其意；欲诚其意者，先致其知，致知在格物。物格而后知至，知至而后意诚，意诚而后心正，心正而后身修，身修而后家齐，家齐而后国治，国治而后天下平。”",2],[657,1,"属于道教的三天尊的是玉清原始天尊、上清灵宝君和太清____。",["玉皇大帝","道德天尊","真武大帝","太上老君"],"B","三清天尊是道教对其所崇奉的三位最高天神的合称。指居于三清仙境的三位尊神，即玉清境清微天元始天尊、上清境禹馀天灵宝天尊、太清境大赤天道德天尊。其中所谓玉清境、上清境、太清境是所居仙境的区别，清微天、禹余天、大赤天是所统天界的划分，而天尊的意思则是说，极道之尊，至尊至极，故名天尊。",1],[658,1,"中国现存最大的清真寺是喀什的____。",["南关清真寺","艾提尕尔清真寺","西关清真寺","化觉巷清真大寺"],"B","中国最大的清真寺是新疆的艾提尕尔清真寺。2001年06月25日，艾提尕尔清真寺作为明代古建筑，被国务院批准列入第五批全国重点文物保护单位名单。",10],[659,1,"“太守与客来饮于此，饮少辄醉，而年又最高，故自号曰醉翁也”中的“太守”是____。",["苏轼","柳宗元","欧阳修","范仲淹"],"C","《醉翁亭记》最后一句：“太守谓谁？庐陵欧阳修也。”",0],[660,1,"宣纸是中国独特的手工艺品，享有“千年寿纸”的美誉。它名字的来历与什么有关____。",["材质","用途","产地","创制者"],"C","宣纸得名于其产地——安徽宣城。",8],[661,1,"顾恺之创作的是____。",["《步辇图》","《游春图》","《洛神赋图》","《历代帝王图》"],"C","《洛神赋图》是东晋顾恺之的画作，原《洛神赋图》卷为设色绢本。是由多个故事情节组成的类似连环画而又融会贯通的长卷。",1],[662,1,"阎立本创作的是____。",["《富春山居图》","《游春图》","《历代帝王图》","《洛神赋图》"],"C","《历代帝王图》又名《列帝图》、《十三帝图》、《古列帝图卷》、《古帝王图》，传为唐代阎立本画作，绢本，设色，现存后人摹本。",1],[663,1,"展子虔创作的是____。",["《洛神赋图》","《历代帝王图》","《游春图》","《步辇图》"],"C","《游春图》是隋朝画家展子虔创作的绘画作品，绢本、青绿设色，画上有宋徽宗题写的“展子虔游春图”六个字，现存北京故宫博物院绘画馆。、",1],[664,1,"书法史上“楷书四大家”指的是欧阳询、____、柳公权、赵孟頫。",["褚遂良","虞世南","颜真卿","薛稷"],"C","楷书四大家是对书法史上以楷书著称的四位书法家的合称,也称四大楷书。他们分别指：唐朝欧阳询(欧体)、唐朝颜真卿(颜体)、唐朝柳公权(柳体)、元代赵孟頫(赵体)。",8],[665,1,"现存面积最大的地面城池是____。",["开封城","北京城","西安城","南京城"],"C","古代的城市称作城池，“城”指城墙，“池”指城外环绕城墙的河池，俗称“护城河”。西安城是我国现存面积最大、保存最完整的古城。",7],[666,1,"北京故宫是____时期修建的。",["明太祖","清世祖","明成祖","清圣祖"],"C","紫禁城是明成祖朱棣在位时建造的，于明成祖永乐四年（1406年）开始建设，以南京故宫为蓝本营建，到永乐十八年（1420年）建成。它是一座长方形城池，南北长961米，东西宽753米，四面围有高10米的城墙，城外有宽52米的护城河。紫禁城内的建筑分为外朝和内廷两部分。",10],[667,1,"最早修建长城的是春秋时的____国。",["秦","燕","楚","赵"],"C","最早修建长城是春秋时期的楚国，《左传》上所说楚国“汉水以为池，方城以为城”的方城，即指此。",2],[668,1,"秦长城实际上是把春秋战国时期 秦国、燕国、____三国修建的长城连在一起。",["齐国","韩国","赵国","魏国"],"C","秦始皇三十三年（公元前214年）遣大将蒙恬北逐匈奴，筑长城万余里，以防匈奴南进，史称秦长城。秦长城实际是在原先战国时期秦长城，赵长城，燕长城三国长城的基础上修建。",7],[669,1,"历史上，春秋战国时期、秦代、____、北朝、隋代、金代、明代修筑长城。",["唐代","宋代","汉代","元代"],"C","历史上，春秋战国时期、秦代、汉代、北朝、隋代、金代、明代修筑长城。持续近2000年，长城东西绵延上万华里，因此又称作万里长城。长城建筑于两千多年前的春秋战国时代，现存的长城遗迹主要为建于14世纪的明长城。",1],[670,1,"佛教的创始人是乔达摩·____。",["牟尼","达摩","悉达多","玄奘"],"C","乔达摩·悉达多是古印度著名思想家，古印度迦毗罗卫国释迦族人，佛教的创始者，被后世尊称为释迦牟尼佛。",2],[671,1,"中国三大古建筑群的是____、曲阜孔庙、承德避暑山庄。",["苏州园林","平遥古城","北京故宫","丽江古城"],"C","中国三大古建筑群，即北京故宫、曲阜孔庙和承德避暑山庄，中国三大古建筑群均已列入世界文化遗产名录。",10],[672,1,"被誉为“古民居博物馆”的是____。",["晋派民居","闽派民居","徽派民居","粤派民居"],"C","徽派民居是汉族传统民居建筑的一个重要流派，被誉为“古民居博物馆”。无论南方还是北方的汉族，其传统民居的共同特点都是坐北朝南，注重内采光；以木梁承重，以砖、石、土砌护墙；以堂屋为中心，以雕梁画栋和装饰屋顶、檐口见长。",1],[673,1,"古代茶圣是____。",["蔡襄","皎然","陆羽","卢仝"],"C","陆羽（733—804），字鸿渐，复州竟陵（今湖北天门）人，一名疾，字季疵，号竟陵子、桑苎翁、东冈子，又号“茶山御史”。是唐代著名的茶学家，被誉为“茶仙”，尊为“茶圣”，祀为“茶神”。",12],[674,1,"“何以解忧，唯有杜康”这句诗出自东汉末年____的《短歌行》。",["陶渊明","曹丕","曹操","曹植"],"C","“何以解忧，唯有杜康”这句诗出自东汉末年曹操的《短歌行》。",0],[675,1,"李清照号____。",["青莲居士","香山居士","易安居士","六一居士"],"C","李清照，南宋女词人。号易安居士，今山东济南人。长于诗、文、词,兼书法、绘画,且通音律。",0],[676,1,"著名的候风地动仪的研制者是____。",["祖冲之","僧一行","张衡","郭守敬"],"C","候风地动仪的发明者东汉大科学家张衡。早在公元132年，中国就发明了地球的探测器——地动仪。它是中国古代科文并茂的巨星——张衡创制发明的，也是世界上最早的一台会测报地震方向的科学仪器，它首开人类科学测报地震的先河。",11],[677,1,"明代三大针灸巨著指的是《针灸大全》《针灸聚英》和____。",["《难经》","《针灸甲乙经》","《针灸大成》","《黄帝内经》"],"C","明代是针灸学术发展的鼎盛时期，理论逐渐深入和细化，涌现了大批的学术著作，如三大针灸巨著：《针灸大全》、《针灸节要》、《针灸聚英》等。",11],[678,1,"李白号____。",["易安居士","香山居士","六一居士","青莲居士"],"D","李白（701年—762年） ，字太白，号青莲居士，又号“谪仙人”。",0],[679,1,"属于徐光启的著作是____。",["《天工开物》","《齐民要术》","《本草纲目》","《农政全书》"],"D","《农政全书》是明代徐光启创作的农书，成书于明朝万历年间，大致上可分为农政措施和农业技术两部分。",11],[680,1,"国子监的最高官员称为____。",["司业","监丞","博士","祭酒"],"D","国子监以师为官，最高职位是祭酒，一般的教学和管理人员也是朝廷命官，由吏部统一管理任免。国子监的学生称为监生，监生又分官生和民生。",3],[681,1,"最早记录指南针存在偏差的是____。",["《齐民要术》","《天工开物》","《本草纲目》","《梦溪笔谈》"],"D","沈括是世界上第一个指出指南针不完全指南北的人，记载于《梦溪笔谈》中。",11],[682,1,"____被誉为“天下名茶之冠”。",["碧螺春","铁观音","祁门红茶","西湖龙井"],"D","杭州西湖龙井，被誉为“天下名茶之冠”，产于湘江省杭州市西湖周围的群山之中。",7],[683,1,"唐太宗李世民登基前曾发动“玄武门事变”，按照古代五行说，大兴宫的“玄武门”一定位于该宫的____。",["南方","东方","西方","北方"],"D","玄武门之变，是唐高祖武德九年六月初四（公元626年7月2日），是由当时唐高祖李渊次子秦王李世民在唐王朝的首都长安城（今陕西省西安）太极宫的北宫门--玄武门附近发动的一次政变。",1],[684,1,"传统节日中，源于佛教传说的是____。",["清明节","端午节","中秋节","腊八节"],"D","腊八节，即每年农历十二月八日，又称为“法宝节”“佛成道节”“成道会”等。本为佛教纪念释迦牟尼佛成道之节日，后逐渐也成为民间节日。",5],[685,1,"在中国的饮茶史上，____皇帝是著名的泉水评定专家，被誉为“茶帝”。",["康熙","唐太宗","宋徽宗","乾隆"],"D","乾隆皇帝爱新觉罗弘历（1711——1799）在世89年,是我国历史上在位时间最长,寿命最长的皇帝,也是最爱茶的皇帝。",1],[686,1,"中国的三大传统节日是____、中秋节、端午节。",["清明节","元宵节","重阳节","春节"],"D","中国的三大传统节日是春节、端午节、中秋节。",5],[687,1,"人殉制度是中国历史上最残忍的制度，他终止于____时期。",["清世祖","明成祖","明太祖","明英宗"],"D","明英宗朱祁镇即位后，对人殉制度非常厌恶，明确提出废止人殉，曾下旨说“藩王薨，妃、夫人以下不必从死，年少有父母者遣归”。",1],[688,1,"二胡名曲《二泉映月》中的“二泉”指的是天下第二泉，它位于____。",["杭州","苏州","镇江","无锡"],"D","二泉映月中的二泉，是江苏无锡市的西郊惠山九龙十三泉，中声名最大的“天下第二泉”，人们也称它为二泉。",7],[689,1,"既不能以公历日期也不能以夏历日期准确确定日期的传统节日是____。",["春节","端午节","中秋节","清明节"],"D","清明节不是固定日期，不过清明在阳历中的日期会在4月4日、4月5日和4月6日这三个日子中变动。统计结果表明，在1582年采用现行公历至2100年的518年中，清明在4月4日的为219年，4月5日的为281年，4月6日的最少只有18年。",5],[690,1,"盖碗茶是____族所喜爱的特色饮茶方式。",["藏","蒙古","壮","回"],"D","盖碗茶是西北回族的一种独特的饮茶方式，相传始于唐代，相传至今，颇受回族人民喜爱。",12],[691,1,"葬俗中，为佛教所提倡，却为儒家强烈反对的是____。",["土葬","水葬","天葬","火葬"],"D","佛教传入中国后，其理论不断影响儒家社会的生活方式，其主张的火葬之法也逐步为民间社会普遍接受。宋儒出于对儒家义理的维护，强烈反对这种习俗，试图扭转这一违背儒家思想的丧葬习俗。",2],[692,1,"我国古代铜活字印书史上造字时间最长、耗费资金最大、刻字数量最多的人物是____。",["王祯","毕升","周必大","林春祺"],"D","在我国古代印刷史上，林春祺造铜活字印书，造字时间最长，耗费资金最大，刻字数量最多。",1],[693,1,"王维的诗句“朝为越溪女，暮作吴宫妃。”说的是我国古代的著名美女____。",["王昭君","貂蝉","杨玉环","西施"],"D","《西施咏》：“艳色天下重，西施宁久微。朝为越溪女，暮作吴宫妃。贱日岂殊众，贵来方悟稀。邀人傅脂粉，不自著罗衣。君宠益娇态，君怜无是非。当时浣纱伴，莫得同车归。持谢邻家子，效颦安可希。”《西施咏》是唐代诗人王维创作的一首诗。此诗借西施从平民到宫廷宠妃的历史典故，揭示人生浮沉全凭际遇的炎凉世态，并表达对小人的嘲讽，揭露当时社会上潜藏的危机，抒发诗人怀才不遇的不平与感慨。",0],[694,1,"诗句“年年乞与人间巧，不道人间巧已多？”描述的是我国____。",["元宵节","端午节","中秋节","七夕节"],"D","诗句“年年乞与人间巧，不道人间巧已多？”描述的是我国七夕节，又称七巧节、七姐节、女儿节、乞巧节等）是中国民间的传统节日，由星宿崇拜衍化而来，为传统意义上的七姐诞，因拜祭“七姐”活动在七月七晩上举行，故名“七夕”。",5],[695,1,"“苦心人，无不负，卧薪尝胆，三千越申可吞吴。”描写的是____。",["项羽","刘邦","夫差","勾践"],"D","出自蒲松龄“落第自勉联”：有志者，事竟成，破釜沉舟，百二秦关终属楚；苦心人，天不负，卧薪尝胆，三千越甲可吞吴。越王勾践（约前520年―前465年），姒姓，名勾践，又名鸠浅、菼执，夏禹后裔，越王允常之子，春秋末年越国国君。前496年即位，曾败于吴国，被迫求和。返国后重用范蠡、文种，卧薪尝胆使越国国力渐渐恢复起来。前482年，吴王夫差兴兵参加黄池之会，以彰显武力率精锐而出。越王勾践抓住机会率兵而起，大败吴师。夫差仓卒与晋国定盟而返，与勾践连战惨败。不得已与越议和。前473年夫差被迫自尽，灭吴国称霸，是春秋时期最后一位霸主。",1],[696,1,"我国广州市的别称是____。",["春城","江城","蓉城","羊城"],"D","羊城是广州别称，广东省省会，位于广东省中南部，东江、西江、北江交汇处，珠江三角洲北缘，濒临中国南海。",7],[697,1,"为了感念苏东坡的功德，杭州流传着一道名菜____。",["西湖醋鱼","龙井虾仁","宋嫂鱼羹","东坡肉"],"D","东坡肉相传为北宋词人苏轼（四川省眉山市人）所创制（一说为苏轼小妾王朝云在苏轼被贬黄州之际为改善饮食所创），最早发源地是四川眉山。",7],[698,1,"五谷中的“黍”是指____。",["小米","黄米","大米","小麦"],"B","黄米又称黍、糜子、黄米、夏小米、黄小米，有糯质和非糯质之别，糯质黍多作以醇酒，非糯质黍，称为穄，以食用为主。",12],[699,1,"田园诗派的开创者是____。",["陶渊明","王维","孟浩然","谢灵运"],"A","陶渊明，字元亮，又名潜，世称靖节先生，私谥靖节，世称靖节先生，浔阳柴桑（今江西九江）人，东晋著名诗人、辞赋家、散文家，被誉为“隐逸诗人之宗”“田园诗派之鼻祖”，江西首位文学巨匠。",0],[700,1,"我国的第一部长篇历史小说是____。",["《三国演义》","《水浒传》","《西游记》","《红楼梦》"],"A","《三国演义》（全名为《三国志通俗演义》，又称《三国志传》）是中国古典四大名著之一，亦是中国第一部长篇历史章回小说，作者是元末明初的罗贯中。",0],[701,1,"清朝文学家蒲松龄号“柳泉居士”，世称____。",["易安居士","六一居士","聊斋先生","香山居士"],"C","蒲松龄（1640年6月5日-1715年2月25日），字留仙，一字剑臣，别号柳泉居士，世称聊斋先生，自称异史氏。",0],[702,1,"《水调歌头·明月几时有》一词的小序中提到的“子由”是苏轼的____。",["哥哥","父亲","儿子","弟弟"],"D","子由是苏轼弟弟苏辙的字。",0],[703,1,"被尊为“曲状元”的是____。",["郑光祖","关汉卿","白朴","马致远"],"D","马致远，字千里，号东篱，被尊称为“曲状元”，在元代的文学史上具有极高的声誉。",3],[704,1,"____在古时是指结婚时把夫妻头发束在一起。",["纳征","结发","纳采","合饮"],"B","结发是古时候的婚姻习俗，当夫妻成婚时，各取头上一根头发，合而作一结，男女双方结为夫妻。这就是古诗中所说的：“结发为夫妻，恩爱两不疑”。",12],[705,1,"著名的元代杂剧西厢记取材于____。",["《莺莺传》","《牡丹亭》","《长生殿》","《桃花扇》"],"A","元曲《西厢记》取材唐代传奇《莺莺传》。",9],[706,1,"____是关于农业生产和农事活动的著作。",["《本草纲目》","《齐民要术》","《天工开物》","《农政全书》"],"B","《齐民要术》大约成书于北魏末年(公元533年-544年)，是北朝北魏时期，南朝宋至梁时期，中国杰出农学家贾思勰所著的一部综合性农学著作，也是世界农学史上专著之一，是中国现存最早的一部完整的农书。",11],[707,1,"秦灭六国，统一天下，大兴土木，依山建起____，亭台楼阁参差环抱，绵延三百余里气势非凡。",["大明宫","长乐宫","阿房宫","未央宫"],"C","杜牧《阿房宫赋》第一句：“六王毕，四海一，蜀山兀，阿房出。”",10],[708,1,"瓷器唐三彩为白色、黄色和____。",["绿色","紫色","蓝色","红色"],"A","唐三彩，中国古代陶瓷烧制工艺的珍品，全名唐代三彩釉陶器，是盛行于唐代的一种低温釉陶器，釉彩有黄、绿、白、褐、蓝、黑等色彩，而以黄、绿、白三色为主。",10],[709,1,"先秦两汉时期成就最高，影响最大，通过人物描写来反映历史面貌的是____。",["《史记》","《汉书》","《左传》","《战国策》"],"A","“通过人物描写反映历史面貌”，可知此书是纪传体，因为纪传体是通过记叙人物活动反映历史事件的史书体例。《史记》为西汉司马迁所作，是中国第一部纪传体通史，以人物传记为中心来反映历史内容，记载了从黄帝以来至汉武帝时期的历史，被列为“二十四史之首”。",1],[710,1,"“在天愿做比翼鸟，在地愿为连理枝。”这句诗描写的是____和杨贵妃的爱情故事。",["唐宪宗","唐高宗","唐明皇","唐太宗"],"C","这句诗出自白居易的《长恨歌》，描述的是唐明皇和杨贵妃的爱情故事，无论是在天上地下，彼此都不希望分开。这句诗展现了忠贞不渝的爱情观。",0],[711,1,"《红楼梦》中有“小宝钗\"，“小黛玉”之称的两人是袭人、____。",["鸳鸯","麝月","平儿","晴雯"],"D","小宝钗指的是袭人，他们俩都是封建思想的代表，实时劝谏宝玉读书封侯，与达官贵人结交。小黛玉指的是晴雯，第一是晴雯和黛玉关系本来就不错，又都是不喜欢宝玉读书考举人进士，厌恶世俗经济学问的人。",10],[712,1,"郑谷有诗曰“何事文星与酒星，一时钟在李先生。高鸣大醉三千百，留着人家伴月明。”诗中的“李先生”指的____。",["李清照","李贺","李商隐","李白"],"D","诗中的李先生指的是李白。这首诗是“芳林十哲”之一的郑谷读了李白的诗以后写的。",0],[713,1,"王昌龄《出塞》一诗 “但使龙城飞将在”中的“飞将”指的是____。",["李陵","霍去病","卫青","李广"],"D","西汉英勇善战,被匈奴称为“飞将军”的名将李广。",1],[714,1,"“七月流火，九月授衣”，其中“七月流火”指的是：____。",["天气渐渐转凉","七月天气炎热","流星划过夜空","火灾多发季节"],"A","出自《诗经·豳风·七月》，“七月流火，九月授衣”指夏去秋来，天气转凉。",2],[715,1,"“但愿人长久，千里共婵娟”，苏东坡借这首词表达了对____的思念之情。",["父亲","妻子","兄弟","朋友"],"C","“但愿人长久，千里共婵娟。”苏东坡借这首词表达了对弟弟苏辙的思念之情。",0],[716,1,"五湖指的是洞庭湖、鄱阳湖、太湖、巢湖、____。",["青海湖","洪泽湖","西湖","千岛湖"],"B","五湖指洞庭湖、鄱阳湖、太湖、巢湖和洪泽湖。",7],[717,1,"元杂剧中的女主唱称为____。",["旦本","末本","净本","丑本"],"A","旦本戏是戏剧用语，指元杂剧由女主角演唱的杂剧为旦本戏。",9],[718,1,"“匪女之为美，美人之贻”中的“贻”的意思是____。",["赠送","遗留","丢失","购买"],"A","贻的意思是指： 赠给。解释：不是你的美好(让我动心)，(而是因为)美人送给我的(我才珍惜)。",14],[719,1,"旧时我国的老百姓称____为“仓神”。",["老鼠","牛","马","猪"],"A","旧时我国民间曾将正月二十五日定为“填仓节”。人们管老鼠叫“仓神”。到“填仓节”这天，家家仓囤装满粮食，并虔诚祭祀，祈求“老鼠仓神”口下留情，少来偷吃，并祷祝年年五谷丰登，粮油满仓。",12],[720,1,"“名不正言不顺”表达了中国的____思想。",["法家","道家","儒家","墨家"],"C","“名不正言不顺”是儒家的思想。出处：《论语·子路》：“名不正则言不顺，言不顺则事不成。”",2],[721,1,"山东曲阜有“三孔”，分别是“孔府”、“ 孔林 ”和____。",["孔院","孔祠","孔墓","孔庙"],"D","曲阜三孔由孔庙、孔府和孔林构成，位于山东省曲阜市，是中国唯一且规模最大的集祭祀孔子的寺庙、孔子嫡系后裔的府邸和孔子及其子孙墓地于一体的建筑群。",10],[722,1,"“格萨尔王”史诗是我国____的优秀作品。",["彝族","维吾尔族","藏族","蒙古族"],"C","格萨尔王史诗是藏族人民集体创作的一部伟大的英雄史诗，历史悠久，结构宏伟，卷帙浩繁，内容丰富，气势磅礴，流传广泛。",0],[723,1,"“霓裳羽衣”是我国____代的宫廷乐舞。",["明","宋","元","唐"],"D","霓裳羽衣舞，是一种唐代的宫廷乐舞，唐玄宗作曲。",1],[724,1,"“字字看来皆是血，十年辛苦不寻常”描述的是名著____的成书过程。",["《红楼梦》","《三国演义》","《水浒传》","《西游记》"],"A","《红楼梦》，又名《石头记》《金玉缘》，是清代作家曹雪芹创作的章回体长篇小说，被誉为中国古典四大名著之首。“字字看来皆是血，十年辛苦不寻常。”是《红楼梦》甲戌本第一回之前《凡例》的末尾。《凡例》的末段内容与其他诸本第一回第一段基本相同，是对全书的总评。",0],[725,1,"吴伟业名句“恸哭三军俱缟素，冲冠一怒为红颜”中的“红颜”指的是____。",["陈圆圆","李师师","苏小小","柳如是"],"A","“恸哭六军俱缟素，冲冠一怒为红颜”出自清朝诗人吴伟业作品的《圆圆曲》。缟素：指吴三桂的军队为崇祯皇帝服丧。冲冠：发怒。这里指吴三桂为失去陈圆圆而发怒。",0],[726,1,"中国最古老的史书体裁是____。",["国别体","编年体","纪传体","纪事本末体"],"B","编年体记录历史的方式最早起源于中国，是中国最古老的历史体裁，以年代为线索编排有关历史事件的史书体例。",7],[727,1,"“三国演义”中的“三英战吕布”的“三英”指的是____、关羽、张飞。",["马超","诸葛亮","赵云","刘备"],"D","三英战吕布中的三英指的是刘备，关羽，张飞三人。",1],[728,1,"严复所说的“孔门四科”具体指德行、政事、文学和____。",["礼义","孝悌","言语","忠义"],"C","后世学者将德行、政事、文学、言语，视为“孔门四科”。",2],[729,1,"中华文化源远流长，我国四大文化遗产分别为《明清档案》、《殷墟甲骨》、《居延汉简》、____。",["《二十四史》","《敦煌经卷》","《永乐大典》","《四库全书》"],"B","四大文化遗产是指四本记录了中国历史的书籍，分别是《明清档案》、《殷墟甲骨》、《居延汉简》和《敦煌经卷》。",1],[730,1,"清代散文流派____主张“义理”、“考据”、“辞章”合而为一。其作品以山川游记、记事小品为佳，一些文论，影响较大。",["竟陵派","公安派","桐城派","阳湖派"],"C","桐城派是中国清代文坛上最大的散文流派，亦称“桐城古文派”，世通称“桐城派”。主张“义理”、“考据”、“辞章”合而为一。",0],[731,1,"“不愤不启，不悱不发”中的____是想弄明白而弄不明白的意思。",["发","愤","悱","启"],"B","愤：心里想弄明白可还是不明白。",1],[732,1,"科举中，会出现一人兼解元、会元、状元的“连中三元”，其分别是在____、会试、殿试考试中取得的。",["县试","府试","乡试","院试"],"C","连中三元，汉语成语，意思是指接连在乡试、会试、殿试中考中了第一名。出自明·冯梦龙《警世通言》卷十八。",3],[733,1,"对乐府诗的分类，以郭茂倩的____最为完备。",["《玉台新咏》","《乐府诗集》","《文选》","《全唐诗》"],"B","《乐府诗集》是北宋文学家郭茂倩编撰的上古至唐、五代的乐府诗歌总集，成书于北宋时期。每一类有总序，每一曲有题解，对乐曲的起源、性质、演唱配器等均有详尽说明。其中还保存了不少已失传著作的内容。",9],[734,1,"《汉书》的志尤为人们所重视。其中由《史记·平准书》演变而来的志被命名为____。",["《刑法志》","《食货志》","《地理志》","《艺文志》"],"B","《食货志》是由《史记》的《平准书》演变来的，但有很大发展，内容也更加丰富了。",7],[735,1,"赵州桥是隋朝工匠____修建的。",["鲁班","宇文恺","李春","喻皓"],"C","建于隋朝年间公元595年－605年，由著名匠师李春设计建造，距今已有1400多年的历史，是当今世界上现存第二早（还有一座小商桥）、保存最完整的古代单孔敞肩石拱桥。",1],[736,1,"中国大一统国家的形成，乃至两千多年的封建王朝历史，是从____开始的。",["秦始皇","汉高祖","汉武帝","隋文帝"],"A","秦始王嬴政 公元前259～前210 秦始皇是一位伟大的中国皇帝。他在位期间（公元前238～前210），用武力统一了中国，实行了一系列影响广泛的改革。",1],[737,1,"陕西皮影戏的代表剧目是____。",["《哪吒闹海》","《白毛女》","《三打白骨精》","《白蛇传》"],"A","皮影戏是中国汉族民间广为流传的傀儡戏之一，一门古老的汉族传统艺术。表演时，艺人们在白色幕布后面，一边用手操纵戏曲人物，一边用当地流行的曲调唱述故事，同时配以打击乐器和弦乐，有浓厚的乡土气息。在关中地区很为流行。皮影戏演出简便，表演领域广阔，演技细腻，活跃于广大农村，深受农民的欢迎。其代表作为《哪吒闹海》。",9],[738,1,"“蒹葭苍苍，白露为霜。所谓伊人，在水一方”中“蒹葭”是指____。",["芦苇","水草","荷花","浮萍"],"A","蒹葭者，芦苇也，飘零之物，随风而荡，却止于其根，若飘若止，若有若无。思绪无限，恍惚飘摇，而牵挂于根。根者，情也。相思莫不如是。露之为物，瞬息消亡。",6],[739,1,"常用作表示第五位顺序的字是____。",["戎","戍","戊","戌"],"C","戊，天干的第五位，用作顺序第五的代称。",6],[740,1,"文字是人类文明的重要标志，我国最古老的文字是____。",["隶书","金文","小篆","甲骨文"],"D","中国迄今发现的最古老的比较成熟的文字是甲骨文，是刻在龟甲和兽骨上的文字。",8],[741,1,"宋史上最为后人所敬仰的状元当属南宋末年的____，他在国难之时，毁家纾难，无奈被俘，曾作“人生自古谁无死，留取丹心照汗青”，正义凛然，青史流芳。",["岳飞","文天祥","陆秀夫","张世杰"],"B","出自《过零丁洋》作者文天祥。",3],[742,1,"故宫的三大殿是指太和殿、中和殿、保和殿，三大殿是封建皇帝行使权力或者举行盛典时用的宫殿。如果新皇帝要举行登基大典，一般会在____举行。",["太和殿","中和殿","保和殿","乾清宫"],"A","太和殿俗称金銮殿，明清两朝皇帝都在太和殿举行盛大典礼，如皇帝登基即位、皇帝大婚、册立皇后、命将出征等。",10],[743,1,"俗语说“化干戈为玉帛”，干戈都是兵器，其中“干”指的是____。",["盾牌","长矛","大刀","弓箭"],"A","“化干戈为玉帛”比喻消除仇怨，使战争转化为和平，使争吵转化为友好。干和戈是古代常用武器，“干”指盾牌，“戈”指用青铜或铁制成，装有长柄的武器。",10],[744,1,"《山海经》中“迷谷”指的是____。",["动物","植物","山谷","神仙"],"B","《山海经》中迷谷是一种植物。",2],[745,1,"“勿以恶小而为之，勿以善小而不为。”语出三国志，出自____。",["孙权","刘备","曹操","诸葛亮"],"B","“勿以恶小而为之，勿以善小而不为”，出自蜀汉昭烈帝刘备的诏书中。意思是不要因为是件较小的坏事就去做，不要因为是件较小的善事就毫不关心。",1],[746,1,"我国古代第一部文学评论专著是____。",["《沧浪诗话》","《典论・论文》","《诗品》","《文心雕龙》"],"D","《文心雕龙》是中国现存最早的一部文章学论著，由于书中所论多涉及文学创作，故现代学者又多视之为现存最早的一部用中文撰写的综合性的文学批评专著。",0],[747,1,"我国古代诗人中流传下来的诗作数量第一的诗人是____。",["李白","杜甫","白居易","陆游"],"D","我国古代诗人中流传下来的诗作数量第一的诗人是陆游。陆游具有多方面文学才能，尤以诗的成就为最，自言“六十年间万首诗”，存世有九千三百余首。",0],[748,1,"凤凰涅槃出自____先生的同名作品《凤凰涅槃》。",["巴金","茅盾","鲁迅","郭沫若"],"D","凤凰涅槃一说出自于郭沫若先生同名作品，非中国古代传说，在中国古代神话传说中并无凤凰会浴火重生的说法。",0],[749,1,"西王母住在____山。",["蓬莱","方丈","瀛洲","昆仑"],"D","西王母住在昆仑山。",7],[750,1,"“其鸣自叫也，见则其邑有讹火。”中的“讹火”指的是____。",["火山喷发","闪电","磷火","火灾"],"C","讹火意思是指怪火，也指磷火。",7],[751,1,"与王建齐名，并称“张王乐府”的唐代诗人是____。",["张继","张九龄","张籍","张若虚"],"C","张籍（约766年- 约830年），字文昌，和州乌江（今安徽和县乌江镇）人，唐代诗人，世称“张水部”、“张司业”。张籍为韩门大弟子，其乐府诗与王建齐名，并称“张王乐府”。",9],[752,1,"“刑天舞干戚”“女娲补天”“精卫填海”都是出自____。",["《淮南子》","《山海经》","《列子》","《楚辞》"],"B","它们都出自《山海经》。",0],[753,1,"《山海经》现存共18篇，最早的版本由____（朝代）刘向刘歆父子校刊而成。",["东晋","西汉","东汉","西晋"],"B","刘向、刘歆父子是西汉时期的人。",1],[754,1,"根据《史记》当中的记载，秦始皇姓____。",["赢","赵","秦","吕"],"B","庄襄王为秦质子于赵，见吕不韦姬，悦而取之，生始皇。以秦昭王四十八年正月生于邯郸。及生，名为政，姓赵氏。",1],[755,1,"战国时期著名变法家商鞅姓____。",["公孙","姬","商","卫"],"B","商鞅（约公元前390年－公元前338年），姬姓，公孙氏，名鞅，卫国人。",1],[756,1,"____是六国中最后灭亡的。",["燕国","齐国","楚国","赵国"],"B","从公元前230年攻打韩国到前221年灭齐国结束，共计10年的时间，先后按顺序消灭韩、赵、魏、楚、燕、齐六国，结束了中国自春秋以来长达500多年的诸侯割据纷争的局面。",2],[757,1,"____的内容反映的历史时期是春秋时期。",["《史记》","《国语》","《左传》","《战国策》"],"C","《左传》内容反映的历史时期是春秋时期。《左传》记叙了春秋时期250多年的历史，主要记录了周王室的衰微，诸侯争霸的历史，对各类礼仪规范、典章制度、社会风俗、民族关系、道德观念、天文地理、历法时令、古代文献、神话传说、歌谣言语均有记述和评论。",2],[758,1,"“花甲”是指____岁。",["五十","六十","七十","八十"],"B","不满周岁——襁褓；\n2-3岁——孩提；\n7岁（女）——髫年；\n8岁（男）——龆年；\n幼年泛称——总角；\n10岁以下——黄口，即乃稚气未脱的少儿代称也；\n13岁（女）——豆蔻年华，\n15岁（女）——及笄之年；\n15岁（男）——志学之年；\n16岁（女）——破瓜年华、碧玉年华，二八年华；\n15~20岁——舞象之年；\n20岁（女）——桃李年华；\n20岁（男）——弱冠；\n30岁（女）——半老徐娘；\n30岁（男）——而立之年；\n40岁（男）——不惑之年、强壮之年；\n50岁——年逾半百、知非之年、知命之年、艾服之年、大衍之年；\n60岁——花甲、平头甲子、耳顺之年、杖乡之年、还历之年；\n70岁——古稀、杖国之年、致事之年、致政之年，从心之年、悬车之年；\n80~90岁——耄耋之年；\n100岁——期颐，又可称为“人瑞”。",4],[759,1,"“危局如斯敢惜身?愿将生命作牺牲”是女革命家秋瑾的豪迈诗篇。她在同盟会成立后领导的武装起义是____。",["浙皖起义","黄花岗起义","武昌起义","萍浏醴起义"],"A","1907年，秋瑾与徐锡麟等组织光复军，拟于7月6日在浙江、安徽同时起义，事泄被捕。",1],[760,1,"“抛绣球、碰红蛋、抢花炮”是我国____歌圩节举行的活动。",["傣族","壮族","苗族","彝族"],"B","壮族的歌圩节是壮族民间传统歌节，流行于广西、云南等地。在每年春、秋两季，尤其是三月三，要搭彩棚、摆歌台，举办唱山歌的歌圩。节日期间还举行抛绣球、碰红蛋、踢毽子、抢花炮等活动。",5],[761,1,"“八仙”之中手握芭蕉扇的是____。",["何仙姑","铁拐李","汉钟离","吕洞宾"],"C","汉钟离，本名钟离权。又称为正阳祖师。法宝是芭蕉扇，此宝扇扇火火灭，扇水水潇，变化无穷，能遮天蔽日。",1],[762,1,"因写出《三都赋》而让大家竞相传写，导致洛阳纸贵的是____。",["王羲之","潘岳","陆机","左思"],"D","“洛阳纸贵”原义是晋代左思《三都赋》写成之后，抄写的人非常多，洛阳的纸因此都涨价了；后比喻著作广泛流传，风行一时。",8],[763,1,"在我国有一座石窟又名“千佛洞”指的是____。",["云冈石窟","龙门石窟","麦积山石窟","莫高窟"],"D","莫高窟又名“千佛洞”，现有洞窟735个，保存壁画4.5万多平方米，彩塑2400余尊，唐宋木构窟檐5座，是中国石窟艺术发展演变的一个缩影，在石窟艺术中享有崇高的历史地位。",2],[764,1,"凿壁偷光，勤学苦读的是____。",["孙敬","苏秦","车胤","匡衡"],"D","凿壁偷光，是一个寓言故事演化而成的成语，出自《西京杂记》。该成语原指西汉匡衡凿穿墙壁引邻舍之烛光读书，后用来形容家贫而读书刻苦学习的事情。",1],[765,1,"在中国书法史上被誉为“草圣”的书法家是____。",["张旭","怀素","王羲之","王献之"],"A","张旭,盛唐时期知名书法家,以狂草著名,被尊为“草圣”,唐文宗曾下诏称李商隐的诗、裴文的舞剑与戏法张旭的草书为“三绝”,代表作品有《古诗四帖》。",8],[766,1,"甲骨文，是中国的一种古老文字，又称“契文”、“甲骨卜辞”、殷墟文字或“龟甲兽骨文”。是汉字的早期形式，是现存中国王朝时期最古老的一种成熟文字，最早出土于河南省安阳市殷墟。历史上发现、收藏和研究甲骨文的第一人是____。",["王懿荣","刘鹗","罗振玉","王国维"],"A","光绪二十五年（1899年），王懿荣因通晓医术在鹤年堂抓药时，买到一种叫龙骨的药材，对其上面的图形文字进行研究，并通过山东古董商人范维卿大量收购，王懿荣首次发现甲骨文，并将其断为商代。该发现轰动中外学术界，把汉字的历史推到公元前1700多年的殷商时代，成为甲骨文研究的奠基人。",1],[767,1,"弈秋是我国春秋时期著名的____老师。",["围棋","象棋","书法","兵法"],"A","弈秋是第一个史上有记载的围棋专业棋手，也是史上第一个卜、卜徒父是也。此名弈秋，故知秋为其名，因通国皆谓之善弈，故以弈加名称之。",13],[768,1,"10世纪初（916年）契丹族首领____，统一契丹各部，建立契丹国（辽）。",["耶律阿保机","耶律德光","耶律隆绪","耶律洪基"],"A","10世纪初，契丹族的杰出首领耶律阿保机统一了契丹各部，916年，他建立契丹政权，定都上京，今内蒙古巴林左旗南，后来改国号为辽。",1],[769,1,"古代宫殿大门前成对的石狮一般都是____。",["左雄右雌","左雌右雄","都是雄狮","都是雌狮"],"A","在宫殿大门外一般都有一对石狮或铜狮，按建筑方位，古代宫殿大门前成对的石狮一般都是左雄右雌（石狮子在大门两口的摆放都是以人从大门里出来的方向为参照的），符合中国传统男左女右的阴阳哲学。",10],[770,1,"他擅篆、隶、真、行、草多种书体，在书法方面颇有造诣，推动了楷书的发展，被后世尊为“楷书鼻祖”，他就是____。",["钟繇","王羲之","欧阳询","颜真卿"],"A","钟繇（锺繇）擅篆、隶、真、行、草多种书体，在书法方面颇有造诣，推动了楷书（小楷）的发展，对后世书法影响深远，后世尊为“楷书鼻祖”。",8],[771,1,"与黄培芳、谭敬昭并称为“粤东三子”的清代作家是____。",["张维屏","梁启超","康有为","黄遵宪"],"A","粤东三子指清广东三诗人。“三子”受翁方纲诗论影响，以张维屏成就较大。出自《清史稿·文苑·张维屏传》：张维屏，字子树，番禺人。工诗，计偕入都，翁方纲尝异之。与黄培芳、谭敬昭，称粤东三子。",0],[772,1,"“东施效颦”中，东施效仿的是____。",["王昭君","西施","貂蝉","杨玉环"],"B","故西施病心而矉（通‘顰’，皱眉）其里，其里之丑人见而美之，归亦捧心而矉其里。其里之富人见之，坚闭门而不出；贫人见之，絜（通‘挈’，带领）妻子而去之走。彼知颦美，而不知颦之所以美。（《庄子·天运》）。",1],[773,1,"在古代，“杵臼”是一种捣鼓粮食或____的工具。",["药物","矿石","金属","木材"],"A","杵臼是在古代，是指用来鼓捣粮食或药物等的工具，是一个不可分离的器具。",9],[774,1,"中国的茶饮风俗源于____地区。",["浙江","福建","四川","云南"],"C","四川茶文化源远流长，四川是我国饮茶和种植茶叶的最早的地区之一，我国最早有价值的文献，也恰巧出自四川文人之手。",5],[775,1,"杭州虎跑泉与龙井茶相配，被称为____。",["天下双绝","江南双绝","西湖双绝","钱塘双绝"],"C","西湖龙井驰名中外，色绿、香郁、味醇；虎跑泉水天下第三泉，泉水甘洌醇厚、水质纯净，而龙井茶只有虎跑水才能泡出它独特的茶香，因此二者被世人合称为“西湖双绝”.",7],[776,1,"文献表明，火药的利用最晚不迟于____代。",["宋","元","明","唐"],"D","据文献记载,最迟在唐代火药已经被发现和利用。唐代孙思邈的《孙真人丹经》首次制做记载了制造火药的方法,接中是世界上才关于火药的最早记载。",11],[777,1,"历史上著名的“针灸铜人”是在北宋太医____的主持下制造的。",["孙思邈","王惟一","华佗","张仲景"],"B","王惟一是北宋医家，对针灸学很有研究，集宋以前针灸之大成，著有《铜人腧穴针灸图经》一书。同时,他主持制造了外科铜人，作为学生练针的样本。",11],[778,1,"年少时，梦见所用之笔头上生花，后来名闻天下的是____。",["杜甫","王维","李白","白居易"],"C","《开元天宝遗事·梦笔头生花》：“李太白少时，梦所用之笔头上生花，后天才赡逸，名闻天下。”",0],[779,1,"____是历史上著名的医学家，他发明的药剂“麻沸散”，具有全身麻醉的功能。",["李时珍","孙思邈","张仲景","华佗"],"D","华佗东汉末年著名的医学家，与董奉和张仲景被并称为“建安三神医”。他精通内、外、妇、儿、针灸各科，对外科尤为擅长，发明了“麻沸散”来辅助外科手术，被后人称为“外科圣手”“外科鼻祖”。",11],[780,1,"现代京剧的行当有生、旦、净、丑四行，而昆曲则除此之外，还有____。",["末","外","贴","杂"],"A","京剧并非源于北京的剧种,而是由南方入京的安徽徽调和湖北汉调吸收流行于北京的风行梆子、昆曲、京腔的营养,融会本地语言形成的剧种。京剧有生、旦、净、丑四大行当,而昆曲除此之外还有末。",9],[781,1,"____的发明源于古代道士的“炼丹术”。",["造纸术","火药","印刷术","指南针"],"B","火药火枪是我国古代的四大发明之一,源于古代的炼丹术。据文献记载,最迟在唐代火药已经被发现和利用,唐代孙思邈的《孙真人丹经》首次记载了制造火药的方法,是世界上关于火药的最早记载。",11],[782,1,"在淝水之战中，“闻风声鹤唳，皆以为王师已至”的是谁？",["苻坚","谢安","谢玄","慕容垂"],"A","淝水之战指的是前秦皇帝苻坚对东晋发动的战争，失败后在奔逃的路上，远处山上郁郁葱葱的树木被风吹得簌簌作响，高度紧张的前秦士兵以为那是晋军的追兵，越发拼命逃窜。",1],[783,1,"最早的印本书籍____是在莫高窟发现的。",["《金刚经》","《道德经》","《论语》","《诗经》"],"A","我国和世界现存最早的有日期的雕版排印的书是《金刚经》，撕掉于唐咸通九年(868)。这卷举世闻名的《金刚经》，原藏于甘肃敦煌莫高窟，1899年被发现，1907年后被英国人斯坦因盗去，原藏伦敦不列颠博物馆。",2],[784,1,"国内仅存的一座帝王庙位于____的阜成门。",["洛阳市","北京市","西安市","南京市"],"B","帝王庙是供奉祭祀上至伏羲、轩辕祖先，下至明、清各朝的历代帝王和名臣的场所，是我国唯一纪念历代帝王名臣的坛庙。帝王庙位于北京西城区阜成门内大街路北。",1],[785,1,"中国第一大佛是四川的____。",["乐山大佛","峨眉山金顶佛像","荣县大佛","屏山大佛"],"A","乐山大佛，又名凌云大佛，是中国最大的石刻佛像。",2],[786,1,"中国最早的佛经是____。",["《四十二章经》","《金刚经》","《心经》","《楞严经》"],"A","中国古代最早的佛经是在东汉时期的《四十二章经》，相传为摄摩腾摄摩腾和竺法兰所译，这是我国翻译梵文佛经的开始。",2],[787,1,"与“达赖”并称为黄教两大转世系统的称号是____。",["法王","活佛","班禅","国师"],"C","“达赖”和“班禅”是黄教两大活佛转世系统的称号。达赖的称号始于三世达赖喇嘛锁南嘉错,前两世都是后来追认的。班禅的称号比达赖略晚。",2],[788,1,"中国建立的第一个王朝是____。",["周朝","商朝","夏朝","秦朝"],"C","中国史书记载的第一个朝代是夏朝制。",1],[789,1,"江苏之名是其境内江宁与____两地的合称。",["苏州","扬州","无锡","常州"],"A","江苏的名字是以江宁、苏州各取一字得名。清康熙6年(1667年)设江苏省,取两江总督驻所江宁(今南京市)和巡抚驻所苏州(今苏州市)两府首字组成江苏省。取全称中的“苏”字作为简称。",7],[790,1,"秦朝的国家行政机构分为中央、“____”和县三级。",["州","路","郡","省"],"C","秦建立后废除分封制，在全国推行郡县制。郡是中央政府以下最高一级地方行政机构；县是郡的下级行政机构。郡守是郡的最高行政长官，对上承受中央命令，对下督责所属各县。郡守和县令都由皇帝直接任免，对中央负责。",1],[791,1,"甲骨文也称____。",["隶书","小篆","卜辞","金文"],"C","记录商代的社会情况的文字主要是甲骨文，是刻在甲骨上的文字，都是商代王室占卜的记录，因而也称卜辞。",8],[792,1,"现存最早的天文台遗址在今天的河南洛阳市，古名为____。",["浑天仪","司天台","灵台","观星台"],"C","灵台位于故城河南省洛阳市汉魏阳城南郊,由班固于东汉中元元年(56)主持修建,是历史文献最早的天文台遗址。据文献记载,灵台连续使用达二百五并建十余年,为我国古代天文学的发展作出了巨大贡献。",10],[793,1,"唐代出现的一种著名的陶器被称为____。",["青花瓷","白瓷","唐三彩","青瓷"],"C","陶瓷业在唐朝有重要发展，越窑青瓷、邢窑白瓷和唐三彩最为有名，其中唐三彩造型美观，釉色绚丽，是世界工艺的珍品。",10],[794,1,"所谓先秦的诸子百家，实际上就是指儒、墨、____、道、阴阳、名家、纵横家、兵家、农家和杂家这几个门派及其代表人物。",["名","农","法","杂"],"C","诸子百家是对先秦晚期总称学术思想派别的总称，主要包括儒、道、墨、法、阴阳、农、名、兵、纵横和杂家。诸子百家各自阐发立论，已经形成了学术争鸣的局面，对中国古代思想史产生了可贵的神话传说影响。",2],[795,1,"集宋代理学之大成的学者是____。",["朱熹","程颢","程颐","张载"],"A","朱熹，字元晦、仲晦，南宋徽州婺源县（今江西省上饶市婺源县）人，生于福建路南剑州尤溪县（今福建省三明市尤溪县），南宋理学家，宋代理学集大成者。",2],[796,1,"藏传佛教又称____，是在我国西藏、青海、内蒙古等地区流传的佛教。",["喇嘛教","禅宗","华严宗","净土宗"],"A","藏传佛教，又称藏语系佛教，或俗称喇嘛教，是指传入中国西藏的佛教分支。",2],[797,1,"史书上将中国古代帝王在京城外祭祀天地的仪式称为____。",["郊祭","封禅","庙祭","社祭"],"A","古代帝王除了往泰山封禅、往汾阴祭典后土之外,祭祀天地的仪式还有庙祭和郊祭两种,这两种仪式都始于周代。其中,郊祭则是所指在京城外郊区祭祀天地,史书称“郊祭”。",1],[798,1,"现存最古老的宗祠是位于山西省闻喜县的____。",["裴氏祠","孔庙","孟庙","关帝庙"],"A","素有“中华宰相村”房氏之称的裴柏村是裴氏宗祠所在地,裴氏祠堂原称晋公祠,建于唐贞观三年(629年),有前殿、后殿、状元坊、碑廊等,规模宏大,但屡遭兵燹,屡修屡毁。",7],[799,1,"殿试制度完善于____时期；进士考试始于隋炀帝时期；三甲发榜始于宋太宗时期。",["宋太祖","唐太宗","唐玄宗","武则天"],"A","殿试为科举考试中最高的一种,由武则天创制,但尚未成定制,宋太祖时始为常制。隋炀帝进士科考试始于炀帝大业三年(607),采用分科考试的方法选拔官员,是科举制宣告形成的标志。宋太宗太平兴国八年(983)开始分类“三甲”发榜。",3],[800,1,"现存最早的类书是隋末虞世南的____。",["《永乐大典》","《太平御览》","《艺文类聚》","《北堂书钞》"],"D","现存最早的类书是隋末虞世南编纂的《北堂书钞》。",1],[801,1,"在中国古代建筑史上，“汉三宫”和“唐三宫”非常著名，前者长乐宫、未央宫和建章宫；后者指____、大明宫、和兴庆宫。",["长乐宫","阿房宫","紫禁城","太极宫"],"D","我国古代历史时期的“汉三宫”是指长乐宫、未央宫和建章宫。其中，东宫由秦代旧宫整修改建而成；未央宫是明清两代以前中国古代最大的宫殿,为汉高祖前半期萧何督建；建章宫为汉景帝下令修建。“唐三宫”是指太极宫、大明宫、兴庆宫，其中，太极宫是在隋朝大兴宫的基础上改建而成，其北门为玄武门；大明宫是唐太宗专为李渊避暑而建；兴庆宫于唐玄宗时期建造，唐玄宗和杨贵妃的故事绝大多数发生于此。",1],[802,1,"古代帝王陵寝通常包含____、陵园和地宫三部分。",["神道","祭殿","墓碑","陵冢"],"D","陵寝是古代帝王的坟墓。帝王的坟墓造得如山陵般又高又大,故称为“陵”；“寝”是密序死者灵魂起居之所，此外还有子孙祭天的祭殿。陵寝的构成包括陵园、陵冢和地宫三部分。",1],[803,1,"中国古塔按照造型来分类，有____、密檐式、喇嘛式、花式和金刚宝座式五种。",["过街式","覆钵式","亭阁式","楼阁式"],"D","塔源于印度的“浮屠”,用于收藏佛祖舍利,又称“舍利塔”，后用于藏经、埋葬，成为纪念性建筑。按照它的造型可分为：楼阁式、密檐式、喇嘛式、花式和夜叉宝座式。",10],[804,1,"古代乐器按演奏方法分为吹、拉、弹、打四类，按乐器的材料可分为____、石、土、木、匏、革、丝、竹八类。",["银","铁","铜","金"],"D","乐器按照各自使用的物质材料分为八种类别：即金，石，土，革，丝，木，匏，竹，称为八音。乐器分为四类：吹，拉，弹，唱。",9],[805,1,"南宋数学家____提出的“大衍求一术”被国际数学界称为“中国剩余定理”。",["祖冲之","秦九韶","刘徽","杨辉"],"B","秦九韶是南宋汉学家，于淳祐七年(1247)著成《数书九章》十八卷。这是一部极其重要的巨著，它总结了前人在开方中剖析所使用的列筹方法，将其整齐而又系统地应用到有理的高次方程或无理根的求解上去，其中的“大衍求一术”(一次同余组解法)在世界数学握有史上占有崇高的优势地位，被称为“中国剩余定理”。",11],[806,1,"著名的《四库全书总目提要》是著名学者____撰写的。",["戴震","姚鼐","方苞","纪晓岚"],"D","《四库全书总目提要》简称四库全书总目、四库总目、四库提要，共二百卷，是中国清代纪昀等编纂的一部大型解题书目，是中国古典目录学方法的集大成者。",0],[807,1,"我国家庭教育的鼻祖是____。",["孔子","孟子","荀子","朱熹"],"A","我国的始于家庭教育最早始于西周时期，孔子是家庭教育的泰斗，尽管在他的论述中关于基础教育家庭教育的不是很多，但是我们仍然可以从中汲取智慧。他重视家庭中的起始教育，强调诚信与威严，将忠孝思想也渗透到家庭教育的思想之中，为后世传统基础教育理念的形成奠定了基础。",2],[808,1,"中国历史上正式设立的太学是在____时期。",["汉文帝","汉武帝","秦始皇","汉高祖"],"B","太学是中国古代的的一种大学，始设于汉武帝元朔五年。",1],[809,1,"明清时，殿试的地点均在北京故宫的____殿。",["太和殿","保和殿","中和殿","乾清宫"],"B","殿试又称御试、廷试、廷对，殿试为科举考试中的最高一段，由皇帝亲自出题考试，明清时，科举殿试的地点均在北京故宫保和殿。",10],[810,1,"《四书章句集注》是____从《礼记》中摘出《大学》和《中庸》两篇，合《论语》和《孟子》注释而成。",["董仲舒","朱熹","程颢","程颐"],"B","南宋理学家，程朱理学集大成者。朱熹历高宗、孝宗、光宗、甯宗四朝。他总结了宋代理学思想，建立了庞大的理学体系，开创了紫阳学派。他还在建阳云谷“晦庵”草堂讲学，并校订了四书，成为后代科举应试科目。",2],[811,1,"大运河北起北京，南到杭州，故又称____，全长2400多公里，全面修建于隋炀帝时期，是世界上开凿最早、规模最大、里程最长的内陆运河，曾经与万里长城并称于世。",["通济渠","京杭大运河","浙东运河","隋唐大运河"],"B","京杭大运河是“大运河”的一条干线，位于中国东部。它被列为世界文化遗产，是“南水北调”东线工程，也是世界上里程最长、工程最大和最古老的运河之一，与长城、坎儿井并称为中国古代的三项伟大工程，使用至今。",7],[812,1,"《本草纲目》的作者是____。",["孙思邈","李时珍","华佗","张仲景"],"B","《本草纲目》是李时珍所著的集中国16世纪前本草学大成的中医典籍，该著作吸收了之前的草本书籍的精华，纠正了前人很多错误的地方，而且更是增加了数百种药物草本，有很多新的发现和突破，是中国历史上1600年以前最完整、最科学的一部医学著作。",11],[813,1,"现存的古碑荟萃之地，著名的有两处：第一位是____碑林；第二位是曲阜的孔庙碑林。",["南京","开封","西安","洛阳"],"C","长方形者为碑，上圆而下方者为碣，合称“碑碣”。碑碣起源于先秦的无字碑（宫碑、丰碑和庙碑），墓前丰碑到秦汉演变为纪念性建筑；东汉时立碑刻字成为风气，用于歌功颂德、宣扬门阀；隋唐更甚，始立庙中，往往留存大量书法真迹。现存的古碑集中地主要有两处：西安碑林，位于陕西省西安市，为中国第一碑刻艺术宝库；孔庙碑林，位于山东省曲阜市，仅次于西安碑林，为中国第二碑林。",8],[814,1,"南宋四大书院中，由朱熹主持的是白鹿洞书院；由陆九渊主持的是象山书院；由吕祖谦主持的是丽泽书院；由张栻主持的是____。",["嵩阳书院","应天书院","石鼓书院","岳麓书院"],"D","朱熹、吕祖谦、张栻和江西学派的陆九渊是南宋时期四位著名的理学家,他们主持的白鹿洞书院、丽泽书院、岳麓书 院、象山书院,世称南宋四大书院。",2],[815,1,"北京的“三海”也是著名的园林建筑，指的是____、中海、南海。",["东海","北海","西海","前海"],"B","三海，即北海、中海、南海的合称，位于北京城内故宫和景山的西侧，明、清时期称为西苑。它是中国现存历史悠久、规模宏大、布置精美的宫苑之一",10],[816,1,"“四君子”指的是梅、兰、竹、____四种植物",["荷","菊","松","柏"],"B","明代黄凤池辑有《梅竹兰菊四谱》，从此，梅、兰、竹、菊被称为“四君子”，世人常用“四君子”来寓意圣人高尚的品德。“四君子”是中国传统文化的题材，以梅、兰、竹、菊谓四君子，他们分别是指：梅花、兰花、翠竹、菊花。被人称为“四君子”，其品质分别是：傲、幽、澹、逸。“花中四君子”成为中国人借物喻志的象征，也是咏物诗文和艺人字画中常见的题材。其文化寓意为：梅，探波傲雪，高洁志士；兰，深谷幽香，世上贤达；竹，清雅澹泊，谦谦君子；菊，凌霜飘逸 ，世外隐士。他们都没有媚世之态、遗世而独立。在四君子之中而唯有梅花被古人的智慧创作出“梅花篆字”。",1],[817,1,"梅花的五瓣在传统文化中被比喻为寿、福、康宁、好德、善终，被称为____。",["人生五福","五福临门","五福捧寿","五福同享"],"A","梅耐严寒,报春早,有清香,姿态秀雅,节操凝重,为文人雅士所垂青。梅花有五瓣,象征着寿、福、康宁、好德、善终的人生五福。",1],[818,1,"迄今发现的最早、最大、保存最好的古代都城遗址是河南偃师市发现的，它被认为是____早期都城遗址。",["商代","夏代","周代","秦代"],"A","古代的大城市称作城池,“城”指城墙,“池”指城外环绕城墙的河池,俗称“护城河”。河南偃师周代都城遗址是迄今我国发现年代最早、规模最大、保存最难的古代都城遗址,属于商代早期城址,旧都传统上认为它就是商代的都城“西亳”。",1],[819,1,"有“东南名园之冠”美誉的园林是____。",["上海豫园","苏州拙政园","苏州留园","扬州个园"],"A","豫园位于上海市中心的黄浦区,是明朝时期的私人湖畔,建于1559年。园内建筑设计精巧、布局细腻,以清幽秀丽、玲珑剔透见长,具有小中见大的特点,充分展现了中国园林的建筑与设计风格,是嘉兴园林中的一颗明珠,被誉为“东南名园之冠”。",10],[820,1,"中国书画史上，被称为“画圣”的是唐代的吴道子；被称为“书圣”的是晋代的____。",["王羲之","王献之","颜真卿","欧阳询"],"A","吴道子是唐代第一大画家,被后世尊称为“画圣”,他一生主要包括创作壁画,作品数量惊人,代表作品有《天王送子图》《八十七神仙卷》,孔庙的镇庙之宝《孔子行教像》;王羲之是晋代著名书法家,他博采众长,自辟蹊径,自成一体,被誉为“书圣”,代表作品有《兰亭集序》。",8],[821,1,"中国画史上东晋时期____因才绝、画绝和痴绝被称为“三绝”，后来人们又把诗、书、画达到很高的造诣称为“三绝”。",["顾恺之","陆探微","张僧繇","吴道子"],"A","东晋时的顾恺之帛画是人物画大师,以才绝、画绝、痴绝被称为“三绝”。“才绝”是说他才华横溢,“画绝”是说他画技高超,“痴绝”是说他做人太痴。他精通画论,提出“迁想妙得”“以形写神”等著名论点,对中国绘画的国际化发展有深远影响,其传世作品有碑帖《洛神赋图》《列女仁智图》。",8],[822,1,"秦代以后陆续修过的长城的王朝有10个，其中以汉、____两代规模最大。",["元","唐","明","宋"],"C","战国时期，秦、燕、赵北邻匈奴，各自筑城自卫，但没有相连，其他诸国也在各自边界筑城。秦始皇统一中国后，派蒙恬、扶苏将原有秦、燕、赵三国长城连为一体，形成我们熟知的“万里长城”。在秦以后，共有十个王朝修建长城，以汉代和明代规模最大。",1],[823,1,"历史上的著名灭佛事件被称为“三武一宗”，指的是____、北周武帝、唐武宗和周世宗这四个皇帝。",["北魏孝文帝","隋文帝","北魏太武帝","隋炀帝"],"C","“三武灭佛”，指的是北魏太武帝灭佛、北周武帝灭佛、唐武宗灭佛这三次事件的合称。这些在位者的谥号或庙号都带有个武字。若加上后周世宗时的灭佛则合称为“三武一宗灭佛”。",1],[824,1,"现代藏传佛教多属“黄教”，其创始人就是著名的____。",["班禅额尔德尼","达赖喇嘛","宗喀巴","八思巴"],"C","宗喀巴（1357年-1419年10月25日），本名罗桑扎巴，13岁时在夏琼寺出家，青海湟中县人，藏传佛教格鲁派（黄教）创立者、佛教理论家，被藏族人尊称为第二佛陀。他的著述极多，重要著作有《密宗戒注释成就穗》《囊则敬寺所说比丘学处》《金刚持道次第秘密枢要解》等。在中国西藏、青海、内蒙、北京等地区的喇嘛寺院里，均设有宗喀巴塑像。宗喀巴于明代永乐十七年（公元1419年10月25日）在拉萨甘丹寺圆寂，享年63岁。",2],[825,1,"六经也称“六艺”，是经过孔子删定向弟子讲授的教材，它实际上指的是后世所说的“五经”和后来失传的____。",["《尚书》","《诗经》","《易经》","《乐经》"],"D","六经是暗指经过孔子整理而经学传授的六部先秦古藉,它们是《诗经》《尚书》《仪礼》《乐经》《周易》《春秋》。其中《乐经》已失传,所以通常又称“五经”。",2],[826,1,"中国文化遗产的标志是太阳鸟金箔，中国旅游的标志是____。",["兵马俑","长城","故宫","马踏飞燕"],"D","太阳鸟金箔2001年出土于四川成都金沙遗址。2005年08月17日,国家文物局国家文物局正式公布采行成都金沙“四鸟绕日”(太阳神鸟)金饰图案为“中国文化遗产标志”。马踏飞燕又称铜奔马,是东汉青铜器,1969年出土于甘肃省武威雷台墓。马踏飞燕自出土文物以来一直被视为中国古代高超铸造业的铸造业象征,1983年被确定为中国旅游标志。",10],[827,1,"针灸是根据中医的_______理论刺激特定穴位的治疗方法，其疗效在国际上已得到公认。",["脏腑","气血","阴阳","经络"],"D","针灸治病，是直接作用于腧穴，通过经络的传导和反应，来调整人体的营卫气血和脏腑功能恢复体内阴阳的相对平衡，以达到治愈疾病的目的。",11],[828,1,"2006年5月，经国务院批准，未被列入第一批国家级非物质文化遗产名录的民俗节日有：____、七夕节、重阳节等。",["春节","清明节","中秋节","腊八节"],"D","2006年5月，经国务院批准，被列入第一批国家级非物质文化遗产名录的民俗节日有：春节、清明节、端午节、中秋节、七夕节、重阳节等。",5],[829,1,"唐朝是我国饮茶历史上的鼎盛时期，流行于唐朝的饮茶方式不包括____？",["煎茶","庵茶","点茶","煮茶"],"C","宋代流行点茶。",12],[830,1,"几千年来，中国人制造陶瓷，使用陶瓷，陶瓷文化已经融入中国人生活的方方面面。下列选项中，属于陶瓷的有____。",["四羊方尊","莲鹤方壶","后母戊鼎","三彩胡人背猴骑俑"],"D","ABC项都属于青铜器。",10],[831,1,"中国地形多样，人们因地制宜，建造出适合自己的房屋,组成了丰富多彩的中式民居。以下地区与住房搭配不正确的有____。",["北京--四合院","内蒙古--窑洞","山西--大院","福建--土楼"],"B","B项窑洞主要分布于黄土高原上，是当地居民的传统居住场所。",10],[832,1,"东汉时期张衡发明的水运浑象仪，巧妙地把计量时间用的____与____结合起来，以水流做动力，推动仪器模拟天体运行情况。",["日晷—浑象","漏刻—浑象","圭表—浑象","沙漏—浑象"],"B","水运浑象仪的核心是将计量时间的装置与模拟天体运行的浑象结合。漏刻是古代常见的计时工具，通过水流的滴漏来计量时间，张衡利用漏刻的水流作为动力，驱动浑象旋转，模拟天体运行，B 选项正确。日晷通过太阳影子计时，圭表通过测量日影长度确定节气和时间，沙漏虽也是计时工具，但在张衡的水运浑象仪中，主要结合的是漏刻，而非日晷、圭表或沙漏，故正确答案为 B。",11],[833,1,"泰山的每一处都蕴含着悠久的历史和丰富的文化。以下不是位于泰山的古建筑有____。",["王母池","万仙楼","百尺峡","碧霞祠"],"C","“百尺峡”也叫“百丈崖”，是华山的险境之一。",7],[834,1,"自古以来，黄河常常是诗人吟咏的对象。下列关于黄河的诗句与其作者对应不正确的有____。",["黄河之水天上来，奔流到海不复回--李白","九曲黄河万里沙，浪淘风簸自天涯--刘禹锡","黄河落天走东海。万里写人胸怀间--王维","白日依山尽，黄河人海流--王之涣"],"C","黄河落天走东海，万里写入胸怀间出自李白的《赠裴十四》。",7],[835,1,"北岳恒山的悬空寺称得上是天下独绝，寺中同时供奉着佛、道、儒三家的始祖,他们分别是____。",["释迦牟尼、老子、孔子","耶稣、老子、孔子","释迦牟尼、庄子、孟子","释迦牟尼、老子、孟子"],"A","佛教的始祖是释迦牟尼，道教的始祖是老子（李耳），儒家的始祖是孔子（孔丘），悬空寺作为三教合一的独特建筑，供奉的正是这三位始祖。",2],[836,1,"益者三友是____。",["友直、友谅、友多闻","友便辟、友善柔、友便佞","友仁、友义、友礼","友智、友信、友勇"],"A","益者三友指友直，友谅，友多闻的朋友（友直是指正直的朋友，友谅是指诚信（谅，诚信）的朋友，友多闻是指见闻广博的朋友）。",2],[837,1,"西湖是中国著名的风景区，有着浓厚的历史文化气息，下列选项中不属于西湖古时旧称的有____。",["上湖","钱塘湖","西子湖","重湖"],"D","重湖是洞庭湖的旧称。",7],[838,1,"彝族刺绣历史悠久，颜色以____为主。",["黑、红、黄","黑、白、蓝","红、绿、蓝","红、黄、绿"],"A","彝族刺绣在色彩运用上具有鲜明的民族特色，传统上以黑、红、黄三种颜色为主。黑色象征大地和庄重，红色象征火焰、生命和热情，黄色象征太阳和光明，这三种颜色的搭配体现了彝族对自然和生活的认知，A 选项正确。其他选项中的颜色组合并非彝族刺绣的主流颜色，故正确答案为 A。",10],[839,1,"玉在我国古代具有十分深刻的寓意和文化内涵，人们认为玉拥有美好品质不包括____？",["仁","利","智","洁"],"B","在《管子·水地》中，管仲认为玉有九种美德，分别为“仁、知、义、行、洁、勇、精、容、辞”。",10],[840,1,"象脚鼓的用料十分讲究，鼓身木料选用___，这样不容易开裂损坏",["梧桐木","桦木","椿木","芒果木"],"D","象脚鼓是傣族等少数民族的重要乐器，其鼓身木料的选择尤为关键。芒果木质地坚硬、纹理细密，且具有较好的防潮性和稳定性，不易开裂损坏，是制作象脚鼓鼓身的传统优选材料，D 选项正确。梧桐木常用于制作古琴等乐器；桦木、椿木虽也是常见木材，但在象脚鼓制作中并非主流选用木料，故正确答案为 D。",9],[841,1,"下列选项中不属于怒江傈僳族自治州独特技艺的有____。",["“上刀山，下火海”技艺","起奔乐器制作技艺","柳溪竹雕制作技艺","独龙族竹编技艺"],"C","柳溪竹雕制作技艺是云南省昭通市彝良县的·竹雕技艺。",7],[842,1,"藏族传统金属铸造工艺源远流长，不会采用以___为熔模材料的铸造方法。",["羊油","松香","檀香","蜂蜡"],"C","檀香主要分布于广东、广西、海南、云南、福建等地区，并非藏族地区常见的熔模材料。",14],[843,1,"战国时期著名的思想家韩非在《韩非子》中提出____、____、____相结合的法治主张。",["仁、义、礼","道、法、术","法、礼、智","法、术、势"],"D","韩非子结合商鞅、申不害、慎道三位前辈的思想，在其老师荀子之性恶论的基础上，提出了“法、术、势”的治国思想。",2],[844,1,"“损者三友”不包括____。",["友酒肉","友便辟","友善柔","友便佞"],"A","孔子曰：“益者三友，损者三友。友直，友谅，友多闻，益矣。友便辟，友善柔，友便佞，损矣。”孔子说：“有益的朋友有三种，有害的朋友有三种。同正直的人交友，同诚信的人交友，同见闻广博的人交友，是有益的。同逢迎谄媚的人交友，同表面柔顺而内心奸诈的人交友，同花言巧语的人交友，是有害的。”",12],[845,1,"古人倡导的“三不朽”不包括以下哪个？",["立德","立志","立功","立言"],"B","三不朽， 指立德、立功、立言。",14],[846,1,"以下选项中不属于“晚清四大名臣”的是____。",["张之洞","袁世凯","李鸿章","左宗棠"],"B","晚清四大名臣分别为：曾国藩、左宗棠、李鸿章、张之洞。",1],[847,1,"下列成语典故中，出自《庄子》的除了____？",["邯郸学步","东施效颦","井底之蛙","五十步笑百步"],"D","五十步笑百步是一则来源于寓言故事的成语，成语有关典故最早见于《孟子·梁惠王上》。",0],[848,1,"孟子在《生于忧患，死于安乐》一文中，在开头列举了一系列历史人物，这些历史人物不包括____。",["舜","大禹","管仲","百里奚"],"B","《生于忧患，死于安乐》中孟子举了舜、傅说、胶鬲、管夷吾、孙叔敖、百里奚六位名人的事例，得出困境出人才的结论。",1],[849,1,"《大道之行也》的“矜、寡、孤、独、废疾者皆有所养”一句中，以下理解正确的是____。",["“矜” 指老而无子的人，“寡” 指幼而无父的人","“孤” 指老而无妻的人，“独” 指老而无夫的人","“废疾者” 指身体残疾、无法劳动的人","该句体现了封建社会的等级制度"],"C","在 “矜、寡、孤、独、废疾者” 中，“矜”（通 “鳏”）指老而无妻的人，“寡” 指老而无夫的人，“孤” 指幼而无父的人，“独” 指老而无子的人，A、B 选项对 “孤” 和 “独” 的理解颠倒，错误；“废疾者” 指身体残疾、丧失劳动能力的人，C 选项正确；该句描绘的是 “大同社会” 中人人都能得到供养的理想景象，体现的是平等、互助的理念，而非封建社会的等级制度，D 选项错误。",0],[850,1,"《诗经》是我国第一部诗歌总集，其主要不包括哪个部分？",["“风”","“雅”","“言”","“颂”"],"C","《诗经》是中国最早的诗歌总集，收集了地方乐调、西周王畿的乐调及祭祀用的宗教音乐，分别被称为“风、雅、颂”。",2],[851,1,"下列诗句中，表现送别时朋友之间深厚情谊的不包括以下____？",["但愿人长久，千里共婵娟","洛阳亲友如相问，一片冰心在玉壶","劝君更尽一杯酒，西出阳关无故人","桃花潭水深千尺，不及汪伦送我情"],"A","“但愿人长久，千里共婵娟”出自苏轼写给弟弟的《水调歌头》，常用于表达对远方亲人的思念之情以及美好祝愿。",0],[852,1,"下列选项中，属于老子思想主张的有____。",["“仁者爱人”","“无为而治”","“制天命而用之”","“兼爱、非攻”"],"B","老子是道家学派的创始人，其思想核心是 “道”，主张 “无为而治”，即统治者不过多干预，让事物自然发展，以达到社会和谐稳定，B 选项正确。“仁者爱人” 是孔子的儒家思想主张；“制天命而用之” 是荀子的思想，强调人可以利用自然规律；“兼爱、非攻” 是墨子的墨家思想主张，A、C、D 选项错误。",2],[853,1,"下列选项中，被称为“吴中四士”的除了以下____？",["贺知章","张旭","包融","徐凝"],"D","“吴中四士”包括张若虚、贺知章、张旭和包融",8],[854,1,"欧阳修是北宋著名文学家，后人将他和____、____、____并称“千古文章四大家”。",["韩愈、柳宗元、苏轼","李白、杜甫、白居易","王安石、苏轼、苏辙","韩愈、柳宗元、王安石"],"A","“千古文章四大家” 是指在散文创作上成就卓著的四位文学家，分别是唐代的韩愈、柳宗元和宋代的欧阳修、苏轼。",0],[855,1,"元代时期出现了很多优秀的杂剧家和曲作家，其中未被誉为“元曲四大家”的有____。",["马致远","王实甫","白朴","郑光祖"],"B","“元曲四大家”包括关汉卿，马致远，郑光祖，白朴。",1],[856,1,"下列作品中，未被称为“元代四大爱情剧”的是____。",["《拜月亭》","《西厢记》","《汉宫秋》","《倩女离魂》"],"C","“元代四大爱情剧”分别为关汉卿的《拜月亭》、王实甫的《西厢记》、白朴的《墙头马上》和郑光祖的《倩女离魂》。",1],[857,1,"《白雪歌送武判官归京》里描写了主将营帐中为武判官送行的情景，其中演奏的时候未用到___乐器？",["胡琴","洞箫","琵琶","羌笛"],"B","《白雪歌送武判官归京》中“胡琴琵琶与羌笛”的意思是：胡琴琵琶羌笛合奏来助兴。所以演奏的时候用到了胡琴、琵琶、羌笛。",9],[858,1,"下列木材中不属于硬木的有____。",["楠木","紫檀","红木","黄花梨"],"A","楠木为软木。",14],[859,1,"下列作品中，不属于草书作品的有____。",["张旭《肚痛帖》","王献之《鸭头丸帖》","怀素《自叙帖》","王羲之《兰亭序》"],"D","D项《兰亭序》是行书作品。",8],[860,1,"围棋的别称体现了中国棋文化的深厚底蕴。下列词语中，不属于围棋别称的有____。",["黑白","楚河","手谈","玉楸枰"],"B","“楚河”与象棋有关。",13],[861,1,"我国古代关于围棋的著作不包括____？",["《仙机武库》","《幼学琼林》","《忘忧清乐集》","《石室仙机》"],"B","《幼学琼林》是中国古代启蒙的儿童读物，包含许多成语典故、著名人物、天文地理、典章制度等内容。",13],[862,1,"宋代确立了科举考试的三级考试制，不包括____？",["州试","省试","吏部试","殿试"],"C","为了录取的公平，宋代形成了三级科举考试制度：州试，由地方官主持；省试，由尚书省礼部主持；殿试，由皇帝主持。",3],[863,1,"《史记》中的“本纪”原为历代帝王的传记。下列选项中，不是帝王却被载入“本纪”中的有____。",["项羽","刘邦","秦始皇","汉武帝"],"A","《史记》中的 “本纪” 主要记载帝王事迹，但项羽虽未正式称帝，却在秦末推翻秦朝后，分封诸侯，自称 “西楚霸王”，实际掌握了当时的政权，具有与帝王相当的地位和影响力，司马迁为了肯定其历史功绩和地位，将其载入《项羽本纪》，A 选项正确。刘邦是汉高祖，秦始皇是秦朝开国皇帝，汉武帝是西汉皇帝，他们均为帝王，分别载入《高祖本纪》《秦始皇本纪》《孝武本纪》，B、C、D 选项错误。",1],[864,1,"古时百姓的称谓不包括____？",["黔首","生民","黎元","阁下"],"D","“阁下” 是对有一定地位的人的尊称，多用于书信中",4],[865,1,"中国古代神话故事“干将莫邪”，在多本书籍中均有提及。下列记载了此故事的书籍有《孝子传》和____？",["《列士传》","《聊斋志异》","《搜神记》","《史记》"],"A","干将莫邪是古代中国神话传说，最早出自汉朝刘向《列士传》和《孝子传》中。",0],[866,1,"下列关于道教的发展历程，说法错误的有____。",["隋唐至北宋是道教的兴盛时期。","北魏寇谦之改革了道教，要求教徒“专以礼度为首”，为北天师道。","《三经洞书目录》是道教史上第一部道经目录。","张道陵撰写了《真灵位业图》，构造了道教的神仙谱系。"],"D","D项为陶弘景撰写了《真灵位业图》。",1],[867,1,"下列话语体现了循序渐进教学原则的有____。",["“不愤不启，不悱不发”","“学不躐等”","“温故而知新”","“因材施教”"],"B","“学不躐等” 出自《礼记・学记》，“躐” 指超越，意思是学习不能超越等级和顺序，要按照一定的步骤逐步进行，体现了循序渐进的教学原则，B 选项正确。“不愤不启，不悱不发” 体现的是启发性教学原则；“温故而知新” 体现的是巩固性教学原则；“因材施教” 体现的是因材施教的教学原则，A、C、D 选项错误。",2],[868,1,"入世精神是中国历代优秀士大夫身体力行的人生追求。下列选项中不能体现这一精神的是____。",["“先天下之忧而忧，后天下之乐而乐”","“天下兴亡，匹夫有责”","“采菊东篱下，悠然见南山”","“苟利国家生死以，岂因祸福避趋之”"],"C","入世精神指的是关注社会现实，积极参与社会事务，为国家和人民贡献力量的精神。“采菊东篱下，悠然见南山” 出自陶渊明的《饮酒・其五》，描绘了诗人归隐田园后的闲适生活，体现的是出世（归隐）精神，不能体现入世精神",12],[869,1,"勤俭节约是中华民族的传统美德，下面选项中与节约节俭无关的是____。",["“一粥一饭，当思来处不易；半丝半缕，恒念物力维艰”","“谁知盘中餐，粒粒皆辛苦”","“天生我材必有用，千金散尽还复来”","“克勤于邦，克俭于家”"],"C","“天生我材必有用，千金散尽还复来” 出自李白的《将进酒》，表达了诗人对自身才华的自信和豪放洒脱的心态，与节约节俭无关",0],[870,1,"我国近代历史上涌现出很多爱国进步人士，清代爱国政治家林则徐就是这样的人，他曾经____。",["领导虎门销烟","收复台湾","创办洋务企业","领导戊戌变法"],"A","1839 年，林则徐作为钦差大臣到广州禁烟，在虎门海滩当众销毁收缴的鸦片，史称 “虎门销烟”，这是中国近代史上反对外国侵略的重要事件，A 选项正确。",1],[871,1,"李清照是宋朝著名的女词人，下面选项中不属于李清照的作品有____。",["《如梦令•常记溪亭日暮》","《声声慢•寻寻觅觅》","《回乡偶书》","《夏日绝句》"],"C","C项《回乡偶书》出自贺知章。",0],[872,1,"壮族人民会在歌圩这个传统文化娱乐活动上吃传统食物“五色饭”，请问“五色饭”不含有下列哪些颜色？",["红色","粉色","紫色","黑色"],"B","五色饭是布依族、壮族等许多民族的传统风味小吃，一般呈黑、红、黄、白、紫5种色彩。",12],[873,1,"五言诗因每句五个字而得名，下面不属于五言诗的有____。",["《登鹳雀楼》","《望庐山瀑布》","《江雪》","《静夜思》"],"B","《望庐山瀑布》每句有七个字，因此为七言诗。",0],[874,1,"下列关于郑成功的说法不正确的是____。",["郑成功出生于福建","郑成功的父亲是一名渔夫","郑成功收复台湾后，在台湾设置府县","写有诗句“开辟荆榛逐荷夷，十年始克复先基”"],"B","郑成功的父亲为郑芝龙，初为海盗，后归顺明朝成为官员。",0],[875,1,"下列属于清代民族英雄的是____。",["岳飞","文天祥","林则徐","郑成功"],"C","林则徐是清代著名的爱国政治家，他领导的虎门销烟打击了英国鸦片贩子的嚣张气焰，维护了中国的民族尊严，是清代的民族英雄",7],[876,1,"二十四节气反映了自然节律的变化。下列不属于二十四节气的是____。",["大暑","小雨","小雪","大雪"],"B","二十四节气中并无“小雨”节气。",6],[877,1,"在端午节时，有些地方还有吃“五黄”的习俗，据说可以避 “五毒”。下列属于“五毒”的有____。",["蛇、蝎子、蜈蚣、蟾蜍、蜘蛛","蛇、蝎子、蜈蚣、蟾蜍、壁虎","蛇、蝎子、蜈蚣、蜥蜴、壁虎","蛇、蝎子、蜈蚣、蟾蜍、蜥蜴"],"B","端午节所说的 “五毒” 是指五种常见的有毒动物，传统说法为蛇、蝎子、蜈蚣、蟾蜍（癞蛤蟆）、壁虎（守宫）",5],[878,1,"下列不属于纳西族文化的是____。",["东巴舞","东巴经籍文学","东巴文","甩发舞"],"D","甩发舞是高山族原始舞蹈的遗存形式。",0],[879,1,"玉溪市因水得名，取其清流如玉之意。下列不属于玉溪市自然景观的有____。",["杞麓湖","帽天山","星云湖","虎跳峡"],"D","虎跳峡位于云南省香格里拉市虎跳峡镇。",10],[880,1,"红河州因红河横贯全州腹地而得名。下面不属于红河州自然景观的有____。",["盘龙河","阿庐古洞","花鱼洞瀑布","屏边大围山"],"A","盘龙河为中越国际河流，是云南省文山壮族苗族自治州文山市人民的母亲河。",7],[881,1,"下列属于西双版纳傣族自治州的民俗饮食文化的是____。",["五色饭","手抓饭","酥油茶","青稞酒"],"B","手抓饭是西双版纳傣族等少数民族的传统饮食方式，通常将米饭、菜肴放在芭蕉叶上，用手抓食，体现了当地的民俗饮食文化",12],[882,1,"下列名言出自《弟子规》的是____。",["“三人行，必有我师焉”","“父母呼，应勿缓；父母命，行勿懒”","“己所不欲，勿施于人”","“温故而知新，可以为师矣”"],"B","《弟子规》是清朝李毓秀所作的三言韵文，列举了为人子弟在家、外出，待人、接物等应该有的礼仪规范，上述句子均出于此。",0],[883,1,"以下寓言故事与出处对应不正确的是____。",["滥竽充数——《孟子》","屠龙之术——《庄子》","掩耳盗铃——《吕氏春秋》","与狐谋皮——《符子》"],"A","滥竽充数是一则由寓言故事演化而来的成语，最早出自《韩非子·内储说上》。",2],[884,1,"下列名句与出处搭配不正确的选项有____。",["爱人者，人恒爱之——《孟子》","驽马十驾，功在不舍——《韩非子》","己欲立而立人，己欲达而达人——《论语》","真者，精诚之至也——《庄子》"],"B","“驽马十驾，功在不舍”出自荀子的《劝学》，",2],[885,1,"梁山伯与祝英台坚贞的爱情故事感动了许多人。下列哪个不是梁山伯与祝英台的爱情故事中的桥段？",["水漫金山","草桥结拜","三载同窗","十八相送"],"A","水漫金山是中国著名四大爱情传说之《白蛇传》中的一段情节。",10],[886,1,"中国传统绘画原本称为____等，明清时，西洋画传入中国才有了其他提法。",["丹青","油画","水彩画","版画"],"A","中国传统绘画在古代常被称为 “丹青”，“丹” 指朱砂，“青” 指石青、石绿，是传统绘画中常用的颜料，后来 “丹青” 便成为绘画的代称",8],[887,1,"苏州一带画家承接元代文人画风格形成“吴门画派”。下列选项不属于“吴门四家”的有______。",["唐寅","仇英","文徵明","祝枝山"],"D","“吴门四家”指的是四位著名的明代画家：沈周、文徵明、唐寅和仇英。",1],[888,1,"清代郑板桥注重意境创造，提出了以下理论,以竹喻人正是人格、精神、情操的自我写照。其中不包括？",["“眼中之竹”","“笔中之竹”","“胸中之竹”","“手中之竹”"],"B","郑板桥提出的“眼中之竹、胸中之竹、手中之竹”，分别代表艺术家进行艺术体验、艺术构思和艺术表现的绘画过程。",8],[889,1,"山水画可以细多种类型，除了以下哪项？。",["青绿山水","金碧山水","水墨山水","工笔山水"],"D","山水画为中国画的一种，主要描写山川等自然景色，主要分为：青绿山水、水墨山水、浅绛山水、金碧山水和没骨山水。",8],[890,1,"下列画家与其画作搭配错误的一项是____。",["《清明上河图》——张择端","《虢国夫人游春图》——张萱","《步辇图》——阎立本","《富春山居图》——赵孟頫"],"D","D项作者是黄公望。",8],[891,1,"《清明上河图》生动地展现了北宋时期城市生活的多彩风貌，大致可以分为三段，其中不包括___？",["郊野春色","大漠孤烟","汴河码头","市井街道"],"B","《清明上河图》展现的是汴京的城市景象，大漠孤烟为沙漠景色，不会出现在城市当中。",5],[892,1,"大观楼始建于康熙年间，见证了昆明三百多年来的成长、变化与发展，下面出自大观楼长联的选项不包括____。",["汉习楼船","唐标铁柱","宋挥玉斧","洪武开疆"],"D","上联\n五百里滇池奔来眼底，披襟岸帻，喜茫茫空阔无边。看：东骧神骏，西翥灵仪，北走蜿蜒，南翔缟素。高人韵士何妨选胜登临。趁蟹屿螺洲，梳裹就风鬟雾鬓；更苹天苇地，点缀些翠羽丹霞，莫辜负：四围香稻，万顷晴沙，九夏芙蓉，三春杨柳。\n下联\n数千年往事注到心头，把酒凌虚，叹滚滚英雄谁在？想：汉习楼船，唐标铁柱，宋挥玉斧，元跨革囊。伟烈丰功费尽移山心力。尽珠帘画栋，卷不及暮雨朝云；便断碣残碑，都付与苍烟落照。只赢得：几杵疏钟，半江渔火，两行秋雁，一枕清霜。通读全诗，由此排除D选项。",1],[893,1,"我国有很多名楼皆因文人杰作而名扬天下，下列选项中文人与其所写的关于名楼的作品对应不正确的是____。",["辛弃疾——《岳阳楼记》","王勃——《滕王阁序》","王之涣——《登鹳雀楼》","崔颢——《黄鹤楼》"],"A","A项岳阳楼记是范仲淹所写。",10],[894,1,"“《韩诗》曰：‘郑国之俗，三月上巳……’”讲述上巳节的习俗，其中，《韩诗》是今文学派之一，西汉时与____并称为“三家诗”。",["《鲁诗》《齐诗》","《鲁诗》《楚诗》","《齐诗》《楚诗》","《燕诗》《鲁诗》"],"A","西汉时期，今文学派的《诗经》解读有 “三家诗”，分别是《韩诗》（韩婴所传）、《鲁诗》（鲁人申培所传）、《齐诗》（齐人辕固生所传），三者在当时影响深远，后《毛诗》兴起，“三家诗” 逐渐失传，故答案为 A。",5],[895,1,"《史记》不仅反映了中国古代历史，其本身也是一部优秀的文学作品，以下不属于列传五个部分的是____。",["志","世家","表","书"],"A","《史记》分为本纪、世家、列传、表、书等五个部分。",0],[896,1,"孔林圣地承载着传播儒家文化的使命，影响一代又一代的人们，下列选项中有关孔林的叙述正确的是____。",["孔子“杏坛讲学”的杏坛亭是孔林的主要建筑之一","孔林的主殿名为大成殿，与故宫太和殿、泰山岱庙天贶殿并称“东方三大殿”","孔林的核心是“铁山园”","孔子墓因墓形如隆起的马背，故名“马鬣封”"],"D","A选项中，孔子“杏坛讲学”的杏坛亭不是孔林的主要建筑之一，孔林的主要建筑包括大成殿、铁山园等，而杏坛亭位于孔庙内，并非孔林的一部分‌。B选项中，东方三大殿分别为山东曲阜孔庙的主殿大成殿、北京故宫太和殿、山东泰安岱庙天贶殿。C选项中，孔林的核心是“孔子墓”。",10],[897,1,"下列哪些材料不是用来制作活字印刷所使用的活字块的常见材料？",["木头","胶泥","金属","龟甲"],"D","最早的活字是胶泥字（陶字）,木字、金属字是后来的进步之作。因此可以排除D选项。",11],[898,1,"中国瓷器闻名世界，下列选项中哪个不是清代的瓷器制作技艺？",["釉里红","五彩","粉彩","珐琅彩"],"A","A项釉里红瓷是传统陶瓷中的艺术珍品，属于元代中期景德镇劳动人民的重要发明之一。",10],[899,1,"苏州园林中比较有代表性的有沧浪亭、狮子林、拙政园、留园，它们代表的朝代的艺术风格不包括____。",["唐","宋","元","明"],"A","沧浪亭、狮子林、拙政园和留园分别代表着宋、元、明、清四个朝代的艺术风格，因此排除A选项。",1],[900,1,"下列关于金银器的说法，正确的是____。",["中国古代金银器仅用于装饰，无实用功能","唐代金银器制作工艺达到顶峰，造型精美","金银器在古代只有皇室才能使用","古代金银器材质单一，仅用纯金、纯银制作"],"B","A 项古代金银器既有装饰功能，也有实用功能（如金银餐具、酒具），说法错误；B 项唐代经济繁荣，金银器制作工艺精湛，出现了锤揲、錾刻等复杂技艺，造型精美，达到顶峰，说法正确；C 项古代贵族、官员等也可使用金银器，并非仅皇室专属，说法错误；D 项古代金银器常采用金、银与其他金属合金制作，材质并非单一，说法错误，故答案为 B。",10],[901,1,"造纸术在四世纪传到了___，直至19世纪中叶，造纸术已传遍世界。",["欧洲","朝鲜","美洲","非洲"],"B","造纸术的传播有明确时间线：东汉蔡伦改进造纸术后，首先传入邻近的朝鲜（4 世纪）和日本（7 世纪）；8 世纪传入阿拉伯地区，12 世纪左右经阿拉伯传入欧洲，后来逐步传到美洲、非洲，故答案为 B。",11],[902,1,"莫高窟为我们呈现出一个神秘、瑰丽的艺术世界，下列关于莫高窟壁画描述不正确的是____。",["莫高窟壁画题材与佛教息息相关，有佛像画、佛教故事的画作等","莫高窟壁画绘画技巧风格多样，线条精细","壁画所用的全部颜料均从矿石中提炼而来","莫高窟壁画有4500平方米"],"D","D项目莫高窟壁画面积约45000平方米。",8],[903,1,"宋代是瓷器发展的重要时期，其中五大名窑包含____。",["汝窑、官窑、哥窑、钧窑、青花瓷窑","汝窑、官窑、哥窑、唐三彩窑、定窑","汝窑、官窑、哥窑、钧窑、定窑","汝窑、官窑、哥窑、钧窑、青瓷窑"],"C","中国古代五大名窑是钧窑、汝窑、官窑、定窑、哥窑。",10],[904,1,"文山苗族花山节中必不可少的表演项目是芦笙舞表演，芦笙舞表演按照功能划分可以分为三大类，以下哪个不属于三大类？",["祭祀性","习俗性","娱乐性","礼仪性"],"C","芦笙舞表演分为自娱性芦笙舞,习俗性芦笙舞以及表演性芦笙舞,同时还有礼仪性和祭祀性的芦笙舞",5],[905,1,"下列选项中哪些不是东巴经籍文学的代表作品？",["《创世纪》","《黑白战争》","《彩虹》","《鲁般鲁饶》"],"C","《东巴经》除记载迎神驱鬼、祈福求寿、消灾消难等内容外,还记载了大量的纳西族古典文学作品,包括神话故事、叙事长诗、谚语歌谣等。 神话中最著名的是创世史诗《创世纪》、英雄史诗《黑白战争》、悲剧长诗《鲁般鲁饶》。它们合称纳西族的三大史诗。",0],[906,1,"下列选项中，不属于欧阳询楷书代表作的是____。",["《九成宫醴泉铭》","《皇甫诞碑》","《张翰帖》","《化度寺碑》"],"C","C项《张翰帖》是唐代书法家欧阳询创作的纸本行书作品，有“天下第七行书”之称。",8],[907,1,"形声是一种造字方法。下列汉字不属于形声字的是____。",["睁","吐","咏","灰"],"D","形声字是由两个文或字复合成体，其中的一个文或字表示事物的类别而另一个表示事物的读音，因此选择D选项。",0],[908,1,"关于夸父追日的神话故事，下列描述错误的是____。",["夸父倒下后变成了一座大山","在追逐太阳的过程中，夸父即便又渴又累，也没有放弃","夸父最终追上了太阳","夸父最终死在了路上"],"C","夸父追日指的是相传在黄帝时期，夸父族首领夸父想要把太阳摘下，于是开始逐日，和太阳赛跑，在口渴时喝干了黄河、渭水之后，在奔于大泽路途中渴死。死后他的手杖化作桃林，身躯化作夸父山。",7],[909,1,"传说神农对中华民族的生存繁衍和发展做出了重要贡献。人们为了纪念这位无私爱民的首领，尊称他为____。",["舜帝","“药圣”","“五谷之神”","“五谷先帝”"],"D","B项药圣是李时珍；C项五谷之神为后稷。",4],[910,1,"下面选项中，哪些不属于立春的习俗？",["鞭春牛","游春","吃春饼","戴五彩线"],"D","D项，人民一般在端午节佩戴五色丝线以辟邪，兼有祈福纳吉的美好寓意。",5],[911,1,"清明节是我国的重要传统节日之一，下列哪些不属于清明节的节日习俗？",["扫墓","踏青","吃粽子","放风筝"],"C","C项吃粽子是端午节的习俗。",5],[912,1,"下面选项中，关于绝句《池上》（小娃撑小艇）一诗分析正确的是____。",["“池上”意思是池塘里","“浮萍”指一种水生植物","“小艇”指小船","这首诗的作者白居易是宋代诗人"],"D","D项，白居易是唐代诗人。",0],[913,1,"下列不属于寒食节节日习俗的有____。",["禁火","吃冷食","扫墓","猜灯谜"],"D","D项猜灯谜又称打灯谜，是从古代就开始流传的元宵节特色活动。",5],[914,1,"孟浩然是唐代著名的山水田园派诗人。下列选项中，属于孟浩然所写诗句的有____。",["大漠孤烟直，长河落日圆","春眠不觉晓，处处闻啼鸟","举头望明月，低头思故乡","飞流直下三千尺，疑是银河落九天"],"B","“春眠不觉晓，处处闻啼鸟” 出自孟浩然的《春晓》，B 选项正确；A 选项出自王维的《使至塞上》；C 选项出自李白的《静夜思》；D 选项出自李白的《望庐山瀑布》。",0],[915,1,"传说夸父在追赶太阳的路途上，因为口渴，喝干了哪些河流里的水？",["黄河、渭河","长江、淮河","珠江、钱塘江","黑龙江、松花江"],"A","根据《山海经》等古籍记载，夸父追日时，因极度口渴，先喝干了黄河、渭河的水，随后又去喝北方大泽的水，未到便渴死；B、C、D 选项中的河流均与夸父追日的传说无关。",7],[916,1,"下列选项中，既属于农历二十四节气，又是我国传统节日的是____。",["立春","清明节","端午节","中秋节"],"B","在二十四节气中，只有清明节同时是传统节日，兼具节气的自然属性（春分后十五日，万物清洁而明净）与节日的人文属性（祭祖、踏青）；A 选项立春是节气，但不是传统节日；C、D 选项是传统节日，但不属于二十四节气。",5],[917,1,"在我国，每个地区、每个民族都有自己的特色美食，下列选项中，哪些不属于云南地区的特色美食？",["过桥米线","竹筒饭","汽锅鸡","虾饺"],"D","D项虾饺是广东的特色美食。",12],[918,1,"六经，是六部儒学经典的统称，下列选项中不属于六经的是____。",["《诗经》","《论语》","《礼记》","《春秋》"],"B","六经，是指《诗》、《书》、《礼》、《易》、《乐》、《春秋》的合称。",2],[919,1,"尊老爱幼是我们中华民族的传统美德。下列选项中，不属于尊老爱幼的是____。",["单老孤稚有所养","老吾老以及人之老，幼吾幼以及人之幼","子不学，非所宜。幼不学，老何为","臣无祖母，无以至今日；祖母无臣，无以终余年"],"C","C项意思是：一个人倘若小时候不好好学习，到老的时候既不懂做人的道理，又无知识，那么到老的时候都很难有所作为的，与题目不符。",14],[920,1,"柳永《八声甘州》抒写了词人漂泊在外的愁思和仕途失意的悲慨。以下哪个选项不是出自这首词？",["对潇潇、暮雨洒江天","望故乡渺邈，归思难收","罗幕轻寒，燕子双飞去","叹年来踪迹，何事苦淹留"],"C","C项出自晏殊的《蝶恋花·槛菊愁烟兰泣露》。",0],[921,1,"古代通讯技术不发达，人们都用书信传递信息。下列词语中不是表示书信别称的是____。",["桃符","尺牍","尺素","鲤鱼"],"A","A项桃符是春联的别名。",0],[922,1,"豪放派是形成于宋代的词学流派之一，豪放派的代表人物有____。",["柳永","李清照","苏轼","秦观"],"C","苏轼是宋代豪放派的开创者之一，其词突破了婉约派的题材限制，风格豪迈开阔，C 选项正确；A 柳永、B 李清照、D 秦观均为婉约派词人，词风以婉转、细腻为主。",0],[923,1,"百日礼，是我国古代较为重要的礼俗之一。下列哪些关键词与“百日礼”有关？",["抓周","剃胎发","冠礼","笄礼"],"B","百日礼（又称 “百晬”）的常见习俗包括为婴儿剃胎发（寓意洁净、健康成长）、穿百家衣等，B 选项正确；A 选项 “抓周” 是婴儿周岁时的礼俗，通过抓取物品预测未来兴趣；C 选项 “冠礼” 是男子二十岁的成人礼；D 选项 “笄礼” 是女子十五岁的成人礼。",4],[924,1,"《周礼》记载的“六艺”不包括____。",["诗","礼","射","书"],"A","“六艺”分别是：礼、乐、射、御、书、数，因此排除A选项。",13],[925,1,"射箭已经成为现代奥运会的比赛项目之一，我国自古以来就有这项运动，下列哪些人物不是射箭能手？",["李广","养由基","蒙万赢","长孙晟"],"C","C项蒙万赢是相扑高手。",13],[926,1,"汉语中有很多词语是从“纺织”中发展而来的。下列选项中的词语，哪些与纺织无关？",["经纬","绸缎","推敲","绫罗"],"C","A 选项 “经纬” 原指织物的纵线（经）和横线（纬），与纺织相关；B 选项 “绸缎”、D 选项 “绫罗” 均为丝织品，属于纺织品类，与纺织相关；C 选项 “推敲” 源于唐代诗人贾岛斟酌诗句 “僧敲月下门” 还是 “僧推月下门” 的故事，指反复琢磨，与纺织无关。",10],[927,1,"作为中国古代四大发明之一，印刷术为人类文明的进步做出了重大贡献。下列哪些词语与印刷无关？",["雕版","活字","拓片","针灸"],"D","A 选项 “雕版” 是雕版印刷的核心工具，与印刷相关；B 选项 “活字” 是活字印刷的核心部件，与印刷相关；C 选项 “拓片” 是通过拓印技术获取文字 / 图案的方式，与印刷原理有相通之处；D 选项 “针灸” 是中医的治疗方法，通过针刺和艾灸调理身体，与印刷无关。",11],[928,1,"在瓷器鉴赏节目中，我们常常能听到一些专业术语，下列哪个术语与瓷器无关？",["重皮","棕眼","倒口儿","口磕"],"C","C项“倒口儿”是曲艺行业术语，意思是“说方言”。",10],[929,1,"故宫的宫殿按照使用性质分为外朝和内廷两大部分，下列宫殿位于外朝的是____。",["乾清宫","太和殿","交泰殿","坤宁宫"],"B","故宫外朝是皇帝处理政务、举行大典的场所，核心宫殿包括太和殿、中和殿、保和殿；内廷是皇帝与后妃的居住、日常活动区域，包括乾清宫（皇帝寝宫）、交泰殿、坤宁宫（皇后寝宫）等。因此 B 选项太和殿位于外朝，A、C、D 选项位于内廷。",10],[930,1,"太和殿是故宫内规模最大、最高的殿宇。主要供____大朝会和其他大典，如皇帝登基或大婚册封时使用。",["正月初一","五月初五","八月十五","九月初九"],"A","太和殿的核心用途是举行国家重大典礼，其中 “大朝会” 特指正月初一（春节）、冬至等重要节日，皇帝在此接受百官朝贺；B 选项五月初五是端午节，C 选项八月十五是中秋节，D 选项九月初九是重阳节，均无在太和殿举行大朝会的习俗。",10],[931,1,"清朝有专门供皇家使用的藏书楼即“北方四阁”,下列哪些不属于“北方四阁”？",["文渊阁","文津阁","文澜阁","文源阁"],"C","“北方四阁”分别是：北京故宫的文渊阁、沈阳故宫的文溯阁、北京圆明园的文源阁、河北承德避暑山庄的文津阁。",10],[932,1,"颐和园规模宏大，气象万千。下列选项中，哪些景点位于颐和园中？",["拙政园","佛香阁","留园","狮子林"],"B","佛香阁是颐和园的核心标志性建筑，位于万寿山山顶，B 选项正确；A 拙政园、C 留园、D 狮子林均是苏州古典园林，不属于颐和园。",10],[933,1,"华佗一生喜爱运动，他在吸取前人养生保健经验的基础上，创编了五禽戏。这“五禽”包括鸟、熊、____。",["虎、鹿、猿","虎、马、兔","龙、蛇、兔","龙、鹿、猿"],"A","五禽戏是虎、鹿、熊、猿、鸟五种动物。",9],[934,1,"中国文化又可称为____。",["华夏文化","玛雅文化","两河文化","爱琴文化"],"A","“华夏” 是中国古代的别称，“华夏文化” 即中国文化，A 选项正确；B 选项玛雅文化是美洲古代文明；C 选项两河文化是西亚底格里斯河、幼发拉底河流域的文明；D 选项爱琴文化是欧洲古希腊地区的古代文明，均与中国文化无关。",9],[935,1,"古代人们对月亮有着美好的想象，对其有很多种称呼，下列哪项不是古人对月亮的称呼？",["婵娟","玉盘","金乌","桂魄"],"C","A 选项 “婵娟”（如 “但愿人长久，千里共婵娟”）、B 选项 “玉盘”（如 “小时不识月，呼作白玉盘”）、D 选项 “桂魄”（因传说月中有桂树，故称桂魄）均是月亮的别称；C 选项 “金乌” 是古代对太阳的称呼（传说太阳中有三足金乌），不是月亮的称呼。",10],[936,1,"《四时幽赏录》主要记述西湖一年四季的不同境趣，如春时____，夏时____，秋时“西泠桥畔醉红树”，冬时“三茅山顶望雪霁”。",["“苏堤春晓赏桃花”；“曲院风荷闻暗香”","“孤山月下看梅花”；“湖心亭畔听蝉鸣”","“柳浪闻莺赏新绿”；“平湖秋月品清茗”","“六和塔上观潮涌”；“断桥残雪觅诗意”"],"B","《四时幽赏录》是明代高濂所著，其对西湖四季幽赏场景的记述贴合西湖实景与文人雅趣。选项 A 中 “苏堤春晓” 是西湖十景之一，但 “赏桃花” 并非《四时幽赏录》春时核心记述；选项 C “平湖秋月” 是秋季景观，与 “夏时” 搭配错误；选项 D “六和塔观潮” 多在中秋前后，“断桥残雪” 是冬季景观，均不符合四季对应逻辑。而 “孤山月下看梅花” 符合西湖孤山春季梅景的雅致，“湖心亭畔听蝉鸣” 贴合夏季西湖的清幽意境，与原文秋、冬景致的风格一致，故选择 B。",10],[937,1,"“中国四大名园”被公认为中国最优秀的园林建筑，它们分别是颐和园和____。",["苏州拙政园","北京圆明园","杭州西湖","南京中山陵"],"A","中国四大名园分别是拙政园、颐和园、避暑山庄、留园。",10],[938,1,"蜡染是我国古老的少数民族民间传统纺织印染手工艺，古称蜡缬，与绞缬和____并称为我国古代三大印花技艺。",["夹缬","胶浆印","植物印","织锦"],"A","到了唐代，印染工艺十分发达，著名的有蜡缬、绞缬、夹缬,这是中国古代三大印花技艺。",10],[939,1,"历史上对学生的称谓种类繁多，下列称谓哪些不是对学生的称呼？",["生员","监生","弟子","足下"],"D","D项足下常用于对平辈或是朋友之间的敬称。",4],[940,1,"以下哪个不是中国传统的祭祖节日？",["除夕","清明节","端午节","重阳节"],"C","清明节、中元节、重阳节、除夕是中国民间传统的四大祭祖大节，因此排除C选项。",5],[941,1,"历史上出现的“上品无寒门，下品无势族”、“四世三公”等现象，证明了在以古代农业自然经济为基础的宗法社会里的____。",["科举制度公平","门阀制度盛行","平民机会均等","皇权高度集中"],"B","“上品无寒门，下品无势族” 描述的是魏晋南北朝九品中正制下，官员选拔被世家大族垄断；“四世三公” 指一个家族四代人均担任三公（高级官职），体现了世家大族的特权。这两个现象均证明古代宗法社会中 “门阀制度” 盛行（门阀即世代为官的世家大族）；A 选项科举制度公平与现象相悖（科举制打破门阀垄断）；C 选项平民机会均等与 “上品无寒门” 矛盾；D 选项皇权高度集中与门阀制度无关（门阀甚至会削弱皇权）。",3],[942,1,"以下哪个不属于“岁寒三友”？",["兰花","松树","翠竹","梅花"],"A","“岁寒三友”意思是松、竹经冬不凋，梅花耐寒开放，因此有“岁寒三友”之称。",2],[943,1,"下列选项中，未体现爱国主义精神的有____。",["位卑未敢忘忧国","苟利国家生死以，岂因祸福避趋之","人生自古谁无死，留取丹心照汗青","周虽旧邦，其命维新"],"D","D项出自《诗经》，意思是周虽然是旧的邦国，但其使命在革新。",2],[944,1,"我国古代就已出现了专门为学童编写的书目。下列选项中，不属于古代启蒙教材的有____。",["《三字经》","《增广贤文》","《菜根谭》","《弟子规》"],"C","C项《菜根谭》是以处世思想为主的格言式小品文集，采用语录体，揉合了儒家的中庸思想和佛家的出世思想的人生处世哲学。",2],[945,1,"以明清以来流行的样式为例，古典家具大体上可以分为五类，分别是坐具、承具以及____。",["电器","卧具","现代沙发","塑料椅"],"B","以明清以来流行的样式为例,古典家具大体上可以分为卧具、庋具、坐具、承具、杂具五类。",10],[946,1,"下列诗句中，描写的是洞庭湖的有____。",["月落乌啼霜满天，江枫渔火对愁眠","湖光秋月两相和，潭面无风镜未磨","最爱湖东行不足，绿杨阴里白沙堤","孤帆远影碧空尽，唯见长江天际流"],"B","A项地处苏州；C项描写的是钱塘湖。D选项描写长江（黄鹤楼送别场景）",7],[947,1,"下列句子中，描写西湖风光的有____。",["雾凇沆砀，天与云与山与水，上下一白","寒雨连江夜入吴，平明送客楚山孤","一道残阳铺水中，半江瑟瑟半江红","天门中断楚江开，碧水东流至此回"],"A","B项描述王昌龄在芙蓉楼送别时的吴江夜雨，C项是诗人白居易在赴杭州任刺史的途中写的，表示出诗人自愿远离朝廷后轻松愉悦的解放情绪和个性色彩。",7],[948,1,"茶马古道是中国西南民族经济文化交流的走廊。下面对茶马古道介绍错误的是____。",["易武、倚帮都是茶马古道上的重要古镇","茶马古道始于明清","运输的最主要货物是云南大叶种晒青紧压茶","普洱是茶马古道上独具优势的货物产地和中转集散地，具有悠久的历史"],"B","B项茶马古道始于唐代。",12],[949,1,"明代围棋之风兴盛，流派纷起，以下除了哪个选项，形成了三个著名的流派？",["永嘉派","江西派","新安派","京师派"],"B","明代正德、嘉靖年间，形成了三个著名的围棋流派：以鲍一中为冠的永嘉派，以程汝亮为冠的新安派，以及以颜伦、李釜为冠的京师派，因此排除B选项。",13],[950,1,"下列人物传记不是出自《史记》的有____。",["《项羽本纪》","《张淳传》","《高祖本纪》","《吕不韦列传》"],"B","B项《张淳传》出自《明史》。",0],[951,1,"《三国演义》中出现了两次美人计，涉及的两位美人分别是貂蝉和____。",["孙尚香","小乔","蔡琰","王昭君"],"A","《三国演义》中有两个著名的美人计，第一个是貂蝉离间吕布与董卓，另一个则是孙权把妹妹孙尚香嫁给刘备，预想骗其到东吴作人质。",1],[952,1,"戏曲演员要具备的四项基本功，俗称“四功”，不包括____。",["唱","说","念","做"],"B","“四功”是唱、念、做、打，因此排除B选项。“唱”指歌唱，是戏曲表演中的核心内容；“念”指具有音乐性的念白；“做”指舞蹈化的形体动作，即戏曲演员在戏曲表演过程中做工的基本功夫；“打”指武打和翻跌的技艺，即戏曲表演艺术中武戏中的武打功夫。",9],[953,1,"一般来说，评书的艺术手法有四种，其中包括摆砌末和____。",["开脸儿","开肩","压嗓子","扯段儿"],"A","评书的艺术手法有四种,分别为:开脸儿、摆砌末、赋赞以及垛句。",9],[954,1,"下列选项中不属于京韵大鼓代表作品的有____。",["探晴雯》","《关公战秦琼》","《长坂坡》","《大西厢》"],"B","B项《关公战秦琼》是相声艺术的经典作品。",9],[955,1,"下列不属于韩愈在文学上的主张有____。",["“致君尧舜上，再使风俗淳”","“文道合一”","“务去陈言”","“文从字顺”"],"A","A项“致君尧舜上，再使风俗淳”，出自唐代杜甫《奉赠韦左丞丈二十二韵》诗。",0],[956,1,"每逢春节，大街小巷就会挂上红色的中国结，以营造喜庆的节日氛围。下列不属于中国结特点的有____。",["上下一致","左右对称","首尾互衔","正反不同"],"D","中国结讲究上下一致，左右对称，正反相同，首尾可接，因此排除D选项。",5],[957,1,"下列不属于相声演员四大基本功的是____。",["说","逗","唱","捧"],"D","相声的四大基本功是说、学、逗、唱。",9],[958,1,"下列有关戏曲角色行当的说法错误的有____。",["花旦主要扮演天真活泼或性格泼辣的青年女性，常带有喜剧色彩","武旦主要扮演勇武的女性，多是擅长武艺的巾帼英雄","武丑包括方巾丑、褶子丑、茶衣丑等","彩旦主要扮演滑稽或奸刁的女性，又称“丑旦”"],"C","C项方巾丑、褶子丑、茶衣丑属于文丑。",9],[959,1,"下列关于鲁班的说法中错误的是____。",["鲁班姓鲁，名公输","传说锯子为鲁班所发明","“班门弄斧”的成语故事与鲁班有关","《墨子》中记载了鲁班造云梯的故事"],"A","A项鲁班姓公输，名般，或称“公输子”“班输”等。因他是春秋时期鲁国人，又被称为“鲁班”。",2],[960,1,"我国古代神医扁鹊医术出神入化，下列有关扁鹊的描述中错误的有____。",["“病入膏肓”的故事与扁鹊有关","他在总结前人经验的基础上，结合自己的行医实践，创制了“四诊法”","他被誉为“中医学的奠基人”","他是春秋时期的医学家，姓秦，名越人"],"D","D项扁鹊是战国
