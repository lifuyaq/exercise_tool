<title>中华知识竞赛刷题本</title>
<style>
:root{
  --paper:#F2F4F1; --card:#FFFFFF; --ink:#1E2A2B; --muted:#66706F; --line:#D5DBD6; --soft:#E7ECE8;
  --qing:#2F5D73; --qing-soft:#DCE8EE; --lv:#2F7A63; --lv-soft:#DDEFE7; --yan:#A8344A; --yan-soft:#F5DFE3;
  --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","Noto Serif CJK SC",serif;
  --sans:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#131A1B; --card:#1B2425; --ink:#E3E9E6; --muted:#97A3A0; --line:#2E3A3B; --soft:#232E2F;
    --qing:#86B6CB; --qing-soft:#203640; --lv:#7CC5AA; --lv-soft:#1C3A30; --yan:#E58395; --yan-soft:#43242B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#131A1B; --card:#1B2425; --ink:#E3E9E6; --muted:#97A3A0; --line:#2E3A3B; --soft:#232E2F;
  --qing:#86B6CB; --qing-soft:#203640; --lv:#7CC5AA; --lv-soft:#1C3A30; --yan:#E58395; --yan-soft:#43242B;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--qing);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:16px 20px 120px}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:18px 0 8px}
header.top h1{font-family:var(--serif);font-size:22px;font-weight:700;margin:0;letter-spacing:.04em}
header.top .sub{color:var(--muted);font-size:14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:860px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{padding:10px 4px 12px;font-size:14px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px}
nav.tabs button b{font-family:var(--serif);font-size:20px;font-weight:700;line-height:1.2}
nav.tabs button[aria-current="page"]{color:var(--qing)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:14px 0}
.panel h2{font-size:17px;margin:0 0 12px;font-weight:600}
.panel h3{font-size:15px;margin:16px 0 8px;font-weight:600;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:15px;background:var(--card);min-height:40px}
.chip[aria-pressed="true"]{background:var(--qing);border-color:var(--qing);color:var(--card)}
.chip small{opacity:.7;margin-left:4px}
.btn{border-radius:10px;padding:10px 18px;min-height:46px;font-size:16px;font-weight:600;background:var(--soft);border:1px solid var(--line)}
.btn.primary{background:var(--qing);border-color:var(--qing);color:var(--card)}
.btn.ghost{background:transparent}
.btn.small{min-height:38px;padding:6px 12px;font-size:14px;font-weight:500}
.btn:disabled{opacity:.4;cursor:default}
input.num,input.txt,select,textarea{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 12px;min-height:44px;font-size:16px}
input.num{width:96px}
textarea{width:100%;min-height:80px;resize:vertical}
.muted{color:var(--muted)}
.hint{color:var(--muted);font-size:14px;margin:6px 0 0}
.banner{background:var(--yan-soft);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:14px;margin:10px 0}

/* question */
.qhead{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--muted);font-size:14px;margin:6px 0 4px}
.qhead .tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{font-size:13px;border-radius:6px;padding:2px 8px;background:var(--soft);color:var(--muted)}
.tag.type{background:var(--qing-soft);color:var(--qing)}
.qbody{display:grid;grid-template-columns:auto 1fr;gap:4px 18px;align-items:start;margin-top:8px}
.qno{font-family:var(--serif);font-size:44px;line-height:1;color:var(--qing);font-weight:700;min-width:2.2em;text-align:right;padding-top:4px;font-variant-numeric:tabular-nums}
.qtext{font-family:var(--serif);font-size:22px;line-height:1.75;margin:0}
.blank{display:inline-block;min-width:3em;border-bottom:2px solid var(--ink);margin:0 4px;transform:translateY(-4px)}
.opts{display:grid;gap:10px;margin:22px 0 0}
.opt{display:flex;align-items:flex-start;gap:14px;text-align:left;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:13px 16px;min-height:56px;font-size:18px;line-height:1.55}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:15px;margin-top:-1px}
.opt.sel{border-color:var(--qing);background:var(--qing-soft)}
.opt.sel .k{background:var(--qing);border-color:var(--qing);color:var(--card)}
.opt.ok{border-color:var(--lv);background:var(--lv-soft)}
.opt.ok .k{background:var(--lv);border-color:var(--lv);color:var(--card)}
.opt.bad{border-color:var(--yan);background:var(--yan-soft)}
.opt.bad .k{background:var(--yan);border-color:var(--yan);color:var(--card)}
.opt.miss{border-color:var(--lv);border-style:dashed}
.opt:disabled{cursor:default;color:var(--ink)}
.tf{grid-template-columns:1fr 1fr}
.tf .opt{justify-content:center;font-family:var(--serif);font-size:22px;font-weight:700;min-height:72px;align-items:center}
.fill{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.fill input{flex:1 1 240px;font-size:20px;font-family:var(--serif);min-height:54px}
.fill input.ok{border-color:var(--lv);background:var(--lv-soft)}
.fill input.bad{border-color:var(--yan);background:var(--yan-soft)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.verdict{margin-top:22px;border-left:4px solid var(--lv);padding:4px 0 4px 16px}
.verdict.bad{border-color:var(--yan)}
.verdict .v{font-weight:700;font-size:18px}
.verdict.good .v{color:var(--lv)}
.verdict.bad .v{color:var(--yan)}
.verdict .exp{font-family:var(--serif);font-size:17px;line-height:1.8;margin:8px 0 0;white-space:pre-wrap}
.verdict .note-ok{font-size:14px;color:var(--lv);margin-top:6px}
.navbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:26px;padding-top:16px;border-top:1px solid var(--line)}
.prog{height:4px;background:var(--soft);border-radius:2px;overflow:hidden;margin:4px 0 0}
.prog i{display:block;height:100%;background:var(--qing)}
.extra{margin-top:18px;display:grid;gap:10px}
.tagedit{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tagedit .chip{min-height:34px;padding:4px 12px;font-size:14px}
.tagedit input{min-height:36px;padding:4px 10px;width:140px;font-size:14px}
.star{font-size:22px;color:var(--muted);min-width:44px;min-height:44px}
.star[aria-pressed="true"]{color:#C9962B}

/* check list */
.clist{display:grid;gap:0;margin-top:6px}
.citem{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}
.citem .n{font-family:var(--serif);font-weight:700;color:var(--qing);text-align:right;font-variant-numeric:tabular-nums}
.citem .t{font-size:15px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.citem .a{font-size:14px;color:var(--lv);font-weight:600;margin-top:2px}
.mk{display:flex;gap:6px}
.mk button{width:48px;height:44px;border-radius:10px;border:1.5px solid var(--line);font-size:18px;font-weight:700;color:var(--muted)}
.mk button.y[aria-pressed="true"]{background:var(--lv);border-color:var(--lv);color:var(--card)}
.mk button.x[aria-pressed="true"]{background:var(--yan);border-color:var(--yan);color:var(--card)}
.citem.wrong{background:var(--yan-soft)}

/* wrong book */
.group{margin:18px 0 6px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.group h3{margin:0;font-family:var(--serif);font-size:19px;color:var(--ink)}
.witem{border-bottom:1px solid var(--line)}
.witem > button{display:grid;grid-template-columns:52px 1fr auto;gap:12px;width:100%;text-align:left;padding:12px 4px;align-items:center}
.witem .n{font-family:var(--serif);font-weight:700;color:var(--qing);text-align:right}
.witem .t{font-size:15px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.witem .c{font-size:13px;color:var(--yan);white-space:nowrap}
.wdetail{padding:4px 4px 18px 68px}
.wdetail .qtext{font-size:19px}
.wdetail .opts{margin-top:12px;gap:6px}
.wdetail .opt{min-height:0;padding:8px 12px;font-size:16px}

/* stats */
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.big div{padding:4px 0}
.big strong{display:block;font-family:var(--serif);font-size:34px;line-height:1.2;font-variant-numeric:tabular-nums}
.big span{color:var(--muted);font-size:14px}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:7em 1fr 6.5em;gap:10px;align-items:center;font-size:15px}
.bar .track{height:12px;background:var(--soft);border-radius:6px;overflow:hidden}
.bar .track i{display:block;height:100%;border-radius:6px;background:var(--qing)}
.bar .track i.low{background:var(--yan)}
.bar .val{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.days{display:grid;grid-template-columns:repeat(14,1fr);gap:6px;align-items:end;height:140px;margin-top:8px}
.days div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--muted)}
.days i{display:block;width:100%;max-width:28px;border-radius:4px 4px 0 0;background:var(--qing);min-height:2px}
.days .ac{font-size:11px;color:var(--ink);margin-bottom:2px;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:15px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
@media (max-width:600px){
  .wrap{padding:10px 14px 110px}
  .qno{font-size:30px;min-width:0}
  .qbody{grid-template-columns:1fr}
  .qtext{font-size:20px}
  .wdetail{padding-left:4px}
  .bar{grid-template-columns:5.5em 1fr 5.5em}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

<script type="application/json" id="qdata">{"cats":["文学作品","历史人物事件","思想经典","官制科举","称谓礼仪","节日民俗","天文历法","地理名胜","书法绘画","音乐戏曲","建筑器物","科技医药","饮食服饰","体育游艺","其他"],"q":[[1,0,"“山不在高，有仙则名。水不在深，有龙则灵”出自《陋室铭》，这篇文章的作者有“诗佛”之称。",[],"错误","《陋室铭》的作者是刘禹锡，有“诗佛”之称的是王维。",0],[2,0,"白朴的《天净沙·秋思》属于羁旅之作，既“深得唐人绝句妙景”，又兼具宋词清隽疏朗之自然，被尊为“秋思之祖”。",[],"错误","《天净沙·秋思》的作者是马致远。",1],[3,0,"“近取诸身，远取诸物”是老祖宗最初的造字方式；“画成其物，随体诘诎”是书法最初的表现形式。",[],"正确","“近取诸身，远取诸物”阐述的是老祖宗最初的造字方式。“画成其物，随体诘诎”原句是“象形者，画成其物，随体诘诎，日月是也。”出自《说文解字》，意思是所谓的象形字说的是把具体的物体以绘画的形式表现出来，形成文字，根据物体的不同绘画形式也不同，比如日和月就是象形字。结合《说文解字叙》可知这里说的是书法最初的表现形式。",8],[4,0,"古代帝王把帝位让给贤能的人称为禅让，是原始社会末期部落首领的选举制度。",[],"正确","禅让是指统治者把部落首领之位让给有才华，有能力的人，让更贤能的人统治国家。尧是黄帝以后比较著名部落联盟首领，尧去世后，尧把部落联盟首领位置让于舜，推舜为帝。这种让位，历史上称为“禅让”。",1],[5,0,"三省六部：三省为中书省、门下省、尚书省。三省的长官都是宰相。六部：吏部、户部、礼部、兵部、刑部、工部。各部长官称尚书。六部制从隋唐开始实行，一直延续到清末。",[],"正确","隋唐时，三省同为最高政务机构，一般中书省管决策，门下省管审议，尚书省管执行。中书省长官称中书令，门下省长官称侍中，尚书省长官称尚书令。尚书省下辖六部，吏部(管官吏的任免与考核等)、户部(管土地户口、赋税、财政等)、礼部(管典礼、科举、学校等)、兵部(管军事)、刑部(管司法刑狱)、工部(管工程营造、屯田水利等)，各部副职称侍郎。",3],[6,0,"礼部为六部之一，掌管礼仪、祭祀、土地、户籍等职事，部长官称为礼部尚书。",[],"错误","“礼部”，在明代有尚书一人，左、右侍郎各一人，下设四司，分别为：仪制清吏司，掌嘉礼、军礼及管理学务、科举考试事；祠祭清吏司，掌吉礼、凶礼事务；主客清吏司，掌宾礼及接待外宾事务；精膳清吏司，掌筵飨等事务。",3],[7,0,"兵部是古代“六部”之一，掌管全国武官选用和兵籍、军械、军令等事宜。",[],"正确","兵部为中国古代官署名，六部之一，相当于今日的国防部。其长官为兵部尚书。兵部又称夏官、武部。掌管武官选用及兵籍、兵械、军令等。",3],[8,0,"“举孝廉”是古代一种自下而上的选官制度，即中央和地方一定级别的官吏根据考察情况，将未有官职的士人推荐给中央政府。",[],"正确","举孝廉是汉朝的一种由下向上推选人才为官的制度，孝廉是察举制的主要科目之一。被举人的资历，大多为州郡属吏或通晓经书的儒生",3],[9,0,"“征辟”是古代一种自下而上的选官制度。被征辟者经过试用，确有能力，就正式授予官职。",[],"错误","“征辟”是自上而下的选官制度。一般由皇帝派人去聘任特别有名望的人叫作征召，三公以下召举布衣入仕叫作辟除，合称为“征辟”，为汉代选用官吏的一种制度。皇帝征召的士人，多授予博士或待诏的称号，公府辟除的士人一般通称掾吏。",3],[10,0,"“终养”又称“归养”，是指因亲人年老或病重而辞官侍奉。",[],"正确","奉养父母，以终其天年。多指辞官归家以终养年老亲人。",3],[11,0,"古代官吏告老退休称“致仕”，也称“休致”。官员年老有病，由本人提出申请，获准后致仕，国家据其职位，给予一定的赏赐。",[],"正确","古代官吏的退休制，形成于春秋时期，汉代承先秦，并进一步完备。汉代丞相以下皆须致仕，称“归老”“乞骸骨”。自魏晋以后，历代相沿。",3],[12,0,"“告老”本指古代社会官员因年老辞去职务，有时也是官员因故辞职的一种借口。",[],"正确","指封建时代臣子或官员因年老辞去职务，后泛指年老退休。语出《左传·襄公七年》：“冬十月，晋韩献子告老。”",3],[13,0,"移疾指官员上书称病，实际是官员受到权臣诋毁，不得不请求退职的委婉说法。",[],"错误","移疾，指官员上书称病，多为居官者求退的委婉语。",3],[14,0,"皇帝指定的皇位继承人称为“皇太子”。一般为皇帝的嫡长子，但也有例外，由皇帝选定册立。",[],"正确","商周时期天子及诸侯的嫡长子，称太子或世子。自汉朝开始，只有法定继承人(即皇帝的嫡长子)，才能称太子或皇太子，而诸侯王或藩王的正式继承人只能称“世子”。封建社会的太子，其地位仅次于皇帝，并拥有类似于朝廷的东宫。",1],[15,0,"太子指封建时代君主儿子中被确定继承君位的人，有时也可指其他儿子。",[],"错误","太子指封建时代君主儿子中被确定继承君位的人。其他儿子不能称太子。",1],[16,0,"嗣位指继承君位，我囯封建王朝通常实行长子继承制，君位由最年长的儿子继承。",[],"错误","我囯封建王朝通常实行嫡长子继承制，嫡长子是嫡妻(正妻)所生的长子。",1],[17,0,"中国古代朝廷中最尊显的三个官职的名称为“三公”。但朝代不同、时期不同，三公之官名称不同，职掌也不同。",[],"正确","三公，始于周朝，或以司徒、司马、司空为三公，或以太师、太傅、太保为三公。秦汉称丞相、太尉、御史大夫。唐宋沿用此称。明清以太师、太傅、太保为三公，但已无实际职权，只用作大臣的最高荣誉。",3],[18,0,"秦代三公即丞相、太尉和御史大夫。丞相位最高，尊称为相国，通称为宰相，秉承皇帝旨意辅佐朝政；太尉掌管全国军事；御史大夫负责监察并帮助丞相处理事务。",[],"正确","丞相，最高行政长官，辅助皇帝处理政务，同时负责对文武百官的管理。太尉，最高军政长官，负责管理全国军事事务。御史大夫，负责监察百官，也是副丞相。",3],[19,0,"尚书，始置于战国，历代相沿，是执掌文书的官员，因尚书在皇帝左右办事，掌管文书奏章，地位很重要。",[],"正确","尚书，是中国封建时代的政府高官名称。在清朝，六部和理藩院等部门的主官称为尚书。",3],[20,0,"我国战国时期中央就设有监察官，称为御史，一直沿袭至清代。主要职责是对百官进行纠察弹劾。",[],"正确","西汉时建立了独立的监察机构——御史府，后改称御史台。历代御史台的长官称御史大夫或御史中丞等。明代把御史台改为都察院，长官为左右都御史，清代沿袭。",3],[21,0,"古代朝廷中分职设官，各有专司，所以可用“有司”来指称朝廷中的各级官员。",[],"错误","“有司”意为“有具体职务、做具体工作的官吏”或“泛指官吏”。不能用来指称朝廷中的各级官员。",3],[22,0,"唐代县以上的行政单位称州或郡，长官是刺史或太守。首都或陪都所在地的州叫府，长官叫尹或少尹。唐初中央派官员出巡各州，监察地方行政，称为黜陟使，有权罢免或提升地方官吏。职权和汉代的州刺史相似。",[],"正确","唐代县以上的行政单位称州或郡，长官是刺史或太守。首都或陪都所在地的州叫府，长官叫尹或少尹。唐初中央派官员出巡各州，监察地方行政，称为黜陟使，有权罢免或提升地方官吏。职权和汉代的州刺史相似。",3],[23,0,"提辖，主管军队武装、训练、督捕盗贼、维护地方治安等。宋代州郡多设提辖兵马一官。",[],"正确","宋代州郡多设置提辖，或由守臣兼任，专管统辖军队，训练教阅、督捕盗贼",7],[24,0,"“征、辟、任、除、拜、授、迁”都是指任用官员，用法相同。",[],"错误","“征”是皇帝特聘；“辟”是官府或高官聘用；“任”又称“保”，指高官保任其子弟为官；“除”有“除旧官，任新官”之意，就是改任；“拜”“授”是正常授官，有时是平级调任，有时是升职；“迁”指官职晋升或调动。",3],[25,0,"古代任官，还有摄官、兼官、加官、试守的制度。“摄”是代行职守；“兼”指兼职，以低职兼高职为“行”，以高职兼低职为“领”或“平”。",[],"错误","汉代以低职兼高职为“行”，以高职兼低职为“领”；而到了唐宋，以低职兼高职为“守”，以高职兼低职为“行”。",3],[26,0,"封邑是指古代君主把自己国土的某一块地方作为奖励赐给功臣，如淮阴侯韩信所在的淮阴就是刘邦赐给他的封邑。",[],"错误","封邑是把国土中某一块地方的财政收入或者赋税奖励给某人，不是把国土奖励给他。",1],[27,0,"三省六部制里，主管工程营造、屯田水利的是户部。",[],"错误","是工部。",3],[28,0,"在唐代，官员官服的颜色因官位的高低而有所不同，高级官员一般是紫色或红色，有“大紫大红”“红得发紫”等说法，官阶低的一般是青色或黑色，从《琵琶行》“司马青衫”可以看出，李白当时的官阶比较低。",[],"错误","“司马青衫”指的是白居易，不是李白。",3],[29,0,"“出”在古代一般是指地方的官员到朝廷担任要职，如《琵琶行》中有“予出官二年”。",[],"错误","是指京官到地方就任。",3],[30,0,"古人幼时命名，成年取字，字和名有意义上的联系。字是为了便于他人称谓，对平辈或尊辈称字出于礼貌和尊敬。",[],"正确","有三种情况直称姓名：自称；用于介绍或作传；称所厌恶、所轻视的人。",4],[31,0,"以字行，是指在古代社会生活中，某人的字得以通行使用，他的名反而不常用。",[],"正确","汉字文化圈中，中国、朝鲜半岛、越南等地之古人，一般有“名”也有“字”。“以字行”即是因为种种原因，世人多仅称呼此人的“字”，而不熟悉其“名”。例如明朝著名内阁首辅，阁臣杨士奇，名寓，字士奇，但世人通常仅知其字，所以称之为“以字行”。反之，如李白，名白，字太白，因名、字都为世人所熟悉，就不能说是“以字行”。",1],[32,0,"古代男子有名有字，名是出生后不久父亲起的，字是二十岁举行冠礼后才起的。",[],"正确","人的称号。古人不仅有“名”，而且有“字”。婴儿出生三个月后由父亲命“名”。古时汉族男子二十岁时举行成人礼冠礼，并取“字”；女子十五岁许嫁,举行笄礼，并取“字”。",4],[33,0,"古代王侯将相、高级官吏、著名文士死后会被追加的称号叫“谥号”。",[],"正确","谥号是指社会地位相对较高人物死之后，后人按其生平事迹进行评定后给予或褒或贬评价的文字，始于西周，曾广泛通行于汉字文化圈",4],[34,0,"“郡望”表示某一地域范围内的名门大族。如韩愈虽是河内河阳人，但因昌黎韩氏为唐代望族，故韩愈常以“昌黎韩愈”自称。",[],"正确","“郡望”一词，是“郡”与“望”的合称。“郡”是行政区划，“望”是名门望族，“郡望”连用，即表示某一地域或范围内的名门大族。古称郡中为众人所仰望的贵显家族。",0],[35,0,"古人称自己一方的亲属朋友时，常用“家”“舍”等谦辞。如“家父”，又作“家严”“家君”；“家母”，又作“家慈”；舍弟、舍妹、舍侄。",[],"正确","比如[北齐]颜之推《颜氏家训·风操》：“陈思王 称其父为家父，母为家母。”",4],[36,0,"古人称对方时，表示尊敬客气的态度，常用“令”“尊”“贤”等敬辞。其中“令”用以称呼对方的亲属，如令尊、令堂、令兄、令郎、令爱等；“尊”用来称与对方有关的人或物，如“尊上”(称对方的父母)、“尊意”(对方的意思)；“贤”，用于尊称平辈或晚辈，如“贤郎”(对方的儿子)、“贤弟”等。",[],"正确","比如《三国演义》第三回：“肃与贤弟少得相见，令尊却常会来。”",4],[37,0,"古人的年龄有时不用数字表示，不直接说出某人多少岁，而是用一种与年龄有关的称谓来代替，如“豆蔻”指十三四岁的男子。",[],"错误","“豆蔻”指十三四岁的少女。",4],[38,0,"垂髫：借指三岁到九岁的儿童。总角：八岁到十四岁的少年。",[],"正确","古人的年龄有时不用数字表示，不直接说出某人多少岁，而是用一种与年龄有关的称谓来代替。",4],[39,0,"古人对死的称谓等级森严，天子、帝后之死曰崩，诸侯、太子之死曰薨，大夫之死曰卒，庶人之死曰不禄。",[],"错误","士的死曰不禄，庶人之死曰死。",4],[40,0,"“幸”通常指封建帝王到达某地，也叫巡幸。“召幸”特指皇帝对妃嫔的召见、宠幸。",[],"正确","出自《汉书．卷二十五．郊祀志上》：「上始巡幸郡县，寖寻于泰山矣！」。",1],[41,0,"冠族是指当地最有钱、最有势力，人口最多的豪门世族。",[],"错误","冠族是指名门望族。",12],[42,0,"古人成年取字，名和字使用有别，名供晚辈呼唤，字供长辈或平辈呼唤。",[],"错误","名供长辈呼唤，字供晚辈或平辈呼唤。",4],[43,0,"古人的称谓有谦敬之分，对别人称自己的父亲时用“令尊”，称呼对方的父亲用“家父”。",[],"错误","对别人称自己的父亲时用“家父”，称呼对方的父亲用“令尊家父”。",4],[44,0,"朕是古人的自称，本来没有贵贱之分，自秦始皇开始专用为皇帝的自称。",[],"正确","朕最早见于商代甲骨文  。《说文》：“朕，我也，阙。”段玉裁注分析朕字之构形之义是：朕，从舟，灷声，本义是舟的裂缝；还有预兆，迹象，秦始皇二十六年起定为帝王自称之词，我等义。",4],[45,0,"古人对于父母的死有委婉的称谓，父亲去世曰“内艰”，母亲去世曰“外艰”。",[],"错误","父亲去世曰“外艰”，母亲去世曰“内艰”。",4],[46,0,"对于皇帝的称谓，在古代不同时期有不同的称法，有称庙号的，如“汉武帝”，有称年号的，如“唐太宗”，有称谥号的，如“康熙”。",[],"错误","汉武帝是谥号，唐太宗是庙号，康熙是年号。",4],[47,0,"古人幼时命名，成年取字。字是为了便于他人称谓，对平辈或者尊辈一般称字，如“苏东坡”。",[],"错误","苏轼，字子瞻，号东坡居士，东坡算号。",4],[48,0,"普通人称自己已故的父亲为“先考”；已故的母亲称为“妣”、“先妣”；已故父母就合称“考妣”，如成语“如丧考妣”。",[],"正确","如丧考妣， 好像死了父母那样悲痛。形容非常伤心和着急，今多为贬义。出自《尚书·舜典》。",0],[49,0,"古代对已婚妇女的称呼因身份不同而有别，“天子之妃曰后，诸侯曰夫人，大夫曰孺人，士曰妇人，庶人曰妻。”",[],"正确","天子的配偶叫后，诸侯的配偶叫夫人，大夫的配偶叫孺人，士的配偶叫妇人，庶人的配偶叫妻。",14],[50,0,"谥号，专指有功之臣死后，朝廷赐予的寓含善意评价或表扬性质的称号。",[],"错误","不一定是功臣，也不一定是善意的评价。",3],[51,0,"谥号专指皇帝死后依其生前事迹所给予的带有评价性质的称号。如文帝、武帝等属于褒谥，厉帝、炀帝属于恶谥。",[],"错误","谥号不一定是皇帝专用，大臣也有。",1],[52,0,"在古代宗法社会中，嫡长子指旧时嫡妻所生的长子，因其地位最高，又称“宗子”，有继承父亲地位和财产的权利。",[],"正确","嫡长子是指古代宗法制正妻所生的第一个儿子。",14],[53,0,"“封禅”指在都城的城郊祭天、祭地的盛典。历代好大喜功的帝王都给予特别的重视。",[],"错误","“封禅”专指在泰山的天地祭祀。《史记·封禅书》：“此泰山上筑土为坛以祭天，报天之功，故曰封。此泰山下小山上除地，报地之功，故曰禅。”",7],[54,0,"古代的宗庙制是天子七庙，诸侯五庙，大夫三庙，士一庙，庶人不准设庙。",[],"正确","宗庙制度，简称庙制。是指儒家为已故祖先建立灵魂依归之所设立的次序和祭祀制度。庙制规定，天子立七庙，诸侯立五庙，大夫立三庙，士立一庙，庶人无庙，以此区分亲疏贵贱",2],[55,0,"古代帝王临朝的典礼仪式称“朝仪”，是体现一代帝王之尊及典制完备的重要标志，具有强烈的政治色彩。",[],"正确","各朝对朝仪都有严格的规定和等级区别。一般规定：天子面向南，三公面向北以东为上。朝仪之位已定，天子和臣子行揖礼，礼毕退朝，后世泛称人臣朝君之礼仪为“朝仪”。",1],[56,0,"古代诸侯会定期朝见天子叫“朝聘”。每年派大夫朝见称为“小聘”；每隔三年派卿朝见为“大聘”；每隔五年亲自朝见为“朝”。",[],"正确","古代诸侯亲自或派使臣按期朝见天子的礼仪。春秋时期，政在霸主，诸侯朝见霸主，亦称朝聘。",1],[57,0,"揖让，一指古代宾主相见的礼节。按尊卑分为三种，称为三揖：一为土揖，专用于没有婚姻关系的异姓，行礼时推手微向下；二为时揖，专用于有婚姻关系的异姓，行礼时推手平而置于前；三为天揖，专用于同姓宾客，行礼时推手微向上。一指禅让，即让位于比自己更贤能的人。",[],"正确","长揖，不分尊卑的相见礼，拱手高举，自上而下；拱，一种相见礼，两手在胸前相合表示敬意。",4],[58,0,"祖道，出行者祭祀路神和设宴送行的礼仪。“至易水上，既祖，取道”(《荆轲刺秦王》)中的“祖”就是“祖道”，引申为饯行和送别。",[],"正确","祖道指古代为出行者祭祀路神和设宴送行的礼仪。",4],[59,0,"虚左，古代座次以左为尊，空着左边的位置以待宾客。",[],"正确","古时一般以右为尊，但是在车上例外以左为尊。空着左边的位置。古代以左为尊，虚左表示对宾客的尊敬。",14],[60,0,"孝，指对父母要孝顺、服从；悌，指对兄长要敬重、顺从。孔子非常重视孝悌，把孝悌作为实行“仁”的根本，提出“三年无改于父道”“父母在，不远游”等一系列孝悌主张。",[],"正确","孝悌简言之：孝敬父母、尊重爱护兄弟姐妹。",2],[61,0,"古人在祭祀前沐浴、更衣、独居，以示虔诚。这些活动叫“斋戒”。斋戒时要求“五思”(思其居处、笑语、志意、所乐、所嗜)，主要是为了使思想集中、统一。",[],"正确","《史记·秦始皇本纪》：“齐人徐巿等上书，言海中有三神山，名曰蓬莱、方丈、瀛洲，仙人居之。请得斋戒，与童男女求之。”",1],[62,0,"纨绔子弟代指富贵人家的子弟。因为纨是一种细而有光泽的绢帛；绔是套裤，是套在最外面御寒的。穷人一般穿不起绔，而富贵人家子弟不仅穿纨，还讲究“纨绔”。",[],"正确","旧时指官僚、地主等有钱有势人家成天吃喝玩乐、不务正业的子弟。",3],[63,0,"古人称已嫁出的女子回娘家省父母为“归宁”，也指男子归省父母。",[],"正确","归宁又可称为做客、返外家。流行于南北广大地区。指已嫁女子，回娘家归问父母之行动。起源很早，《诗经》已有“归事父母”之记载。",2],[64,0,"牺牲：古代祭祀用的牲畜，色纯为“牺”，如牛羊猪；色杂为“牲”，如鸡鸭鹅。",[],"错误","体全为“牲”。",14],[65,0,"古代帝王祭祀时，牛羊豕三牲全备为“太牢”，只有羊豕没有牛为“少牢”。",[],"正确","出自《管子·事语》：“俎豆之礼不致牲，诸侯太牢，大夫少牢，不若此，则六畜不育。",1],[66,0,"顿首，古代的一种见面礼，行礼时点点头以示问候。",[],"错误","顿首，俗称叩头，行礼时，头碰地即起。通常用于下对上及平辈之间的敬礼。",14],[67,0,"稽首，古代的拜礼，行礼时头碰地须停留一段时间，新婚夫妇拜天地父母常用此大礼。",[],"正确","中国传统礼仪的稽首动作和佛教的叩头动作是不一样的，手的动作是不一样的，当然它所代表的意义也是不一样的。佛教的叩头动作手心是向上的，意为承接佛法。",4],[68,0,"古代男子二十岁成年，行加冠礼并取字取号，故男子二十岁称为“弱冠”，如苏轼字子瞻，号东坡居士。",[],"错误","男子二十岁成年只取字，不取号。",4],[69,0,"斋戒，古人祭祀或做重大事情前，为表虔诚，往往要沐浴更衣并忌荤，不喝酒，不吃肉。",[],"错误","斋戒时并非不吃肉，而是忌食有辛辣有臭气的食物，如葱蒜、芥末等。",12],[70,0,"嗣位是指继承君位，我国封建王朝奉行长子继承制，君位只能由最年长的儿子继承。",[],"错误","这个说法太过于绝对，一般是嫡长子继承，但到了清代康熙之后，这一传统被打破。",1],[71,0,"春节，我国传统习俗中最隆重的节日，又称元日、新春、新正等。春节习俗是庆贺过去的一年，祈祝新年快乐、五谷丰登、人畜兴旺，多与农事有关。迎龙舞龙为取悦龙神保佑，风调雨顺；舞狮源于震慑糟蹋庄稼、残害人畜之怪兽的传说。燃鞭炮、贴春联、挂年画、拜年贺喜等习俗至今仍广为流行。",[],"正确","古时候，人们把谷物的成长周期称为“年”。民间一般从上年的腊月初八或腊月二十三开始，一直到来年的正月十五都称为“春节”。",5],[72,0,"元宵节，古称上元节、灯节。源于“火把节”，汉代民众在乡间田野持火把驱赶虫兽，希望减轻虫害，祈祷好的收成。吃元宵是我国由来已久的习俗。元宵节的习俗还有赏花灯、猜灯谜、舞龙灯、迎紫姑、走百病等。",[],"正确","元宵节，又称上元节、小正月、元夕或灯节，时间为每年农历正月十五。",5],[73,0,"端午节，又称端阳、重午、重五。端午原是月初午日的仪式，因“五”与“午”同音，农历五月初五遂成端午节。一般认为，该节与纪念屈原有关。习俗有喝雄黄酒、挂香袋、吃粽子、插花和菖蒲、斗百草、驱“五毒”等。",[],"正确","端午节，又称端阳节、龙舟节、重五节、天中节等，是集拜神祭祖、祈福辟邪、欢庆娱乐和饮食为一体的民俗大节。",5],[74,0,"七夕节，又称乞巧节。每年七月初七晚上，妇女们趁织女与牛郎团圆之际，摆设香案，穿针引线，向她乞求织布、绣花的技巧。在葡萄架下，静听牛郎织女的谈话。",[],"正确","七夕节由星宿崇拜演化而来，为传统意义上的七姐诞，因拜祭“七姐”活动在七月七晩上举行，故名“七夕”。",5],[75,0,"中秋节，又称团圆节。农历八月在秋季之中，八月十五又在八月之中，故称中秋。秋高气爽，明月当空，故有赏月与祭月之俗。圆月带来的团圆的联想，使中秋节更加深入人心。中秋节的主要习俗有赏月、祭月、观潮、吃月饼等。",[],"正确","中秋节，又称祭月节、月光诞、月夕、秋节、仲秋节、拜月节、月娘节、月亮节、团圆节等，是中国民间传统节日。",5],[76,0,"重阳节，《易经》将“九”定为阳数，两九相重，故农历九月初九为“重阳”。重阳时节，秋高气爽，风清月洁，故有登高望远、赏菊赋诗、喝菊花酒、插茱萸等习俗。",[],"正确","重阳节，是中国民间传统节日，节期在每年农历九月初九日。",5],[77,0,"除夕，农历十二月三十，因此也叫“年三十”，那一天人们往往通宵不眠，有除旧迎新的意思。",[],"错误","除夕是农历一年最后一天的晚上，不一定是十二月三十，有时是十二月廿九。",5],[78,0,"古人用干支纪年、纪月、纪日，如甲子、乙丑等，一个循环下来共有六十种排列组合。",[],"正确","简化后的天干地支：“甲、乙、丙、丁、戊、己、庚、辛、壬、癸”称为十天干，“子、丑、寅、卯、辰、巳、午、未、申、酉、戌、亥”称为十二地支。\n十天干和十二地支依次相配，组成六十个基本单位，两者按固定的顺序相互配合，组成了干支纪元法。天干地支的发明影响深远，依旧在使用天干地支，用于历法、术数、计算、命名等各方面。",6],[79,0,"古人用十二地支纪时，其中子时是指23点至1点，辰时是指7点至9点，午时是指11点至13点。",[],"正确","中国古时把一天划分为十二个时辰，每个时辰相等于现在的两小时。相传古人根据中国十二生肖中的动物的出没时间来命名各个时辰。十二时辰制。西周时就已使用。汉代命名为夜半、鸡鸣、平旦、日出、食时、隅中、日中、日昳、晡时、日入、黄昏、人定。又用十二地支来表示，以夜半二十三点至一点为子时，一至三点为丑时，三至五点为寅时，依次递推。",6],[80,0,"古人拿十二种动物配十二地支，寅为虎，午为马，戌为狗。",[],"正确","子鼠，丑牛，寅虎，卯兔，辰龙，巳蛇，午马，未羊，申猴，酉鸡，戌狗，亥猪。",6],[81,0,"二十四节气中排第一的立春，排最后的是除夕。",[],"错误","除夕不是二十四节气里的，排最后的是大寒。",6],[82,0,"农历每月的第一天叫“朔”，最后一天叫“晦”。",[],"正确","出自《汉书·李寻传》：“朔晦正终始，弦为绳墨，望成君德，春夏南，秋冬北。”",6],[83,0,"公历纪元是目前世界上最通用的纪年，它是在公元1世纪逐渐流行开来的。",[],"错误","公历纪元是目前世界上最通用的纪年。相传在约公元532年时，基督教修道士迪奥尼修斯·埃克西鸠厄斯推算出，耶稣诞生于532年前，即罗马纪元754年，应以次年作为耶稣诞生后第533年，从此在欧洲基督纪元与罗马纪元并行。到15世纪基督纪元逐渐代替了罗马纪元。",6],[84,0,"古人把每个季节三个月顺次称为孟、仲、季，仲夏就是夏季的第二个月。",[],"正确","一年十二个月依次为：孟春、仲春、季春，孟夏、仲夏、季夏，孟秋、仲秋、季秋，孟冬、仲冬、季冬。",1],[85,0,"《五经正义》是唐代孔颖达奉命主持编订的。",[],"正确","《五经正义》是唐代孔颖达等奉敕编写的五经义疏著作。该作品于唐高宗时成书，完成了五经内容上的统一。",2],[86,0,"东曦，古代神话中太阳神的名字叫曦和，驾着六条无角的龙拉的车子在天空驰骋。东曦指初升的太阳。",[],"正确","出自《促织》：“东曦既驾，僵卧长愁。”",10],[87,0,"山东，山可指崤山、华山、太行山、泰山等数种不同的山，而所指地域不尽相同。大多是以崤山为标准的“山东”。",[],"正确","山东，作为一个地理区域的名称，最早始于战国时期，当时秦人称崤山、函谷关以东的地区为“山东”，为一个地域性的泛称。由于战国七雄之中，除秦国以外的韩、赵、魏、齐、楚、燕六国都在崤函以东，故也有“山东六国”之称。",7],[88,0,"关东，函谷关或潼关以东地区，近代指山海关以东的东北地区；关西，函谷关或潼关以西地区；关中，古人习惯上将函谷关以西地区称为关中；关内，山海关以西或嘉峪关以东一带地区；关外，山海关以东或嘉峪关以西或居庸关以北一带地区。",[],"正确","关东出相指函谷关以东的地区多出宰相，典出《晋书·姚兴载记》。秦汉时普遍用地处崤山谷地的函谷关、大散关作为区分东、中、西三大地域的界标，分别称关东、关中、关西。以上等等表明秦汉关东由来。",7],[89,0,"“朔漠”原指北方沙漠地带，有时也泛指北方。古代越族居住在江、浙、闽、粤各地，各部落各有名称，而统称“百粤”，也叫“百越”。",[],"正确","出自《后汉书·袁安传》：“今朔漠既定，宜令南单于反其北庭。”",6],[90,0,"“中原”即中州、中土，是区别于边疆地区的说法。狭义指今河南及其附近地区；广义指黄河中下游地区或整个黄河流域。",[],"正确","陆游《示儿》“王师北定中原日”中的“中原”特指当时沦陷于金人的淮河以北地区。",7],[91,0,"三辅，西汉时本指治理京畿地区的三位官员，后指这三位官员管辖的地区。",[],"正确","《张衡传》：“衡少善属文，游于三辅。”",3],[92,0,"古代的“河”专指黄河，“江”专指“长江”，所以《鸿门宴》里“将军战河南”的“河南”是指“黄河以南的地区”，不是今天所说的“河南省”。",[],"正确","《过秦论》：“然后践华为城，因河为池。”",7],[93,0,"曾使“洛阳纸贵”的作品是曹植的《洛神赋》。",[],"错误","应为左思的《三都赋》。",0],[94,0,"根据“上北下南，左西右东”的地理常识推断，古代的“江左”是指长江以西的地区。",[],"错误","古代的政治中心在北方，君王坐北朝南，其左边是东，因此，江左是指长江以东一带。",7],[95,0,"古代以中原为中心，人们将处于东、西、南、北方的少数民族分别称为东夷、西戎（西羌）、南蛮（南闽）、北狄，有鄙视之意。",[],"正确","《礼记王制》：“东曰夷、西曰戎、南曰蛮、北曰狄”。",2],[96,0,"“路”是宋代时期区域的名称，与今天的省区大致相似，如福建路、广东路。",[],"正确","无论在唐代、宋朝，还是五代十国、辽国和金国，道或路是最高行政区划单位始终没有变。",1],[97,0,"“夫运筹帷幄之中，决胜千里之外，吾不如子房”，最早出自《史记·汉高祖本纪》。",[],"正确","出自西汉·司马迁《史记·高祖本纪》：“夫运筹策帷幄之中，决胜于千里之外，吾不如子房。”",0],[98,0,"中国古代历代各级官府都会直接举办和管理学校，称为“官学”。由政府提供“廪膳”，选派教师，指定教材，监选生员。",[],"正确","“官学”与“私学”相对，分中央官学和地方官学。其中朝廷直接举办和管辖的属中央官学，如唐代的国子学、大学、四门学、弘文馆、崇文馆，元明清的太学、国子监等。",2],[99,0,"在宋代，主管教育的行政机关称为“国子监”，同时又是国家最高学府。",[],"正确","国子监，中国古代最高学府和教育管理机构。晋武帝司马炎始设国子学，至隋炀帝时，改为国子监。唐、宋时期，国子监作为国家教育管理机构，统辖其下设的国子学、太学、四门学等，各学皆立博士，设祭酒一人负责管理。",1],[100,0,"我国古代藏书、校书、讲学的地方称为“书院”，主要是校勘经典、辨明典章、收罗人才。",[],"正确","书院始于唐代，宋代书院大兴。以白鹿洞、石鼓、应天府、岳麓四大书院最为著名。",1],[101,0,"中国科举时代，学校里的幼童称为“童生”。",[],"错误","明清科举考试，凡考试未合格，没被称为秀才以前，无论年龄大小，都称为童生，又称文童、儒童。",3],[102,0,"古代向朝廷荐举人才，泛称贡士，唐以后亦称科举制度为贡举。",[],"正确","清代科举中参加会试被录取者称为贡士，其第一名称会元。贡士均需参加殿试，殿试后根据成绩排名，由皇帝赐予进士出身。",3],[103,0,"“其曲弥高，其和弥寡”是屈原的名句。",[],"错误","“其曲弥高，其和弥寡”出自宋玉。",0],[104,0,"班固作《汉书》时删去《史记·大宛传》，不再为西域少数民族专门立传。",[],"错误","《汉书》继承《史记》为少数民族专门立传的优良传统，运用新史料将《史记·大宛传》扩充为《西域传》，叙述了西域几十个地区和邻国的历史以补充，增补了大量汉武帝以后的史实。",1],[105,0,"《诗经》中的“雅”分为小雅和大雅，主要分别作于西周初期和晚期。",[],"错误","时间对应相反。",2],[106,0,"公车，官府的马车。古代臣民上书或被征召，都由官府的马车接送。",[],"错误","“公车”是汉代官署名，负责接待臣民，非接送臣民。",3],[107,0,"“振恤”，即赈济与抚恤，即面对灾荒来袭时，各级政府和民间做的相应的反应和对策。",[],"正确","振恤，“振”通“赈”，即赈济与抚恤的意思，并且偏重于安抚。出自《吕氏春秋·怀宠》。",2],[108,0,"“介”指古代战士带的帽子，“胄”指用来防身的一种武器，即铠甲。介胄分别指头盔和铠甲。",[],"错误","对“介”和“胄”的解释全部颠倒了，前者指铠甲，后者指头盔。",10],[109,0,"大学是我国古代的最高学府，有时也是教育行政机构。",[],"错误","应该是“太学”或“国子监”。",2],[110,0,"博士和教授都是指古代的学者或博学多才之人，与官职没有任何关系。",[],"错误","“博士”是秦汉时掌管书籍文典、通晓史事的官职，“教授”一开始也是学官名。",3],[111,0,"征辟是汉代选拔官吏的一种形式。“征”一般是皇帝亲自征聘人才，“辟”则大多数是由中央高官或地方政府向朝廷推荐人才。",[],"正确","《后汉书·庾乘传》：“﹝ 乘 ﹞后徵辟并不起，号曰：‘徵君’。",3],[112,0,"古代科举考试，由低级到高级一般经历以下四个阶段：院试、会试、乡试、殿试。",[],"错误","由低级到高级一般经历以下四个阶段：院试、乡试、会试、殿试。",3],[113,0,"“风骚”：风，《诗经》里的“国风”；骚，《楚辞》里的“离骚”。后来用“风骚”借指文采。",[],"正确","《宋书·谢灵运传论》：“原其飇流所始，莫不同祖《风》《骚》。",2],[114,0,"《左传》，我国第一部叙事详备的编年体史书。",[],"正确","作品原名为《左氏春秋》，汉代改称《春秋左氏传》、《春秋内传》、《左氏》，汉朝以后多称《左传》。它是儒家重要经典之一，是历代儒客学子重要研习史书。",2],[115,0,"《史记》，我国第一部纪传体断代史。",[],"错误","是第一部纪传体通史。",14],[116,0,"“姬”姓，中华上古八大姓之一，得姓始祖为华夏民族的人文初祖--黄帝，黄帝因长居姬水，以姬为姓。",[],"正确","姬姓，中华上古八大姓之一，为黄帝之姓、周朝的国姓。春秋战国时代的姬姓诸侯国有吴国、鲁国、燕国、卫国、晋国、郑国、曹国、蔡国，有近5000年历史。姬姓的得姓始祖为华夏民族的人文初祖——黄帝，黄帝因长居姬水，以姬为姓。",1],[117,0,"二十四史：从《史记》到《清史》的二十四部纪传体史书。",[],"错误","是从《史记》到《明史》，清代只有《清史稿》。",1],[118,0,"《汉书》，又名《前汉书》，东汉班固所著，是中国第一部纪传体断代史。",[],"正确","《汉书》全书主要记述了上起汉高祖元年（公元前206年），下至新朝王莽地皇四年（公元23年）共230年的史事。《汉书》包括纪十二篇，表八篇，志十篇，传七十篇，共一百篇，后人划分为一百二十卷，全书共八十万字。",1],[119,0,"“经史子集”是中国古籍按内容区分的四大部类。经，指儒家经典著作；史，即正史。",[],"正确","“经史子集”是古代人将古籍按内容区分的四大部类。一些大型的古籍丛书往往囊括四部，并用以命名，如《四库全书》、《四部丛刊》、《四部备要》等，可见四部分类对古籍的重要意义。经：经书，是指儒家经典著作；史：史书，即正史；子：先秦百家著作，宗教；集：文集，即诗词汇编。泛指我国古代典籍。出处：《新唐书·艺文志一》：“两都各聚书四部，以甲乙丙丁为次，列经史子集四库。",2],[120,0,"冠冕是贵族男子的头衣，平民男性的头发则以头巾为主，贵族则在冠之下附巾。如葛巾、幅巾、纶巾等。",[],"正确","贵族男子二十岁行冠礼，在亲人和乡贤的祝福下，将头发梳起来，并带上冠固定头发，从此就是成年人了。男子年满二十称为“弱冠”。",12],[121,0,"人们常用“数九寒天”来指冬天天气最冷的时候。“数九”是从立冬开始，到立春结束。",[],"错误","“是从立冬开始”错。应从“冬至”开始。数九又称冬九九，是一种中国民间节气。数九从每年阳历12月下旬冬至开始。",6],[122,0,"古代将上下身分为两件的衣服总称“衣裳”，这里的“衣”和“裳”是两个词，“衣”指上身的衣服，“裳”指下身的衣服，也叫“裙”。",[],"正确","女子服饰中，短上衣叫“襦”。把裙子穿在襦外面，就成了襦裙。在裙子外面又加了一件上衣叫作“袄”，以袄掩裙，袄可长可短，在明代最为常见。",12],[123,0,"短褐，用麻或毛捻成线编织的粗衣，不但重，无光华，而且不暖。对地位低下的人来说，则为平时所穿，因此“短褐”成了平民的标志。",[],"正确","《荀子·大略》“衣则竖褐不完”。",10],[124,0,"袖，又称“袂”，古语“联袂”就是连在一起拉着手的意思。",[],"正确","“联袂”是一同做某件事的意思。“挥袂”则是挥手的意思。由此可见，古代常常用“袂”来代指手。",14],[125,0,"黔首，以黑巾裹头，代指平民，即本业为农业与小手工业，末业为小商贾等各种不事生产的人。",[],"正确","秦始皇时期开始作为官方辞令使用。“分天下以为三十六郡，郡置守、尉、监。更名民曰‘黔首’”（《史记·秦始皇本纪》），含义与当时常见的民、庶民同。",11],[126,0,"白丁，古代平民着白衣，故常以“白丁”称呼平民百姓；布衣、麻衣，借指平民。",[],"正确","平民不能衣锦绣，多穿布衣。布衣之交，即贫贱之交。",12],[127,0,"青衫，黑色的单衣。唐代官职低的服色为青黑色。后人也常用“司马青衫”形容悲伤凄切。",[],"正确","白居易《琵琶行》诗：“座中泣下谁最多，江州司马青衫湿。”",12],[128,0,"“笏”又称“笏板”，当纸张还没有发明的时候，文字都记录在上面，上朝的时候可以提醒自己重要的事情。",[],"正确","缙绅，插笏于绅带间，旧时官宦的装束，亦借指士大夫。",11],[129,0,"“席”是跪坐时用的垫子。这是由于最初中国人是席地而坐的，坐的时候，比较庄重的坐姿是跪坐。",[],"正确","《诗经·邶风·柏舟》：“我心匪席，不可卷也。”",2],[130,0,"“鼎”用于煮肉和盛肉。鼎有圆形三足和方形四足两种，现存的鼎中，最著名的要数司母戊鼎。青铜鼎非常贵重，非大贵族不能使用。",[],"正确","商后母戊鼎，又称司母戊鼎、司母戊大方鼎，是商后期（约前十四世纪至前十一世纪）铸品，于1939年出土于河南省安阳市武官村。",10],[131,0,"“箪”是一种像小筐的竹器，古代用它来盛饭。",[],"正确","一箪食，一豆羹，得之则生，弗得则死。——《孟子·告子上》",10],[132,0,"按照一般说法，“五谷”是指稷（小米）、黍（黍子）、麦（大麦小麦）、菽（豆）、麻（大麻子）。",[],"正确","平常俗称的“五谷”所指的五种谷物。“五谷”，古代有多种不同说法，最主要的有两种：一种指稻、黍、稷、麦、菽；另一种指麻、黍、稷、麦、菽。两者的区别是：前者有稻无麻，后者有麻无稻。古代经济文化中心在黄河流域，稻的主要产地在南方，而北方种稻有限，所以“五谷”中最初无稻。",7],[133,0,"“荤”本意是指葱、蒜等辛臭的蔬菜，后来指部分动物性食物，如鸡、鸭、鱼等。",[],"正确","荤，臭菜也。――《说文》",12],[134,0,"在中国周代，马车就已经在一定程度上得到普及。根据马的数量，可以对车有不同的称呼：骈就是两匹马拉车，骖就是三匹马拉车，驷就是四匹马拉车。",[],"正确","据说“天子驾六”，只有天子才能乘坐六匹马拉的车子。由于四马拉车最为常见，所以用“驷”来代指马车。“一言既出，驷马难追”表示说出口的话，即使是驾着四匹马拉的车子也无法追回来。",2],[135,0,"古代的轿子叫肩舆或腰舆，其区别是肩舆上肩抬，而腰舆抬在腰间。最早叫“辇”，本来是人推的车，后来成为专用的车或者轿子。",[],"正确","杜牧《阿房宫赋》中说别国的王孙公主被“辞楼下殿，辇来于秦”，可见当时的辇还不是皇帝专用。",1],[136,0,"最初的田猎是一种非常严肃的军事和祭祀活动，后来田猎的制度消失，对贵族们来说，打猎成了休闲活动。",[],"正确","出自田猎于此。——《孟子·梁惠王下》",2],[137,0,"刺配：脸上刺了字，发放送往远地充军。刺，即黥刑，在罪犯额面或肌肤上刺上字，用墨染上颜色；配，发往远地充军。",[],"正确","黥刑又称墨刑，以刀刻凿人面体再用墨涂在刀伤创口上，使其永不褪色。汉以前，墨刑主要施于犯人面、额之上，适用于较轻的罪犯；以后，墨刑间或有之，主要用于逃奴、窃盗和辅助刑。",8],[138,0,"刖刑，又称剕刑，指砍去受罚者左脚、右脚或双脚的酷刑。",[],"正确","从膑刑演变而来。膑刑是去掉犯人的膝盖骨，犯人受膑刑后不能行走，受刖刑即断足后，装上假肢仍可行走，故刖刑轻于膑刑。",14],[139,0,"笞刑，用竹板或荆条打人背部或臀部。笞刑打十至五十下。杖刑，用大荆条、大竹板或棍棒抽击人的背、臀或腿部。杖刑打五十至一百下。",[],"正确","以竹、木板等拷打犯人臀部、背部或大腿的轻刑。始于战国时期，是古代“五刑”之一。针对轻微犯罪而设，或作为减刑后的刑罚。",1],[140,0,"戮刑，戮有羞辱和耻辱之意。戮刑视为奇耻大辱。戮分为生戮和死戮。生戮即先将犯人示众，然后再杀死；死戮是先将人杀死，然后再陈尸示众。",[],"正确","《旧唐书 酷吏传》记载：公元694年（武则天长寿二年）唐侍御史 “（万）国俊至广州，遍召流人，置于别所，矫制赐自尽，并号哭称冤不服。国俊乃引出，拥之水曲，以次加戮，三百余人，一时并命。” 这三百余人当是生戮。",1],[141,0,"从层次角度区分，中国传统文化的主文化为物质文化与精神文化。",[],"正确","主文化是在一个社会中处于支配地位的正统文化，也可以称之为主流文化。比如在中国的传统社会中，儒家文化就是那一时期占统治地位的主流文化，统治者依靠儒家文化的传播来统一民众的思想。在不同的历史时期，一个社会的主文化也会随着时代的变迁而有所不同。而中国传统文化的主文化为物质文化与精神文化。",1],[142,0,"四大发明中，从起源到完成，经历时间最长的一项是造纸术。",[],"错误","应为指南针。",11],[143,0,"“龙媒”是指给人做媒。",[],"错误","应为一种好马。",14],[144,0,"古代武状元考试，武试中打鼓考核最为重要。",[],"错误","应为射箭。",3],[145,0,"中国的十二生肖是子鼠、丑牛、寅虎、卯兔、辰龙、巳蛇、午马、未羊、申猴、酉鸡、戌狗、亥猪。",[],"正确","中国的十二生肖，又叫十二属相，是中国与十二地支相配以人的出生年份的十二种动物，包括鼠、牛、虎、兔、龙、蛇、马、羊、猴、鸡、狗、猪。",5],[146,0,"茶正式作为普及民间的大众饮品是在明朝。",[],"错误","应为唐朝。",12],[147,0,"八股文的写作步骤为破题、承题、起讲、入手、起股、中股、后股、束股。",[],"正确","八股文就是指文章的八个部分，文体有固定格式:由破题、承题、起讲、入题、起股、中股、后股、束股八部分组成，题目一律出自四书五经中的原文。后四个部分每部分有两股排比对偶的文字，合起来共八股。旧时科举，八股文要用孔子、孟子的口气说话，四副对子平仄对仗，不能用风花雪月的典故亵渎圣人，每篇文章包括从起股到束股四个部分。",2],[148,0,"汉字六书是象形、指事、形声、会意、转注、假借 。",[],"正确","六书，汉字的六种造字方法: 象形、 指事、 形声、 会意、 转注、 假借， 其中象形、指事、会意、形声主要是“造字法”，转注、假借是“用字法”。",1],[149,0,"与《梅花谱》并列为两大中国象棋传世古谱之一的是《自出洞来无敌手》。",[],"错误","应为《橘中秘》。",13],[150,0,"现行的二十四节气是刘安创立的。",[],"正确","二十四节气是中国古代人民的伟大发明创造，它最早完整、科学的记载，出自西汉时期淮南王刘安的《淮南子·天文训》。",6],[151,0,"西安兵马佣的主人是秦始皇。",[],"错误","应为秦宣太后。",1],[152,0,"明代纯以彩色在熟纸绘绢上作写意的画家是孙隆。",[],"正确","孙隆，又名龙，字廷振，号都痴，毗邻人（今常州人），明开国忠敏侯孙兴祖之孙。大概与林良同时期画家，为宣德年间宫廷重要画家。擅画翎毛、虫草，不作墨线，纯以色彩点染而成，谓之“没骨“，别具一格。亦善山水。画翎毛草虫，全以彩色渲染，生动鲜活，饶有机趣，自成一家，对后代影响很大。",8],[153,0,"我国有句古语，斗柄东指，天下皆春，在春夏秋冬中，北斗七星的斗柄依次指向东南西北。",[],"正确","北斗七星的斗柄依次指向东南西北。",6],[154,0,"地雷最早出现在唐朝。",[],"错误","应为明朝。",1],[155,0,"以《谏逐客书》为代表的李斯散文最鲜明的特色是流畅谐偶。",[],"错误","应为铺陈排比。",0],[156,0,"认为天与人之间是“交相胜，还相用”的关系的思想家是王勃。",[],"错误","应为刘禹锡。",7],[157,0,"“冻吟可但笔锋健，醒狂不觉屐齿折”其中“不觉屐齿折”这个典故来源于采石之战。",[],"错误","应为淝水之战。",0],[158,0,"素有“世界屋脊”之称的是藏族。",[],"正确","藏族被称为世界屋脊的民族，因为他们生活在青藏高原。",14],[159,0,"相传我国古代能作“掌上舞”的人是貂蝉。",[],"错误","应为赵飞燕。",14],[160,0,"“吾师心，心师目，目师华山”是由赵原提出的。",[],"错误","应为王履。",7],[161,0,"《八仙过海》中，张果老是骑在驴背上过海的。",[],"正确","张果老是骑着驴背过河的。",7],[162,0,"记载食物疗法的《食疗本草》出自唐朝。",[],"正确","《食疗本草》是唐前饮食疗法和营养学的本草专著，出自唐朝。",12],[163,0,"庖丁解牛中的“庖丁”指的是厨师。",[],"正确","庖丁解牛比喻经过反复实践，掌握了事物的客观规律，做事得心应手，运用自如",2],[164,0,"词的别称有长短句、诗余。",[],"正确","南宋以后，文人称词为诗余。作词要求典雅纯正，避用艳丽的词藻、婉约的内容、粗俗的格调，运用诗的清空雅正语言及风格，故称词为诗余",0],[165,0,"律诗偶数句押平声韵，每句平仄皆有规定，每篇必有对仗。",[],"正确","平仄，是中国诗词中用字的声调。“平”指平直，“仄”指曲折。根据隋朝至宋朝时期修订的韵书，如《切韵》《广韵》等，中古汉语有四种声调，称为平、上、去、入。除了平声，其余三种声调有变化，故统称为仄声。",0],[166,0,"国画是我国传统的美术形式，我国存世最早最完整的国画作品是周昉的《簪花仕女图》。",[],"错误","应为顾恺之的《女史箴图》。",8],[167,0,"泼水节是苗族的节日。每逢新年，人们都互相泼洒洁净的水，表示 除污秽，迎接吉祥幸福的新年。",[],"错误","泼水节，是中国傣族、阿昌族、布朗族、佤族、德昂族等少数民族和中南半岛某些民族的新年节日。为傣族一年中最盛大的传统节日。中国傣族节期在傣历六七月(清明节后十日左右)。现已固定在公历4月13至15日。节日期间，人们相互泼水祝福，并举行拜佛、赛龙舟、放高升、点孔明灯等活动",5],[168,0,"陆机被称为“太康之英”。",[],"正确","中国文学史上,被称作“太康之英”的是陆机。",0],[169,0,"中国古代小说源远流长，小说在唐代叫做话本。",[],"错误","应为传奇。",0],[170,0,"《贵妃醉酒》、《杜十娘》、《琐麟囊》、《梁红玉》依次是梅兰芳、程砚秋、荀慧生、尚小云的代表作。",[],"错误","杜十娘是明代冯梦龙所著《警世通言·杜十娘怒沉百宝箱》中的女主人公；《锁麟囊》是翁偶虹根据《剧说》中一则引自《只麈谭》的故事创作剧本，程砚秋设计唱腔、排演的京剧剧目。",9],[171,0,"中国传统屋顶主要有六种形式：悬山顶、硬山顶、庑殿顶、歇山顶、攒尖顶、卷棚顶，其中以悬山顶为级别最高。",[],"错误","重檐庑殿顶是古代建筑中最高级的屋顶样式。",10],[172,0,"六子全书有《老子》、《庄子》、《列子》、《荀子》、《孟子》、《文中子中说》。",[],"错误","《六子全书》六十卷，明顾春编，嘉靖十二年（1533）顾春世德堂刻本，二函十四册，钤印为“五老峰主人”和“钬坚所藏”。“六子”即为老子《道德经》二卷，《南华真经》十卷、《冲虚至德真经》八卷，《荀子》二卷、《新纂门目五臣音注扬子法言》十卷，《中说》十卷。",2],[173,0,"我国现存年代最早的一首用文字谱记写的琴曲是《碣石调·幽兰》。",[],"正确","《碣石调·幽兰》是至今仅存的一首用原始文字谱保留下来的琴曲,据传是梁代琴家丘明所传的一首古琴曲,现收录在《神奇秘谱》中的是唐人的手抄本,是现存最早的古琴曲谱。",0],[174,0,"唐代有一种诗叫“长吉体”，开创“长吉体”诗歌的是李白。",[],"错误","开创长吉体诗歌的是唐代著名诗人李贺。李贺，字长吉，李贺的诗作想象极为丰富，经常应用神话传说来托古寓今，所以有“诗鬼”之称。长吉体指唐元和年间诗人李贺的诗作所独有的风格意境。长吉体诗在思想构造上面善于运用神话传说和怪诞、华美的语汇，创造出异想天开、从未有过的意象。",0],[175,0,"八个样板戏：《沙家浜》、《红灯记》、《西厢记》、《海港》、《奇袭白虎团》、《红色娘子军》、《白毛女》、《沙家浜》。",[],"错误","“京剧《红灯记》《智取威虎山》《沙家浜》《海港》《奇袭白虎团》，芭蕾舞剧《红色娘子军》《白毛女》，交响音乐《沙家浜》”。",9],[176,0,"九流：儒家、道家、阴阳家、法家、名家、墨家、评论家、杂家、农家。",[],"错误","九流，秦至汉初的九大学术流派。在《汉书·艺文志》指：道家、儒家、阴阳家、法家、农家、名家、墨家、纵横家、杂家。",2],[177,0,"杂剧在元代文学中有突出的地位，代表作有关汉卿的《窦娥冤》、王实甫的《西厢记》、孔尚任的《桃花扇》和马致远的《汉宫秋》等。",[],"错误","孔尚任的《桃花扇》是清代代表作。",1],[178,0,"钟惺《浣花溪记》中所写的浣花溪位于现在的甘肃天水，",[],"错误","应为四川成都。",0],[179,0,"所谓从“笔尖下发现的行星”指的是冥王星。",[],"错误","应为海王星。",8],[180,0,"我国的第一位女诗人是朱淑真。",[],"错误","中国第一位女诗人是：蔡琰（文姬）。",0],[181,0,"清代苏南已经开始试种双季稻，一年三熟。",[],"正确","清代苏南已经开始试种双季稻, 一年三熟,充分运用了江南气候条件。",2],[182,0,"杜甫是我国文学史上诗作留存最多的大诗人。",[],"错误","应为陆游。",0],[183,0,"《洛神赋》的作者曹植是建安时期成就卓著的作家。",[],"错误","《洛神赋》是三国时期曹魏文学家曹植创作的辞赋。",0],[184,0,"传说，盘古用斧头开辟了天地。",[],"正确","南朝萧梁的任昉撰的《述异记》称盘古身体化为天地各物。《五运历年纪》及《古小说钩沉》辑的《玄中记》亦有类似记载。",0],[185,0,"“尊长前，声要低。低不闻，却⾮宜”出⾃《⼩⼉语》。",[],"错误","出⾃《弟⼦规》。",14],[186,0,"很多有关动物的⽂字，如“鱼”“龟”“鸟”“⽺”，都是象形字，最初是按照动物的样⼦描画下来的。",[],"正确","象形字，是描摹事物外形特征的表意文字。它纯粹利用图形来作文字使用，而这些文字又与所代表的东西，在形状上很相像。象形字是最早产生的文字。它用文字的线条或笔画，把要表达物体的外形特征，具体地勾画出来。",8],[187,0,"“迟⽇江⼭丽，春风花草⾹”中“迟日”指的是迟到的太阳。",[],"错误","迟⽇：春天⽇渐长，所以说迟⽇。",7],[188,0,"古代夏至时，百姓们会将冬季窖藏的冰块取出使用，以便消暑。",[],"错误","只有皇宫才会有⽤冰的条件。",6],[189,0,"传说中⽉亮⾥包着⼀只⾦⾊的、三条腿的乌鸦，所以⽉亮⼜被称为“金乌”。",[],"错误","太阳被称为“金乌”。",14],[190,0,"炎帝⼜被⼈们尊称为“五⾕先帝”。",[],"正确","炎帝制耒耜，种五谷，奠定了农工基础。耒耜的使用和种五谷，解决了民以食为天的大事，促进了农业生产的发展，为人类由原始游牧生活向农耕文明转化创造了条件。",4],[191,0,"夏⾄后⽓温继续升⾼，⼤约再过⼆⼗多天，便会进⼊三伏天，这是夏季最凉爽的时段。",[],"错误","三伏天是⼀年中最热的时段。",1],[192,0,"《官仓⿏》（官仓⽼⿏⼤如⽃，见⼈开仓亦不⾛。健⼉⽆粮百姓饥，谁遣朝朝⼊君⼝）⼀诗只是表达了诗⼈对官仓管理不善、到处都有⽼⿏偷吃粮⾷现象的不满。",[],"错误","诗⼈借官仓管理不善，对贪官污吏进⾏讽刺。",3],[193,0,"“兄道友，弟道恭。兄弟睦，情在中”出⾃《弟⼦规》，告诉我们要与兄弟姐妹和睦相处。",[],"错误","原⽂为“兄道友，弟道恭。兄弟睦，孝在中。”",2],[194,0,"《鸟鸣涧》的作者是唐代诗⼈⽩居易。",[],"错误","作者是王维。",0],[195,0,"点苍⼭亦称“灵鹫⼭”，⼜称“灵⼭”。",[],"错误","⼜称“苍⼭”。在云南省⼤理市西北、洱海及漾濞江间，北起洱源，南⽌下关，绵延50多千⽶。",7],[196,0,"传说中⽤⼸箭射落九个太阳的神仙是仓颉。",[],"错误","应为后羿。",13],[197,0,"传说中民族的始祖是炎帝，⼜称神农。",[],"正确","炎帝，是中国上古时期姜姓部落的首领尊称，号神农氏，又号魁隗氏、连山氏、列山氏，别号朱襄（尚有争议，也有说朱襄氏部落曾有三代首领尊号炎帝）。",11],[198,0,"夸⽗是传说中追赶太阳的巨⼈。",[],"正确","夸父是中国上古时期神话传说人物之一，又名博父、举父，夸父是幽冥神、地母后土（厚土娘娘）的孙儿。",14],[199,0,"腊祭是中国传统的祭祀活动，把捕猎所得献给神灵或祖先亡灵，祈求丰收吉祥。",[],"正确","腊祭，是历史悠久的民间传统祭祀文化，指在新旧交接的岁末十二月举行的祭祀。",1],[200,0,"张骞出使西域，经过艰苦跋涉，终于找到了⼤⽉⽒国，和他们⼀起结盟，联合起来抗击了匈奴。",[],"错误","张骞找到了⼤⽉⽒国，⼤⽉⽒⼈已经过上了安居乐业的⽣活，不再想报仇了。",2],[201,0,"⽩居易，字乐天；李⽩，字太⽩；杜甫，字务观。",[],"错误","杜甫，字⼦美。",0],[202,0,"《拳经捷要篇》是郑成功的著作。",[],"错误","《拳经捷要篇》是明代抗倭名将戚继光所著。",2],[203,0,"围棋标准棋盘纵横各有15条线，棋⼦分⿊⽩两⾊，⿊⼦先，⽩⼦后，轮流下⼦。",[],"错误","围棋标准棋盘纵横各有19条线。",13],[204,0,"1957年，南京龙江船⼚遗址出⼟了长11⽶的郑和宝船⼤舵杆。",[],"正确","另据造船史家杨的推算，则船长为 57米。一艘长 57米的海船的排水量为1200吨左右，比起葡萄牙航海家达·伽马所用的 300吨的船以及哥伦布所用 280吨的旗舰都大得多。",7],[205,0,"郭守敬组织开挖了“通惠河”。",[],"正确","通惠河不仅是北京的一条经济命脉，而且也是京城著名的风景游览区，通惠河主要位于通州区和朝阳区。",7],[206,0,"宋应星每次去京城参加会试的路上，都会到沿途的作坊、⽥间等劳动现场，观察各⾏各业的⼯作⽅法和流程。正因如此， 他才会在会试中取得第⼀名的好成绩。",[],"错误","宋应星⼏次到京城参加会试，却⼀次⼜⼀次落榜了。",3],[207,0,"在那达慕⼤会上，赛马分为奔马赛和⾛马赛，奔马赛⽐的是速度，⾛马赛⽐的是马匹的外表。",[],"错误","⾛马赛⽐的是技巧。",14],[208,0,"蚕眠之前的叶子不宜湿，蚕眠之后的叶子却要湿润，蚕吐出的丝才鲜亮。",[],"正确","我国珠江三角洲地区盛产蚕丝，我国的蚕丝主要产地除珠江三角洲外，还有华东平原和四川盆地。",7],[209,0,"《观书有感》（半亩方塘一鉴开）是一首借景寓理的诗，这首诗的作者是北宋著名的哲学家、文学家朱熹。",[],"错误","应该是南宋。",0],[210,0,"“姑苏城外寒山寺，夜半钟声到客船”出自张继的《枫桥夜泊》。",[],"正确","月落乌啼霜满天，江枫渔火对愁眠。\n姑苏城外寒山寺，夜半钟声到客船",10],[211,0,"“一带一路”指的是丝绸之路经济带和21世纪海上丝绸之路。",[],"正确","“一带一路”是“丝绸之路经济带”和“21世纪海上丝绸之路”的简称，2013年9月和10月由中国国家主席习近平分别提出建设“新丝绸之路经济带”和“21世纪海上丝绸之路”的合作倡议",10],[212,0,"“半亩方塘一鉴开，天光云影共徘徊”中，“鉴”的意思是镜子，形容水很清澈。",[],"正确","半亩大的方形池塘像一面镜子一样展现在眼前，天空的光彩和浮云的影子都在镜子中一起移动。",1],[213,0,"古代把山南水北称为“阳”，洛阳坐落于洛河北岸，因此得名。",[],"正确","由于我国大部分地区都位于北回归线以北，太阳直射点始终位于北回归线以南，阳光主要从南方照向北方，南坡为阳坡，南面能够得到更多的太阳辐射，获取更多的热量。因此山南为阳，山北为阴",7],[214,0,"古人为了使铜钱不乱转，将铜钱中间开出方孔，所以后来人们把铜钱戏称为“孔方兄”。",[],"正确","古代的铜钱是一种辅币，一千个为一贯。在铸造时为了方便细加工，常将铜钱穿在一根棒上，为了在加工铜钱时铜钱不乱转，所以将铜钱当中开成方孔。后来人们就称钱为“孔方兄”，有时候寓指拜金主义",9],[215,0,"“兵藏武库，马入华山”一般用来形容天下太平。",[],"正确","北周·庚信《贺平邺都表》：“当今鹿台已散，离宫已遗，兵藏武库，马入华山。",7],[216,0,"漏壶是古代的一种盛水工具，常常用来测量水量。",[],"错误","漏壶是一种古代的计时工具。",6],[217,0,"汉服中，左衣襟向右腋掩去，盖住右衣襟，称为“左祍”。",[],"错误","应该称为“右祍”。",12],[218,0,"杜甫草堂位于四川省成都市。",[],"正确","杜甫草堂，是中国唐代大诗人杜甫流寓成都时的故居，位于四川省成都市青羊区青华路38号。杜甫先后在此居住近四年，创作诗歌240余首。唐末诗人韦庄寻得草堂遗址，重结茅屋，使之得以保存，宋元明清历代都有修葺扩建",0],[219,0,"杜牧是盛唐时期的诗人。",[],"错误","杜牧是晚唐时期的诗人。",0],[220,0,"王维，字摩诘，曾任尚书右丞，世称王右丞。",[],"正确","王维参禅悟理，精通诗书音画，以诗名盛于开元、天宝间，尤长五言，多咏山水田园，与孟浩然合称“王孟”，因笃诚奉佛，有“诗佛”之称",2],[221,0,"范成大，北宋诗人，是“中兴四大诗人”之一，他的田园诗尤为著名。",[],"错误","南宋诗人。",0],[222,0,"云南省少数民族众多，有白族、彝族、独龙族、哈尼族等。",[],"正确","全省少数民族人口数超过100万人的有彝族、哈尼族、白族、傣族、壮族、苗族6个；超过10万人不到100万人的有回族、傈僳族、拉祜族、佤族、纳西族、瑶族、景颇族、藏族、布朗族9个；超过1万人不到10万人的有布依族、普米族、阿昌族、怒族、基诺族、蒙古族、德昂族、满族8个；超过6000人不到1万人的有水族、独龙族2个。云南少数民族交错分布，表现为大杂居与小聚居，彝族、回族在全省大多数县均有分布",7],[223,0,"法家学派的先驱为春秋时期的管仲、子产。",[],"正确","法家思想渊源可上溯到春秋时的管仲、士匄、子产，而实际的始祖，当推战国初的李悝。此外还有吴起、慎到、申不害、商鞅、韩非子等，均被称为“前期法家”，而以商鞅为前期法家的主要代表人物",2],[224,0,"作为兵学鼻祖的孙子以自然天论为前提。",[],"正确","孙武（约前545年－约前470年），字长卿，春秋末期齐国乐安人 [1]  。中国春秋时期著名的军事家、政治家，尊称兵圣或孙子（孙武子），又称“兵家至圣”，被誉为“百世兵家之师”、“东方兵学的鼻祖”",4],[225,0,"“天人合一”源于奴隶社会的需要。",[],"错误","“天人合一”为中国哲学思想，儒、道、释等诸家各有阐述。天指天空，也指天道，还指自然大道，道家道教所说的天，多指自然、天道。天人合一，多指人与道合而“天地与我并生，万物与我为一”的境界，也指天人相合相应。",2],[226,0,"道的“无”“恒”“一”“朴”是一切事物原初状态。",[],"正确","道教继承和发展了先秦道家思想，将“道”作为最高信仰，从中演化出最高经典，最上道术及最高的神灵，构建了庞大的经典道术神仙体系",2],[227,0,"佛教传入中国后，与儒、道等本土文化碰撞融合，渐成中国文化的重要组成部分。",[],"正确","佛教于西汉末年传入中国",2],[228,0,"两汉文学中最有价值的是乐府诗中的民歌。",[],"正确","汉乐府，是指专门管理乐舞演唱教习的机构。乐府初设于秦，是当时少府下辖中专门管理乐舞演唱教习的机构。\n\n公元前112年，正式成立于西汉汉武帝时期。乐府的职责是采集民间歌谣或文人的诗来配乐，以备朝廷祭祀或宴会时演奏之用。它搜集整理的诗歌，后世就叫“乐府诗“，或简称“乐府“。",9],[229,0,"中国真正有文字的历史从殷墟甲骨文开始，从此进入信史时代。",[],"正确","信史时代是指有文字或出土文物记载着当时社会的情况的时代，后人称为信史时代。与它相反的，就是传疑时代或是传说时代。",1],[230,0,"《孙子兵法》号称“百世谈兵之祖”。",[],"正确","《孙子兵法》又称《孙武兵法》、《吴孙子兵法》、《孙子兵书》、《孙武兵书》等，是中国现存最早的兵书，也是世界上最早的军事著作，早于克劳塞维茨《战争论》约2300年，被誉为“兵学圣典”。共有六千字左右，一共十三篇。",1],[231,0,"程颐制定的《白鹿洞书院学规》是其他众多书院借鉴的范本。",[],"错误","应该为朱熹。",2],[232,0,"诗句“露从今夜白，月是故乡明”的作者是唐代诗人李白。",[],"错误","应为杜甫。",0],[233,0,"“小品”多指写作形式固定，篇幅短小精悍，诙谐搞笑的散文文体。",[],"错误","“诙谐搞笑”不正确，“小品”多指写作形式灵活，注重个性和创见的散文文体。",0],[234,0,"算筹是中国古代的计算工具。",[],"正确","算筹是中国古代的计算工具,是横截面为圆形、方形或三角形的小棍,使用木、竹、骨等物制成。",11],[235,0,"南北朝是中国古代数学的蓬勃发展时期。",[],"正确","南北朝是中国古代数学的蓬勃发展时期,计有《孙子算经》、《夏侯阳算经》、《张丘建算经》等算学著作问世。",11],[236,0,"齐国的稷下学宫是战国各家私学的汇集地。",[],"正确","稷下学宫，是世界上最早的官办高等学府，也是中国最早的社会科学院、政府智库。始建于齐桓公田午时期。位于齐国国都临淄（今山东省淄博市临淄区）稷门附近。",7],[237,0,"诗言志，是我国古代文论家对诗的本质特征的认识。",[],"正确","诗言志，是我国古代文论家对诗的本质特征的认识。《诗经》的作者关于作诗目的的叙述中就有“诗言志”这种观念的萌芽。作为一个理论术语提出来，最早大约是在《左传·襄公二十七年》记赵文子对叔向所说的“诗以言志”。后来“诗言志”的说法就更为普遍。《尚书·尧典》中记的舜话说：“诗言志，歌永言，声依永，律和声。”《庄子·天下篇》说：“诗以道志。”《荀子·儒效》篇云：“《诗》言是其志也。”",2],[238,0,"中国的戏曲起源于原始的乐舞，巫人以舞降神，巫舞逐渐演变为民间歌舞和小调。",[],"正确","中国的戏曲起源于原始的乐舞,后来巫术盛行,巫人以舞降神,巫舞逐渐演变为民间歌舞和小调。古代在每年腊月还举行一种驱鬼逐疫的仪式,叫做“驱傩”或“大傩”。",9],[239,0,"东晋时的画家顾恺之、张僧繇和陆探微合称“六朝三杰”。",[],"正确","六朝三杰是指在中国绘画史上,六朝时期著名的三位书画家:东晋顾恺之、南朝宋陆探微,和南朝梁张僧繇。",8],[240,0,"张择端是北宋时期最著名的大画家，其长卷风俗画《清明上河图》是当时风俗画的代表。",[],"正确","清明上河图，中国十大传世名画之一。为北宋风俗画，北宋画家张择端仅见的存世精品，属国宝级文物，现藏于北京故宫博物院。",5],[241,0,"《九章算术》成书于公元1世纪，被称为“中国算法”。",[],"正确","《九章算术》是《算经十书》中最重要的一部，成于公元一世纪左右。其作者已不可考，一般认为它是经历代各家的增补修订，而逐渐发展完备成为现今定本的，西汉的张苍、耿寿昌曾经做过增补和整理，其时大体已成定本。",11],[242,0,"西周时期，诗歌与音乐是结合在一起的，十五国风是十五种地方性的民歌。",[],"正确","西周时期，诗歌与音乐是结合在一起的。十五国风是十五种地方性的民歌，各有不同特点、声调和风格。雅与颂也各有不同的格律，都能配乐歌唱，组成一定的乐章，这些乐章是国家制定的礼乐的重要组成部分，应用相当广泛。",0],[243,0,"《庄子》分为外篇、内篇和和杂篇。外篇是庄子的思想精华所在。",[],"错误","内篇是庄子的思想精华所在。",2],[244,0,"中国第一长洞是贵州绥阳的双河溶洞。",[],"正确","中国第一长洞是贵州绥阳的双河溶洞。其位于贵州省遵义市绥阳县温泉镇，距绥阳县城50公里，距遵义市92公里。",7],[245,0,"天一阁是中国现存最早传世最久的私家藏书阁，现位于浙江宁波市区。",[],"正确","天一阁,位于今浙江省宁波市,是中国现存历史最悠久的私家藏书楼,也是世界上最古老的三大私家藏书楼之一。",10],[246,0,"我国迄今为止出土的最庞大的一组战国编钟是1978年出土于湖北随县(今随州市)的曾侯乙编钟。",[],"正确","曾侯乙编钟,战国早期文物,中国首批禁止出国(境)展览文物。1978年在湖北随县(今随州市)出土。是由六十五件青铜编钟组成的庞大乐器,其音域跨五个半八度,十二个半音齐备。",9],[247,0,"孔子在教育上取得巨大成就，所谓弟子三千，贤者七十二。",[],"正确","“弟子三千，贤人七十二”的意思是：孔子的学生有三千人，身通六艺的只有七十二个。出自《史记·孔子世家》所记：“孔子以诗书礼乐教，弟子盖三千焉，身通六艺者七十有二人。”",2],[248,0,"“齐物”的思想不仅体现在《齐物论》中，《庄子·至乐》中鼓盆而歌的故事也能体现这一思想。",[],"正确","“齐物”的思想认为宇宙间一切事物，如生死寿夭，是非得失，物我有无，都应当同等看待。",2],[249,0,"《太公兵法》相传是辅佐周武王伐纣的姜太公写的兵书。",[],"正确","《姜太公兵书》为该八大兵书之一。商周之交， 姜太公在山中避纣时苦心研究兵法，并写出太公兵书，成为中国古代八大兵书之一。",1],[250,0,"桌与案有形制上的区别，腿的位置缩进一块的是桌，腿的位置顶住四角的为案。",[],"错误","腿的位置缩进一块的是案，腿的位置顶住四角的为桌。",14],[251,0,"“许人一物，千金不移”出自《幼学琼林》。",[],"错误","出自《增广贤文》。",0],[252,0,"乐府原是封建朝廷设立的音乐管理机构，最初始于西周，汉朝依然沿用了这一名称。",[],"错误","乐府原是封建朝廷设立的音乐管理机构，最初始于秦代。",1],[253,0,"汉代乐府的主要任务是采集编撰各地民间歌谣，将一些文人诗作制曲配乐，演唱或演奏新的歌舞等。",[],"正确","公元前112年，汉王朝在汉武帝时正式设立乐府，其任务是收集编纂各地民间音乐、整理改编与创作音乐、进行演唱及演奏等。",9],[254,0,"清末魏学洢的散文《核舟记》，介绍了一个由核桃雕刻而成的小舟，这个核舟再现了“大苏泛赤壁”的情景。",[],"错误","明末。",0],[255,0,"庋具俗称“框架类家具”。度，意为“储藏”，故庋具即储物类家具。储物类家具有两大类\n一为柜，一为箱。",[],"正确","在中国传统家具中，有一类家具叫庋具，包括柜、架、橱和箱等，是储物类家具。",10],[256,0,"清朝的《古今图书集成》是我国现存的最大的一部类书。",[],"正确","我国现存的规模最大、保存最完 整的类书则是《古今图书集成》。 《古今图书集成》系清圣祖(即玄烨、俗称康熙帝)亲自命令编撰,本名《古今图书汇编》,又称《文献汇编》。",1],[257,0,"九品中正制，即在各州各郡设立中正官，负责察访评定本地之人，并按照其声望和才智划分为一品、二品、三品、四品、五品、六品、七品、八品、九品，向上推举官员人选。",[],"错误","按照其声望和才智划分为上上、上中、上下、中上、中中、中下、下上、下中、下下九品。",3],[258,0,"慈恩是古龙武侠小说《神雕侠侣》中的人物。",[],"错误","金庸。",0],[259,0,"严格意义上说，青铜不是纯铜，而是一种铜合金。",[],"正确","青铜是合金。青铜是铜和锡的合金,就是在纯铜(紫铜)中加入锡或铅的合金。",10],[260,0,"《周礼·考工记》记载有“金有六齐”说，详细记录了铸造不同种类的青铜器时的铜锡比例。",[],"正确","“六齐”规律是位于黄河下游的齐国的冶金工匠们关于冶铸青铜合金时铜锡配比的经验总结｡比如在冶炼熔铸过程中，对不同火候的辨认与掌握，《考工记》有详细记载:凡铸金之状，金与锡黑浊之气竭，黄白次之;黄白之气竭，青白次之;青白之气竭，青气次之，然后可铸也｡",10],[261,0,"古人在龟甲兽骨上刻画记事，产生了“甲骨文”，后来随着冶铜技术的进步，人民又将文字刻写在青铜器上，出现了“钟鼎文”，也称“铭文”。",[],"正确","甲骨文是中国商代和西周早期王室用于占卜记事而刻（或写）在龟甲和兽骨上的文字；钟鼎文，也叫金文或铭文，是铸刻在青铜器的钟或鼎上的一种文字。",10],[262,0,"人们把由竹片连成的可以书卷的竹简称为“简牍”或者“尺素”。",[],"错误","应该是“尺牍”。",14],[263,0,"成语故事“多多益善”的主角是项羽。",[],"错误","“多多益善”出自《史记》：“上（刘邦）曰：‘于君何如？’（韩信）曰：‘臣多多而益善耳。’”因此故事的主角是韩信。",0],[264,0,"高山流水相传是魏晋南北朝时期民间演奏家伯牙所作的古琴曲。",[],"错误","《高山流水》，中国古琴曲，属于中国十大古曲之一。传说先秦的琴师伯牙一次在荒山野地弹琴，樵夫钟子期竟能领会这是 描绘“峨峨兮若泰山”和“洋洋兮若江河”。伯牙惊道：“善哉，子之心而与吾心同。”钟子期死后，伯牙痛失知音，摔琴绝弦，终生不弹，故有高山流水之曲。",7],[265,0,"榻在古代使用非常广泛，因其低矮，无栏杆无围子，移动方便，因此常常作为小憩的用具。",[],"正确","榻在古代使用非常广泛，因其低矮，无栏杆无围子，移动方便，因此常常作为小憩的用具。",14],[266,0,"算盘的木框内以直柱贯穿，称作“档”，档中以一木柱横穿，称作“梁”。梁上有五颗算珠，\n每一颗算珠计算时作数五;梁下有两颗算珠，每一颗算珠计算时作数一。",[],"错误","梁上有两颗算珠，梁下有五颗算珠。",11],[267,0,"老子认为“无为而无不为”，无为是指不做任何行动。",[],"错误","“无为”就是不做任何违反自然规律、有损道德规范、违反社会法则，有害众生的事。但这里的“无为”并不是什么都不做，并不是不为，而是含有不妄为、不乱为、顺应客观态势、尊重自然规律的意思。老子说过“无为而无不为”，意思是说：不妄为，就没有什么事情做不成的。",2],[268,0,"架子床，出现在明代，有四架或者六架，偶尔有八架，它不是单纯的卧具，常常用来待客。",[],"错误","它是单纯的卧具，不能用以待客。",1],[269,0,"屏风是古代室内用于挡风或隔断视线的用具，材质多样，可以自由移动，既能隔出秘密空间，又有很强的装饰作用。",[],"正确","屏风，中国传统建筑物内部挡风用的一种家具，所谓“屏其风也”。屏风作为传统家具的重要组成部分，历史由来已久。屏风一般陈设于室内的显著位置，起到分隔、美化、挡风、协调等作用。它与古典家具相互辉映，相得益彰，浑然一体，成为中式家居装饰不可分割的整体，而呈现出一种和谐之美、宁静之美。",10],[270,0,"晚年白居易和刘长卿唱和颇多，时人称为“刘白”。",[],"错误","晚年白居易和刘禹锡唱和颇多，时人称为“刘白”。",0],[271,0,"《战国策》，主要记述了战国时期的纵横家的政治主张和言行策略。西汉刘向编定。它是一部纪传体史书。",[],"错误","《战国策》是国别体。",1],[272,0,"“轻诺必寡信”的意思是小声许下的诺言肯定不会实现。",[],"错误","这句话的意思是：随意的许诺往往会因为难于实现而使自己丧失信用。",4],[273,0,"三国时期，以道家清净养生、无为治世为主的黄老学向宗教化发展，又与方仙道结合，行成了黄老道，行其术者被称为方士。",[],"错误","应该是西汉末年。",1],[274,0,"“君子素其位而行”指君子要按自己平常所处的地位做该做的事，不羡慕这以外的事。",[],"正确","指的是君子安于现在所处的地位去做应做的事，不生非分之想。",1],[275,0,"洛阳因坐落于洛河南岸而得名。",[],"错误","古代称山南水北为阳。",7],[276,0,"《劝学》中有：“君子生非异也，善假于物也。”这里的“假”是“假设”的意思。",[],"错误","“假”是“借助”的意思。",1],[277,0,"“闻过则改”的意思是做一件事情要坚持不懈，就能取得成功。",[],"错误","闻过则改的意思是知道了错误就立刻改正，不将错就错。",14],[278,0,"我国古代纺织过程中，先将线染好颜色，再上机进行织布。",[],"错误","先织布再练染。",10],[279,0,"八股文的文体有固定格式：由破题、承题、起讲、入题、起股、中股、后股、束股八部分组成。",[],"正确","八股文就是指文章的八个部分，文体有固定格式：由破题、承题、起讲、入题、起股、中股、后股、束股八部分组成，题目一律出自四书五经中的原文。后四个部分每部分有两股排比对偶的文字，合起来共八股。",0],[280,0,"张衡是东汉中期浑天说的代表人物之一，他指出月球本身并不发光，月光其实是日光的反射。",[],"正确","张衡是东汉中期浑天说的代表人物之一;他指出月球本身并不发光,月光其实是日光的反射;他还正确地解释了月食的成因,并且认识到宇宙的无限性和行星运动的快慢与距离地球远近的关系。",11],[281,0,"在出土的青铜器中，刀远远多于剑，材料特性使然。",[],"错误","应该是剑远远多于刀。",10],[282,0,"“小品”多指写作形式固定，篇幅短小精悍，不落窠臼，注重个性、情怀和创见的散文文体。",[],"错误","“小品”多写作形式灵活。",0],[283,0,"“大道之行也，天下为公，选贤与能，讲信修睦”选自《孟子》。",[],"错误","选自《礼记》。",2],[284,0,"2007年，广东省阳江市海域打捞上来南宋时期沉船“南海一号”，船舱中装有6万余件南宋瓷器。",[],"正确","“南海一号”是迄今为止，世界上发现的海上沉船中年代最早、船体最大、保存最完整的远洋贸易商船，对研究我国乃至整个东亚、东南亚的古代造船史、航运史、贸易史都有着重要意义。",10],[285,0,"关于满汉全席的最早记载出现在《扬州画舫录》一书中。",[],"正确","满汉全席兴起于清代，是集满族与汉族菜点之精华而形成的历史上最著名的中华大宴。乾隆甲申年间李斗所著《扬州画舫录》中记有一份满汉全席食单，是关于满汉全席的最早记载。满汉全席以东北、山东、北京、江浙菜为主。",7],[286,0,"京杭大运河历史悠久，它贯通海河、黄河、淮河、长江、钱塘江五大水系。",[],"正确","大运河南起余杭（今杭州），北到涿郡（今北京），途经今浙江、江苏、山东、河北四省及天津、北京两市，贯通海河、黄河、淮河、长江、钱塘江五大水系，主要水源为微山湖，大运河全长约1797公里。",7],[287,0,"2000年10月，都江堰被联合国列入“世界文化遗产名录”；2014年6月，大运河被联合国列入“世界文化遗产名录”。",[],"正确","2000年10月，都江堰被联合国列入“世界文化遗产名录”;2014年6月，大运河被联合国列入“世界文化遗产名录”。",7],[288,0,"古代称筷子为“箸”。",[],"正确","古代称筷子为“箸”。箸是中国汉族发明的进食工具，后来这种工具开始传入了朝鲜、日本、越南等汉字文化圈国家。",1],[289,0,"以李梦阳、李攀龙为首的“前后七子”提出了“文必秦汉，诗必盛唐”的口号。",[],"正确","明代中后期,以李梦阳、李攀龙为首的“前后七子”提出了“文必秦汉,诗必盛唐”的口号。",1],[290,0,"“宜将剩勇追穷寇，不可沽名学霸王”中的“霸王”指的是关羽。",[],"错误","指的是项羽。",1],[291,0,"不以物喜，不以己悲;居庙堂之高则忧其民;处江湖之远则忧其君。这里庙堂指的是寺庙。",[],"错误","朝廷。",7],[292,0,"词集《珂雪词》出自清词词人曹贞吉。",[],"正确","词集《珂雪词》为清代曹贞吉著。他为人嗜书，工诗文，与嘉善诗人曹尔堪并称为“南北二曹”，词尤有名，被誉为清初词坛上“最为大雅”的词家。",0],[293,0,"古人论琴，有“四德九善”之说。",[],"错误","应该是“四善九德”。",9],[294,0,"“千载谁堪伯仲间”的“堪”的意思是“能够”。",[],"正确","堪：能够。伯仲：原指兄弟间的次第。这里比喻人物不相上下，难分优劣高低。",14],[295,0,"《袁氏世范》有很多经典名言广泛流传，比如“小人当敬远”“小人为恶不必谏”。",[],"正确","“小人当敬远”“小人为恶不必谏”出自《袁氏世范》。",2],[296,0,"《孙权劝学》节选自南宋政治家、史学家司马光编纂的《资治通鉴》。",[],"错误","司马光是北宋时代。",1],[297,0,"甲骨文出现在周代，是我国所发现的最早的成熟汉字。",[],"错误","殷商时代。",1],[298,0,"相传仓颉造字时，惊天地、泣鬼神，天降谷子，称作“谷雨”，人们把这一天作为祭祀仓颉的节日。",[],"正确","仓颉造字，是中国古代神话传说之一，仓颉造字的地方叫“凤凰衔书台”。出自《淮南子·本经训》：“昔者仓颉作书，而天雨粟，鬼夜哭。”仓颉，称苍颉，复姓侯刚，号史皇氏，曾把流传于先民中的文字加以搜集、整理、规范和使用，在创造汉字的过程中起了重要作用，为中华民族文明的传承做出了不朽的功绩。但普遍认为汉字由仓颉一人创造只是传说，不过他可能是汉字的整理者，被后人尊为“造字圣人”。",5],[299,0,"天地神灵扶庙社，京华父老望和銮。出师一表通今古，夜半挑灯更细看。这里和銮指的是金銮殿。",[],"错误","天子的车驾。",6],[300,0,"汉字的特点使书法艺术形成了独特的艺术规律和美学价值，金文古朴大方，小篆形象直观，隶书龙飞凤舞，草书整齐优美。",[],"错误","应该是隶书整齐优美，草书龙飞凤舞。",8],[301,0,"汉魏间,曹操与曹植、曹冲父子三人在文学上均有很高的成就，后人合称之头“三曹”。“三曹”是建安文学的代表作家，其现实主义的创作特征与遒劲刚健、慷慨悲凉的创作风格被后人称为“建安风骨”。",[],"错误","曹冲应改为曹丕。",0],[302,0,"唐代时，出现了第一个蹴鞠民间团体齐云社。",[],"错误","应该是宋代。",13],[303,0,"柳永是宋代著名词人，他有一首词是专门描写宋代杭州的，其中描写杭州“有三秋桂子，十里荷花”，这首词是《八声甘州》。",[],"错误","这首词是《望海潮》。",0],[304,0,"在《明夷待访录》中，黄宗羲第一次比较完整地提出了具有近代资产阶级民主政治和民主主义精神的教育思想。",[],"正确","《明夷待访录》比法国民主主义启蒙教育思想家卢梭的《社会契约论》发表早一百年。在这部著作中，黄宗羲第一次比较完整地提出了具有近代资产阶级民主政治和民主主义精神的教育思想，并为限制封建专制特权，推行民主政治制度改革，设计了一套普及教育的学制体系。",2],[305,0,"我国第一部系统的绘画理论著作是谢赫的《古画品录》。",[],"正确","《古画品录》是南齐时代的⼈物画家谢赫（公元479—502年）绘画理论著作，也是我国绘画史上第⼀部完整的绘画理论著作。",8],[306,0,"鲁迅在《中国小说史略》中称《儒林外史》为“用传奇法，而以志怪”。",[],"错误","应该是《聊斋志异》。",0],[307,0,"西汉末年有一位名叫“左伯”的造纸能手，他造出来的纸厚薄均匀、质地细密、色泽鲜明，时人称“左伯纸”。",[],"错误","东汉末年。",8],[308,0,"由于《楚辞》的诗歌形式是在楚国民歌的基础上加工而成，篇中又大量引用楚地的风十物产和方言词汇，多用兮字，且五言、六言、七言不等，所以称为“楚辞”。",[],"正确","《楚辞》是我国第一部浪漫主义诗歌总集。由于诗歌的形式是在楚国民歌的基础上加工 形成,篇中又大量引用楚地的风土物产和方言词汇,所以叫“楚辞”。",0],[309,0,"《楚辞》的作者是屈原。屈原，名平，字原，是战国时楚国的贵族，也是我国浪漫主义诗歌传统的奠基人，代表作有《离骚》《九章》《湘夫人》。",[],"错误","《楚辞》为西汉刘向所辑，收录了战国时期楚国屈原、宋玉等人的作品。",0],[310,0,"我国古代把一昼夜分为12个时辰，每个时辰相当于现在的2个小时。",[],"正确","时辰是古代计时单位，古代人把一天划分为十二个时辰，每个时辰相等于现在的两小时。相传是根据十二生肖中的动物的出没时间来命名各个时辰。",6],[311,0,"文与道的关系，是中国古代文论的中心问题。",[],"正确","文学本原论（文与道之间的关系）就是中国古代文论的中心问题。",7],[312,0,"中国现存最早的古代木结构建筑实例是重建于宋代的山西五台山的南禅寺大殿。",[],"错误","应该是唐代。",10],[313,0,"建安风骨，又称“汉魏风骨”，其主要特点是意境宏大，格调高昂，具有鲜明的时代特征和个性特征，呈现出雄健深沉、慷慨悲凉的艺术风格。",[],"正确","“建安风骨也称汉魏风骨，是汉魏之际的文学风格，具有慷慨悲凉、雄健深沉等特点。简要介绍建安时期的作品真实地反映了现实的动乱和人民的苦难，抒发建功立业的理想和积极进取的精神。",1],[314,0,"“客从远方来，遗我双鲤鱼”中，“双鲤鱼”指丰厚的礼物。",[],"错误","“双鲤鱼”指信函。",14],[315,0,"《蒹葭》中有：“溯洄从之，道阻且长。溯游从之，宛在水中央。”这里，“溯洄”的意思是逆流而上，“溯游”的意思是“顺流而下”。",[],"正确","溯洄指逆着河流的道路往上游走。",7],[316,0,"李商隐《隋宫》中：“乘兴南游不戒严，九重谁省谏书函？”这里“乘兴南游”的是隋文帝。",[],"错误","乘兴南游的是隋炀帝。",1],[317,0,"麻纸是中国古人的重要发明。由东汉蔡伦改进，成为中国古代图书典籍的用纸之一。",[],"正确","麻纸是中国古人的重要发明。由东汉蔡伦改进，成为中国古代图书典籍的用纸之一。麻纸是一种大部分以黄麻、布头、破履为主原料生产的强韧纸张。",11],[318,0,"“君子于役，如之何勿思”与“即今三月莺花满，长作江南梦里人”都赞扬了边境百姓守土御敌的斗争精神。",[],"错误","这两句诗都表达了思妇对在远方服役的丈夫的思念之情。",7],[319,0,"“珠算”一词最早出现于东汉徐岳的《数术记遗》中。",[],"正确","“珠算”一词最早见于东汉徐岳所撰的《数术记遗》，其中有云：“珠算控带四时，经纬三才。”",11],[320,0,"最能集中体现魏晋风度的著作当属南朝刘义庆所著的《世说新语》一书。",[],"正确","《世说新语》是南朝时期的文言志人小说集,由南朝刘义庆所撰写,也有称是由刘义庆所组织门客编写。其内容主要是记载东汉后期到魏晋间一些名士的言行与轶事。",1],[321,0,"伯夷、叔齐两人是好朋友关系，因为义不食周粟，而饿死于首阳山。",[],"错误","他们两人是兄弟关系。",7],[322,0,"雅乐舞蹈的主要内容是“六大舞”，也称“六代舞”，代表六个朝代。",[],"正确","雅乐舞蹈的主要内容是“六大舞”，也称“六代舞”，代表六个朝代。为首的据传是起自黄帝的《云门》（又称《云门大卷》、《咸池》和《承云》），依次是尧帝传下的《大章》（又名《大咸》），舜帝的《大韶》，夏禹的《大夏》（又称《夏龠》），商汤《桑林》，然后是现实题材——反映武王伐纣功绩的《大武》。",1],[323,0,"我们生活中习惯说的“陶瓷”，实际上是陶器和瓷器的合称。陶器与瓷器的区别主要在于使用材料和烧成温度不同。",[],"正确","陶器与瓷器的区别在于，一使用材料；二烧成温度，二者缺一不可。陶器可以使用包括瓷土在内的各种矿物粘土制作，烧成温度较低，多在700—1000℃之间，胎体基本烧结，不再遇水分解，但气孔率和吸水率较高。在显微镜下观察胎体，极少存在玻璃相莫来石结晶体，换句话说就是没有瓷化，敲击之声较沉闷。而瓷器使用的是氧化铝含量较高的瓷土即高龄土烧制。瓷器的烧成温度至少在1100℃以上，胎质基本瓷化，显微观察有大量莫来石结晶体存在，气孔率和吸水率较低，敲击之声清脆。",10],[324,0,"汉文帝罢黜百家、独尊儒术，儒学上升为官学。",[],"错误","汉武帝推行的“罢黜百家,独尊儒术”的政策,使儒学从过去的民间私学变为官学。",2],[325,0,"顾炎武倡导国家兴亡 、匹夫有责的爱国主义道德观。",[],"正确","顾炎武在《日知录》中提出“天下兴亡，匹夫有责”的著名观点。这句名言充分体现了爱国主义精神，鼓舞了人民的爱国热情。",2],[326,0,"孝悌的基本内容是父慈子孝、兄友弟恭。",[],"正确","孝悌”是“仁”的根本。它的基本内容是父慈子孝、兄友弟恭,在社会道德生活中具有崇高的地位,得到普遍的奉行。",2],[327,0,"词的重要组成部分是词调，俗称“词牌”。每个词牌都有自己特定的格式，对于句数和每句的字数有明确的限定，对于用韵和平仄则没有限定。",[],"错误","词对于用韵和平仄也有明确的限定。",0],[328,0,"中国的美术、绘画首先是通过带有各种图案的丝绸、锦绣、陶瓷、漆器等日用品、工艺品而传入欧洲的。",[],"正确","中国的美术、绘画首先是通过带有各种图案的丝绸、锦绣、陶瓷、漆器等日用品、工艺品而传人欧洲的。因此，中国的丝绸、锦绣、陶瓷、漆器对当时欧洲人来说，不仅是实用物品，而且是具有观赏价值的艺术品。",10],[329,0,"“封侯非我意，但愿海波平”的作者是郑成功。",[],"错误","作者是是戚继光。",0],[330,0,"史评体著作按其内容可分为两种，一是史书评论，一是史事评论。",[],"正确","史评体著作按其内容可分为两种，一是史书评论，一是史事评论。史事评论就是史学家对历史事实进行评论,目的是总结历史上治乱兴衰的经验教训,为现实服务. 史书评论就是对史学著作进行评论。",2],[331,0,"三通是指《通典》、《通志》、《文献通考》。",[],"正确","“三通”是《通典》《通志》和《文献通考》的合称。《通典》由唐朝杜佑撰写，全书共二百卷，约一百九十万字，是中国历史上第一部体例完备的政书。《通志》由南宋郑樵撰写，是一部以人物为中心的纪传体通史。《文献通考》简称《通考》，由宋元时代着名学者马端临编撰写，是继《通典》《通志》之后，规模最大的一部记述历代典章制度的着作。",1],[332,0,"李白把现实主义诗歌推向了最高峰。",[],"错误","李白把浪漫主义诗歌推向了最高峰。",0],[333,0,"马致远是元代杂剧的奠基人。",[],"错误","元代杂剧作家有200人左右，剧目有600种左右，现存的有150多种。元代最著名的戏剧家是关汉卿，他一生创作了许多剧本，流传至今有10多种，代表作是悲剧《窦娥冤》，元杂剧的奠基人就是关汉卿。",9],[334,0,"金元散曲，指的是金元时期的小令和套数。",[],"正确","金元散曲,指的是金元时期的小令和套数,小令和词调同源,是一支支独立的曲子;套数则源自宋金时期的说唱诸宫调,是由多只曲子依照一定的调性组织起来的。",1],[335,0,"三山五园，是对北京西北郊、以清代皇家园林为代表的历史文化遗产的统称。三山是指万寿山、香山、玉泉山，五园是指颐和园、静宜园、静明园、畅春园和圆明园。",[],"正确","三山五园，是对北京西北郊、以清代皇家园林为代表的历史文化遗产的统称。三山是指万寿山、香山、玉泉山，五园是指颐和园、静宜园、静明园、畅春园和圆明园。",10],[336,0,"公元前613年，当时中国人观察“有星孛入北斗”，这是世界上公认的首次关于哈雷彗星的确切纪录，此记录记载于《春秋》。",[],"正确","鲁国《春秋》说：鲁文公十四年（公元前613年）“秋七月，有星孛入于北斗。”",6],[337,0,"《开元占经》保存了汉民族最古老的关于恒星位置观测的记录。",[],"正确","《开元占经》全名《大唐开元占经》，清人又或名《唐开元占经》，成书时间约在公元718年~726年之间。作者是瞿昙悉达，是中国古代天文学著作之一。",1],[338,0,"《数书九章》是中国古代数学的高峰。",[],"正确","《数书九章》是南宋数学家秦九韶所著数学著作。该书在数学内容上颇多创新，是对《九章算术》的继承和发展。它概括了宋元时期数学的主要成就，标志着中国古代数学的高峰。",11],[339,0,"青花瓷最早始于宋朝。",[],"错误","原始的青花瓷在唐代已经开始出现端倪，成熟的青花瓷则是在唐代中期才慢慢出现，到了明代时期青花已经变成了瓷器物品的主流品种。",1],[340,0,"诗句“戏与山妻谈故事”中的“山妻”是诗人对他人妻子的谦称。",[],"错误","应该是诗人对自己棋子妻子的谦称。",0],[341,0,"《尚书》是中国古代散文已经形成的标志。",[],"正确","《尚书》，是上古历史文献集。标志着中国古代散文已经形成。书中文章可分为记言、叙事两类。",2],[342,0,"“何须浅碧深红色，自是花中第一流”中的“花”指的是桂花。",[],"正确","淡黄色的桂花，并不鲜艳，但体态轻盈。于幽静之处，不惹人注意，只留给人香味。不需要具有名花的红碧颜色。桂花色淡香浓，应属最好的。",14],[343,0,"史前时期玉器玉材材质大都属于蛇纹石。",[],"正确","人们将蛇纹石当作建筑用材料，有些可当作耐火材料，颜色好看的还可以制成装饰品或工艺品。除此以外，蛇纹石还可用来制造化肥。",10],[344,0,"“千古兴亡多少事？悠悠。不尽长江滚滚流”的作者是宋代词人陆游。",[],"错误","作者是辛弃疾。",0],[345,0,"“春种一粒粟，秋收万颗子”出自《悯农》，作者是李白。",[],"错误","作者是李绅。",0],[346,0,"晏殊，字同叔，擅长写小令，是晚唐著名的词人。",[],"错误","不是晚唐词人，应该是宋代词人。",0],[347,0,"“都缘自有离恨，故画作远山长”中，“远山长”是远处高大的山峰。",[],"错误","“远山长”是指眉毛画得又细又长。",7],[348,0,"《古诗十九首》的第一首是《行行重行行》，是一首表达游子思乡而不得归的诗。",[],"错误","是一首妻子思念出门在外的丈夫的诗。",0],[349,0,"《静夜思》、《秋浦歌》、《赠汪伦》、《古朗月行》、《望庐山瀑布》、《独坐敬亭山》、《春望》、《送孟浩然之广陵》等诗都是李白写的。",[],"错误","《春望》是杜甫写的。",0],[350,0,"《陈太丘与友期行》中“入门不顾”的“顾”与“一步三顾”中的“顾”意思相同。",[],"正确","都是回顾的意思。",14],[351,0,"\"三皇五帝\"是史书上确有年代记载的真实人物。",[],"错误","\"三皇五帝\"属于神话传说和历史考古断处，没有确切的年代与资料证明，是先夏文化时期各文化阶段的象征。",1],[352,0,"万里长城东起山海关，西到嘉峪关，这段被称为长城的\"主线\"。",[],"正确","万里长城东起山海关、西到嘉峪关，全长达1.3万多里，这部分被称为长城的\"主线\"，是长城文化的核心。",7],[353,0,"除万里长城外，山东、陕西、辽宁等地还保存有齐长城、魏长城、燕长城等古长城遗址。",[],"正确","山东穆陵关两侧的战国齐长城、陕西华阴的魏长城、辽宁建平县的烧锅营子燕长城等都是古长城遗址。",7],[354,0,"清朝的汉族大臣也可以像满族大臣一样，对皇帝自称\"奴才\"。",[],"错误","\"奴才\"是满族主奴之间的自家称呼，汉臣与皇帝没有主奴关系，只能称\"臣\"；乾隆年间汉臣马人龙奏折自称\"奴才\"还遭到斥责。",1],[355,0,"古代官员出行鸣锣开道，鸣锣十三下代表皇帝出行。",[],"正确","鸣锣七下表县太爷出行，九下表府一级官员出行，十一下表省级官员出行，鸣锣十三下则代表皇帝出行。",1],[356,0,"汉代朝廷每五天给官吏放一次假，让官员回家洗澡休息，称为\"休沐\"。",[],"正确","汉代重视洗沐，\"五日一假洗沐\"以法律形式固定下来，这个假日被称为\"休沐\"。",3],[357,0,"唐代官员的休沐改为每十天休息洗浴一次。",[],"正确","唐代考虑到五日一假太频繁，改为官吏每10天休息洗浴一次，称为\"旬休\"。",3],[358,0,"\"七擒孟获\"的故事在正史《三国志》中有明确记载。",[],"错误","《三国志》并无\"七擒孟获\"的记载，此事最早见于《汉晋春秋》等，经《三国演义》渲染后家喻户晓。",1],[359,0,"种种史料记载表明，曹操并没有设置\"七十二疑冢\"。",[],"正确","据《祭魏武帝文》等记载，曹操没有设置七十二疑冢，该传闻多出自盗墓贼或小说家的杜撰。",1],[360,0,"世界上最早的纸币\"交子\"出现于北宋时期的四川地区。",[],"正确","世界上最早的纸币是\"交子\"，出现于北宋的四川地区。",8],[361,0,"最早的针灸用针是金属针。",[],"错误","最早的针灸用针并不是金属的，最初用的是砭石（石头针），金属针是后来才出现的。",11],[362,0,"在\"牛痘\"接种法发明之前，中国古人早已用接种\"人痘\"的方法预防天花。",[],"正确","有比\"牛痘\"更早的\"人痘术\"，中国人很早就通过接种人痘来预防天花。",11],[363,0,"\"秀才\"在中国历代科举中始终是最低一级、最容易考取的功名。",[],"错误","秀才最初泛指才华出众之人，唐代秀才曾是科举中地位很高的科目，直到明清才成为最低一级的功名。",3],[364,0,"古代\"八百里加急\"公文，每天都必须严格跑满八百里。",[],"错误","\"八百里加急\"是最高等级的要求，公文按紧急程度分级传递，并非每天都要求飞驰八百里。",14],[365,0,"\"黄帝战蚩尤\"确有其事，是有史料确切记载的真实战争。",[],"错误","黄帝战蚩尤与\"三皇五帝\"一样属于上古神话传说，没有确切的年代和史料可以证明。",1],[366,0,"项羽设下的\"鸿门宴\"确实暗藏杀机、凶险万分。",[],"正确","楚汉相争时项羽在鸿门设宴，范增示意项庄舞剑意在沛公，刘邦险象环生，后世遂以\"鸿门宴\"代指暗藏杀机的宴会。",12],[367,0,"王昭君出塞后被称为\"明妃\"，是为了避晋代司马昭的名讳。",[],"正确","王昭君并没有被汉元帝封为\"妃\"，到匈奴后为\"阏氏\"，晋代为避司马昭的讳才改称\"明妃\"。",1],[368,0,"武则天是中国历史上唯一称过帝的女性。",[],"错误","武则天是唯一的正统女皇帝，但并非唯一称帝的女性，民间起义女领袖陈硕真就曾自称\"文佳皇帝\"。",1],[369,0,"\"老佛爷\"是慈禧太后独有的专称。",[],"错误","\"老佛爷\"并非慈禧的专称，清代皇帝也常被称为\"老佛爷\"，只是慈禧使用最多而令人误会。",2],[370,0,"\"太子洗马\"是专门替太子洗马的仆役。",[],"错误","\"洗马\"即\"先马\"，是辅佐太子、出行时前驱引路的官职，并非洗马的仆役。",3],[371,0,"\"丞相\"和\"宰相\"完全是一回事。",[],"错误","\"宰相\"是对辅助君主、总领百官的最高行政长官的通称，历代名称与制度不同；\"丞相\"只是其中的一个具体官职名，二者不能画等号。",3],[372,0,"史料记载岳飞背上确有\"尽忠报国\"四字，但\"岳母刺字\"的具体情节是后世演绎。",[],"正确","史载岳飞背上有\"尽忠报国\"四字，但\"岳母刺字\"的故事带有传奇色彩，属后世演绎。",7],[373,0,"权宦魏忠贤曾被称为\"九千九百岁\"。",[],"正确","魏忠贤权势熏天，竟被称\"九千九百岁\"，距\"万岁\"仅一步之遥。",14],[374,0,"\"三堂会审\"中的\"三堂\"指刑部、大理寺、都察院。",[],"正确","\"三堂会审\"的\"三堂\"即中央三大司法机关：刑部、大理寺、都察院。",10],[375,0,"\"纸上谈兵\"说的是赵括，他在长平之战中兵败身亡。",[],"正确","\"纸上谈兵\"说的是只会空谈兵法的赵括，他在长平之战中被秦军大败，自己也在乱军中身亡。",8],[376,0,"西汉抗击匈奴的名将李广被称为\"飞将军\"。",[],"正确","李广英勇善战、行动神速，匈奴畏之，称其为\"飞将军\"。",1],[377,0,"诸葛亮在历史上真的用\"空城计\"吓退了司马懿。",[],"错误","\"空城计\"是小说家的虚构，正史并无诸葛亮以空城计吓退司马懿的记载。",1],[378,0,"明代兴起的\"马吊\"牌与后来的麻将有关。",[],"正确","明代兴起的\"打马吊\"与现在的麻将有关，是麻将的雏形之一。",7],[379,0,"明宣宗因痴迷斗蟋蟀而被称为\"促织天子\"。",[],"正确","明宣宗痴迷蟋蟀（促织），因而被人称为\"促织天子\"。",10],[380,0,"\"登龙门\"与\"跳龙门\"是一回事。",[],"错误","\"登龙门\"原指得到名流接引而身价倍增，后世也指科场得意；\"跳龙门\"专指科举及第，二者含义并不相同。",3],[381,0,"\"冷板凳\"一词来源于戏曲梨园行当。",[],"正确","\"冷板凳\"来源于梨园行，指后台待场艺人坐的冷清凳子，后引申为清苦冷落的职务。",9],[382,0,"民间讲究大年初一不吃稀饭。",[],"正确","\"年初一，不吃稀\"是春节的一大讲究，民间忌讳清早吃稀饭。",5],[383,0,"古代君王临朝听政要\"面南背北\"而坐，因为南方为尊。",[],"正确","\"南面\"为尊，古时君王一定要\"面南\"治天下，尊长以坐北朝南见生晚辈。",1],[384,0,"《红楼梦》完全是曹雪芹本人的自传。",[],"错误","贾宝玉的原型是否为曹雪芹本人并无定论，《红楼梦》并非完全意义上的作者自传。",10],[385,0,"梁山一百单八将的座次是应\"天罡地煞\"之数有意安排的。",[],"正确","一百单八将的座次对应天罡地煞之数，是作者有意安排，并非巧合。",7],[386,0,"林冲上梁山时，王伦要他先交纳\"投名状\"。",[],"正确","林冲误入白虎堂犯下死罪，投奔梁山时还要纳\"投名状\"，方为接纳。",7],[387,0,"\"韦编三绝\"说的是孔子晚年反复研读《周易》。",[],"正确","\"韦编三绝\"讲孔子读《易》勤奋，把编联竹简的皮绳都磨断了多次。",2],[388,0,"曹操曾用金璧赎回蔡文姬，他与蔡文姬之父蔡邕确是好友。",[],"正确","曹操与蔡邕是好朋友，因此用金璧把流落匈奴的蔡文姬赎了回来。",14],[389,0,"夏朝是中国历史上第一个王朝
