  return `
  ${storageOK?'':'<div class="banner">这个浏览器现在不能保存数据，关掉页面后记录会丢失。请用 Safari 正常模式（非无痕）打开。</div>'}
  <div class="panel"><h2>备份和恢复</h2>
    <p class="hint" style="margin-top:-6px">记录只保存在这台 iPad 的浏览器里。建议每周备份一次，换设备时用备份恢复。上次备份：${lb}</p>
    <div class="row" style="margin-top:12px"><button class="btn primary" data-act="export">保存备份文件</button><button class="btn" data-act="copy">复制备份文本</button></div>
    <h3>恢复</h3>
    <div class="row"><label class="btn" style="display:inline-flex;align-items:center">选择备份文件<input type="file" accept=".json,application/json,text/plain" data-in="impfile" hidden></label></div>
    <textarea data-in="imptext" placeholder="或者把备份文本粘贴到这里" style="margin-top:10px"></textarea>
    <div class="row" style="margin-top:8px"><button class="btn" data-act="imptext">从文本恢复</button></div>
  </div>
  <div class="panel"><h2>设置</h2>
    <h3>错题连续答对几次后自动移出错题本</h3>
    <div class="row">${[[1,'1 次'],[2,'2 次'],[3,'3 次'],[0,'不自动移出']].map(([v,n])=>`<button class="chip" data-act="sauto" data-v="${v}" aria-pressed="${S.set.auto===v}">${n}</button>`).join('')}</div>
    <h3>单选题点一下选项就判对错</h3>
    <div class="row"><button class="chip" data-act="sinst" data-v="1" aria-pressed="${S.set.instant}">是</button><button class="chip" data-act="sinst" data-v="0" aria-pressed="${!S.set.instant}">否，选完再点提交</button></div>
    <h3>外观</h3>
    <div class="row">${[['auto','跟随系统'],['light','浅色'],['dark','深色']].map(([v,n])=>`<button class="chip" data-act="stheme" data-v="${v}" aria-pressed="${(S.set.theme||'auto')===v}">${n}</button>`).join('')}</div>
  </div>
  <div class="panel"><h2>清空记录</h2><p class="hint" style="margin-top:-6px">删除所有做题记录、错题本、标签和笔记，不能撤销。建议先备份。</p>
    <div class="row" style="margin-top:10px"><button class="btn" style="color:var(--yan)" data-act="reset">清空所有记录</button></div></div>
  <p class="hint" style="text-align:center">题库共 ${Q.length} 题。在 Safari 里点“分享 → 添加到主屏幕”，就能像 App 一样打开。</p>`;
}
function backupText(){ return JSON.stringify({app:'zhzs2026', v:1, at:Date.now(), r:S.r, log:S.log, set:S.set}); }
async function doExport(){
  const name='刷题记录备份-'+today()+'.json'; const text=backupText();
  try{
    if(window.claude && typeof window.claude.use==='function'){
      const dl = await window.claude.use('downloads');
      if(dl){ await dl.save({filename:name, data:text}); S.lastBackup=Date.now(); save(); render(); toast('已保存备份'); return; }
    }
  }catch(e){ /* fall back */ }
  try{
    const blob=new Blob([text],{type:'application/json'}); const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    S.lastBackup=Date.now(); save(); render(); toast('已生成备份文件');
  }catch(e){ toast('保存文件失败，请用“复制备份文本”'); }
}
function doImport(text){
  try{
    const d=JSON.parse(text);
    if(!d || d.app!=='zhzs2026' || typeof d.r!=='object') throw 0;
    if(!confirm('用这份备份替换现在的所有记录？')) return;
    S.r=d.r; S.log=d.log||{}; S.set=Object.assign(S.set,d.set||{}); S.sess=null; S.chk=null;
    save(); applyTheme(); render(); toast('已恢复');
  }catch(e){ toast('这不是有效的备份内容'); }
}
function applyTheme(){ const t=S.set.theme||'auto'; if(t==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',t); }

/* ---------- render ---------- */
function render(){
  renderTabs();
  const v = {practice:practiceView, check:checkView, wrong:wrongView, stats:statsView, settings:settingsView}[U.tab]();
  document.getElementById('app').innerHTML =
    `<header class="top"><h1>中华知识竞赛刷题本</h1><span class="sub">初赛题库 ${Q.length} 题</span></header>` +
    (storageOK||U.tab==='settings'?'':'<div class="banner">这个浏览器现在不能保存数据，请用 Safari 正常模式（非无痕）打开。</div>') + v;
}

/* ---------- events ---------- */
document.addEventListener('click', e=>{
  const b=e.target.closest('[data-act]'); if(!b || b.disabled) return;
  const a=b.dataset.act, v=b.dataset.v, f=U.f;
  switch(a){
    case 'tab': U.tab=v; render(); window.scrollTo(0,0); return;
    case 'ftype': { const i=+v; f.types=f.types.includes(i)?f.types.filter(x=>x!==i):[...f.types,i].sort(); break; }
    case 'fcat': f.cats=f.cats.includes(v)?f.cats.filter(x=>x!==v):[...f.cats,v]; break;
    case 'fpool': f.pool=v; break;
    case 'forder': f.order=v; break;
    case 'frange': { const [x,y]=v.split('-').map(Number); f.from=x; f.to=y; break; }
    case 'start': {
      const names=[]; if(f.types.length<4) names.push(f.types.map(i=>TSHORT[i]).join('、'));
      if(f.from>1||f.to<MAXID) names.push(f.from+'–'+f.to+' 题');
      if(f.cats.length) names.push(f.cats.join('、'));
      const pn={new:'没做过的',wb:'错题本',ever:'做错过的',star:'收藏'}[f.pool]; if(pn) names.push(pn);
      startSession(buildPool(f), names.join('，')||'全部题目', f.order); return; }
    case 'resume': U.setup=false; break;
    case 'setup': U.setup=true; break;
    case 'tf': answer(v); return;
    case 'opt': {
      const q=QM.get(S.sess.ids[S.sess.i]);
      if(q.t===1){ if(S.set.instant){ answer(v); return; } U.pick=[v]; }
      else U.pick = U.pick.includes(v)?U.pick.filter(x=>x!==v):[...U.pick,v].sort();
      break; }
    case 'submit': answer(U.pick.join('')); return;
    case 'submitfill': { const el=document.querySelector('[data-in="fill"]'); answer((el&&el.value||'').trim()); return; }
    case 'giveup': answer(''); return;
    case 'fixfill': { const s=S.sess, id=s.ids[s.i]; undoLast(id); const cl=record(id,true,'app'); s.ans[id].ok=true; s.ans[id].cleared=cl; save(); break; }
    case 'next': go(1); return;
    case 'prev': go(-1); return;
    case 'finish': {
      const s=S.sess; const vals=Object.values(s.ans); const ok=vals.filter(x=>x.ok).length;
      toast(`本组完成：答了 ${vals.length} 题，对 ${ok} 题`); S.sess=null; U.setup=true; save(); U.tab='stats'; render(); window.scrollTo(0,0); return; }
    case 'star': { const r=rec(+v); r.st=r.st?0:1; save(); toast(r.st?'已收藏':'已取消收藏'); break; }
    case 'unwb': { const r=rec(+v); r.wb=0; save(); toast('已移出错题本'); break; }
    case 'towb': { const r=rec(+v); r.wb=1; r.s=0; save(); toast('已放回错题本'); break; }
    case 'extra': U.showExtra=!U.showExtra; break;
    case 'tagtoggle': { const r=rec(+b.dataset.id); r.tg=r.tg||[]; r.tg=r.tg.includes(v)?r.tg.filter(x=>x!==v):[...r.tg,v]; save(); break; }
    case 'addtag': { addTag(+b.dataset.id); break; }
    case 'cshift': { const len=Math.max(1,U.chkTo-U.chkFrom+1); const d=+v;
      let nf=U.chkFrom+d*len; nf=Math.max(1,Math.min(MAXID,nf)); U.chkFrom=nf; U.chkTo=Math.min(MAXID,nf+len-1); window.scrollTo(0,0); break; }
    case 'cmark': paperMark(+b.dataset.id, +v); break;
    case 'crest': { const c=ensureChk(); for(let i=U.chkFrom;i<=U.chkTo;i++){ if(QM.has(i) && c.marks[i]===undefined){ c.marks[i]=1; record(i,true,'paper'); } } toast('已标为做对'); break; }
    case 'cbulk': { const el=document.querySelector('[data-in="cids"]'); const ids=parseIds(el?el.value:''); if(!ids.length){ toast('没有识别到题号'); return; }
      const c=ensureChk(); let n=0; ids.forEach(i=>{ if(i>=U.chkFrom && i<=U.chkTo){ if(c.marks[i]!==0){ paperMark(i,0); n++; } } else { record(i,false,'paper'); n++; } });
      toast(`已把 ${n} 道题标为做错`); break; }
    case 'wscope': U.wScope=v; U.wOpen=null; break;
    case 'wgroup': U.wGroup=v; U.wOpen=null; break;
    case 'wopen': U.wOpen = U.wOpen===v?null:v; U.wExtra=null; break;
    case 'wextra': U.wExtra = U.wExtra===+v?null:+v; break;
    case 'wone': startSession([+v],'单独练第 '+v+' 题','seq'); return;
    case 'wredo': {
      const scope=U.wScope;
      let list=Q.filter(q=>{ const r=R(q.id); if(!r) return false; if(scope==='wb') return r.wb; if(scope==='ever') return r.w>0; return r.st; });
      if(v!=='__all') list=list.filter(q=>{ if(U.wGroup==='cat') return catOf(q)===v; if(U.wGroup==='type') return TYPES[q.t]===v; const t=R(q.id).tg||[]; return v==='（没有标签）'?!t.length:t.includes(v); });
      startSession(list.map(q=>q.id), (v==='__all'?'错题重做':'错题重做：'+v), 'rand'); return; }
    case 'export': doExport(); return;
    case 'copy': { const t=backupText();
      (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{ S.lastBackup=Date.now(); save(); render(); toast('已复制，可以粘贴到备忘录保存'); })
        .catch(()=>{ const ta=document.querySelector('[data-in="imptext"]'); if(ta){ ta.value=t; ta.select(); } toast('请手动复制下面框里的文本'); }); return; }
    case 'imptext': { const ta=document.querySelector('[data-in="imptext"]'); doImport(ta?ta.value:''); return; }
    case 'sauto': S.set.auto=+v; save(); break;
    case 'sinst': S.set.instant=v==='1'; save(); break;
    case 'stheme': S.set.theme=v; save(); applyTheme(); break;
    case 'reset': if(confirm('确定清空所有做题记录、错题本、标签和笔记？')){ const set=S.set; S=DEF(); S.set=set; save(); toast('已清空'); } break;
    default: return;
  }
  render();
});
function addTag(id){
  const el=document.querySelector(`[data-in="newtag"][data-id="${id}"]`); const t=(el&&el.value||'').trim().slice(0,12);
  if(!t) return; const r=rec(id); r.tg=r.tg||[]; if(!r.tg.includes(t)) r.tg.push(t); save();
}
document.addEventListener('input', e=>{
  const el=e.target, k=el.dataset && el.dataset.in; if(!k) return;
  if(k==='fill') U.fillVal=el.value;
});
document.addEventListener('change', e=>{
  const el=e.target, k=el.dataset && el.dataset.in; if(!k) return;
  const clampN = x => Math.max(1, Math.min(MAXID, parseInt(x,10)||1));
  if(k==='ffrom'){ U.f.from=clampN(el.value); if(U.f.from>U.f.to) U.f.to=U.f.from; render(); }
  else if(k==='fto'){ U.f.to=clampN(el.value); if(U.f.to<U.f.from) U.f.from=U.f.to; render(); }
  else if(k==='cfrom'||k==='cto'){
    let a=k==='cfrom'?clampN(el.value):U.chkFrom, b=k==='cto'?clampN(el.value):U.chkTo;
    if(a>b){ if(k==='cfrom') b=a; else a=b; }
    if(b-a>299){ if(k==='cfrom') b=a+299; else a=b-299; toast('一次最多 300 题'); }
    U.chkFrom=a; U.chkTo=b; render(); }
  else if(k==='setcat'){ const r=rec(+el.dataset.id); r.ct=el.value; save(); toast('已改为“'+el.value+'”'); render(); }
  else if(k==='note'){ const r=rec(+el.dataset.id); r.n=el.value.slice(0,1000); save(); toast('笔记已保存'); }
  else if(k==='impfile'){ const file=el.files&&el.files[0]; if(!file) return; const fr=new FileReader(); fr.onload=()=>doImport(fr.result); fr.readAsText(file); el.value=''; }
});
document.addEventListener('keydown', e=>{
  const el=e.target;
  if(e.key==='Enter' && el.dataset){
    if(el.dataset.in==='fill'){ e.preventDefault(); answer(el.value.trim()); return; }
    if(el.dataset.in==='newtag'){ e.preventDefault(); addTag(+el.dataset.id); render(); return; }
    if(el.dataset.in==='cids'){ e.preventDefault(); document.querySelector('[data-act="cbulk"]').click(); return; }
  }
  if(U.tab!=='practice' || U.setup || !S.sess || /INPUT|TEXTAREA|SELECT/.test(el.tagName)) return;
  if(e.key==='ArrowRight') go(1); else if(e.key==='ArrowLeft') go(-1);
});

applyTheme();
if(!S.sess) U.setup=true; else U.setup=false;
render();
})();
</script>
